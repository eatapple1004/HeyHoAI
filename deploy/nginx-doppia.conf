# Doppia — nginx 리버스 프록시 (Cloudflare Full Strict)
# 배치: /etc/nginx/sites-available/doppia  →  sites-enabled에 심볼릭 링크
#
# EC2에 다른 앱이 자기 포트로 직접 떠 있어도 무관 — nginx는 server_name(도메인)으로
# 구분하므로, 이 블록은 doppia.ai 트래픽만 127.0.0.1:3000(Doppia)로 보냄.

# HTTP(80) → HTTPS 리다이렉트 (직접 접근 대비)
server {
    listen 80;
    listen [::]:80;
    server_name doppia.ai www.doppia.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doppia.ai www.doppia.ai;

    # ── Cloudflare Origin Certificate (Full Strict) ──
    # Cloudflare 대시보드 → SSL/TLS → Origin Server → Create Certificate
    # 발급 시 호스트명에 doppia.ai 와 *.doppia.ai 둘 다 포함
    ssl_certificate     /etc/ssl/cloudflare/doppia.pem;
    ssl_certificate_key /etc/ssl/cloudflare/doppia.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 업로드 한도: 앱 json 50mb + 파일 업로드 → 여유 있게 60M
    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:3000;     # ← Doppia 포트
        proxy_http_version 1.1;

        # trust proxy(app.set)가 읽는 헤더 — https/host가 앱에 정확히 전달됨
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 릴스 생성은 동기로 수 분 → nginx가 끊지 않도록 타임아웃 넉넉히
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;

        # (필요 시) WebSocket/업그레이드 대비
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
