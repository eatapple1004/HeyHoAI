# Doppia STAGING — nginx 리버스 프록시 (staging.doppia.ai → 127.0.0.1:3001)
# 배치: /etc/nginx/sites-available/doppia-staging → sites-enabled에 심볼릭 링크
#   sudo ln -s /etc/nginx/sites-available/doppia-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# prod(doppia.ai:3000)와 같은 EC2·nginx에 공존 — server_name으로 구분되어 서로 영향 없음.

server {
    listen 80;
    listen [::]:80;
    server_name staging.doppia.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.doppia.ai;

    # Cloudflare Origin Certificate — *.doppia.ai 와일드카드가 staging.doppia.ai도 커버.
    # (prod와 동일 인증서 재사용 가능)
    ssl_certificate     /etc/ssl/cloudflare/doppia.pem;
    ssl_certificate_key /etc/ssl/cloudflare/doppia.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:3001;     # ← staging 포트
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
