<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genova Honors</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="" data-meta="home">

<!-- ============ HERO (기획안 05 / 27) ============ -->
<section class="hero">
  <div class="hero-media">
    <img src="assets/img/projects/songdo/hero-golf-sunset.jpg" data-i18n-alt="home.hero.alt" alt="">
  </div>
  <div class="wrap hero-inner">
    <p class="kicker reveal" data-i18n="home.tag"></p>
    <h1 class="reveal">
      <span class="l1" data-i18n="home.h1a"></span>
      <span class="l2" data-i18n="home.h1b"></span>
    </h1>
    <p class="hero-lede reveal" data-i18n="home.lede"></p>
    <div class="hero-actions reveal">
      <a href="projects.html" class="btn btn-gold" data-i18n="home.cta1"></a>
      <a href="contact.html" class="btn btn-ghost" data-i18n="home.cta2"></a>
    </div>
  </div>
  <div class="scroll-cue"><span data-i18n="home.scroll"></span><i></i></div>
</section>

<!-- ============ ABOUT 요약 (기획안 06) ============ -->
<section class="section">
  <div class="wrap">
    <div class="split-2">
      <div class="reveal">
        <p class="kicker" data-i18n="home.i.kicker"></p>
        <h2 class="display" data-i18n-html="home.i.title"></h2>
        <div class="rule"></div>
      </div>
      <div class="reveal">
        <p class="lead" data-i18n="home.i.lead"></p>
        <p style="margin-top:1.4rem;color:var(--text-inv-m)" data-i18n="home.i.p"></p>
        <p style="margin-top:2rem"><a class="arrow-link" href="about.html" data-i18n="home.i.more"></a></p>
      </div>
    </div>

    <div class="stat-row reveal">
      <div class="stat"><b data-i18n="home.s1.b"></b><small data-i18n="home.s1.s"></small></div>
      <div class="stat"><b data-i18n="home.s2.b"></b><small data-i18n="home.s2.s"></small></div>
      <div class="stat"><b data-i18n="home.s3.b"></b><small data-i18n="home.s3.s"></small></div>
      <div class="stat"><b data-i18n="home.s4.b"></b><small data-i18n="home.s4.s"></small></div>
    </div>
  </div>
</section>

<!-- ============ BUSINESS 요약 (기획안 07) ============ -->
<section class="section navy">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="home.b.kicker"></p>
      <h2 class="display" data-i18n="home.b.title"></h2>
      <p class="sub" data-i18n="home.b.sub"></p>
    </header>

    <div class="biz-grid reveal">
      <article class="biz">
        <span class="num">01</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-develop"/></svg></span>
        <h3 data-i18n="biz.1.en"></h3><span class="ko" data-i18n="biz.1.ko"></span>
        <p data-i18n="biz.1.p"></p>
      </article>
      <article class="biz">
        <span class="num">02</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-arch"/></svg></span>
        <h3 data-i18n="biz.2.en"></h3><span class="ko" data-i18n="biz.2.ko"></span>
        <p data-i18n="biz.2.p"></p>
      </article>
      <article class="biz">
        <span class="num">03</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-crane"/></svg></span>
        <h3 data-i18n="biz.3.en"></h3><span class="ko" data-i18n="biz.3.ko"></span>
        <p data-i18n="biz.3.p"></p>
      </article>
      <article class="biz">
        <span class="num">04</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-clipboard"/></svg></span>
        <h3 data-i18n="biz.4.en"></h3><span class="ko" data-i18n="biz.4.ko"></span>
        <p data-i18n="biz.4.p"></p>
      </article>
      <article class="biz">
        <span class="num">05</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg></span>
        <h3 data-i18n="biz.5.en"></h3><span class="ko" data-i18n="biz.5.ko"></span>
        <p data-i18n="biz.5.p"></p>
      </article>
    </div>
    <p style="margin-top:2.4rem" class="reveal"><a class="arrow-link" href="business.html" data-i18n="home.b.more"></a></p>
  </div>
</section>

<!-- ============ PROJECTS 요약 (기획안 19) ============ -->
<section class="section">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="home.p.kicker"></p>
      <h2 class="display" data-i18n="home.p.title"></h2>
      <p class="sub" data-i18n="home.p.sub"></p>
    </header>

    <div class="portfolio reveal">
      <a class="pf" href="project-songdo.html">
        <img src="assets/img/projects/songdo/lux-entrance.jpg" data-i18n-alt="pj.1.name" alt="">
        <div class="pf-body">
          <span class="no">01</span>
          <h3 data-i18n="pj.1.name"></h3>
          <div class="pf-meta">
            <span data-i18n="pj.1.loc"></span>
            <span data-i18n="pj.1.type"></span>
            <span data-i18n="pj.1.year"></span>
          </div>
        </div>
      </a>
      <div class="pf is-empty">
        <div class="ph" style="border:0;background:none;aspect-ratio:auto">
          <div class="ph-in">
            <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-layers"/></svg></span>
            <b data-i18n="pj.empty.b"></b>
            <span data-i18n="pj.empty.s"></span>
          </div>
        </div>
      </div>
    </div>
    <p style="margin-top:2.4rem" class="reveal"><a class="arrow-link" href="projects.html" data-i18n="home.p.more"></a></p>
  </div>
</section>

<!-- ============ CONSTRUCTION 요약 (기획안 08) ============ -->
<section class="section navy">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="home.c.kicker"></p>
      <h2 class="display" data-i18n="home.c.title"></h2>
      <p class="sub" data-i18n="home.c.sub"></p>
    </header>

    <div class="process reveal">
      <div class="step"><span class="dot">01</span><h4 data-i18n="pr.1.h"></h4><p data-i18n="pr.1.p"></p></div>
      <div class="step"><span class="dot">02</span><h4 data-i18n="pr.2.h"></h4><p data-i18n="pr.2.p"></p></div>
      <div class="step"><span class="dot">03</span><h4 data-i18n="pr.3.h"></h4><p data-i18n="pr.3.p"></p></div>
      <div class="step"><span class="dot">04</span><h4 data-i18n="pr.4.h"></h4><p data-i18n="pr.4.p"></p></div>
      <div class="step"><span class="dot">05</span><h4 data-i18n="pr.5.h"></h4><p data-i18n="pr.5.p"></p></div>
      <div class="step"><span class="dot">06</span><h4 data-i18n="pr.6.h"></h4><p data-i18n="pr.6.p"></p></div>
    </div>
    <p style="margin-top:3rem" class="reveal"><a class="arrow-link" href="construction.html" data-i18n="home.c.more"></a></p>
  </div>
</section>

<!-- ============ CTA ============ -->
<section class="cta">
  <div class="wrap reveal">
    <h2 data-i18n="cta.title"></h2>
    <p data-i18n="cta.p"></p>
    <a href="contact.html" class="btn btn-gold" data-i18n="cta.btn"></a>
  </div>
</section>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
