<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction | Genova Honors</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="construction" data-meta="con" class="solid-header">

<section class="page-hero with-img">
  <div class="page-hero-media"><img src="assets/img/projects/songdo/lux-entrance.jpg" alt=""></div>
  <div class="wrap page-hero-inner">
    <p class="kicker" data-i18n="nav.construction"></p>
    <h1 data-i18n="cn.h1"></h1>
    <p class="sub" data-i18n="cn.sub"></p>
  </div>
</section>

<!-- PROCESS 6단계 (기획안 08) -->
<section class="section">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="cn.pr.kicker"></p>
      <h2 class="display" data-i18n="cn.pr.title"></h2>
      <p class="sub" data-i18n="cn.pr.sub"></p>
    </header>
    <div class="process reveal">
      <div class="step"><span class="dot">01</span><h4 data-i18n="pr.1.h"></h4><p data-i18n="pr.1.p"></p></div>
      <div class="step"><span class="dot">02</span><h4 data-i18n="pr.2.h"></h4><p data-i18n="pr.2.p"></p></div>
      <div class="step"><span class="dot">03</span><h4 data-i18n="pr.3.h"></h4><p data-i18n="pr.3.p"></p></div>
      <div class="step"><span class="dot">04</span><h4 data-i18n="pr.4.h"></h4><p data-i18n="pr.4.p"></p></div>
      <div class="step"><span class="dot">05</span><h4 data-i18n="pr.5.h"></h4><p data-i18n="pr.5.p"></p></div>
      <div class="step"><span class="dot">06</span><h4 data-i18n="pr.6.h"></h4><p data-i18n="pr.6.p"></p></div>
    </div>
  </div>
</section>

<!-- BEFORE / DURING / AFTER (기획안 17) -->
<section class="section navy">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="cn.bda.kicker"></p>
      <h2 class="display" data-i18n="cn.bda.title"></h2>
      <p class="sub" data-i18n="cn.bda.sub"></p>
    </header>

    <div class="bda reveal">
      <figure>
        <div class="tag"><span data-i18n="cn.bda1.t"></span><i></i></div>
        <div class="ph wide"><div class="ph-in">
          <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-ruler"/></svg></span>
          <b data-i18n="ph.img.b"></b><span data-i18n="ph.img.s"></span>
        </div></div>
        <h4 data-i18n="cn.bda1.h"></h4>
        <p data-i18n="cn.bda1.p"></p>
      </figure>
      <figure>
        <div class="tag"><span data-i18n="cn.bda2.t"></span><i></i></div>
        <div class="ph wide"><div class="ph-in">
          <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-crane"/></svg></span>
          <b data-i18n="ph.con.b"></b><span data-i18n="ph.con.s"></span>
        </div></div>
        <h4 data-i18n="cn.bda2.h"></h4>
        <p data-i18n="cn.bda2.p"></p>
      </figure>
      <figure>
        <div class="tag"><span data-i18n="cn.bda3.t"></span><i></i></div>
        <img src="assets/img/projects/songdo/lux-house2.jpg" alt="" style="aspect-ratio:16/9;object-fit:cover;width:100%">
        <h4 data-i18n="cn.bda3.h"></h4>
        <p data-i18n="cn.bda3.p"></p>
      </figure>
    </div>
  </div>
</section>

<!-- QUALITY / SAFETY / TECH (기획안 18) -->
<section class="section">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="cn.q.kicker"></p>
      <h2 class="display" data-i18n="cn.q.title"></h2>
      <p class="sub" style="font-size:.85rem" data-i18n="cn.q.sub"></p>
    </header>
    <div class="value-grid reveal">
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-award"/></svg></span><h3 data-i18n="cn.q1.h"></h3><p data-i18n="cn.q1.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-shield"/></svg></span><h3 data-i18n="cn.q2.h"></h3><p data-i18n="cn.q2.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></span><h3 data-i18n="cn.q3.h"></h3><p data-i18n="cn.q3.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-ruler"/></svg></span><h3 data-i18n="cn.q4.h"></h3><p data-i18n="cn.q4.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-clipboard"/></svg></span><h3 data-i18n="cn.q5.h"></h3><p data-i18n="cn.q5.p"></p></article>
    </div>
  </div>
</section>

<section class="cta">
  <div class="wrap reveal">
    <h2 data-i18n="cta.title"></h2>
    <p data-i18n="cta.p"></p>
    <a href="contact.html" class="btn btn-gold" data-i18n="cta.btn"></a>
  </div>
</section>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>

</html>
