<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About | Genova Honors</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about" data-meta="about" class="solid-header">

<!-- ============ PAGE HERO ============ -->
<section class="page-hero with-img">
  <div class="page-hero-media"><img src="assets/img/projects/songdo/biz-hero.jpg" alt=""></div>
  <div class="wrap page-hero-inner">
    <p class="kicker" data-i18n="nav.about"></p>
    <h1 data-i18n="ab.h1"></h1>
    <p class="sub" data-i18n="ab.sub"></p>
  </div>
</section>

<!-- ============ VISION (기획안 20 — VISION 먼저) ============ -->
<section class="section">
  <div class="wrap">
    <div class="split-2">
      <div class="reveal">
        <p class="kicker" data-i18n="ab.v.kicker"></p>
        <h2 class="display" data-i18n-html="ab.v.title"></h2>
        <div class="rule"></div>
      </div>
      <div class="reveal">
        <p class="lead" data-i18n="ab.v.lead"></p>
        <p style="margin-top:1.4rem;color:var(--text-inv-m)" data-i18n="ab.v.p"></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ WHAT WE DO / HOW WE BUILD / WHAT WE VALUE (기획안 06) ============ -->
<section class="section navy">
  <div class="wrap">
    <div class="biz-grid reveal">
      <article class="biz">
        <span class="num">01</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-layers"/></svg></span>
        <h3 data-i18n="ab.w1.h"></h3>
        <p data-i18n="ab.w1.p"></p>
      </article>
      <article class="biz">
        <span class="num">02</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></span>
        <h3 data-i18n="ab.w2.h"></h3>
        <p data-i18n="ab.w2.p"></p>
      </article>
      <article class="biz">
        <span class="num">03</span>
        <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-award"/></svg></span>
        <h3 data-i18n="ab.w3.h"></h3>
        <p data-i18n="ab.w3.p"></p>
      </article>
    </div>
  </div>
</section>

<!-- ============ BRAND VALUES (기획안 03 — TRUST·QUALITY·DESIGN·CONSTRUCTION·VALUE) ============ -->
<section class="section">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="ab.val.kicker"></p>
      <h2 class="display" data-i18n="ab.val.title"></h2>
    </header>
    <div class="value-grid reveal">
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></span><h3 data-i18n="ab.val1.h"></h3><p data-i18n="ab.val1.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-award"/></svg></span><h3 data-i18n="ab.val2.h"></h3><p data-i18n="ab.val2.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-ruler"/></svg></span><h3 data-i18n="ab.val3.h"></h3><p data-i18n="ab.val3.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-crane"/></svg></span><h3 data-i18n="ab.val4.h"></h3><p data-i18n="ab.val4.p"></p></article>
      <article class="value"><span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-diamond"/></svg></span><h3 data-i18n="ab.val5.h"></h3><p data-i18n="ab.val5.p"></p></article>
    </div>
  </div>
</section>

<!-- ============ CEO MESSAGE (기획안 22) ============ -->
<section class="section navy">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="ab.ceo.kicker"></p>
      <h2 class="display" data-i18n="ab.ceo.title"></h2>
    </header>

    <div class="ceo">
      <div class="reveal">
        <div class="ph tall">
          <div class="ph-in">
            <span class="f-ico"><svg viewBox="0 0 24 24"><use href="#i-camera"/></svg></span>
            <b data-i18n="ab.ceo.ph"></b>
            <span data-i18n="ab.ceo.phs"></span>
          </div>
        </div>
      </div>
      <div class="reveal">
        <blockquote data-i18n="ab.ceo.quote"></blockquote>
        <p style="margin-top:1.6rem;color:var(--text-inv-m)" data-i18n="ab.ceo.p"></p>
        <div class="sig">
          <b data-i18n="ab.ceo.role"></b>
          <span data-i18n="ab.ceo.name"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ HISTORY (기획안 21) ============ -->
<section class="section">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="ab.h.kicker"></p>
      <h2 class="display" data-i18n="ab.h.title"></h2>
      <p class="sub" style="font-size:.85rem" data-i18n="ab.h.note"></p>
    </header>

    <div class="split-2">
      <div class="reveal">
        <div class="timeline">
          <div class="tl"><b data-i18n="ab.h1y"></b><h4 data-i18n="ab.h1h"></h4><p data-i18n="ab.h1p"></p></div>
          <div class="tl"><b data-i18n="ab.h2y"></b><h4 data-i18n="ab.h2h"></h4><p data-i18n="ab.h2p"></p></div>
          <div class="tl"><b data-i18n="ab.h3y"></b><h4 data-i18n="ab.h3h"></h4><p data-i18n="ab.h3p"></p></div>
        </div>
      </div>
      <div class="reveal">
        <div class="timeline">
          <div class="tl"><b data-i18n="ab.h4y"></b><h4 data-i18n="ab.h4h"></h4><p data-i18n="ab.h4p"></p></div>
          <div class="tl"><b data-i18n="ab.h5y"></b><h4 data-i18n="ab.h5h"></h4><p data-i18n="ab.h5p"></p></div>
          <div class="tl"><b data-i18n="ab.h6y"></b><h4 data-i18n="ab.h6h"></h4><p data-i18n="ab.h6p"></p></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="cta">
  <div class="wrap reveal">
    <h2 data-i18n="cta.title"></h2>
    <p data-i18n="cta.p"></p>
    <a href="contact.html" class="btn btn-gold" data-i18n="cta.btn"></a>
  </div>
</section>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
