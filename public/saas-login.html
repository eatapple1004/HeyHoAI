<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HeyHoAI — Sign in</title>
<link rel="stylesheet" href="/css/theme.css?v=2" />
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{position:relative;z-index:2;width:100%;max-width:410px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid var(--border2);border-radius:24px;padding:38px 34px;
    box-shadow:0 40px 100px -40px rgba(124,108,255,.5)}
  .brand{justify-content:center;font-size:22px;margin-bottom:6px}
  .tagline{text-align:center;color:var(--dim);font-size:13.5px;margin-bottom:28px}
  .tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:24px}
  .tabs button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:13.5px;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;transition:all .2s}
  .tabs button.active{background:linear-gradient(120deg,var(--accent),#9b7bff);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
  .bonus{background:rgba(94,224,214,.1);border:1px solid rgba(94,224,214,.3);color:var(--cyan);font-size:11.5px;font-weight:600;padding:9px 12px;border-radius:10px;text-align:center;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:7px}
  .field input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:11px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;transition:border-color .2s}
  .field input:focus{outline:none;border-color:var(--accent);background:rgba(124,108,255,.05)}
  .terms{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--dim);margin:4px 0 18px}
  .terms input{margin-top:3px;accent-color:var(--accent)}
  .terms a{color:var(--accent2)}
  .btn-primary,.btn-social{width:100%}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--faint);font-size:11px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .btn-social{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--border2);font-size:14px;font-weight:600;padding:12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:inherit;transition:border-color .2s}
  .btn-social:hover{border-color:var(--accent)}
  .foot{text-align:center;font-size:12.5px;color:var(--dim);margin-top:22px}
  .foot a{color:var(--accent2);cursor:pointer}
</style>
</head>
<body>
<div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<div class="card fade d1">
  <div class="brand" onclick="location.href='/landing.html'"><span class="dot"></span><b>HeyHoAI</b></div>
  <div class="tagline">Your face. Any look. Content on autopilot.</div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="setTab('login')">Log in</button>
    <button id="tabSignup" onclick="setTab('signup')">Sign up</button>
  </div>

  <div id="signupBonus" class="bonus hidden">🎁 Sign up &amp; get 10 free credits</div>

  <form onsubmit="return submitForm(event)">
    <div class="field hidden" id="nameField"><label>Name</label><input type="text" placeholder="Your name" /></div>
    <div class="field"><label>Email</label><input type="email" placeholder="you@example.com" required /></div>
    <div class="field"><label>Password</label><input type="password" placeholder="••••••••" required /></div>
    <div class="field hidden" id="confirmField"><label>Confirm password</label><input type="password" placeholder="••••••••" /></div>
    <div class="terms hidden" id="termsRow">
      <input type="checkbox" id="agree" />
      <span>I confirm this is my own face/content and I agree to the <a onclick="alert('약관')">Terms</a> &amp; <a onclick="alert('개인정보처리방침')">Privacy Policy</a>.</span>
    </div>
    <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Log in</button>
  </form>

  <div class="divider">OR</div>
  <button class="btn-social" onclick="alert('→ Google OAuth (mock)')"><b style="color:#fff">G</b> Continue with Google</button>

  <div class="foot" id="footText">New here? <a onclick="setTab('signup')">Create an account</a></div>
</div>

<script>
let tab='login';
function setTab(t){
  tab=t;
  document.getElementById('tabLogin').classList.toggle('active',t==='login');
  document.getElementById('tabSignup').classList.toggle('active',t==='signup');
  const su=t==='signup';
  document.getElementById('nameField').classList.toggle('hidden',!su);
  document.getElementById('confirmField').classList.toggle('hidden',!su);
  document.getElementById('termsRow').classList.toggle('hidden',!su);
  document.getElementById('signupBonus').classList.toggle('hidden',!su);
  document.getElementById('submitBtn').textContent=su?'Create account':'Log in';
  document.getElementById('footText').innerHTML=su
    ?`Already have an account? <a onclick="setTab('login')">Log in</a>`
    :`New here? <a onclick="setTab('signup')">Create an account</a>`;
}
function submitForm(e){
  e.preventDefault();
  if(tab==='signup'&&!document.getElementById('agree').checked){alert('약관에 동의해 주세요.');return false;}
  alert((tab==='signup'?'회원가입':'로그인')+' 성공 (mock) → /studio.html');
  window.location.href='/studio.html';return false;
}
</script>
</body>
</html>
