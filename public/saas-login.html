<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia — Sign in</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/js/i18n.js?v=18" defer></script>
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{position:relative;z-index:2;width:100%;max-width:410px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid var(--border2);border-radius:24px;padding:38px 34px;
    box-shadow:0 40px 100px -40px rgba(124,108,255,.5)}
  .brand{justify-content:center;font-size:22px;margin-bottom:6px}
  .tagline{text-align:center;color:var(--dim);font-size:13.5px;margin-bottom:28px}
  .tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:24px}
  .tabs button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:13.5px;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;transition:all .2s}
  .tabs button.active{background:linear-gradient(120deg,var(--accent),#9b7bff);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
  .bonus{background:rgba(94,224,214,.1);border:1px solid rgba(94,224,214,.3);color:var(--cyan);font-size:11.5px;font-weight:600;padding:9px 12px;border-radius:10px;text-align:center;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:7px}
  .field input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:11px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;transition:border-color .2s}
  .field input:focus{outline:none;border-color:var(--accent);background:rgba(124,108,255,.05)}
  .terms{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--dim);margin:4px 0 18px}
  .terms input{margin-top:3px;accent-color:var(--accent)}
  .terms a{color:var(--accent2)}
  .btn-primary,.btn-social{width:100%}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--faint);font-size:11px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .btn-social{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--border2);font-size:14px;font-weight:600;padding:12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:inherit;transition:border-color .2s}
  .btn-social:hover{border-color:var(--accent)}
  .foot{text-align:center;font-size:12.5px;color:var(--dim);margin-top:22px}
  .foot a{color:var(--accent2);cursor:pointer}
</style>
</head>
<body>
<div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<div class="card fade d1">
  <div class="brand" onclick="location.href='/landing'"><b>Doppia</b></div>
  <div class="tagline">One product photo — the plan, lookbook and ad video, all done for you.</div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="setTab('login')">Log in</button>
    <button id="tabSignup" onclick="setTab('signup')">Sign up</button>
  </div>

  <div id="signupBonus" class="bonus hidden">Sign up &amp; get 10 free credits</div>

  <form onsubmit="return submitForm(event)">
    <div class="field hidden" id="nameField"><label>Name</label><input type="text" id="inName" placeholder="Your name" /></div>
    <div class="field"><label>Email</label><input type="email" id="inEmail" placeholder="you@example.com" required /></div>
    <div class="field"><label>Password</label><input type="password" id="inPassword" placeholder="••••••••" required /></div>
    <div class="field hidden" id="confirmField"><label>Confirm password</label><input type="password" id="inConfirm" placeholder="••••••••" /></div>
    <div class="terms hidden" id="termsRow">
      <input type="checkbox" id="agree" />
      <span>I confirm I have the rights to the content I upload and I agree to the <a href="/terms" target="_blank" rel="noopener">Terms</a> &amp; <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span>
    </div>
    <div id="errMsg" class="hidden" style="color:#ff7eb6;font-size:12.5px;margin-bottom:14px;line-height:1.5"></div>
    <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Log in</button>
  </form>

  <div class="divider">OR</div>
  <button class="btn-social" onclick="location.href='/api/auth/google'"><b style="color:#fff">G</b> Continue with Google</button>

  <div class="foot" id="footText">New here? <a onclick="setTab('signup')">Create an account</a></div>
</div>

<script>
// ═══ 실제 인증: /api/auth/{login,signup} (그들 디자인 + main 실인증 이식) ═══
let tab='login';
function setTab(t){
  tab=t;
  document.getElementById('tabLogin').classList.toggle('active',t==='login');
  document.getElementById('tabSignup').classList.toggle('active',t==='signup');
  const su=t==='signup';
  document.getElementById('nameField').classList.toggle('hidden',!su);
  document.getElementById('confirmField').classList.toggle('hidden',!su);
  document.getElementById('termsRow').classList.toggle('hidden',!su);
  document.getElementById('signupBonus').classList.toggle('hidden',!su);
  document.getElementById('submitBtn').textContent=su?'Create account':'Log in';
  document.getElementById('footText').innerHTML=su
    ?`Already have an account? <a onclick="setTab('login')">Log in</a>`
    :`New here? <a onclick="setTab('signup')">Create an account</a>`;
  showErr('');
}
function showErr(msg){
  const el=document.getElementById('errMsg');
  el.textContent=msg;el.classList.toggle('hidden',!msg);
}
function nextUrl(){
  const next=new URLSearchParams(location.search).get('next');
  return next&&next.startsWith('/')?next:'/home.html'; // 로그인 후 기본 진입 = 홈(허브). next 파라미터 있으면 그 곳으로.
}
async function submitForm(e){
  e.preventDefault();showErr('');
  const email=document.getElementById('inEmail').value.trim();
  const password=document.getElementById('inPassword').value;
  if(tab==='signup'){
    if(!document.getElementById('agree').checked){showErr('Please agree to the terms.');return false;}
    if(password!==document.getElementById('inConfirm').value){showErr('Passwords do not match.');return false;}
  }
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent=tab==='signup'?'Creating…':'Logging in…';
  try{
    const body=tab==='signup'
      ?{email,password,displayName:document.getElementById('inName').value.trim()||undefined}
      :{email,password};
    const res=await fetch('/api/auth/'+(tab==='signup'?'signup':'login'),{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.success){
      showErr(data.error||data.message||(tab==='signup'?'Sign-up failed.':'Incorrect email or password.'));
      return false;
    }
    window.location.href=nextUrl();
  }catch(err){
    showErr('Could not reach the server. Please try again shortly.');
  }finally{
    btn.disabled=false;btn.textContent=tab==='signup'?'Create account':'Log in';
  }
  return false;
}
// Google OAuth 등 리다이렉트 에러 표시
(function(){
  const e=new URLSearchParams(location.search).get('error');
  if(!e)return;
  const M={google_disabled:'Google sign-in is not set up yet.',google_denied:'Google sign-in was cancelled.',google_state:'Your session expired. Please try again.',google_token:'Google authentication failed.',google_profile:'Could not retrieve your Google account details.',google_unverified:'This Google account has an unverified email.'};
  showErr(M[e]||'Something went wrong during sign-in. Please try again.');
})();
// 이미 로그인된 상태면 바로 스튜디오로
fetch('/api/auth/me').then(r=>{if(r.ok)window.location.href=nextUrl();}).catch(()=>{});
</script>
</body>
</html>
