<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Video</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<link rel="stylesheet" href="/css/topnav.css?v=1" />
<link rel="stylesheet" href="/css/base-ui.css?v=5" />
<script src="/js/flags.js" defer></script>
<script src="/js/no-pip.js" defer></script>
<script src="/js/i18n.js?v=27" defer></script>
<script src="/saas-auth.js?v=3" defer></script>
<script src="/js/topnav.js?v=7" defer></script>
</head>
<body>
<!-- (2026-10-13) 베이스 1차 — Video: 엔진 선택 + 시작 프레임 + 프롬프트 + 길이·비율·사운드. 제출은 POST /api/generate/video/async(tool=엔진) → GET /video/jobs/:id 폴링. -->
<div class="split">
  <aside class="composer">
    <div class="cbody">
      <div class="lbl">Model</div>
      <div class="msel" id="msel"><span class="ic">…</span><span><b>Loading engines</b><small>GET /api/generate/tools</small></span></div>
      <div class="lbl">Start frame <i id="sfHint">· from Image, Library or upload</i></div>
      <div class="row"><img id="sf" alt="" style="width:92px;height:92px;object-fit:cover;border-radius:12px;background:var(--surface2)"><div class="refs" style="flex:1"><button class="add" id="sfAdd" type="button">+</button><button class="add" id="sfLib" type="button" style="font-size:12px">Lib</button><button class="add" id="sfClear" type="button" style="font-size:12px" title="Clear">✕</button></div></div>
      <input type="file" id="sfFile" accept="image/*" hidden>
      <div class="refs" id="libPick" hidden style="margin-top:6px"></div>
      <div id="efWrap" hidden><div class="lbl">End frame <i>· optional</i></div><div class="row"><img id="ef" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--surface2)"><button class="btn2" id="efAdd" type="button">Upload</button><button class="btn2" id="efClear" type="button">Clear</button></div><input type="file" id="efFile" accept="image/*" hidden></div>
      <div class="lbl">Prompt <i id="plen">0</i></div>
      <textarea class="ff" id="prompt" maxlength="2000" placeholder="Slow push-in, droplets catch the light, label stays readable."></textarea>
      <div class="lbl">Duration</div><div class="chips" id="durs"></div>
      <div id="ratioWrap"><div class="lbl">Aspect ratio</div><div class="chips" id="ratios"></div></div>
      <div id="resWrap" hidden><div class="lbl">Resolution</div><div class="chips" id="ress"></div></div>
      <div id="audioWrap" hidden><div class="lock" id="audioLock" style="margin-top:12px"><div><b>Sound</b><small>Native ambient sound (engine)</small></div><span class="sw2"><i></i></span></div></div>
      <div class="lock" id="privLock" style="margin-top:8px"><div><b>Private Mode</b><small>Off = result goes to the public feed</small></div><span class="sw2"><i></i></span></div>
      <div class="note" id="engNote"></div>
    </div>
    <div class="cfoot"><button class="gen" id="gen">Generate video <span class="c">◈ <span id="cost">—</span></span></button></div>
  </aside>
  <div class="feed">
    <div class="feedbar"><div class="tabs"><button class="on" data-f="mine">My results</button><button data-f="community">Explore</button></div><span id="feedNote" style="color:var(--faint);font-size:12px"></span></div>
    <div class="prog" id="prog" hidden><i id="bar"></i></div>
    <div class="masonry" id="feed" style="columns:3"></div>
    <div class="empty" id="feedEmpty" hidden>No videos yet. Start from an image result.</div>
  </div>
</div>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>(window.DoppiaNav?DoppiaNav.toast(m):alert(m));
const ICON={kling:'K',veo:'V',runway:'R',minimax:'M',sora:'O',seedance:'S'};
const NOTE={kling:'Image → video · text → video · video-to-audio',veo:'Native sound. 1080p forces 8s.',runway:'Needs a start frame.',minimax:'Needs a start frame · 6s',sora:'Text or image → video',seedance:'4–15s · 720p/1080p'};
const st={tools:[],tool:null,dur:null,ratio:null,res:null,audio:false,priv:false,sf:null,ef:null,feed:'mine'};
function tool(){return st.tools.find(t=>t.id===st.tool)||st.tools[0];}
function renderSel(){const t=tool();if(!t){$('#msel').innerHTML='<span class="ic">!</span><span><b>No video engine available</b><small>No API key on this server</small></span>';return}
  $('#msel').innerHTML=`<span class="ic">${ICON[t.provider]||'•'}</span><span><b>${esc(t.label)}</b><small>${esc(t.provider)} · ◈${t.pricing.perDuration[st.dur]||'—'}/${st.dur}s</small></span><span class="ar">▾</span><div class="mlist">${st.tools.map(x=>`<div data-id="${x.id}"><span class="ic" style="width:28px;height:28px;font-size:12px">${ICON[x.provider]||'•'}</span><span><b style="font-size:13px">${esc(x.label)}</b><small>${esc(NOTE[x.provider]||x.provider)}</small></span><span class="pc">◈${Object.values(x.pricing.perDuration||{})[0]||'—'}</span></div>`).join('')}</div>`;}
$('#msel').addEventListener('click',e=>{const d=e.target.closest('[data-id]');if(d){st.tool=d.dataset.id;applyTool();$('#msel').classList.remove('open');e.stopPropagation();return}$('#msel').classList.toggle('open')});
document.addEventListener('click',e=>{if(!$('#msel').contains(e.target))$('#msel').classList.remove('open')});
function chips(sel,arr,cur,fmt){$(sel).innerHTML=arr.map(v=>`<button type="button" class="chip ${String(v)===String(cur)?'on':''}" data-v="${v}">${fmt?fmt(v):v}</button>`).join('');}
function applyTool(){const t=tool();if(!t)return;const c=t.controls||{};
  const durs=c.duration||[5];if(!durs.map(String).includes(String(st.dur)))st.dur=durs[0];chips('#durs',durs,st.dur,v=>v+'s');
  const ratios=c.aspectRatio||null;$('#ratioWrap').hidden=!ratios;if(ratios){if(!ratios.includes(st.ratio))st.ratio=ratios[0];chips('#ratios',ratios,st.ratio);}else st.ratio=null;
  const ress=c.resolution||null;$('#resWrap').hidden=!ress;if(ress){if(!ress.includes(st.res))st.res=ress[0];chips('#ress',ress,st.res);}else st.res=null;
  $('#audioWrap').hidden=!c.audio;if(!c.audio)st.audio=false;$('#audioLock').classList.toggle('on',st.audio);
  $('#efWrap').hidden=!(t.imageSlots||[]).some(s=>s.key==='endFrame');
  $('#engNote').textContent=NOTE[t.provider]||'';renderSel();cost();}
$('#durs').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.dur=b.dataset.v;applyTool()});
$('#ratios').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.ratio=b.dataset.v;chips('#ratios',tool().controls.aspectRatio,st.ratio)});
$('#ress').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.res=b.dataset.v;chips('#ress',tool().controls.resolution,st.res)});
$('#audioLock').addEventListener('click',()=>{st.audio=!st.audio;$('#audioLock').classList.toggle('on',st.audio)});
$('#privLock').addEventListener('click',()=>{st.priv=!st.priv;$('#privLock').classList.toggle('on',st.priv)});
function cost(){const t=tool();if(!t)return;$('#cost').textContent=(t.pricing.perDuration[String(st.dur)]||t.pricing.perDuration[Object.keys(t.pricing.perDuration)[0]]||0).toLocaleString('en-US');}
// ── 프레임 ──
function setSf(x){st.sf=x;$('#sf').src=x?x.url:'';}
$('#sfAdd').addEventListener('click',()=>$('#sfFile').click());$('#sfFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)setSf({file:f,url:URL.createObjectURL(f)});e.target.value=''});
$('#sfClear').addEventListener('click',()=>setSf(null));
$('#efAdd').addEventListener('click',()=>$('#efFile').click());$('#efFile').addEventListener('change',e=>{const f=e.target.files[0];if(f){st.ef={file:f,url:URL.createObjectURL(f)};$('#ef').src=st.ef.url}e.target.value=''});$('#efClear').addEventListener('click',()=>{st.ef=null;$('#ef').src=''});
$('#sfLib').addEventListener('click',async()=>{const p=$('#libPick');if(!p.hidden){p.hidden=true;return}p.hidden=false;p.innerHTML='<span class="note">loading…</span>';
  try{const d=(await(await fetch('/api/generate/results?type=photo&limit=24')).json()).data||[];p.innerHTML=d.filter(r=>r.file_path).map(r=>`<button type="button" data-u="/images/${esc(r.file_path.split('/').pop())}"><img src="/images/${esc(r.file_path.split('/').pop())}" alt=""></button>`).join('')||'<span class="note">No images in Library yet.</span>';}catch(e){p.innerHTML='<span class="note">Library unavailable.</span>'}});
$('#libPick').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;setSf({url:b.dataset.u});$('#libPick').hidden=true});
$('#prompt').addEventListener('input',e=>$('#plen').textContent=e.target.value.length);
// ── 피드 ──
function url(r){return '/images/'+String(r.file_path||'').split('/').pop();}
function vcard(u,idx,label,cls){return `<div class="rt ${cls||''}" ${idx?`onclick="location.href='/creation?idx=${idx}'"`:''}><video src="${esc(u)}" muted loop playsinline autoplay onerror="this.closest('.rt').remove()"></video><span class="badge">▶ ${esc(label||'')}</span></div>`;}
async function loadFeed(){const f=$('#feed');f.innerHTML='';$('#feedEmpty').hidden=true;try{const api=st.feed==='mine'?'/api/generate/results?type=reel&limit=30':'/api/generate/community?limit=60';const d=(await(await fetch(api)).json()).data||[];const rows=d.filter(r=>r.file_path&&/\.(mp4|webm|mov)$/i.test(r.file_path));if(!rows.length){$('#feedEmpty').hidden=false;return}f.innerHTML=rows.map(r=>vcard(url(r),r.idx,(r.metadata&&r.metadata.engine)||r.model||'')).join('');}catch(e){$('#feedEmpty').hidden=false}}
$$('.tabs [data-f]').forEach(b=>b.addEventListener('click',()=>{$$('.tabs [data-f]').forEach(x=>x.classList.toggle('on',x===b));st.feed=b.dataset.f;loadFeed()}));
// ── 생성 ──
let progT=null;function progStart(){const el=$('#bar');$('#prog').hidden=false;let p=3;el.style.width='3%';progT=setInterval(()=>{p=Math.min(95,p+Math.random()*2);el.style.width=p+'%'},1500)}function progStop(){clearInterval(progT);$('#bar').style.width='100%';setTimeout(()=>$('#prog').hidden=true,400)}
const sjson=async r=>{try{return await r.json()}catch(e){return {}}};
$('#gen').addEventListener('click',async()=>{const t=tool();if(!t)return;const prompt=$('#prompt').value.trim();if(!prompt)return toast('Write a prompt first');
  const needsFrame=['runway','minimax'].includes(t.provider);if(needsFrame&&!st.sf)return toast(t.label+' needs a start frame');
  const fd=new FormData();fd.append('prompt',prompt);fd.append('duration',String(st.dur));fd.append('mode','pro');if(st.ratio)fd.append('aspectRatio',st.ratio);if(st.res)fd.append('resolution',st.res);fd.append('audio',st.audio?'true':'false');fd.append('tool',t.id);
  fd.append('billingMode','custom');fd.append('templateName','Video');fd.append('privateMode',st.priv?'true':'false');
  if(st.sf){try{const b=st.sf.file||await(await fetch(st.sf.url)).blob();fd.append('sourceImage',b,'start.png')}catch(e){return toast('Start frame could not be read')}}
  if(st.ef){try{const b=st.ef.file||await(await fetch(st.ef.url)).blob();fd.append('endFrame',b,'end.png')}catch(e){}}
  $('#gen').disabled=true;progStart();const f=$('#feed');$('#feedEmpty').hidden=true;const id='ph'+Date.now();f.insertAdjacentHTML('afterbegin',`<div class="rt pend" id="${id}">rendering · ${esc(t.label)} · ${st.dur}s</div>`);
  try{const res=await fetch('/api/generate/video/async',{method:'POST',body:fd});const d=await sjson(res);
    if(res.status===402)throw Object.assign(new Error(d.error||'Not enough credits'),{c402:true});
    if(!res.ok||!d.success)throw new Error(d.error||'video submit failed');
    DoppiaNav.refreshCredits();
    for(let i=0;i<90;i++){await new Promise(r=>setTimeout(r,8000));let j;try{j=(await(await fetch('/api/generate/video/jobs/'+d.jobId)).json()).data}catch(e){continue}
      if(!j)continue;if(j.status==='succeeded'){const el=document.getElementById(id);if(el)el.remove();f.insertAdjacentHTML('afterbegin',vcard(j.url,j.resultIdx,t.label,'new'));toast('Video ready');return}
      if(j.status==='failed')throw new Error(j.error||'Video generation failed');}
    throw new Error('Still rendering — check your Library shortly.');}
  catch(e){const el=document.getElementById(id);if(el)el.remove();toast(e.message||'failed');if(e.c402)setTimeout(()=>location.href='/billing',1200);DoppiaNav.refreshCredits()}
  finally{$('#gen').disabled=false;progStop()}});
// ── 부팅 ──
function boot(){DoppiaNav.tools().then(T=>{st.tools=T.video||[];const q=new URLSearchParams(location.search);const qt=q.get('tool');st.tool=(qt&&st.tools.some(t=>t.id===qt))?qt:(st.tools[0]&&st.tools[0].id);const start=q.get('start');if(start&&start.startsWith('/'))setSf({url:start});applyTool();});loadFeed();}
if(window.DoppiaNav)boot();else document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,0));
})();
</script>
</body>
</html>
