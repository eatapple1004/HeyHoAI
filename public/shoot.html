<style>
/* (2026-10-16) Doppia Shoot — 옷입히기 게임 구조. 모델을 고르면(허브) 그 모델로 옷·소품 입히기, 장면 바꾸기, 자세 바꾸기(영상은 soon).
   전용 CSS 는 환영 화면·썸네일 그리드·스테이지·버전 띠뿐, 칩·입력·카드·피드는 base-ui 공용. */
.hello{max-width:1100px;margin:0 auto;padding:40px 20px 80px}
.hello h1{font-family:'Sora',sans-serif;font-size:34px;margin:0 0 6px}.hello p{color:var(--dim);margin:0 0 22px}
.hello .filt{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}.hello .filt .lbl{margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.composer .grid{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.composer .grid.wide{grid-template-columns:repeat(2,1fr)}
.mc{position:relative;padding:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;overflow:hidden;text-align:left;font:inherit}
.mc img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--bg2)}.grid.wide .mc img{aspect-ratio:4/3}
.mc .nm{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;font-size:12px;line-height:1.3;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}.mc .nm small{display:block;opacity:.75;font-size:10px}
.mc.on{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}.mc[disabled]{cursor:default;opacity:.55}.mc .bd{position:absolute;top:6px;right:6px}
.mc.add{display:grid;place-items:center;aspect-ratio:4/5;border-style:dashed;color:var(--faint);font-size:12px;text-align:center;padding:10px;line-height:1.4}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:12px}
.who img{width:42px;height:42px;border-radius:50%;object-fit:cover}.who b{display:block;font-size:13px}.who small{color:var(--faint);font-size:11px}.who button{margin-left:auto}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.acts button{padding:9px 4px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.acts button.on{border-color:var(--lime);color:var(--text)}.acts button[disabled]{opacity:.5;cursor:default}.acts button i{display:block;font-style:normal;font-size:16px;margin-bottom:2px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1;border:1px dashed var(--border2);border-radius:12px;background:var(--surface);display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;color:var(--faint);font-size:11px;text-align:center;padding:4px;overflow:hidden}
.slot i{font-style:normal;font-size:22px;line-height:1}.slot.on{border-style:solid;border-color:var(--lime)}.slot.on img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.on span{position:absolute;left:0;right:0;bottom:0;padding:3px;background:rgba(0,0,0,.6);color:#fff;font-size:10px}.slot .x{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:0;cursor:pointer;font-size:11px;display:grid;place-items:center;z-index:1}
.slot.soon{opacity:.45;cursor:default}.slot.over{border-color:var(--lime);background:var(--bg2)}
.drop{display:grid;place-items:center;min-height:84px;border:1px dashed var(--border2);border-radius:12px;background:var(--surface);color:var(--faint);text-align:center;padding:10px;cursor:pointer;font-size:12px;line-height:1.5;margin-top:8px}.drop b{display:block;color:var(--text);font-size:13px}
.stage{padding:16px 22px 60px}
.stage .cur{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center}
.stage .cur img{max-height:70vh;max-width:100%;border-radius:14px;border:1px solid var(--border);background:var(--bg2)}
.stage .cur .pend{display:grid;place-items:center;width:min(100%,420px);aspect-ratio:3/4;border-radius:14px;border:1px dashed var(--border2);color:var(--faint)}
.strip{display:flex;gap:8px;overflow:auto;padding:12px 0 4px}
.strip button{flex:none;width:72px;height:96px;border-radius:10px;overflow:hidden;border:1.5px solid transparent;padding:0;background:var(--bg2);cursor:pointer;position:relative}
.strip button img{width:100%;height:100%;object-fit:cover;display:block}.strip button.on{border-color:var(--lime)}
.strip button small{position:absolute;left:0;right:0;bottom:0;font-size:9px;padding:2px 4px;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
/* Pick a shot — 패널 타일 + 힉스필드 무드보드식 모달 */
.tpl{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:0;height:76px;border:1px solid var(--border2);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit;text-align:left;overflow:hidden}
.tpl img{width:76px;height:100%;object-fit:cover;flex:none}.tpl .ic{font-size:22px;padding-left:12px}.tpl img+.ic{display:none}.tpl b{display:block;font-size:13px}.tpl small{display:block;color:var(--faint);font-size:11px;margin-top:2px}.tpl:hover{border-color:var(--lime)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:20px}
.modal .box{position:relative;width:min(960px,100%);max-height:90vh;overflow:auto;padding:28px;border:1px solid var(--border);border-radius:18px;background:var(--bg)}
.modal h2{font-family:'Sora',sans-serif;font-size:24px;margin:0 0 6px;letter-spacing:.02em;text-transform:uppercase}.modal p{color:var(--dim);margin:0 0 14px;font-size:13px}
.modal .x{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer}
.modal #tplQ{margin-bottom:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tc{position:relative;padding:0;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit;overflow:hidden;text-align:center}
.tc img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--bg2)}.tc .ic{display:grid;place-items:center;aspect-ratio:3/4;font-size:34px;background:var(--bg2)}.tc img+.ic{display:none}
.tc b{display:block;padding:8px 6px;font-size:12px;font-weight:600}.tc:hover,.tc.on{border-color:var(--lime)}
.bubble{display:flex;gap:10px;align-items:flex-start;max-width:560px;margin:0 auto 14px}
.bubble img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--border2)}
.bubble .b{position:relative;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.5}
.bubble .b:before{content:'';position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:var(--border2);border-left:0}
.bubble .q{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.bubble .q button{font-size:12px;padding:5px 10px}
.stage .cur img.intro{animation:pop .35s ease}@keyframes pop{from{opacity:.2;transform:scale(.97)}to{opacity:1;transform:none}}
.mk{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.mk h2{font-family:'Sora',sans-serif;font-size:24px;margin:0 0 4px}.mk p{color:var(--dim);margin:0 0 14px;line-height:1.5}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ugrid .u{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}.ugrid .u img{width:100%;height:100%;object-fit:cover;display:block}
.ugrid .u .x{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:0;cursor:pointer;font-size:12px;display:grid;place-items:center}
.ugrid .up{aspect-ratio:1;border:1px dashed var(--border2);border-radius:12px;display:grid;place-items:center;color:var(--faint);font-size:12px;cursor:pointer;background:var(--surface);text-align:center;line-height:1.4}.ugrid .up b{display:block;font-size:22px;color:var(--text)}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.guide div{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:12.5px;line-height:1.55;color:var(--dim)}.guide b{display:block;color:var(--text);margin-bottom:4px}
.panel{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.gauge{display:flex;align-items:center;gap:12px}.gauge i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:conic-gradient(var(--c,var(--lime)) calc(var(--v,0)*1%),var(--border) 0);position:relative}
.gauge i:after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--surface)}.gauge i span{position:relative;z-index:1}
.gauge .t{font-size:12px;color:var(--dim);line-height:1.45}.gauge .t b{display:block;color:var(--text);font-size:13px}
.panel .consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--dim);line-height:1.45;padding:10px;border:1px solid var(--border2);border-radius:10px;cursor:pointer}.panel .consent input{margin-top:2px}
.panel .gen{width:100%}
.mc .st{position:absolute;left:8px;top:8px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff}
.angles{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--border2);border-radius:12px;background:var(--surface);font-size:12.5px;color:var(--dim);line-height:1.45}.angles b{color:var(--text)}.angles .btn2{margin-left:auto;white-space:nowrap}
.ugrid .u.ai:after{content:'AI';position:absolute;left:5px;top:5px;font-size:9px;padding:2px 5px;border-radius:999px;background:var(--lime);color:#111;font-weight:700}
@media(max-width:860px){.mk{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- (2026-10-16) Doppia Shoot — 사람이 주인공인 촬영(제품 주인공은 Lens). 사용자: "옷입히기 게임 같은 느낌. 들어오면 '반가워, 너의 모델을 골라줘'. 모델을 고르면 그걸로 자세·옷·소품·배경, 나중엔 영상."
     흐름: 환영 화면(모델 고르기/만들기) → 스테이지(현재 모델 사진) + 왼쪽 행동 패널(Outfit · Scene · Pose · Video soon). 행동마다 새 버전이 띠에 쌓이고, 어느 버전에서든 이어 간다.
     엔진(10-16 실측): 현재 버전 사진을 이미지 1로 넣고 "이 사람은 그대로, 이것만 바꿔라" — 옷·소품·수영복·배경·자세 전부 Nano Banana Pro 편집 한 번. 란제리는 얼굴 없이 생성 → FaceFusion 스왑 경로라 서버 워커 전까지 soon.
     모델 = 유나(뱅크 /img/shoot/yuna) + 내 모델(GET /api/shoot/models — Create your model: 사진 → Soul ID 학습 → 장면 뱅크). 로스터 200명은 기준 미달이라 제외. 캐릭터가 인사하고 행동을 안내한다(말풍선). 생성 API = POST /api/generate(Image 페이지와 동일), 피드 = template_name 'Doppia Shoot'. -->
<div id="hello" class="hello" hidden>
  <h1>Hi! Pick your model.</h1>
  <p>Dress them up, change the scene, strike a pose. Make a video with them soon.</p>
  <div id="mgrid"></div>
  <div id="create" hidden></div>
</div>
<div class="modal" id="tplModal" hidden><div class="box">
  <button type="button" class="x" data-close aria-label="Close">✕</button>
  <h2>Pick a shot</h2><p>Real shots from our models — pick one, then change the outfit, the place or the mood in your own words.</p>
  <input class="ff" id="tplQ" type="search" placeholder="Search presets…" autocomplete="off">
  <div class="tgrid" id="tgrid"></div>
</div></div>
<div class="split" id="app" hidden>
  <aside class="composer">
    <div class="cbody">
      <div class="who" id="who"></div>
      <div class="acts" id="acts"></div>
      <div id="panel"></div>

  </aside>
  <div class="stage">
    <div class="feedbar"><div class="tabs"><button class="on" data-f="stage">Stage</button><button data-f="mine">My results</button></div><span id="note" style="color:var(--faint);font-size:12px"></span></div>
    <div id="stageView"><div class="bubble" id="bubble" hidden></div><div class="cur" id="cur"></div><div class="strip" id="strip"></div></div>
    <div id="feedView" hidden><div class="masonry" id="feed"></div><div class="empty" id="feedEmpty" hidden>No Shoot results yet.</div></div>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="pfile" accept="image/*" multiple hidden>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>(window.DoppiaNav?DoppiaNav.toast(m):alert(m));

  outfit:'Drop a few item photos and I\'ll put them on — layers are fine.',scene:'Pick a place or describe one. I\'ll keep my outfit and pose.',pose:'Tell me how to stand, or just pick one.',

 ['🗼','Paris','in front of Haussmann buildings with a croissant and coffee, trench coat, soft overcast light'],
 ['🏯','Tokyo night','in a Tokyo alley full of lanterns and signs at night, streetwear, looking at the camera'],
 ['🏋️','Gym','in a bright gym in a sports top and leggings, mid-workout, light sweat, focused'],
 ['🏃','Morning run','jogging along a river path at sunrise in running gear, earbuds in, candid'],
 ['⛳','Golf','on a green golf course in a polo and cap, holding a club, smiling, bright afternoon'],
 ['🎾','Tennis','on a clay tennis court in a tennis outfit, racket in hand, ready stance'],
 ['🏄','Surf','holding a surfboard on the beach in a wetsuit, wet hair, big smile'],
 ['💻','Office','at a desk in a modern office in a smart shirt, laptop open, thoughtful look, window light'],
 ['🛋','Home sofa','curled up on a sofa in a cozy knit and socks, mug in hand, warm lamp light, relaxed'],
 ['🍳','Kitchen','cooking in a bright kitchen in an apron over a tee, laughing, steam rising'],
 ['📚','Bookstore','browsing shelves in a bookstore, cardigan, holding an open book, soft indoor light'],
 ['💐','Flower market','at an outdoor flower market holding a bouquet, floral dress, morning sun'],

 ['🍂','Autumn park','on a park path covered in autumn leaves, camel coat, holding a leaf, soft smile'],
 ['🎤','On stage','on a concert stage under colored spotlights holding a microphone, sequined outfit, mid-song'],

// 품목 유형 → 프롬프트의 착용 문구. 란제리는 얼굴-없이-생성→FaceFusion 경로가 서버에 없어 soon.
// 옷입히기 슬롯(게임처럼 자리가 정해져 있다, 사용자 10-16). 머리→몸→발 순. [key, 라벨, 아이콘, 착용 문구(null = soon)]
const SLOTS=[['hat','Hat','🧢','worn on the head'],['hair','Hair accessory','🎀','in the hair'],['glasses','Glasses','🕶','worn on the face'],['jewelry','Jewelry','💍','worn'],
  ['outer','Outer','🧥','worn open as the outer layer'],['top','Top','👕','worn as the top'],['dress','Dress','👗','worn as the dress'],['bag','Bag','👜','carried on the shoulder or in hand'],
  ['bottom','Bottom','👖','worn as the trousers/skirt'],['swim','Swimwear','🩱','worn as swimwear'],['socks','Socks','🧦','visible at the ankles'],['shoes','Shoes','👟','on the feet'],
  ['underwear','Underwear','🩲',null]];
const POSES=[['Standing','standing naturally, weight on one leg'],['Walking','walking toward the camera, natural movement'],['Sitting','sitting down, relaxed'],['Leaning','leaning against the nearest wall or surface'],['Back','turned away, back to camera, looking over the shoulder'],['Close-up','close-up from the chest up, hand near the face']];
const STUDIO={id:'studio',name:'Studio',category:'Default',scene:'a clean light-grey seamless studio cyclorama',light:'soft even studio light',img:'/img/accessories/concept-studio.png'};

const st={model:null,versions:[],cur:-1,act:'shot',shot:'',tpl:null,shotN:1,shotAspect:'3:4',slots:{},slotTarget:null,scene:null,sceneText:'',bgCat:'',pose:0,poseText:'',tools:[],tool:null,ratio:'3:4',priv:false,busy:false,intro:0};
const tool=()=>st.tools.find(t=>t.id===st.tool)||st.tools[0];
const cur=()=>st.versions[st.cur];
function chipGroup(sel,onPick){$(sel).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));onPick(b.dataset.v);});}
const chipsHtml=(arr,cur)=>arr.map(([v,n])=>`<button type="button" class="chip ${String(v)===String(cur)?'on':''}" data-v="${esc(v)}">${esc(n)}</button>`).join('');

// ── 환영 화면: 모델 고르기 ──
let pollT=null;
async function loadMine(){try{MINE=((await(await fetch('/api/shoot/models')).json()).data)||[];}catch(e){MINE=[];}}
function renderHello(){$('#hello').hidden=false;$('#app').hidden=true;$('#create').hidden=true;$('#mgrid').hidden=false;
  const card=m=>{const img=m.avatar||(m.bank[0]&&m.bank[0].url)||m.photos[0]||'';const st=m.progress?`${STATUS[m.status]} ${m.progress}`:STATUS[m.status]||'';
    return `<button type="button" class="mc" data-id="${m.id}" ${m.status==='ready'?'':'disabled'}>${img?`<img src="${esc(img)}" alt="">`:''}${st?`<span class="st">${esc(st)}</span>`:''}<span class="nm">${esc(m.name)}<small>${m.status==='failed'?esc(m.error||'Failed'):esc(toModel(m).tag)}</small></span></button>`;};
  const official=MINE.filter(m=>m.official),mine=MINE.filter(m=>!m.official); // 공식 로스터 먼저, 내 것은 아래 — 둘 다 같은 카드
  $('#mgrid').innerHTML=`<div class="lbl">Doppia models <i>· ready to shoot</i></div><div class="pickg">${official.map(card).join('')}</div>
    <div class="lbl" style="margin-top:22px">Your models</div><div class="pickg">${mine.map(card).join('')}<button type="button" class="mc add" id="mkBtn">Create your model<br><small>from your photos — trained once, then every scene and outfit · ◈ ${TRAIN_COST.toLocaleString('en-US')}</small></button></div>`;
  $('#mkBtn').onclick=openCreate;
  clearTimeout(pollT);if(MINE.some(m=>BUSY.includes(m.status)))pollT=setTimeout(async()=>{await loadMine();if(!$('#hello').hidden&&$('#create').hidden)renderHello();},6000);}
$('#mgrid').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b||b.disabled)return;pick(toModel(MINE.find(m=>m.id===b.dataset.id)));});
// 만들기: 사진(업로드 + 다각도 결과) + 이름 + 동의 → POST /api/shoot/models. 다각도는 학습 전에 따로: POST /api/shoot/angles(사진 1장) → 폴링 → 그리드에 AI 표시로 추가(지울 수 있다).
//   오른쪽 패널의 두 게이지 = 힉스필드 캐릭터 화면 참고 — 장수, 품질(올린 사진 중 가장 작은 변). 얼굴 사전검사는 없다(사용자 10-16).
const mk={files:[],consent:false,job:null}; // files: {file,url,px} 업로드 | {remote:url} 다각도 결과
const MAX_PHOTOS=80; // 힉스필드 웹과 같은 상한(API 는 100, 다각도 24 가 더해진다)
const MIN_PX=[[1000,'Good'],[600,'OK'],[0,'Low']];
function openCreate(){mk.files=[];mk.consent=false;mk.job=null;$('#mgrid').hidden=true;const c=$('#create');c.hidden=false;
  c.innerHTML=`<div class="mk"><div><h2>Create your model</h2><p>To train well, the model needs clear face photos from many angles — up to 80, 20+ is best. Only one photo? Don\'t worry — we make them: 24 face close-ups (every angle, several expressions), then train.</p>
    <div class="ugrid" id="ugrid"></div><div class="angles" id="angles"></div>
    <div class="guide"><div><b>✓ Works well</b>One person · clear face · front, side and three-quarter · natural light and indoor light mixed · no heavy filters</div><div><b>✕ Avoid</b>Group shots · sunglasses, masks, hands over the face · duplicates · tiny or blurry photos · screenshots</div></div></div>
    <div class="panel"><div><div class="lbl" style="margin-top:0">Name</div><input class="ff" id="mkName" maxlength="100" placeholder="e.g. Mina"></div>
    <div class="gauge" id="gCount"></div><div class="gauge" id="gQual"></div>
    <label class="consent"><input type="checkbox" id="mkConsent"><span>These photos are of me, or of an adult who gave me written permission. I agree to face data being processed to train this model (Higgsfield Soul ID).</span></label>
    <button class="gen" id="mkGo" disabled>Create <span class="c">◈ ${TRAIN_COST.toLocaleString('en-US')}</span></button><button class="btn2" id="mkCancel">Cancel</button></div></div>`;
  renderMk();$('#ugrid').addEventListener('dragover',e=>e.preventDefault());$('#ugrid').addEventListener('drop',e=>{e.preventDefault();mkAdd([...e.dataTransfer.files]);});
  $('#mkConsent').addEventListener('change',e=>{mk.consent=e.target.checked;renderMk();});$('#mkCancel').onclick=()=>{mk.job=null;renderHello();};$('#mkGo').onclick=mkSubmit;}
function renderMk(){const n=mk.files.length,up=mk.files.filter(f=>f.file),j=mk.job;
  $('#ugrid').innerHTML=`<button type="button" class="up" id="mkUp"><b>+</b>${n?'Upload more':'Upload photos'}</button>`+mk.files.map((f,i)=>`<div class="u ${f.remote?'ai':''}"><img src="${f.url}" alt=""><button type="button" class="x" data-x="${i}">×</button></div>`).join('');
  $('#mkUp').onclick=()=>$('#pfile').click();$$('#ugrid [data-x]').forEach(b=>b.onclick=()=>{mk.files.splice(+b.dataset.x,1);renderMk();});
  // 다각도 행: 업로드 사진이 있고 잡이 없을 때 제안 → 진행 중엔 n/10 → 끝나면 결과 수
  const a=$('#angles');if(j&&!j.done)a.innerHTML=`<span><b>Shooting face angles ${j.urls.length}/${j.total}</b> — same face, the camera and expression move. About ${Math.max(1,Math.ceil((j.total-j.urls.length)/20*0.4))} min left.</span>`;
  else if(j&&j.done)a.innerHTML=`<span><b>${j.urls.length} angles added</b>${j.error?' · '+esc(j.error):''}${j.urls.length?' — remove any you don\'t like, then Create.':''}</span><button class="btn2" id="mkAngles">Shoot again</button>`;
  else if(up.length)a.innerHTML=`<span><b>${up.length===1?'Only one photo?':'Want a stronger set?'}</b> We shoot 24 face close-ups from the first photo — front to full profile both ways, up and down, and eight expressions. Soul ID learns the face, so these are what matter.</span><button class="btn2" id="mkAngles">Shoot 24 face angles · ◈ ${ANGLES_COST.toLocaleString('en-US')}</button>`;
  else a.innerHTML='<span>Add a photo. Only one? We make the 24 face angles for you.</span>';
  const ab=$('#mkAngles');if(ab)ab.onclick=mkAngles;
  const cnt=n===0?['—','Add photos','var(--border)']:n<5?[n,'OK · 5+ is better','#f5c542']:n<20?[n,'Good · 20+ is best','#f5c542']:[n,'Best','var(--lime)'];
  $('#gCount').innerHTML=`<i style="--v:${Math.min(100,Math.round(n/MAX_PHOTOS*100))};--c:${cnt[2]}"><span>${cnt[0]}/${MAX_PHOTOS}</span></i><div class="t"><b>Photos</b>${cnt[1]}</div>`;
  const px=up.length?Math.min(...up.map(f=>f.px||0)):0;const q=MIN_PX.find(([m])=>px>=m);
  $('#gQual').innerHTML=`<i style="--v:${up.length?Math.min(100,Math.round(px/14)):0};--c:${q[1]==='Good'?'var(--lime)':q[1]==='OK'?'#f5c542':'#e5533d'}"><span>${up.length?px+'px':'—'}</span></i><div class="t"><b>Quality</b>${up.length?q[1]+' · shortest side of the smallest upload':'Shortest side ≥ 1000px is best'}</div>`;
  $('#mkGo').disabled=!n||!mk.consent||!!(j&&!j.done);}
function mkAdd(files){files.filter(f=>/^image\//.test(f.type)).slice(0,MAX_PHOTOS-mk.files.length).forEach(f=>{const it={file:f,url:URL.createObjectURL(f),px:0};mk.files.push(it);const im=new Image();im.onload=()=>{it.px=Math.min(im.naturalWidth,im.naturalHeight);renderMk();};im.src=it.url;});renderMk();}
$('#pfile').addEventListener('change',e=>{mkAdd([...e.target.files]);e.target.value='';});
async function mkAngles(){const src=mk.files.find(f=>f.file);if(!src)return;const fd=new FormData();fd.append('photo',src.file,src.file.name);
  try{const res=await fetch('/api/shoot/angles',{method:'POST',body:fd});const d=await res.json().catch(()=>({}));
    if(res.status===402){toast(d.error||'Not enough credits');setTimeout(()=>location.href='/billing',1200);return}
    if(!res.ok||!d.success)throw new Error(d.error||'Could not start');
    mk.job=d.data;DoppiaNav.refreshCredits();renderMk();pollAngles();}
  catch(e){toast(e.message||'failed')}}
async function pollAngles(){const j=mk.job;if(!j||$('#create').hidden)return;
  try{const res=await fetch('/api/shoot/angles/'+j.id);if(res.status===404){mk.job={...j,done:true,error:'The job was lost — shoot again'};renderMk();return} // 잡이 사라짐(서버 재시작 등)
    const d=(await res.json()).data;if(!d)return;const seen=new Set(mk.files.filter(f=>f.remote).map(f=>f.url));
    d.urls.filter(u=>!seen.has(u)).forEach(u=>mk.files.push({remote:true,url:u}));mk.job=d;renderMk();if(!d.done)setTimeout(pollAngles,4000);}
  catch(e){setTimeout(pollAngles,6000);}}
async function mkSubmit(){const b=$('#mkGo');b.disabled=true;const fd=new FormData();fd.append('name',$('#mkName').value.trim());fd.append('consent','true');
  fd.append('photoUrls',JSON.stringify(mk.files.filter(f=>f.remote).map(f=>f.url)));mk.files.filter(f=>f.file).forEach(f=>fd.append('photos',f.file,f.file.name));
  try{const res=await fetch('/api/shoot/models',{method:'POST',body:fd});const d=await res.json().catch(()=>({}));
    if(res.status===402){toast(d.error||'Not enough credits');setTimeout(()=>location.href='/billing',1200);return}
    if(!res.ok||!d.success)throw new Error(d.error||'Could not start training');
    toast('Training started — a few minutes');DoppiaNav.refreshCredits();mk.job=null;await loadMine();renderHello();}
  catch(e){toast(e.message||'failed');b.disabled=false;}}

function pick(m){st.model=m;st.versions=m.bank.map(v=>({...v}));st.cur=0;st.slots={};st.scene=null;st.sceneText='';$('#hello').hidden=true;$('#app').hidden=false;renderApp();intro();}
// 캐릭터 등장: 뱅크 장면을 랜덤으로 몇 장 훑고 기본 장면에 멈춘다 → 인사 + 첫 행동 고르기
async function intro(){const run=++st.intro;const n=st.versions.length;const order=[...Array(n).keys()].sort(()=>Math.random()-.5).slice(0,5);
  for(const i of order){if(st.intro!==run)return;st.cur=i;renderStage(true);await new Promise(r=>setTimeout(r,650));}
  if(st.intro!==run)return;st.cur=0;renderStage(true);
  say(SAY.hello(st.model),[['shot','Shoot me'],['outfit','Dress me up'],['scene','Take me somewhere'],['pose','Pose me']]);}
function say(text,quick){const b=$('#bubble');b.hidden=false;b.innerHTML=`<img src="${st.model.avatar}" alt=""><div class="b">${esc(text)}${quick?`<div class="q">${quick.map(([a,l])=>`<button class="btn2" data-a="${a}">${esc(l)}</button>`).join('')}</div>`:''}</div>`;
  b.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>setAct(x.dataset.a));}
// ── 앱: 허브(모델) + 행동 패널 + 스테이지 ──
function renderApp(){const m=st.model;$('#who').innerHTML=`<img src="${m.avatar}" alt=""><div><b>${esc(m.name)}</b><small>${esc(m.tag)}</small></div><button class="btn2" id="swap">Change</button>`;
  $('#swap').onclick=()=>{st.intro++;$('#bubble').hidden=true;renderHello();};
  $('#acts').innerHTML=ACTS.map(([k,ic,n])=>`<button type="button" data-a="${k}" class="${k===st.act?'on':''}" ${k==='video'?'disabled title="Coming soon"':''}><i>${ic}</i>${n}</button>`).join('');
  renderPanel();renderStage();}
function setAct(a){st.act=a;[...$('#acts').children].forEach(x=>x.classList.toggle('on',x.dataset.a===a));renderPanel();say(SAY[a]);}
$('#acts').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;setAct(b.dataset.a);});
function renderPanel(){({shot:panelShot,outfit:panelOutfit,scene:panelScene,pose:panelPose})[st.act]();if(st.act!=='shot')renderSettings();renderGo();}
// Shoot: 글 → Soul 2 + 내 모델. 엔진 선택 없음(Soul 고정), 장수·비율만
const tplThumb=i=>`/img/shoot/tpl/${String(i+1).padStart(2,'0')}.jpg`;
function tplTile(){const t=st.tpl!=null&&SHOT_TPL[st.tpl];return `<button type="button" class="tpl" id="tplPick">${t?`<img src="${tplThumb(st.tpl)}" alt="" onerror="this.remove()"><span class="ic">${t[0]}</span><b>${esc(t[1])}</b><small>Change</small>`:`<span class="ic">🎞</span><b>Pick a shot</b><small>28 presets — or just describe it</small>`}</button>`;}
function panelShot(){$('#panel').innerHTML=`<div class="lbl">Pick a shot <i>· then change anything</i></div>${tplTile()}
  <div class="lbl">Or describe it <i id="slen">${st.shot.length}</i></div><textarea class="ff" id="shotText" maxlength="1000" placeholder="e.g. by a cafe window in a white shirt, holding a coffee, soft smile">${esc(st.shot)}</textarea>
  <div class="lbl">Count</div><div class="chips" id="shotN">${chipsHtml([1,2,4].map(n=>[n,'× '+n]),st.shotN)}</div>
  <div class="lbl">Aspect ratio</div><div class="chips" id="shotAspect">${chipsHtml(SHOT_ASPECTS.map(v=>[v,v]),st.shotAspect)}</div>
  <div class="lock ${st.priv?'on':''}" id="privLock" style="margin-top:12px"><div><b>Private Mode</b><small>Off = result goes to the public feed</small></div><span class="sw2"><i></i></span></div>
  <div class="note">Shot with Higgsfield Soul using your model\'s face — a fresh photo, not an edit. Pick a result below and dress it up or move it from there.</div>`;
  $('#shotText').addEventListener('input',e=>{st.shot=e.target.value;$('#slen').textContent=st.shot.length;renderGo();});
  $('#tplPick').addEventListener('click',openTpl);chipGroup('#shotN',v=>{st.shotN=+v;renderGo();});chipGroup('#shotAspect',v=>st.shotAspect=v);$('#privLock').addEventListener('click',()=>{st.priv=!st.priv;$('#privLock').classList.toggle('on',st.priv)});}

// Outfit: 품목 여러 개(사진 + 유형)
function panelOutfit(){$('#panel').innerHTML=`<div class="lbl">Dress up <i>· tap a slot or drop a photo on it</i></div><div class="slots" id="slots"></div><div class="note">Each item is kept exactly as photographed — color, print, logo. Fill as many slots as you like; layers work (tee under an open outer).</div>`;renderSlots();}
function renderSlots(){const el=$('#slots');if(!el)return;
  el.innerHTML=SLOTS.map(([k,n,ic,p])=>{const it=st.slots[k];return `<div class="slot ${it?'on':''} ${p?'':'soon'}" data-s="${k}" title="${esc(n)}${p?'':' · coming soon'}">${it?`<img src="${it.url}" alt=""><button type="button" class="x" data-x="${k}">×</button><span>${esc(n)}</span>`:`<i>${ic}</i>${esc(n)}${p?'':'<small>soon</small>'}`}</div>`;}).join('');
  el.querySelectorAll('.slot:not(.soon)').forEach(d=>{const k=d.dataset.s;
    d.addEventListener('click',e=>{if(e.target.closest('[data-x]'))return;st.slotTarget=k;$('#file').click();});
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over');});d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(f=>/^image\//.test(f.type));if(f)setSlot(k,f);});});
  el.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{delete st.slots[b.dataset.x];renderSlots();}));renderGo();}
function setSlot(k,f){st.slots[k]={file:f,url:URL.createObjectURL(f)};renderSlots();}
const filled=()=>SLOTS.filter(([k,,,p])=>p&&st.slots[k]); // 채워진 슬롯, 몸 순서
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f&&st.slotTarget)setSlot(st.slotTarget,f);e.target.value='';});

// Scene: 배경 로스터 + 직접 묘사
function bgs(){return [STUDIO].concat((window.BACKGROUNDS||[]).filter(b=>!st.bgCat||b.category_key===st.bgCat));}
function panelScene(){const cats=[['','All']].concat([...new Map((window.BACKGROUNDS||[]).map(b=>[b.category_key,b.category])).entries()]);
  $('#panel').innerHTML=`<div class="lbl">Concept</div><div class="chips" id="bgcat">${chipsHtml(cats,st.bgCat)}</div><div class="lbl">Or describe a place</div><input class="ff" id="bgText" maxlength="300" placeholder="e.g. rooftop at dusk, city lights" value="${esc(st.sceneText)}"><div class="grid wide" id="bgrid"></div>`;
  renderBgs();chipGroup('#bgcat',v=>{st.bgCat=v;renderBgs();});
  $('#bgText').addEventListener('input',e=>{st.sceneText=e.target.value.trim();if(st.sceneText)st.scene=null;renderBgs();renderGo();});
  $('#bgrid').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;st.scene=bgs().find(x=>x.id===b.dataset.id);st.sceneText='';$('#bgText').value='';renderBgs();renderGo();});}
function renderBgs(){$('#bgrid').innerHTML=bgs().map(b=>`<button type="button" class="mc ${st.scene&&st.scene.id===b.id?'on':''}" data-id="${b.id}"><img src="${b.img}" loading="lazy" alt=""><span class="nm">${esc(b.name)}<small>${esc(b.category)}</small></span></button>`).join('');}

// Pose: 프리셋 + 직접 묘사
function panelPose(){$('#panel').innerHTML=`<div class="lbl">Pose</div><div class="chips" id="poses">${chipsHtml(POSES.map((p,i)=>[i,p[0]]),st.pose)}</div><div class="lbl">Or describe it</div><input class="ff" id="poseText" maxlength="200" placeholder="e.g. crouching, looking up, hands in pockets" value="${esc(st.poseText)}"><div class="note">Same person, same outfit, same place — only the pose and framing change.</div>`;
  chipGroup('#poses',v=>{st.pose=+v;st.poseText='';$('#poseText').value='';});$('#poseText').addEventListener('input',e=>{st.poseText=e.target.value.trim();});}

// 공통 설정(엔진·비율·비공개) — 패널 아래
function renderSettings(){const t=tool();$('#panel').insertAdjacentHTML('beforeend',`<div class="lbl" style="margin-top:16px">Engine</div><div class="msel" id="msel">${t?`<span class="ic">${ICON[t.provider]||'•'}</span><span><b>${esc(t.label)}</b><small>${esc(t.provider)} · ◈${t.pricing.perImage}/image</small></span><span class="ar">▾</span><div class="mlist">${st.tools.map(x=>`<div data-id="${x.id}"><span class="ic" style="width:28px;height:28px;font-size:12px">${ICON[x.provider]||'•'}</span><span><b style="font-size:13px">${esc(x.label)}</b><small>${esc(x.provider)}</small></span><span class="pc">◈${x.pricing.perImage}</span></div>`).join('')}</div>`:'<span class="ic">!</span><span><b>No image engine available</b><small>No API key on this server</small></span>'}</div>
  <div class="lbl">Aspect ratio</div><div class="chips" id="ratios">${chipsHtml(((t&&t.controls&&t.controls.aspectRatio)||['3:4']).map(v=>[v,v]),st.ratio)}</div>
  <div class="lock ${st.priv?'on':''}" id="privLock" style="margin-top:12px"><div><b>Private Mode</b><small>Off = result goes to the public feed</small></div><span class="sw2"><i></i></span></div>`);
  $('#msel').addEventListener('click',e=>{const d=e.target.closest('[data-id]');if(d){st.tool=d.dataset.id;renderPanel();e.stopPropagation();return}$('#msel').classList.toggle('open')});
  chipGroup('#ratios',v=>st.ratio=v);$('#privLock').addEventListener('click',()=>{st.priv=!st.priv;$('#privLock').classList.toggle('on',st.priv)});}
document.addEventListener('click',e=>{const m=$('#msel');if(m&&!m.contains(e.target))m.classList.remove('open')});
// 프리셋 모달 — 검색은 이름·프롬프트 둘 다. 고르면 글칸에 프롬프트가 들어가고(고쳐 쓸 수 있다) 타일이 바뀐다.
function openTpl(){const m=$('#tplModal');m.hidden=false;$('#tplQ').value='';renderTpl('');$('#tplQ').focus();}
function renderTpl(q){const s=q.trim().toLowerCase();$('#tgrid').innerHTML=SHOT_TPL.map((t,i)=>[t,i]).filter(([t])=>!s||(t[1]+' '+t[2]).toLowerCase().includes(s)).map(([t,i])=>`<button type="button" class="tc ${st.tpl===i?'on':''}" data-i="${i}"><img src="${tplThumb(i)}" alt="" loading="lazy" onerror="this.remove()"><span class="ic">${t[0]}</span><b>${esc(t[1])}</b></button>`).join('')||'<p class="note">Nothing matches — describe it in your own words instead.</p>';}
$('#tplQ').addEventListener('input',e=>renderTpl(e.target.value));
$('#tgrid').addEventListener('click',e=>{const b=e.target.closest('.tc');if(!b)return;st.tpl=+b.dataset.i;st.shot=SHOT_TPL[st.tpl][2];$('#tplModal').hidden=true;renderPanel();});
$('#tplModal').addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===e.currentTarget)$('#tplModal').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#tplModal').hidden=true;});
function ready(){return st.act==='shot'?!!st.shot.trim():st.act==='outfit'?filled().length>0:st.act==='scene'?!!(st.scene||st.sceneText):true;}
const SHOT_COST=185; // credit.service IMG_CREDIT.soul 자리값과 같이 간다
function renderGo(){const t=tool(),L={shot:'Shoot',outfit:'Dress up',scene:'Change scene',pose:'Strike the pose'}[st.act],shot=st.act==='shot';$('#go').disabled=st.busy||!ready()||(!shot&&!t);$('#go').firstChild.textContent=L+' ';$('#cost').textContent=shot?(SHOT_COST*st.shotN).toLocaleString('en-US'):t?t.pricing.perImage.toLocaleString('en-US'):'—';}

// 스테이지: 현재 버전 + 버전 띠(어느 버전에서든 이어 가기)
function renderStage(anim){const v=cur();$('#cur').innerHTML=st.busy?`<div class="pend">working on ${esc(st.model.name)}…</div>`:`<img src="${v.url}" alt="" class="${anim?'intro':''}">`;
  $('#strip').innerHTML=st.versions.map((x,i)=>`<button type="button" class="${i===st.cur?'on':''}" data-i="${i}" title="${esc(x.label)}"><img src="${x.url}" alt=""><small>${esc(x.label)}</small></button>`).join('');
  $('#note').textContent=st.versions.length>1?`${st.versions.length} versions · pick one to continue from it`:'';}
$('#strip').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b||st.busy)return;st.intro++;st.cur=+b.dataset.i;renderStage();});
$$('.stage .tabs [data-f]').forEach(b=>b.addEventListener('click',()=>{$$('.stage .tabs [data-f]').forEach(x=>x.classList.toggle('on',x===b));const f=b.dataset.f;$('#stageView').hidden=f!=='stage';$('#feedView').hidden=f!=='mine';if(f==='mine')loadFeed();}));

// ── 프롬프트(10-16 실측 틀): 이미지 1 = 현재 버전 보존, 바꿀 것만 ──
const KEEP='Keep the person exactly as in image 1: same face, hair, body proportions and skin. Photorealistic, same image quality.';
const who=()=>st.model.profileLine?`The person is ${st.model.profileLine}. `:''; // 내 모델이면 성별·외모 한 줄(Soul ID 는 얼굴만 배운다)
function prompt(){
  if(st.act==='outfit'){const list=filled().map(([,n,,p],i)=>`image ${i+2} = ${n.toLowerCase()}, ${p}`).join('; ');
    return `${who()}Image 1 is the photo to edit. Dress the person in image 1 in these items, each reproduced faithfully from its photo — same color, print, logo placement and proportions: ${list}. Replace only what the items cover; keep the rest of the outfit, pose, background, lighting and camera. ${KEEP}`;}
  if(st.act==='scene'){const where=st.sceneText||(st.scene.scene+', '+st.scene.light);const ref=st.scene&&st.scene.id!=='studio'?' Image 2 shows the location.':'';
    return `${who()}Image 1 is the photo to edit.${ref} Place the same person, in the same outfit and pose, in this location: ${where}. Match the light and shadows to the new place. ${KEEP}`;}
  const pose=st.poseText||POSES[st.pose][1];
  return `${who()}Image 1 is the person. Same person, same outfit, same location and lighting; change only the pose and framing to: ${pose}. Natural hands, full outfit still visible where the framing allows. ${KEEP}`;}
function label(){return st.act==='outfit'?filled().map(([,n])=>n).join(' + '):st.act==='scene'?(st.sceneText||st.scene.name):(st.poseText||POSES[st.pose][0]);}
async function refs(){const base=await(await fetch(cur().url)).blob();const out=[base];
  if(st.act==='outfit')for(const [k] of filled())out.push(st.slots[k].file);
  if(st.act==='scene'&&st.scene&&st.scene.id!=='studio')out.push(await(await fetch(st.scene.img)).blob());
  return out;}

// ── 생성: Image 페이지와 같은 POST /api/generate → 새 버전으로 띠에 추가 ──
// Shoot: Soul 로 새 컷 1~4장 → 전부 버전 띠에, 첫 장이 현재
async function shoot(){const res=await fetch('/api/shoot/models/'+encodeURIComponent(st.model.id)+'/shot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:st.shot.trim(),count:st.shotN,aspectRatio:st.shotAspect,privateMode:st.priv})});
  const d=await res.json().catch(()=>({}));if(res.status===402)throw Object.assign(new Error(d.error||'Not enough credits'),{c402:true});if(!res.ok||!d.success)throw new Error(d.error||'shoot failed');
  const ok=d.data.results.filter(r=>r.success&&r.url);if(!ok.length)throw new Error((d.data.results[0]&&d.data.results[0].error)||'no result');
  const label=st.shot.trim().slice(0,24);ok.forEach(r=>st.versions.push({url:r.url,label}));st.cur=st.versions.length-ok.length;if(ok.length<d.data.results.length)toast((d.data.results.length-ok.length)+' failed');}
$('#go').addEventListener('click',async()=>{const t=tool();if(!ready()||st.busy||(st.act!=='shot'&&!t))return;st.intro++;st.busy=true;renderGo();renderStage();say(SAY.busy);
  try{if(st.act==='shot'){await shoot();DoppiaNav.refreshCredits();say(SAY.done());return}
    const fd=new FormData();fd.append('characterId','');fd.append('prompt',prompt());fd.append('model',t.model);fd.append('tool',t.id);fd.append('count','1');fd.append('style','none');fd.append('brandKit','false');fd.append('templateName',TEMPLATE);
    fd.append('aspectRatio',st.ratio);fd.append('imageSize','1K');fd.append('negativePrompt','extra fingers, deformed hands, warped or altered item, mannequin look, watermark, text');fd.append('privateMode',st.priv?'true':'false');fd.append('enhance','false');fd.append('billingMode','custom');
    (await refs()).forEach((b,i)=>fd.append('referenceImages',b,'ref'+i+'.png'));
    const res=await fetch('/api/generate',{method:'POST',body:fd});const d=await res.json().catch(()=>({}));
    if(res.status===402){toast(d.error||'Not enough credits');setTimeout(()=>location.href='/billing',1200);return}
    if(!res.ok||!d.success)throw new Error(d.error||'generation failed');
    const r=(d.results||[]).find(x=>x.success&&x.url);if(!r)throw new Error((d.results||[])[0]&&d.results[0].error||'no result');
    st.versions.push({url:r.url,label:label()});st.cur=st.versions.length-1;if(st.act==='outfit')st.slots={};DoppiaNav.refreshCredits();say(SAY.done());}
  catch(e){toast(e.message||'failed');say(SAY[st.act]);if(e.c402)setTimeout(()=>location.href='/billing',1200)}
  finally{st.busy=false;renderStage();renderPanel();}});

// ── 피드(이 페이지 결과만) ──
function card(r){const u='/images/'+String(r.file_path||'').split('/').pop();return `<div class="rt" onclick="location.href='/creation?idx=${r.idx}'"><img src="${esc(u)}" loading="lazy" alt="" onerror="this.closest('.rt').remove()"><div class="ov"><span>${esc(r.model||'')}</span><span class="a"><span title="Continue from this" data-u="${esc(u)}">↩</span><span onclick="event.stopPropagation();location.href='/video?start=${encodeURIComponent(u)}'">▶</span></span></div></div>`;}
async function loadFeed(){const f=$('#feed');f.innerHTML='';$('#feedEmpty').hidden=true;try{const d=(await(await fetch('/api/generate/results?type=photo&limit=120')).json()).data||[];const rows=d.filter(r=>r.file_path&&r.template_name===TEMPLATE);if(!rows.length){$('#feedEmpty').hidden=false;return}f.innerHTML=rows.map(card).join('');}catch(e){$('#feedEmpty').hidden=false}}
$('#feed').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;e.stopPropagation();st.versions.push({url:b.dataset.u,label:'From Library'});st.cur=st.versions.length-1;$$('.stage .tabs [data-f]')[0].click();renderStage();});

// ── 부팅 ──
function boot(){loadMine().then(renderHello);DoppiaNav.tools().then(T=>{st.tools=(T.image||[]).filter(t=>t.imageSlots&&t.imageSlots.length);st.tool=st.tools.some(t=>t.id==='nano-banana-pro')?'nano-banana-pro':(st.tools[0]&&st.tools[0].id);if(st.model)renderPanel();});}
if(window.DoppiaNav)boot();else document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,0));
})();
</script>
</body>
