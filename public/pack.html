<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Pack · Doppia</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/saas-auth.js?v=3" defer></script>
<script src="/js/rail.js?v=11" defer></script>
<style>
  /* pack = 앱 페이지. 색·폰트·레일 여백은 theme.css 토큰 사용(인라인 warm 테마 폐기). */
  .wrap{max-width:820px;margin:0 auto;padding:34px 24px 90px;position:relative;z-index:2}
  .phead{margin-bottom:24px}
  h1{font-family:'Sora';font-size:28px;font-weight:800;letter-spacing:-.5px}
  .lead{color:var(--dim);font-size:14px;margin-top:6px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:16px}
  label.f{display:block;font-size:13px;font-weight:600;margin:0 0 8px;color:var(--text)}
  input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;font:inherit;background:var(--bg2);color:var(--text);transition:border-color .15s}
  input[type=text]::placeholder{color:var(--faint)}
  input[type=text]:focus{outline:none;border-color:var(--accent2)}
  .drop{border:2px dashed var(--border2);border-radius:14px;padding:30px;text-align:center;color:var(--dim);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .drop:hover{border-color:var(--accent2);color:var(--text)}
  .drop.on{border-color:var(--accent);color:var(--text);background:rgba(124,108,255,.06)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .thumbs img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  button.go{background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff;border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:20px;box-shadow:0 4px 14px -4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.13);transition:transform .15s,box-shadow .15s}
  button.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 24px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
  button.go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .status{font-size:14px;color:var(--dim)}
  .sect h2{font-size:14px;font-weight:700;margin:22px 0 12px;color:var(--text);padding-bottom:8px;border-bottom:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .grid figure{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg2)}
  .grid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .grid figcaption{font-size:11px;padding:7px 9px;color:var(--dim)}
  .hide{display:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .dlall{background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.13);transition:filter .15s}
  .dlall:hover{filter:brightness(1.08)}
  .dl{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;opacity:0;transition:opacity .15s}
  .grid figure:hover .dl{opacity:1}
  @media(hover:none){.dl{opacity:1}}
  /* 완료 후 인터랙티브: 버전 플립 + 컷별 액션(다시/레퍼 다시/studio) + 컨셉 추가 */
  .grid figure.rescard figcaption{padding:7px 9px 9px}
  .cut-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .cutbtn{font-family:inherit;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--border);text-decoration:none;line-height:1}
  .cutbtn:hover{color:var(--text);border-color:var(--border2);background:rgba(255,255,255,.09)}
  .cutbtn:disabled{opacity:.6;cursor:default}
  .ver{position:absolute;top:7px;left:7px;display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border-radius:8px;padding:2px 4px;z-index:3}
  .ver span{font-size:10px;font-weight:700;color:#fff;padding:0 2px;font-variant-numeric:tabular-nums}
  .verb{width:18px;height:18px;border:none;background:none;color:#fff;font-size:10px;cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center;padding:0}
  .verb:hover:not(:disabled){background:rgba(255,255,255,.2)}
  .verb:disabled{opacity:.35;cursor:default}
  .grid figure.addcut{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;border:1.5px dashed var(--border2);background:rgba(255,255,255,.02);cursor:pointer;color:var(--dim);transition:border-color .15s,color .15s}
  .grid figure.addcut:hover{border-color:var(--accent2);color:var(--text)}
  .addcut-in{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .addcut-plus{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:400}
  .addmenu-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .addmenu{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:16px;max-width:440px;width:100%;box-shadow:0 24px 60px -16px rgba(0,0,0,.7)}
  .addmenu-h{font-family:'Sora';font-size:15px;font-weight:700;margin-bottom:12px}
  .addmenu-list{display:flex;flex-wrap:wrap;gap:8px}
  .addmenu-item{font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .addmenu-item:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent2)}
  .addmenu-item:disabled{opacity:.6;cursor:default}
  /* 생성 중 = 컷(Shots)과 동일 UX: 계획이 정해지는 즉시 "생성되는 수만큼" 스피너 슬롯 + 경과초 */
  .analyzing{display:flex;flex-direction:column;align-items:center;gap:13px;padding:44px 0;color:var(--text);font-size:14px;text-align:center}
  .analyzing .sub{color:var(--dim);font-size:12.5px}
  .grid figure.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:4/5;background:rgba(255,255,255,.03)}
  .grid figure.slot .ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;width:100%}
  .grid figure.slot figcaption{align-self:stretch}
  .rb-spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite}
  .rb-elapsed{font-size:12.5px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
  .grid figure.failed-fig{display:flex;flex-direction:column;background:rgba(255,90,90,.06);border-color:rgba(255,120,120,.28)}
  .rb-failed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;aspect-ratio:4/5}
  .rb-failed .rbf-ic{color:#ff8a8a;font-weight:700;font-size:12.5px}
  .rb-failed .rbf-msg{color:var(--dim);font-size:11px;line-height:1.5}
  /* 내 크리에이션 = Shots·Ad Video 페이지와 동일 피드(날짜 그룹 + 배치별 메타패널). studio.html에서 이식. */
  .works{padding:0 24px 90px;position:relative;z-index:2}          /* 화면 넓게(풀폭) — studio 피드와 동일 */
  .works-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px}
  .works-head h2{font-family:'Sora';font-size:22px;font-weight:800;letter-spacing:-.4px}
  .works-sub{color:var(--dim);font-size:13px}
  .works-empty{color:var(--dim);font-size:13px;padding:34px 0;text-align:center}
  #resultsGrid{display:block}
  .result-row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;padding:22px 0;border-bottom:1px solid var(--border)}
  .result-row:first-child{padding-top:8px}
  .result-row:last-child{border-bottom:none}
  .rb-media{display:flex;gap:12px;flex-wrap:wrap;flex:0 1 auto;min-width:0;max-width:calc(100% - 306px)}  /* 정보 패널이 미디어 옆에 밀착 */
  .rb-media .result-card{height:300px;width:auto;max-width:100%}   /* 높이 기준(폭=비율) → 크롭 없이 자연 비율 */
  .rb-media .result-card:only-child{height:460px}
  .rb-meta{width:284px;flex-shrink:0;display:flex;flex-direction:column;gap:9px;padding-top:2px}
  .result-card{border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--border);background:#0c0c14}
  .result-card .img{width:100%;height:100%;object-fit:cover;display:block}
  .result-card .rc-tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transform:translateY(-3px);transition:opacity .15s,transform .15s;z-index:4}
  .result-card:hover .rc-tools,.result-card:focus-within .rc-tools{opacity:1;transform:none}
  @media(hover:none){.result-card .rc-tools{opacity:1;transform:none}}
  .result-card .rc-btn{width:30px;height:30px;border-radius:9px;border:none;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none;transition:background .15s,transform .1s}
  .result-card .rc-btn:hover{background:rgba(0,0,0,.8)}
  .result-card .rc-btn:active{transform:scale(.9)}
  .result-card .rc-btn svg{width:15px;height:15px;display:block}
  .result-card .rc-btn.on{background:var(--accent)}
  .rb-badge{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:7px}
  .rb-badge.tpl{color:var(--accent2);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .rb-badge.custom{color:#5ee0d6;background:rgba(94,224,214,.13)}
  .rb-title{font-size:16px;font-weight:700;color:var(--text);line-height:1.3}
  .rb-prompt{font-size:13.5px;line-height:1.55;color:var(--dim);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .rb-specs{display:flex;flex-wrap:wrap;align-items:baseline;gap:0;margin-top:2px}
  .rb-specs .spec{display:inline;font-size:10.5px;font-weight:500;letter-spacing:.3px;color:var(--faint);line-height:1.5;font-variant-numeric:tabular-nums}
  .rb-specs .spec b{color:var(--dim);font-weight:600}
  .rb-specs .spec[hidden]{display:none}
  .rb-specs .spec:not(:first-child)::before{content:"·";margin:0 6px;color:rgba(255,255,255,.16);font-weight:400}
  .rb-src-row{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
  .rb-src-thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;border:1px solid var(--border);display:block;background:rgba(255,255,255,.04)}
  .rb-src-item{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--dim);line-height:1.3}
  .rb-src-item .k{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--faint)}
  .rb-src-model{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .rb-ch-row{margin-top:5px;gap:6px}
  .rb-ch{padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.035);border:1px solid var(--border);font-size:11px}
  .rb-ch .k{margin-right:1px}
  .ch-dot{width:9px;height:9px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.25);margin-right:1px}
  .rb-del-row{margin-top:10px}
  .rb-del{font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--border)}
  .rb-del:hover{color:#ff5f6e;border-color:#ff5f6e;background:rgba(255,95,110,.1)}
  .rb-del:disabled{opacity:.6;cursor:default}
  .rb-date{font-size:12.5px;font-weight:700;letter-spacing:.3px;color:var(--dim);margin:8px 0 -6px;padding-top:18px;border-top:1px solid var(--border)}
  .rb-date:first-child{border-top:none;padding-top:0;margin-top:2px}
  @media(max-width:760px){.result-row{flex-direction:column;gap:14px}.rb-meta{width:100%}.rb-media{max-width:none}.rb-media .result-card{width:46%;height:auto;max-width:none}.rb-media .result-card:only-child{width:100%}}
</style>
</head>
<body class="has-rail">
<div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<nav>
  <div class="nav-in">
    <div class="brand" onclick="location.href='/landing'"><b>Doppia</b></div>
    <div class="credits" id="saasUserBox"></div>
  </div>
</nav>

<div class="wrap">
  <div class="phead fade d1">
    <h1>Product Pack</h1>
    <p class="lead">상품 사진 1~몇 장을 넣으면 필요한 콘텐츠를 알아서 만들어 드립니다.</p>
  </div>

  <div id="form" class="fade d2">
    <div class="card">
      <div class="drop" id="drop">
        <div>사진을 끌어다 놓거나 클릭해서 업로드</div>
        <input type="file" id="file" accept="image/*" multiple class="hide">
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="card">
      <label class="f">한 줄 힌트 <span style="color:var(--dim);font-weight:400">(선택 — 사진만으로도 됩니다)</span></label>
      <input type="text" id="product" placeholder="예: 국내산 사과 애사비 / 두피용 앰플 — 사진으로 안 보이는 것만">
      <p style="font-size:12px;color:var(--dim);margin:8px 2px 0">카테고리 · 세트 여부는 사진을 분석해 자동으로 판단합니다.</p>
      <button class="go" id="go" disabled>콘텐츠 만들기</button>
    </div>
  </div>

  <div id="result" class="hide">
    <div class="card">
      <div class="rhead">
        <div class="status" id="status"><span class="spin"></span>생성 중…</div>
        <button class="dlall hide" id="dlAll" onclick="downloadAll()">전체 다운로드</button>
      </div>
      <div class="sect" id="assets"></div>
    </div>
  </div>

</div>

<!-- 내 크리에이션 — full-width, studio·Ad Video 페이지와 동일 피드(날짜 그룹 + 배치별 메타패널). generation_results 공유 스토어. -->
<div class="works" id="worksSec">
  <div class="works-head"><h2>내 크리에이션</h2><span class="works-sub" id="worksCount"></span></div>
  <div id="resultsGrid"></div>
  <div class="works-empty hide" id="worksEmpty">아직 만든 콘텐츠가 없어요. 위에서 상품 사진을 넣어 만들어 보세요.</div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let files = [];

const drop = $('#drop'), fileInput = $('#file');
drop.onclick = () => fileInput.click();
['dragover','dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.toggle('on', ev === 'dragover');
  if (ev === 'drop') addFiles(e.dataTransfer.files);
}));
fileInput.onchange = () => addFiles(fileInput.files);
function addFiles(list) {
  for (const f of list) if (f.type.startsWith('image/')) files.push(f);
  renderThumbs();
}
function renderThumbs() {
  $('#thumbs').innerHTML = '';
  files.forEach(f => { const img = new Image(); img.src = URL.createObjectURL(f); $('#thumbs').appendChild(img); });
  $('#go').disabled = files.length === 0;
}

$('#go').onclick = async () => {
  $('#go').disabled = true;
  const fd = new FormData();
  files.forEach(f => fd.append('photos', f));
  const hint = $('#product').value.trim();
  if (hint) fd.append('product', hint);       // 선택 힌트 — 카테고리·세트는 서버가 사진 분석해 자동
  let r;
  try { r = await fetch('/api/pack', { method: 'POST', body: fd }); }
  catch (e) { fail('요청 실패: 네트워크'); $('#go').disabled = false; return; }
  if (!r.ok) { fail('요청 실패: ' + r.status); $('#go').disabled = false; return; }
  const { id } = await r.json();
  PACK_ID = id;
  $('#form').classList.add('hide');
  $('#result').classList.remove('hide');
  startGen();
  poll(id);
};
function fail(msg) { if (window.toast) toast(msg, 'error'); else alert(msg); } // toast=saas-auth 전역, 미로드 시 alert 폴백

// ── 생성 진행 표시 (컷/Shots 동일 UX) ──
//   계획(config.plan)이 정해지는 즉시 "생성되는 수만큼" 스피너 슬롯 + 경과초를 깔고, 완료되는 대로 이미지로 채운다.
//   계획 전(사진 분석 중)엔 개수를 모르므로 "분석 중" 상태. 완료 시 안 채워진 슬롯 = 실패 카드.
const KIND_LABEL = { still: '스틸', composite: '합성', ref: '캐논 레퍼' };
const KIND_ORDER = ['still', 'composite', 'ref'];
const filled = new Set();
let built = false, genStartTs = 0, elapsedTimer = null;
let PACK_ID = null, PACK = null;       // 현재 팩(액션 후 재렌더)
const verIdx = {};                     // slotId → 보고 있는 버전 인덱스(기본 최신)
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slotId = (o) => o.kind + ':' + (o.key != null ? o.key : o.cut_key);
const assetId = (a) => a.kind + ':' + (a.cut_key != null ? a.cut_key : a.key);
function slug(s) { return String(s == null ? '' : s).trim().replace(/[^\w가-힣.-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '') || 'image'; }
function fname(a) { return slug(a.label || a.cut_key || a.kind) + '.jpg'; }  // 라벨 기반 파일명(용도가 파일명에)

function startGen() {
  built = false; filled.clear();
  showAnalyzing();
  genStartTs = Date.now();
  if (elapsedTimer) clearInterval(elapsedTimer);
  elapsedTimer = setInterval(tickElapsed, 100);
}
function stopGen() { if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; } }
function tickElapsed() {
  const t = ((Date.now() - genStartTs) / 1000).toFixed(1) + 's';
  document.querySelectorAll('.rb-elapsed').forEach(el => el.textContent = t);
}
function showAnalyzing() {
  $('#assets').innerHTML = '<div class="analyzing"><div class="rb-spin"></div><div>사진을 분석하는 중…<div class="sub">맞춤 컷을 고르고 있어요</div></div></div>';
}
function buildGrid(slots) {
  const byKind = {};
  (slots || []).forEach(s => (byKind[s.kind] = byKind[s.kind] || []).push(s));
  $('#assets').innerHTML = KIND_ORDER.filter(k => byKind[k]).map(k =>
    `<h2>${KIND_LABEL[k] || k}</h2><div class="grid">` +
    byKind[k].map(s => `<figure class="slot" data-slot="${esc(slotId(s))}"><div class="ph"><div class="rb-spin"></div><div class="rb-elapsed">0.0s</div></div><figcaption>${esc(s.label || s.key)}</figcaption></figure>`).join('') +
    `</div>`).join('');

}
function fillSlot(a, i) {

  let fig = null;
  document.querySelectorAll('#assets figure.slot').forEach(f => { if (f.dataset.slot === key) fig = f; });
  if (!fig) return;
  filled.add(key);
  fig.classList.remove('slot');
  fig.innerHTML = `<a class="dl" href="${a.url}" download="${fname(a, i)}" title="다운로드">⤓</a><img src="${a.url}" loading="lazy"><figcaption>${esc(a.label || a.cut_key || '')}</figcaption>`;
}
// ── 완료 후 = 버전 인식 인터랙티브 렌더(컷별 최신+플립 + 다시/레퍼 다시/컨셉 추가/studio) ──
function versionsByCut(pack) { const g = {}; (pack && pack.assets || []).forEach(a => { const id = assetId(a); (g[id] = g[id] || []).push(a); }); return g; }
function renderInteractive(pack) {
  PACK = pack;

  const groups = versionsByCut(pack);
  const done = pack.status === 'done' || pack.status === 'failed';
  const slots = (plan && plan.slots ? plan.slots.slice() : []);
  Object.keys(groups).forEach(id => { if (!slots.some(s => slotId(s) === id)) { const m = id.match(/^([^:]+):(.+)$/); if (m) slots.push({ kind: m[1], key: m[2], label: (groups[id][0].label) }); } }); // add-cut로 생긴 슬롯
  const byKind = {};
  slots.forEach(s => (byKind[s.kind] = byKind[s.kind] || []).push(s));
  $('#assets').innerHTML = KIND_ORDER.filter(k => byKind[k]).map(k => {
    const cards = byKind[k].map(s => cardHtml(s, groups[slotId(s)] || [], done)).join('');
    const add = (k === 'still' && done) ? `<figure class="addcut" onclick="openAddCut()"><div class="addcut-in"><div class="addcut-plus">+</div><div>컨셉 추가</div></div></figure>` : '';
    return `<h2>${KIND_LABEL[k] || k}</h2><div class="grid">${cards}${add}</div>`;
  }).join('');
}
function cardHtml(slot, versions, done) {

    return `<figure class="failed-fig"><div class="rb-failed"><div class="rbf-ic">⚠ 실패</div><div class="rbf-msg">이 컷은 생성되지 않았어요</div></div><figcaption>${esc(slot.label || slot.key)}</figcaption></figure>`;
  }
  let idx = verIdx[sid]; if (idx == null || idx >= versions.length) idx = versions.length - 1; verIdx[sid] = idx;
  const a = versions[idx];
  const label = a.label || slot.label || a.cut_key || '';
  const flip = versions.length > 1 ? `<div class="ver"><button class="verb" onclick="flipVer('${esc(sid)}',-1)"${idx === 0 ? ' disabled' : ''}>◄</button><span>${idx + 1}/${versions.length}</span><button class="verb" onclick="flipVer('${esc(sid)}',1)"${idx === versions.length - 1 ? ' disabled' : ''}>►</button></div>` : '';
  const isRef = slot.kind === 'ref';
  const acts = isRef
    ? `<button class="cutbtn" onclick="rebakeRef('${esc(slot.key)}',this)">↻ 레퍼 다시 굽기</button>`
    : `<button class="cutbtn" onclick="regenCut('${esc(slot.key)}',this)">↻ 다시</button><a class="cutbtn" href="/studio" title="studio에서 정밀 편집">✎ studio</a>`;
  return `<figure class="rescard" data-slot="${esc(sid)}"><a class="dl" href="${a.url}" download="${esc(fname(a))}" title="다운로드">⤓</a><img src="${a.url}" loading="lazy">${flip}<figcaption>${esc(label)}<div class="cut-actions">${acts}</div></figcaption></figure>`;
}
function flipVer(sid, dir) {

  let idx = (verIdx[sid] != null ? verIdx[sid] : g.length - 1) + dir;
  idx = Math.max(0, Math.min(g.length - 1, idx)); verIdx[sid] = idx;
  const fig = [...document.querySelectorAll('#assets figure.rescard')].find(f => f.dataset.slot === sid);
  if (!fig) return;
  const a = g[idx];
  fig.querySelector('img').src = a.url;
  const dl = fig.querySelector('.dl'); dl.href = a.url; dl.download = fname(a);
  const v = fig.querySelector('.ver'); if (v) { v.querySelector('span').textContent = (idx + 1) + '/' + g.length; const b = v.querySelectorAll('.verb'); b[0].disabled = idx === 0; b[1].disabled = idx === g.length - 1; }
}
async function refreshPack() { try { const pack = await (await fetch('/api/pack/' + PACK_ID)).json(); renderInteractive(pack); loadWorks(); } catch (e) {} }
async function regenCut(cutKey, btn) {

    const d = await r.json(); if (!r.ok) throw new Error(d.error || '실패');

}
async function rebakeRef(refKey, btn) {

  try {
    const sku = String(refKey).replace(/^ref_/, '');
    const r = await fetch('/api/pack/' + PACK_ID + '/rebake-ref', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sku }) });

  } catch (e) { if (window.toast) toast('재굽기 실패: ' + (e.message || e), 'error'); btn.disabled = false; btn.textContent = t; }
}
async function openAddCut() {
  try {

    document.body.insertAdjacentHTML('beforeend', `<div class="addmenu-bg" onclick="if(event.target===this)this.remove()"><div class="addmenu"><div class="addmenu-h">추가할 컨셉 고르기</div><div class="addmenu-list">${items.map(it => `<button class="addmenu-item" onclick="addCut('${esc(it.key)}',this)">${esc(it.label || it.key)}</button>`).join('')}</div></div></div>`);
  } catch (e) { if (window.toast) toast('목록 실패', 'error'); }

async function addCut(cutKey, btn) {

  try {
    const r = await fetch('/api/pack/' + PACK_ID + '/add-cut', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cutKey }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || '실패');
    document.querySelector('.addmenu-bg')?.remove(); await refreshPack();
    if (window.toast) toast('컨셉 추가됨');
  } catch (e) { if (window.toast) toast('추가 실패: ' + (e.message || e), 'error'); btn.disabled = false; btn.textContent = t; }

async function poll(id) {
  let pack;
  try { pack = await (await fetch('/api/pack/' + id)).json(); }
  catch (e) { setTimeout(() => poll(id), 2000); return; }
  const plan = pack.config && pack.config.plan;
  const assets = pack.assets || [];
  window._packAssets = assets; PACK = pack;
  if (plan && !built) buildGrid(plan.slots);
  if (built) assets.forEach((a, i) => fillSlot(a, i));
  $('#dlAll').classList.toggle('hide', assets.length === 0);

  if (pack.status === 'done') { stopGen(); renderInteractive(pack); $('#status').innerHTML = '완료 · ' + assets.length + '개 자산'; loadWorks(); return; }
  if (pack.status === 'failed') { stopGen(); renderInteractive(pack); $('#status').innerHTML = '실패: ' + esc(pack.error || '') + (assets.length ? ' (그때까지 ' + assets.length + '개)' : ''); return; }
  $('#status').innerHTML = plan
    ? '<span class="spin"></span>생성 중 · ' + assets.length + '/' + plan.total
    : '<span class="spin"></span>사진 분석 중…';
  setTimeout(() => poll(id), 1500);
}
function downloadAll() {   // 컷별 현재 보고 있는 버전만
  const g = versionsByCut(PACK || { assets: window._packAssets || [] });
  const items = Object.keys(g).map(sid => { const vs = g[sid]; let i = verIdx[sid]; if (i == null || i >= vs.length) i = vs.length - 1; return vs[i]; });
  items.forEach((a, i) => setTimeout(() => {
    const el = document.createElement('a');
    el.href = a.url; el.download = fname(a);
    document.body.appendChild(el); el.click(); el.remove();
  }, i * 350)); // 스태거 — 브라우저 다중 다운로드 차단 회피
}

// ── 내 크리에이션 = Shots·Ad Video 페이지와 동일 피드(날짜 그룹 + 배치별 메타패널). studio.html에서 이식. ──
//   /api/generate/results(generation_results 공유 스토어) → batch_id||prompt_idx 로 배치 묶고, 날짜 헤더 + [미디어행 | 메타패널].
const RC_SVG = {
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  pub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>',
  priv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
let BATCHES = [];
function dateKeyOf(iso) { const d = iso ? new Date(iso) : new Date(); if (isNaN(d)) return ''; return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function fmtBatchDate(iso) { // Today / Yesterday / Wednesday, May 27, 2026
  const d = iso ? new Date(iso) : new Date(); if (isNaN(d)) return '';
  const t = new Date(); t.setHours(0, 0, 0, 0); const dd = new Date(d); dd.setHours(0, 0, 0, 0);
  const diff = Math.round((t - dd) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function rbModelLabel(m) { m = String(m || '').trim(); if (!m) return ''; const l = m.toLowerCase();
  if (l === 'pro') return 'Nano Banana Pro'; if (l === 'flash') return 'Nano Banana';
  if (/gemini|nano.?banana/.test(l)) return /pro/.test(l) ? 'Nano Banana Pro' : 'Nano Banana';
  if (/gpt/.test(l)) return /high|hd/.test(l) ? 'GPT Image HD' : 'GPT Image';
  if (/kling/.test(l) || /^ugc/.test(l) || l === 'reel') return 'Kling';
  return m; }
function rbRatioLabel(w, h) { if (!w || !h) return ''; const r = w / h, C = [[9, 16], [4, 5], [2, 3], [3, 4], [1, 1], [4, 3], [3, 2], [16, 9]]; let best = C[0], bd = Infinity; C.forEach(c => { const d = Math.abs(r - c[0] / c[1]); if (d < bd) { bd = d; best = c; } }); return best[0] + ':' + best[1]; }
function fitResultCard(el) { const w = el.videoWidth || el.naturalWidth, h = el.videoHeight || el.naturalHeight; if (!w || !h) return; const c = el.closest('.result-card'); if (c) c.style.aspectRatio = w + '/' + h; }
function fillRbSpecs(root) {   // 첫 미디어 로드 시 해상도·비율 채움(정적으로 못 채운 것만)
  (root || document).querySelectorAll('.result-row').forEach(row => {
    const specs = row.querySelector('.rb-specs'); if (!specs) return;
    const dimEl = specs.querySelector('.rb-spec-dim'), ratioEl = specs.querySelector('.rb-spec-ratio');
    if (!dimEl || !dimEl.hasAttribute('hidden')) return;
    const el = row.querySelector('.rb-media .result-card img, .rb-media .result-card video'); if (!el) return;
    const apply = () => { const w = el.naturalWidth || el.videoWidth, h = el.naturalHeight || el.videoHeight;
      if (w && h) { dimEl.innerHTML = '<b>' + w + '</b> × <b>' + h + '</b>'; dimEl.hidden = false;
        if (ratioEl) { const lbl = rbRatioLabel(w, h); if (lbl) { ratioEl.innerHTML = '<b>' + lbl + '</b>'; ratioEl.hidden = false; } } } };
    if (el.tagName === 'IMG') { if (el.complete && el.naturalWidth) apply(); else el.addEventListener('load', apply, { once: true }); }

async function loadWorks() {
  try {
    const r = await fetch('/api/generate/results?limit=120');
    if (!r.ok) return;
    const raw = (await r.json()).data || [];
    const byKey = Object.create(null); BATCHES = [];
    raw.forEach(x => {
      if (x.status !== 'success' || !x.file_path) return;
      const k = (x.metadata && x.metadata.batch_id) || x.prompt_idx;
      let b = byKey[k];
      if (!b) {
        b = { key: k, items: [], idxs: [], promptText: x.prompt_text || '', templateSource: x.template_source || '', templateName: x.template_name || '', model: x.model || '', w: x.width, h: x.height, productImage: x.product_image || (x.metadata && x.metadata.product_image) || '', modelName: (x.metadata && x.metadata.model_name) || '', choices: (x.metadata && x.metadata.choices) || null, dateKey: dateKeyOf(x.created_at), dateLabel: fmtBatchDate(x.created_at) };
        byKey[k] = b; BATCHES.push(b);
      }
      const fn = x.file_path.split('/').pop();
      b.items.push({ url: '/images/' + fn, type: /\.(mp4|webm|mov)$/i.test(fn) ? 'reel' : 'photo', idx: x.idx, visibility: x.visibility === 'public' ? 'public' : 'private' });
      b.idxs.push(x.idx);
    });
    renderWorks();
  } catch (e) {}
}
function studioMediaCard(o) {
  const reel = (o.type === 'reel');
  const inner = reel
    ? `<video class="img" src="${esc(o.url)}" autoplay muted loop playsinline preload="metadata" style="object-fit:cover" onloadedmetadata="fitResultCard(this)"></video>`
    : `<img class="img" src="${esc(o.url)}" loading="lazy" style="object-fit:cover" onload="fitResultCard(this)" alt="" onerror="var c=this.closest('.result-card');if(c)c.remove()">`;
  const priv = (o.visibility === 'private');
  const visBtn = `<button class="rc-btn${priv ? ' on' : ''}" type="button" title="${priv ? '비공개 — 나만 봅니다' : '공개 — Explore에 노출'}" onclick="event.stopPropagation();toggleCardVis(this,${o.idx})">${priv ? RC_SVG.priv : RC_SVG.pub}</button>`;
  const dlBtn = `<a class="rc-btn" href="${esc(o.url)}" download title="다운로드" onclick="event.stopPropagation()">${RC_SVG.dl}</a>`;
  return `<div class="result-card" role="link" tabindex="0" onclick="location.href='/creation?idx=${o.idx}&from=pack'" style="cursor:pointer">${inner}<div class="rc-tools">${visBtn}${dlBtn}</div></div>`;
}
const CH_LBL = { cut: 'Cut', cutBg: 'BG color', bg: 'Scene', garment: 'Garment', skin: 'Skin', age: 'Age', concept: 'Concept', detail: 'Detail', size: 'Size' };
const CH_ORDER = ['cut', 'garment', 'skin', 'age', 'concept', 'bg', 'cutBg', 'size', 'detail'];
function batchRowHtml(b) {
  const media = b.items.map(studioMediaCard).join('');
  const isTpl = !!b.templateSource;
  const head = isTpl
    ? `<span class="rb-badge tpl">⬡ Template</span><div class="rb-title">${esc(b.templateName || 'Template')}</div>`
    : `<span class="rb-badge custom">✎ Custom</span><div class="rb-prompt">${esc(b.promptText || 'Custom')}</div>`;
  const ML = rbModelLabel(b.model);
  const dimStatic = (b.w && b.h) ? `<b>${b.w}</b> × <b>${b.h}</b>` : '';
  const ratioStatic = (b.w && b.h) ? rbRatioLabel(b.w, b.h) : '';
  const isReelBatch = !!(b.items[0] && b.items[0].type === 'reel');
  const specs = `<div class="rb-specs"><span class="spec">${isReelBatch ? 'Reel' : 'Photo'}</span>`
    + `<span class="spec rb-spec-dim"${dimStatic ? '' : ' hidden'}>${dimStatic}</span>`
    + `<span class="spec rb-spec-ratio"${ratioStatic ? '' : ' hidden'}>${ratioStatic ? `<b>${ratioStatic}</b>` : ''}</span>`
    + (ML ? `<span class="spec">${esc(ML)}</span>` : '') + `</div>`;
  const srcRow = ((b.productImage || b.modelName) ? `<div class="rb-src-row">`
    + (b.productImage ? `<img class="rb-src-thumb" src="${esc(b.productImage)}" alt="" loading="lazy" title="사용한 제품" onerror="this.remove()">` : '')
    + (b.modelName ? `<span class="rb-src-item rb-src-model"><span class="k">Model</span>${esc(b.modelName)}</span>` : '') + `</div>` : '');
  const chRow = (() => { const c = b.choices; if (!c || typeof c !== 'object') return '';
    const chips = CH_ORDER.filter(k => c[k]).map(k => { const v = String(c[k]); const dot = (k === 'cutBg') ? `<i class="ch-dot" style="background:${esc(v)}"></i>` : ''; const txt = (k === 'detail' && v.length > 28) ? v.slice(0, 28) + '…' : v; return `<span class="rb-src-item rb-ch" title="${esc((CH_LBL[k] || k) + ': ' + v)}"><span class="k">${esc(CH_LBL[k] || k)}</span>${dot}${esc(txt)}</span>`; });
    return chips.length ? `<div class="rb-src-row rb-ch-row">${chips.join('')}</div>` : ''; })();
  const del = `<div class="rb-del-row"><button class="rb-del" type="button" onclick="delBatch(this,'${b.idxs.join(',')}')">🗑 삭제</button></div>`;
  return `<div class="result-row"><div class="rb-media">${media}</div><div class="rb-meta">${head}${specs}${srcRow}${chRow}${del}</div></div>`;
}
function renderWorks() {
  const grid = $('#resultsGrid'), empty = $('#worksEmpty');
  const total = BATCHES.reduce((n, b) => n + b.items.length, 0);
  $('#worksCount').textContent = total ? total + '개' : '';
  if (!BATCHES.length) { grid.innerHTML = ''; empty.classList.remove('hide'); return; }
  empty.classList.add('hide');
  let html = '', last = null;
  BATCHES.forEach(b => { if (b.dateKey !== last) { html += `<div class="rb-date">${esc(b.dateLabel || '')}</div>`; last = b.dateKey; } html += batchRowHtml(b); });
  grid.innerHTML = html;
  fillRbSpecs(grid);
}
async function toggleCardVis(btn, idx) {   // 글로브 = 공개/비공개 토글(Shots·Library와 동일 엔드포인트)
  if (btn.disabled) return;
  const next = btn.classList.contains('on') ? 'public' : 'private';
  btn.disabled = true;
  try {
    const r = await fetch('/api/generate/results/' + idx + '/visibility', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ visibility: next }) });
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || 'failed');
    const vis = (d.data && d.data.visibility) || next; const priv = (vis === 'private');
    btn.classList.toggle('on', priv); btn.title = priv ? '비공개 — 나만 봅니다' : '공개 — Explore에 노출'; btn.innerHTML = priv ? RC_SVG.priv : RC_SVG.pub;
    if (window.toast) { if (next === 'private' && vis !== 'private') toast('비공개는 유료 플랜이 필요해요 — 공개 유지.', 'error'); else toast(priv ? '비공개로 바꿨어요.' : '공개로 바꿨어요 — Explore에 노출됩니다.'); }
  } catch (e) { if (window.toast) toast('변경 실패: ' + (e.message || e), 'error'); }
  finally { btn.disabled = false; }
}
async function delBatch(btn, idxsCsv) {   // 크리에이션 삭제(배치 = 여러 장이면 전부). /api/generate/creations/:idx DELETE
  if (btn.disabled) return;
  if (!confirm('이 크리에이션을 삭제할까요?')) return;
  btn.disabled = true;
  const idxs = idxsCsv.split(',').filter(Boolean);
  try {
    await Promise.all(idxs.map(id => fetch('/api/generate/creations/' + id, { method: 'DELETE' }).then(r => r.ok).catch(() => false)));
    const row = btn.closest('.result-row'); if (row) row.remove();
    loadWorks();
  } catch (e) { btn.disabled = false; if (window.toast) toast('삭제 실패', 'error'); }
}
loadWorks(); // 페이지 로드 시 피드 채우기
</script>
