<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Pack · Doppia</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/saas-auth.js?v=3" defer></script>
<script src="/js/rail.js?v=11" defer></script>
<style>
  @view-transition{navigation:auto} /* (2026-07-26) 홈 create 바 → pack 부드러운 크로스페이드(양쪽 다 선언해야 동작) */
  /* pack = 앱 페이지. 색·폰트·레일 여백은 theme.css 토큰 사용(인라인 warm 테마 폐기). */
  .wrap{max-width:820px;margin:0 auto;padding:34px 24px 90px;position:relative;z-index:2}
  .phead{margin-bottom:24px}
  h1{font-family:'Sora';font-size:28px;font-weight:800;letter-spacing:-.5px}
  .lead{color:var(--dim);font-size:14px;margin-top:6px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:16px}
  label.f{display:block;font-size:13px;font-weight:600;margin:0 0 8px;color:var(--text)}
  input[type=text],textarea#product{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;font:inherit;background:var(--bg2);color:var(--text);transition:border-color .15s}
  input[type=text]::placeholder,textarea#product::placeholder{color:var(--faint)}
  input[type=text]:focus,textarea#product:focus{outline:none;border-color:var(--accent2)}
  textarea#product{resize:vertical;min-height:64px;line-height:1.5}
  .drop{border:2px dashed var(--border2);border-radius:14px;padding:30px;text-align:center;color:var(--dim);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .drop:hover{border-color:var(--accent2);color:var(--text)}
  .drop.on{border-color:var(--accent);color:var(--text);background:rgba(124,108,255,.06)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .thumbs img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  button.go{background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff;border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:20px;box-shadow:0 4px 14px -4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.13);transition:transform .15s,box-shadow .15s}
  button.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 24px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
  button.go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .status{font-size:14px;color:var(--dim)}
  .sect h2{font-size:14px;font-weight:700;margin:22px 0 12px;color:var(--text);padding-bottom:8px;border-bottom:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .grid figure{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg2)}
  .grid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .grid figcaption{font-size:11px;padding:7px 9px;color:var(--dim)}
  .hide{display:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .dlall{background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.13);transition:filter .15s}
  .dlall:hover{filter:brightness(1.08)}
  .dl{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;opacity:0;transition:opacity .15s}
  .grid figure:hover .dl{opacity:1}
  @media(hover:none){.dl{opacity:1}}
  /* 완료 후 인터랙티브: 버전 플립 + 컷별 액션(다시/레퍼 다시/studio) + 컨셉 추가 */
  .grid figure.rescard figcaption{padding:7px 9px 9px}
  .cut-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .cutbtn{font-family:inherit;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--border);text-decoration:none;line-height:1}
  .cutbtn:hover{color:var(--text);border-color:var(--border2);background:rgba(255,255,255,.09)}
  .cutbtn:disabled{opacity:.6;cursor:default}
  /* ✦ 이런 걸로 더 — 확장 조작이라 재생성보다 한 톤 강조(accent 테두리) */
  .cutbtn.accent{color:var(--accent2);border-color:color-mix(in srgb,var(--accent2) 45%,transparent)}
  .cutbtn.accent:hover{color:#fff;background:var(--accent2);border-color:var(--accent2)}
  /* ➕ 더 뽑기 바 — 결과 맨 아래, 섹션 폭 전체 */
  .more-bar{margin:26px 0 8px;padding:18px 20px;border:1px dashed var(--border2);border-radius:14px;background:rgba(255,255,255,.02);display:flex;flex-direction:column;gap:14px}
  .more-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  /* 💡 컨셉으로 더 — 자유 텍스트 새 방향 */
  .more-concept{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:13px;border-top:1px solid var(--border)}
  .more-concept input{flex:1;min-width:200px;font-family:inherit;font-size:13px;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:11px 13px}
  .more-concept input::placeholder{color:var(--faint)}
  .more-concept input:focus{outline:none;border-color:var(--accent2)}
  .more-note{font-size:13px;color:var(--dim);line-height:1.5;flex:1;min-width:200px}
  .more-note b{color:var(--text);font-weight:600}
  .more-btns{display:flex;gap:8px;flex-wrap:wrap}
  .more-btn{font-family:inherit;font-size:13px;font-weight:700;padding:10px 16px;border-radius:11px;cursor:pointer;color:#fff;border:0;background:linear-gradient(180deg,#7c52e8,#5c33c2);box-shadow:inset 0 1px 0 rgba(255,255,255,.13);white-space:nowrap}
  .more-btn:hover{filter:brightness(1.08)}
  .more-btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--dim);box-shadow:none}
  .more-btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.09)}
  .more-btn:disabled{opacity:.55;cursor:default;filter:none}
  /* 🎬 광고 영상 블록 — 결과 최상단 */
  .pv-cta{margin:0 0 20px;padding:16px 20px;border:1px solid var(--border2);border-radius:14px;background:linear-gradient(180deg,rgba(124,82,232,.10),rgba(124,82,232,.02));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .pv-cta.busy{background:rgba(255,255,255,.02);border-style:dashed}
  /* 🔁 나갔다 온 진행 중 팩 알림(같은 브라우저, localStorage) — 자동 재개 대신 선택 */
  .reconn{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:11px 15px;border:1px solid var(--border2);border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:13px;color:var(--text)}
  .reconn-act{display:flex;gap:8px}
  .reconn button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;border:1px solid var(--border2);background:rgba(255,255,255,.05);color:var(--text)}
  .reconn-go{background:var(--accent);border-color:var(--accent);color:#fff}
  .reconn button:hover{filter:brightness(1.08)}
  .pv-txt{display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1}
  .pv-txt b{font-size:14px;font-weight:700;color:var(--text)}
  .pv-txt span{font-size:12px;color:var(--dim);line-height:1.5}
  .grid figure.rescard.vid video{width:100%;display:block;border-radius:12px 12px 0 0;background:#000;aspect-ratio:9/16;object-fit:contain}
  .ver{position:absolute;top:7px;left:7px;display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border-radius:8px;padding:2px 4px;z-index:3}
  .ver span{font-size:10px;font-weight:700;color:#fff;padding:0 2px;font-variant-numeric:tabular-nums}
  .verb{width:18px;height:18px;border:none;background:none;color:#fff;font-size:10px;cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center;padding:0}
  .verb:hover:not(:disabled){background:rgba(255,255,255,.2)}
  .verb:disabled{opacity:.35;cursor:default}
  /* 확인 스텝 — "이 제품 맞아요?" 카테고리 확정(오분류 사전 차단) */
  .cf-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .cf{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:22px;max-width:460px;width:100%;box-shadow:0 24px 60px -16px rgba(0,0,0,.7)}
  .cf-h{font-family:'Sora';font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:14px}
  .cf-cat{font-size:12px;color:var(--dim);margin-bottom:7px}
  .cf-badge{display:inline-block;font-size:13px;font-weight:700;color:var(--accent2);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:8px;padding:3px 10px;margin-left:4px}
  .cf-prod{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:8px}
  .cf-set{font-size:12px;color:var(--gold);margin-bottom:8px}
  .cf-states{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .cf-states-h{font-size:12px;color:var(--gold);line-height:1.5;margin-bottom:8px}
  .cf-states-h.dim{color:var(--faint)}
  .cf-state-chips{display:flex;flex-wrap:wrap;gap:7px}
  .cf-note{font-size:12px;color:var(--faint);line-height:1.5;margin-top:4px}
  .cf-cats{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--border)}
  .cf-chip{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--border)}
  .cf-chip:hover{color:var(--text);border-color:var(--border2)}
  .cf-chip.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .cf-actions{display:flex;gap:10px;margin-top:18px}
  .cf-cancel{flex:0 0 auto;font-family:inherit;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;cursor:pointer;color:var(--dim);background:none;border:1px solid var(--border2)}
  .cf-cancel:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .cf-go{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer;color:#fff;border:0;background:linear-gradient(180deg,#7c52e8,#5c33c2);box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}
  .cf-go:hover{filter:brightness(1.08)}
  /* 레퍼 소프트 게이트 — 캐논 레퍼 확인 + 몇 컷 만들지 */
  .rg{position:relative}
  .rg-back{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#c9c6dd;border-radius:10px;font-size:12.5px;font-weight:700;padding:7px 12px;cursor:pointer}
  .rg-back:hover{color:#fff;border-color:rgba(163,148,238,.5)}
  .rg-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .rg{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 24px 60px -16px rgba(0,0,0,.7)}
  .rg-h{font-family:'Sora';font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
  .rg-note{font-size:12.5px;color:var(--dim);line-height:1.55;margin-bottom:14px}
  .rg-note b{color:var(--text)}
  .rg-img{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:16px;height:min(340px,40vh);display:flex;align-items:center;justify-content:center}
  .rg-img img{width:100%;height:100%;object-fit:contain;display:block}
  .rg.wide{max-width:660px}
  /* 상태가 여러 개면 모달이 세로로 길어져 깊이 다이얼·진행버튼이 화면 밖으로 나간다.
     → 모달 높이를 화면 안에 가두고 **레퍼 영역만** 스크롤시켜 하단 CTA는 항상 보이게. */
  .rg{max-height:90vh;display:flex;flex-direction:column}
  .rg-states{display:grid;gap:12px;margin-bottom:16px;overflow-y:auto;min-height:0}
  .rg-states.two{grid-template-columns:1fr 1fr}
  .rg-state{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg2)}
  .rg-state-h{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:8px}
  /* 컨셉 미리보기 ↔ 캐논 레퍼 나란히 비교 */
  .rg-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;align-items:start}
  @media(max-width:640px){.rg-compare{grid-template-columns:1fr}}
  .rg-concept,.rg-canon{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg2)}
  .rg-concept .rg-img{margin-bottom:8px;background:var(--surface);aspect-ratio:auto;height:min(300px,34vh)}
  .rg-compare .rg-states{margin-bottom:0}
  .rg-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim);vertical-align:1px;margin-left:4px}
  .rg-tag.on{background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff}
  .rg-concept-note{font-size:11px;color:var(--dim);line-height:1.5}
  /* 확인용 썸네일이라 크게 필요 없음 — 높이를 묶어 두 상태가 한눈에 들어오게. */
  .rg-state .rg-img{margin-bottom:10px;background:var(--surface);aspect-ratio:auto;height:min(300px,34vh)}
  .rg-states.many .rg-state .rg-img{height:min(150px,20vh)}
  .rg-states.many .rg-state{padding:8px}
  .rg-states.many .rg-state-h{font-size:11.5px;margin-bottom:6px}
  .rg-state .rg-rebake{margin-bottom:0;flex-wrap:wrap}
  .rg-state .rg-rebake input{min-width:120px}
  @media(max-width:520px){.rg-states.two{grid-template-columns:1fr}}
  .rg-depth-h{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:8px}
  .rg-depth-sub{color:var(--faint);font-weight:500}
  .rg-fallback{font-size:12.5px;line-height:1.6;color:var(--text);background:color-mix(in srgb,#e0a03a 14%,transparent);border:1px solid color-mix(in srgb,#e0a03a 42%,transparent);border-radius:11px;padding:10px 12px;margin-bottom:14px}
  .rg-fallback b{color:#f0b755}
  .rg-fb-why{display:block;margin-top:5px;color:var(--faint);font-size:11.5px;word-break:break-all}
  .rg-depths{display:flex;gap:8px;margin-bottom:10px}
  .rg-cost{font-size:12.5px;color:var(--dim);margin-bottom:14px;text-align:center}
  .rg-cost b{color:var(--text);font-weight:700}
  .rg-cost-sub{color:var(--faint);font-weight:500}
  .rg-depth{flex:1;font-family:inherit;font-size:13px;font-weight:700;padding:10px 6px;border-radius:11px;cursor:pointer;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--border);display:flex;flex-direction:column;gap:2px;align-items:center}
  .rg-depth span{font-size:10.5px;font-weight:500;color:var(--faint)}
  .rg-depth:hover{color:var(--text);border-color:var(--border2)}
  .rg-depth.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .rg-depth.on span{color:rgba(255,255,255,.8)}
  .rg-rebake{display:flex;gap:8px;margin-bottom:16px}
  .rg-rebake input{flex:1;min-width:0;font-family:inherit;font-size:12.5px;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 11px}
  .rg-rebake input::placeholder{color:var(--faint)}
  .rg-rebake input:focus{outline:none;border-color:var(--accent2)}
  .rg-rebake-go{flex:0 0 auto;font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 13px;border-radius:10px;cursor:pointer;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--border2);white-space:nowrap}
  .rg-rebake-go:hover{color:var(--text);background:rgba(255,255,255,.09)}
  .rg-rebake-go:disabled{opacity:.6;cursor:default}
  .rg-actions{display:flex}
  .rg-go{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer;color:#fff;border:0;background:linear-gradient(180deg,#7c52e8,#5c33c2);box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}
  .rg-go:hover{filter:brightness(1.08)}
  .rg-go:disabled{opacity:.6;cursor:default}
  /* 🎬 영상 토글(선택형·기본 꺼짐) — 깊이 버튼과 같은 토큰, 켜지면 .rg-depth.on처럼 보라 하이라이트 */
  .rg-video{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding:11px 13px;border-radius:12px;cursor:pointer;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--border);transition:border-color .12s,background .12s,color .12s}
  .rg-video:hover{color:var(--text);border-color:var(--border2)}
  .rg-video.on{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent)}
  .rg-video-check{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);background:rgba(255,255,255,.03);position:relative}
  .rg-video.on .rg-video-check{background:var(--accent);border-color:var(--accent)}
  .rg-video.on .rg-video-check::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .rg-video-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .rg-video-txt b{font-size:13px;font-weight:700}
  .rg-video-txt span{font-size:11px;color:var(--faint);line-height:1.45}
  .rg-video-txt em{font-style:normal;color:var(--accent);font-weight:600}
  /* 생성 중 = 컷(Shots)과 동일 UX: 계획이 정해지는 즉시 "생성되는 수만큼" 스피너 슬롯 + 경과초 */
  .analyzing{display:flex;flex-direction:column;align-items:center;gap:13px;padding:44px 0;color:var(--text);font-size:14px;text-align:center}
  .analyzing .sub{color:var(--dim);font-size:12.5px}
  .grid figure.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:4/5;background:rgba(255,255,255,.03)}
  .grid figure.slot .ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;width:100%}
  .grid figure.slot figcaption{align-self:stretch}
  .rb-spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite}

  /* 내 크리에이션 = Shots·Ad Video 페이지와 동일 피드(날짜 그룹 + 배치별 메타패널). studio.html에서 이식. */

  .result-card .rc-btn{width:30px;height:30px;border-radius:9px;border:none;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none;transition:background .15s,transform .1s}

  .result-card .rc-btn svg{width:15px;height:15px;display:block}

  .rb-badge{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 9px;border-radius:7px}

  .rb-src-row{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}

  .rb-src-thumb:hover{border-color:var(--border2);filter:brightness(1.1)}
  /* 캐논 레퍼 썸네일 — "생성 기준"이라 원본과 살짝 구분(점선 테두리) + 앞에 라벨 */

  /* 🔍 원본 크게 보기 — 38px 썸네일로는 "뭘로 만들었는지"만 알 뿐, 라벨이 맞는지 확인이 안 된다. */

  .rb-src-item .k{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--faint)}
  .rb-src-model{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .rb-ch-row{margin-top:5px;gap:6px}

  .rb-editvid:hover{filter:brightness(1.1)}

  @media(max-width:760px){.result-row{flex-direction:column;gap:14px}.rb-meta{width:100%}.rb-media{max-width:none}.rb-media .result-card{width:46%;height:auto;max-width:none}.rb-media .result-card:only-child{width:100%}}
</style>

<!-- (2026-07-27) 홈 배경 통일(홈/컷/광고영상/콘텐츠팩/라이브러리): home-glow 이식 + theme.css 기본배경(mesh·grain) 숨김 → home과 동일(--bg+home-glow만). 롤백: 이 div+style 제거. -->

<!-- 내 크리에이션 — full-width, studio·Ad Video 페이지와 동일 피드(날짜 그룹 + 배치별 메타패널). generation_results 공유 스토어. -->
<div class="works" id="worksSec">
  <div class="works-head"><h2>내 크리에이션</h2><span class="works-sub" id="worksCount"></span></div>
  <div id="resultsGrid"></div>
  <div class="works-empty hide" id="worksEmpty">아직 만든 콘텐츠가 없어요. 위에서 상품 사진을 넣어 만들어 보세요.</div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let files = [];

const drop = $('#drop'), fileInput = $('#file');
drop.onclick = () => fileInput.click();
['dragover','dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.toggle('on', ev === 'dragover');
  if (ev === 'drop') addFiles(e.dataTransfer.files);
}));
fileInput.onchange = () => addFiles(fileInput.files);
function addFiles(list) {
  for (const f of list) if (f.type.startsWith('image/')) files.push(f);
  renderThumbs();
}
function renderThumbs() {
  $('#thumbs').innerHTML = '';
  files.forEach(f => { const img = new Image(); img.src = URL.createObjectURL(f); $('#thumbs').appendChild(img); });
  $('#go').disabled = files.length === 0;
}

$('#go').onclick = async () => {
  if (!files.length) return;
  $('#go').disabled = true; const gt = $('#go').textContent; $('#go').textContent = '제품 분석 중…';
  const fd = new FormData();
  files.forEach(f => fd.append('photos', f));
  const hint = $('#product').value.trim();
  if (hint) fd.append('product', hint);
  let cls;
  try { const r = await fetch('/api/pack/classify', { method: 'POST', body: fd }); cls = await r.json(); if (!r.ok) throw new Error(cls.error || r.status); }
  catch (e) { cls = { category: 'other', product: '', isSet: false, variants: [] }; } // 분류 실패해도 확인창에서 직접 고르게(막지 않음)
  $('#go').disabled = false; $('#go').textContent = gt;
  showConfirm(cls, hint);
};
function fail(msg) { if (window.toast) toast(msg, 'error'); else alert(msg); } // toast=saas-auth 전역, 미로드 시 alert 폴백
// 액션 진행 오버레이 — 대상 요소(카드/이미지)에 스피너를 즉시 덮고, 끝나면 제거. 작은 버튼 글씨보다 눈에 띔.
function busyOn(el, label) { if (!el) return null; if (getComputedStyle(el).position === 'static') el.style.position = 'relative'; const o = document.createElement('div'); o.className = 'busy-ov'; o.innerHTML = '<div class="rb-spin"></div>' + (label ? '<span>' + esc(label) + '</span>' : ''); el.appendChild(o); return o; }
function busyOff(o) { if (o && o.parentNode) o.parentNode.removeChild(o); }

/**
 * 🔍 원본 사진 크게 보기 + 다운로드.
 *   카드의 38px 썸네일은 "뭘로 만들었는지"만 알려줄 뿐, 라벨 글자가 결과와 맞는지는 확인이 안 된다.
 *   판매자가 실제로 하는 검수가 그 대조라서, 원본을 원본 크기로 볼 수 있어야 한다.
 */
function openSrcLightbox(url) {
  if (!url) return;
  document.querySelector('.lb-bg')?.remove();
  // 확장자는 URL에서 딴다 — 저장 파일이 .jpg 가 아닐 때 이름만 .jpg 로 붙으면 열리지 않는 파일이 된다.
  const ext = (String(url).match(/\.(jpe?g|png|webp|gif)(?:[?#]|$)/i) || [, 'jpg'])[1].toLowerCase();
  document.body.insertAdjacentHTML('beforeend',
    `<div class="lb-bg" onclick="if(event.target===this)closeSrcLightbox()">
       <div class="lb-box">
         <img class="lb-img" src="${esc(url)}" alt="올린 원본 사진">
         <div class="lb-bar">
           <span class="lb-cap">올린 원본 사진 — 결과의 라벨이 이것과 같은지 대조해 보세요</span>
           <a class="cutbtn" href="${esc(url)}" download="원본.${ext}">⤓ 다운로드</a>
           <button class="cutbtn" type="button" onclick="closeSrcLightbox()">닫기</button>
         </div>
       </div>
     </div>`);
  document.addEventListener('keydown', lbEsc);
}
function closeSrcLightbox() { document.querySelector('.lb-bg')?.remove(); document.removeEventListener('keydown', lbEsc); }
function lbEsc(e) { if (e.key === 'Escape') closeSrcLightbox(); }

// ── 확인 스텝: "이 제품 맞아요?" — 오분류를 사람이 사전 차단(귀걸이가 음료로 나오는 참사 방지) ──
const CATS = ['beverage', 'food', 'cosmetics-skincare', 'cosmetics-color', 'haircare', 'apparel', 'footwear', 'bag', 'jewelry', 'home', 'tech', 'other'];
const CAT_LABELS = { beverage: '음료', food: '식품', 'cosmetics-skincare': '스킨케어', 'cosmetics-color': '색조 화장품', haircare: '헤어', apparel: '의류', footwear: '신발', bag: '가방', jewelry: '주얼리', home: '홈·리빙', tech: '테크·가전', other: '기타' };
let confirmState = null;
function showConfirm(cls, hint) {
  // 상태(state) = 같은 제품의 다른 모습(뚜껑 닫음/열음). 2개 이상 켜면 상태마다 레퍼+컷세트를 만든다.
  const _n = v => String(v || '').toLowerCase().replace(/[\s·・‧,.\-_()[\]/]+/g, '');
  const _seen = new Set();
  const states = (cls.states || []).filter(s => {   // 같은 뜻의 상태가 두 번 오는 일이 있다("봉지 열림" ×2)
    if (!s || !s.key) return false;
    const k = _n(s.key), l = _n(s.label);
    if (_seen.has(k) || (l && _seen.has(l))) return false;
    _seen.add(k); if (l) _seen.add(l);
    return true;
  }).slice(0, 4);
  const unit = ['pair', 'with_package', 'group'].includes(cls.unit) ? cls.unit : null;   // 단품이 아니면 레퍼를 그 단위로 굽는다
  const lenses = Array.isArray(cls.lenses) ? cls.lenses.filter(l => l && l.key && l.brief) : [];   // 제품 맞춤 촬영 축(유효순)
  confirmState = { category: CATS.includes(cls.category) ? cls.category : 'other', product: cls.product || '', isSet: !!cls.isSet, variants: cls.variants || [], states, stateOn: {}, unit, lenses, hint };
  states.forEach(s => { confirmState.stateOn[s.key] = true; });   // 기본 전부 켬
  const c = confirmState;
  const setLine = (c.isSet && c.variants.length) ? `<div class="cf-set">세트 · ${c.variants.length}종 감지</div>` : '';
  const stateLine = states.length > 1
    ? `<div class="cf-states">
        <div class="cf-states-h">상태 ${states.length}개 감지 — 상태마다 컷 세트를 만듭니다(컷 수가 그만큼 늘어요)</div>
        <div class="cf-state-chips" id="cfStates">${states.map(s => `<button class="cf-chip on" data-s="${esc(s.key)}" onclick="toggleState('${esc(s.key)}')">${esc(s.label || s.key)}</button>`).join('')}</div>
      </div>`
    : (states.length === 1
      ? `<div class="cf-states"><div class="cf-states-h dim">상태 1개(${esc(states[0].label || states[0].key)}) 감지 — 다른 모습(열린 상태·펼친 상태·개봉 등) 사진도 같이 올리면 컷이 배로 늘어납니다</div></div>`
      : '');
  // 한 단위 = 단품이 아니면 알려준다(레퍼를 이 단위로 굽는다). 틀리면 게이트에서 교정 가능.
  const UNIT_LABEL = { pair: '한 쌍', with_package: '제품 + 패키지', group: '묶음 세트' };
  // 라벨 뒤에 조사를 붙이지 않는다 — "한 쌍"+"로" = "한 쌍로"(틀림). 조사 없이 끊어 쓴다.
  const unitLine = unit ? `<div class="cf-set">한 단위 · ${esc(UNIT_LABEL[unit])} — 이 단위로 레퍼를 굽습니다</div>` : '';
  document.querySelector('.cf-bg') && document.querySelector('.cf-bg').remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="cf-bg"><div class="cf">
    <div class="cf-h">이 제품 맞나요?</div>
    <div class="cf-cat">감지된 카테고리 · <span class="cf-badge" id="cfBadge">${esc(CAT_LABELS[c.category] || c.category)}</span></div>
    <div class="cf-prod">${esc(c.product || '(제품 설명을 못 읽었어요 — 카테고리를 골라주세요)')}</div>

function showRefGate(pack) {
