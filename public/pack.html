<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Pack · Doppia</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/saas-auth.js?v=3" defer></script>
<script src="/js/rail.js?v=11" defer></script>
<style>
  /* pack = 앱 페이지. 색·폰트·레일 여백은 theme.css 토큰 사용(인라인 warm 테마 폐기). */
  .wrap{max-width:820px;margin:0 auto;padding:34px 24px 90px;position:relative;z-index:2}
  .phead{margin-bottom:24px}
  h1{font-family:'Sora';font-size:28px;font-weight:800;letter-spacing:-.5px}
  .lead{color:var(--dim);font-size:14px;margin-top:6px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:16px}
  label.f{display:block;font-size:13px;font-weight:600;margin:0 0 8px;color:var(--text)}
  input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;font:inherit;background:var(--bg2);color:var(--text);transition:border-color .15s}
  input[type=text]::placeholder{color:var(--faint)}
  input[type=text]:focus{outline:none;border-color:var(--accent2)}
  .drop{border:2px dashed var(--border2);border-radius:14px;padding:30px;text-align:center;color:var(--dim);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .drop:hover{border-color:var(--accent2);color:var(--text)}
  .drop.on{border-color:var(--accent);color:var(--text);background:rgba(124,108,255,.06)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .thumbs img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
  button.go{background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff;border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:20px;box-shadow:0 4px 14px -4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.13);transition:transform .15s,box-shadow .15s}
  button.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 24px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
  button.go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .status{font-size:14px;color:var(--dim)}
  .sect h2{font-size:14px;font-weight:700;margin:22px 0 12px;color:var(--text);padding-bottom:8px;border-bottom:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .grid figure{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg2)}
  .grid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .grid figcaption{font-size:11px;padding:7px 9px;color:var(--dim)}
  .hide{display:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .dlall{background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.13);transition:filter .15s}
  .dlall:hover{filter:brightness(1.08)}
  .dl{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;opacity:0;transition:opacity .15s}
  .grid figure:hover .dl{opacity:1}
  @media(hover:none){.dl{opacity:1}}
  /* 생성 중 = 컷(Shots)과 동일 UX: 계획이 정해지는 즉시 "생성되는 수만큼" 스피너 슬롯 + 경과초 */
  .analyzing{display:flex;flex-direction:column;align-items:center;gap:13px;padding:44px 0;color:var(--text);font-size:14px;text-align:center}
  .analyzing .sub{color:var(--dim);font-size:12.5px}
  .grid figure.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:4/5;background:rgba(255,255,255,.03)}
  .grid figure.slot .ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;width:100%}
  .grid figure.slot figcaption{align-self:stretch}
  .rb-spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite}
  .rb-elapsed{font-size:12.5px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
  .grid figure.failed-fig{display:flex;flex-direction:column;background:rgba(255,90,90,.06);border-color:rgba(255,120,120,.28)}
  .rb-failed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;aspect-ratio:4/5}
  .rb-failed .rbf-ic{color:#ff8a8a;font-weight:700;font-size:12.5px}
  .rb-failed .rbf-msg{color:var(--dim);font-size:11px;line-height:1.5}
  /* 내 크리에이션 — Shots·Ad Video 페이지와 동일한 공유 피드(전체 크리에이션) */
  .works{margin-top:46px}
  .works-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
  .works-head h2{font-family:'Sora';font-size:20px;font-weight:800;letter-spacing:-.4px}
  .works-sub{color:var(--dim);font-size:13px}
  .works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .wcard{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg2);cursor:pointer;aspect-ratio:4/5}
  .wcard .media{width:100%;height:100%;object-fit:cover;display:block}
  .wcard .rc-tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transform:translateY(-3px);transition:opacity .15s,transform .15s}
  .wcard:hover .rc-tools,.wcard:focus-within .rc-tools{opacity:1;transform:none}
  @media(hover:none){.wcard .rc-tools{opacity:1;transform:none}}
  .rc-btn{width:30px;height:30px;border-radius:9px;border:none;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s,transform .1s;text-decoration:none}
  .rc-btn:hover{background:rgba(0,0,0,.8)}
  .rc-btn:active{transform:scale(.9)}
  .rc-btn svg{width:15px;height:15px;display:block}
  .rc-btn.on{background:var(--accent)}
  .works-empty{color:var(--dim);font-size:13px;padding:34px 0;text-align:center}
</style>
</head>
<body class="has-rail">
<div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<nav>
  <div class="nav-in">
    <div class="brand" onclick="location.href='/landing'"><b>Doppia</b></div>
    <div class="credits" id="saasUserBox"></div>
  </div>
</nav>

<div class="wrap">
  <div class="phead fade d1">
    <h1>Product Pack</h1>
    <p class="lead">상품 사진 1~몇 장을 넣으면 필요한 콘텐츠를 알아서 만들어 드립니다.</p>
  </div>

  <div id="form" class="fade d2">
    <div class="card">
      <div class="drop" id="drop">
        <div>사진을 끌어다 놓거나 클릭해서 업로드</div>
        <input type="file" id="file" accept="image/*" multiple class="hide">
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="card">
      <label class="f">한 줄 힌트 <span style="color:var(--dim);font-weight:400">(선택 — 사진만으로도 됩니다)</span></label>
      <input type="text" id="product" placeholder="예: 국내산 사과 애사비 / 두피용 앰플 — 사진으로 안 보이는 것만">
      <p style="font-size:12px;color:var(--dim);margin:8px 2px 0">카테고리 · 세트 여부는 사진을 분석해 자동으로 판단합니다.</p>
      <button class="go" id="go" disabled>콘텐츠 만들기</button>
    </div>
  </div>

  <div id="result" class="hide">
    <div class="card">
      <div class="rhead">
        <div class="status" id="status"><span class="spin"></span>생성 중…</div>
        <button class="dlall hide" id="dlAll" onclick="downloadAll()">전체 다운로드</button>
      </div>
      <div class="sect" id="assets"></div>
    </div>
  </div>

  <!-- 내 크리에이션 — Shots·Ad Video 페이지와 동일 피드(전체 크리에이션). generation_results 공유 스토어. -->
  <div class="works" id="worksSec">
    <div class="works-head"><h2>내 크리에이션</h2><span class="works-sub" id="worksCount"></span></div>
    <div class="works-grid" id="worksGrid"></div>
    <div class="works-empty hide" id="worksEmpty">아직 만든 콘텐츠가 없어요. 위에서 상품 사진을 넣어 만들어 보세요.</div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let files = [];

const drop = $('#drop'), fileInput = $('#file');
drop.onclick = () => fileInput.click();
['dragover','dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.toggle('on', ev === 'dragover');
  if (ev === 'drop') addFiles(e.dataTransfer.files);
}));
fileInput.onchange = () => addFiles(fileInput.files);
function addFiles(list) {
  for (const f of list) if (f.type.startsWith('image/')) files.push(f);
  renderThumbs();
}
function renderThumbs() {
  $('#thumbs').innerHTML = '';
  files.forEach(f => { const img = new Image(); img.src = URL.createObjectURL(f); $('#thumbs').appendChild(img); });
  $('#go').disabled = files.length === 0;
}

$('#go').onclick = async () => {
  $('#go').disabled = true;
  const fd = new FormData();
  files.forEach(f => fd.append('photos', f));
  const hint = $('#product').value.trim();
  if (hint) fd.append('product', hint);       // 선택 힌트 — 카테고리·세트는 서버가 사진 분석해 자동
  let r;
  try { r = await fetch('/api/pack', { method: 'POST', body: fd }); }
  catch (e) { fail('요청 실패: 네트워크'); $('#go').disabled = false; return; }
  if (!r.ok) { fail('요청 실패: ' + r.status); $('#go').disabled = false; return; }
  const { id } = await r.json();
  $('#form').classList.add('hide');
  $('#result').classList.remove('hide');
  startGen();
  poll(id);
};
function fail(msg) { if (window.toast) toast(msg, 'error'); else alert(msg); } // toast=saas-auth 전역, 미로드 시 alert 폴백

// ── 생성 진행 표시 (컷/Shots 동일 UX) ──
//   계획(config.plan)이 정해지는 즉시 "생성되는 수만큼" 스피너 슬롯 + 경과초를 깔고, 완료되는 대로 이미지로 채운다.
//   계획 전(사진 분석 중)엔 개수를 모르므로 "분석 중" 상태. 완료 시 안 채워진 슬롯 = 실패 카드.
const KIND_LABEL = { still: '스틸', composite: '합성', ref: '캐논 레퍼' };
const KIND_ORDER = ['still', 'composite', 'ref'];
const filled = new Set();
let built = false, genStartTs = 0, elapsedTimer = null;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slotId = (o) => o.kind + ':' + (o.key != null ? o.key : o.cut_key);
const assetId = (a) => a.kind + ':' + (a.cut_key != null ? a.cut_key : a.key);
function fname(a, i) { return (a.cut_key || a.kind || 'image').replace(/[^\w-]/g, '') + '_' + (i + 1) + '.jpg'; }

function startGen() {
  built = false; filled.clear();
  showAnalyzing();
  genStartTs = Date.now();
  if (elapsedTimer) clearInterval(elapsedTimer);
  elapsedTimer = setInterval(tickElapsed, 100);
}
function stopGen() { if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; } }
function tickElapsed() {
  const t = ((Date.now() - genStartTs) / 1000).toFixed(1) + 's';
  document.querySelectorAll('.rb-elapsed').forEach(el => el.textContent = t);
}
function showAnalyzing() {
  $('#assets').innerHTML = '<div class="analyzing"><div class="rb-spin"></div><div>사진을 분석하는 중…<div class="sub">맞춤 컷을 고르고 있어요</div></div></div>';
}
function buildGrid(slots) {
  const byKind = {};
  (slots || []).forEach(s => (byKind[s.kind] = byKind[s.kind] || []).push(s));
  $('#assets').innerHTML = KIND_ORDER.filter(k => byKind[k]).map(k =>
    `<h2>${KIND_LABEL[k] || k}</h2><div class="grid">` +
    byKind[k].map(s => `<figure class="slot" data-slot="${esc(slotId(s))}"><div class="ph"><div class="rb-spin"></div><div class="rb-elapsed">0.0s</div></div><figcaption>${esc(s.label || s.key)}</figcaption></figure>`).join('') +
    `</div>`).join('');
  built = true;
}
function fillSlot(a, i) {
  const key = assetId(a);
  if (filled.has(key)) return;
  let fig = null;
  document.querySelectorAll('#assets figure.slot').forEach(f => { if (f.dataset.slot === key) fig = f; });
  if (!fig) return;
  filled.add(key);
  fig.classList.remove('slot');
  fig.innerHTML = `<a class="dl" href="${a.url}" download="${fname(a, i)}" title="다운로드">⤓</a><img src="${a.url}" loading="lazy"><figcaption>${esc(a.label || a.cut_key || '')}</figcaption>`;
}
function finalizeSlots() {   // 완료/실패 시점에 아직 스피너인 슬롯 = 생성 실패
  document.querySelectorAll('#assets figure.slot').forEach(fig => {
    const cap = fig.querySelector('figcaption');
    const label = cap ? cap.textContent : '';
    fig.classList.remove('slot'); fig.classList.add('failed-fig');
    fig.innerHTML = `<div class="rb-failed"><div class="rbf-ic">⚠ 실패</div><div class="rbf-msg">이 컷은 생성되지 않았어요</div></div><figcaption>${esc(label)}</figcaption>`;
  });
}

async function poll(id) {
  let pack;
  try { pack = await (await fetch('/api/pack/' + id)).json(); }
  catch (e) { setTimeout(() => poll(id), 2000); return; }
  const plan = pack.config && pack.config.plan;
  const assets = pack.assets || [];
  window._packAssets = assets;
  if (plan && !built) buildGrid(plan.slots);
  if (built) assets.forEach((a, i) => fillSlot(a, i));
  $('#dlAll').classList.toggle('hide', assets.length === 0);

  if (pack.status === 'done') { finalizeSlots(); stopGen(); $('#status').innerHTML = '완료 · ' + assets.length + '개 자산'; loadWorks(); return; }
  if (pack.status === 'failed') { finalizeSlots(); stopGen(); $('#status').innerHTML = '실패: ' + esc(pack.error || '') + (assets.length ? ' (그때까지 ' + assets.length + '개)' : ''); return; }
  $('#status').innerHTML = plan
    ? '<span class="spin"></span>생성 중 · ' + assets.length + '/' + plan.total
    : '<span class="spin"></span>사진 분석 중…';
  setTimeout(() => poll(id), 1500);
}
function downloadAll() {
  const assets = window._packAssets || [];
  assets.forEach((a, i) => setTimeout(() => {
    const el = document.createElement('a');
    el.href = a.url; el.download = fname(a, i);
    document.body.appendChild(el); el.click(); el.remove();
  }, i * 350)); // 스태거 — 브라우저 다중 다운로드 차단 회피
}

// ── 내 크리에이션 (전체 — Shots·Ad Video 페이지와 동일 피드. /api/generate/results = generation_results 공유 스토어) ──
const RC_SVG = {
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  pub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>',
  priv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
let WORKS = [];
async function loadWorks() {
  try {
    const r = await fetch('/api/generate/results?limit=60');
    if (!r.ok) return;
    const raw = (await r.json()).data || [];
    WORKS = raw.filter(x => x.status === 'success' && x.file_path).map(x => ({
      idx: x.idx,
      url: '/images/' + x.file_path.split('/').pop(),   // 피드 규약: basename → /images/<name>
      type: /\.(mp4|webm|mov)$/i.test(x.file_path) ? 'reel' : 'photo',
      visibility: x.visibility === 'public' ? 'public' : 'private',
    }));
    renderWorks();
  } catch (e) {}
}
function renderWorks() {
  const grid = $('#worksGrid'), empty = $('#worksEmpty');
  $('#worksCount').textContent = WORKS.length ? WORKS.length + '개' : '';
  if (!WORKS.length) { grid.innerHTML = ''; empty.classList.remove('hide'); return; }
  empty.classList.add('hide');
  grid.innerHTML = WORKS.map(it => {
    const onerr = `onerror="var c=this.closest('.wcard');if(c)c.remove()"`; // 파일 누락(404) 카드 자동 제거
    const media = it.type === 'reel'
      ? `<video class="media" muted loop playsinline preload="metadata" src="${esc(it.url)}#t=0.1" ${onerr}></video>`
      : `<img class="media" src="${esc(it.url)}" loading="lazy" alt="" ${onerr}>`;
    const vp = it.visibility === 'private';
    const visBtn = `<button class="rc-btn${vp ? ' on' : ''}" type="button" title="${vp ? '비공개 — 나만 봅니다' : '공개 — Explore에 노출'}" onclick="event.stopPropagation();toggleVis(${it.idx},this)">${vp ? RC_SVG.priv : RC_SVG.pub}</button>`;
    const dlBtn = `<a class="rc-btn" href="${esc(it.url)}" download title="다운로드" onclick="event.stopPropagation()">${RC_SVG.dl}</a>`;
    return `<div class="wcard" role="link" tabindex="0" onclick="location.href='/creation?idx=${it.idx}&from=pack'"><div class="rc-tools">${visBtn}${dlBtn}</div>${media}</div>`;
  }).join('');
}
async function toggleVis(idx, btn) {   // 글로브 = 공개/비공개 토글(Shots·Library와 동일 엔드포인트)
  const it = WORKS.find(x => x.idx === idx); if (!it) return;
  if (btn && btn.disabled) return;
  const next = it.visibility === 'public' ? 'private' : 'public';
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/api/generate/results/' + idx + '/visibility', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ visibility: next }) });
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || 'failed');
    const vis = (d.data && d.data.visibility) || next;
    it.visibility = vis;
    const priv = vis === 'private';
    if (btn) { btn.classList.toggle('on', priv); btn.title = priv ? '비공개 — 나만 봅니다' : '공개 — Explore에 노출'; btn.innerHTML = priv ? RC_SVG.priv : RC_SVG.pub; }
    if (window.toast) toast(priv ? '비공개로 바꿨어요.' : '공개로 바꿨어요 — Explore에 노출됩니다.');
  } catch (e) { if (window.toast) toast('변경 실패: ' + (e.message || e), 'error'); }
  finally { if (btn) btn.disabled = false; }
}
loadWorks(); // 페이지 로드 시 피드 채우기
</script>
</body>
</html>
