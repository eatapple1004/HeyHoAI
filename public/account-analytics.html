<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doppia - Analytics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a2e;
    --border: #2a2a3e; --text: #e4e4ed; --dim: #8888a0;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00b894;
    --red: #ff7675; --orange: #fdcb6e;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent2); }
  header nav { display: flex; gap: 16px; }
  header nav a { color: var(--dim); text-decoration: none; font-size: 13px; font-weight: 500; }
  header nav a:hover, header nav a.active { color: var(--accent2); }

  .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); text-decoration: none; font-size: 13px; margin-bottom: 20px; }
  .back-link:hover { color: var(--accent2); }

  .profile-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px;
  }
  .profile-card .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--surface2); border: 3px solid var(--accent); }
  .profile-card .info { flex: 1; }
  .profile-card .name { font-size: 20px; font-weight: 700; }
  .profile-card .username { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .profile-card .bio { font-size: 12px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .profile-card .badges { display: flex; gap: 6px; margin-top: 8px; }
  .profile-card .badge { padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; text-align: center;
  }
  .stat-card .stat-value { font-size: 32px; font-weight: 800; }
  .stat-card .stat-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  .section-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 16px;
  }
  .section-card h3 { font-size: 15px; font-weight: 700; color: var(--accent2); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

  .post-list { display: flex; flex-direction: column; gap: 8px; }
  .post-item {
    display: flex; gap: 12px; padding: 12px; background: var(--surface2);
    border-radius: 8px; align-items: center;
  }
  .post-item .post-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: var(--bg); flex-shrink: 0; }
  .post-item .post-info { flex: 1; min-width: 0; }
  .post-item .post-text { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .post-item .post-meta { font-size: 10px; color: var(--dim); margin-top: 4px; }
  .post-item .post-status { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }

  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: var(--dim); }
  .info-row .value { font-weight: 600; }

  .placeholder { color: var(--dim); font-size: 13px; padding: 20px; text-align: center; }
  .error-msg { color: var(--red); font-size: 12px; padding: 10px; }
  .refresh-btn { padding: 8px 16px; background: var(--accent); border: none; border-radius: 6px; color: white; font-size: 12px; font-weight: 600; cursor: pointer; }

  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 300; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); color: white; }
  .toast.error { background: var(--red); color: white; }
</style>
  <script src="/auth-ui.js" defer></script>
</head>
<body>

<header>
  <h1>Doppia</h1>
  <nav>
    <a href="/heyhoai/image/generater/page">Image Generator</a>
    <a href="/heyhoai/character/page">Characters</a>
    <a href="/heyhoai/accounts/page" class="active">Accounts</a>
    <a href="/heyhoai/templates/page">Templates</a>
    <a href="/heyhoai/editor/page">Editor</a>
    <a href="/heyhoai/logs/page">Logs</a>
  </nav>
</header>

<div class="container">
  <a class="back-link" href="/heyhoai/accounts/page">&larr; Back to Accounts</a>

  <div class="profile-card" id="profileCard">
    <div style="color:var(--dim);">Loading...</div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <!-- Account Info -->
  <div class="section-card">
    <h3 style="display:flex;justify-content:space-between;align-items:center;">
      Account Info
      <button class="refresh-btn" onclick="loadAll()">Refresh</button>
    </h3>
    <div id="accountInfo"><div class="placeholder">Loading...</div></div>
  </div>

  <!-- Recent Posts -->
  <div class="section-card">
    <h3>Recent Posts (via Zernio)</h3>
    <div id="postList" class="post-list"><div class="placeholder">Loading...</div></div>
  </div>

  <!-- Analytics Upgrade -->
  <div class="section-card">
    <h3>Advanced Analytics</h3>
    <div style="text-align:center;padding:20px;">
      <div style="font-size:14px;color:var(--dim);margin-bottom:12px;">
        Reach, Impressions, Demographics 등 상세 분석은<br>Zernio Analytics 애드온이 필요합니다.
      </div>
      <a href="https://zernio.com/dashboard" target="_blank" class="refresh-btn" style="text-decoration:none;display:inline-block;">Zernio Dashboard에서 활성화</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const accountId = window.location.pathname.split('/')[3];

  function formatNum(n) {
    if (!n && n !== 0) return '-';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n);
  }

  async function loadDetail() {
    try {
      const res = await fetch('/api/accounts/' + accountId + '/analytics/detail');
      const data = await res.json();
      if (!data.success) { document.getElementById('profileCard').innerHTML = '<div class="error-msg">Failed to load</div>'; return; }

      const acc = data.data;
      const pd = acc.metadata?.profileData || {};

      // Profile Card
      document.title = `Doppia - ${acc.displayName || acc.username} Analytics`;
      document.getElementById('profileCard').innerHTML = `
        ${acc.profilePicture
          ? '<img class="avatar" src="' + acc.profilePicture + '" alt="">'
          : '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--dim);">I</div>'}
        <div class="info">
          <div class="name">${acc.displayName || acc.username}</div>
          <div class="username">@${acc.username}</div>
          ${pd.bio ? '<div class="bio">' + pd.bio + '</div>' : ''}
          <div class="badges">
            <span class="badge" style="background:rgba(225,48,108,0.15);color:#e1306c;">${acc.platform}</span>
            <span class="badge" style="background:rgba(0,184,148,0.15);color:var(--green);">${acc.platformStatus || 'active'}</span>
            <span class="badge" style="background:rgba(108,92,231,0.15);color:var(--accent2);">${pd.accountType || 'unknown'}</span>
          </div>
        </div>
      `;

      // Stats Cards
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-value">${formatNum(pd.followersCount)}</div><div class="stat-label">Followers</div></div>
        <div class="stat-card"><div class="stat-value">${formatNum(pd.followsCount)}</div><div class="stat-label">Following</div></div>
        <div class="stat-card"><div class="stat-value">${formatNum(pd.mediaCount)}</div><div class="stat-label">Posts</div></div>
        <div class="stat-card"><div class="stat-value">${pd.followersCount && pd.followsCount ? (pd.followersCount / pd.followsCount).toFixed(1) : '-'}</div><div class="stat-label">F/F Ratio</div></div>
      `;

      // Account Info
      const connectedAt = acc.metadata?.connectedAt ? new Date(acc.metadata.connectedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '-';
      const tokenExpires = acc.tokenExpiresAt ? new Date(acc.tokenExpiresAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '-';
      const updatedAt = acc.updatedAt ? new Date(acc.updatedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '-';

      document.getElementById('accountInfo').innerHTML = `
        <div class="info-row"><span class="label">Platform User ID</span><span class="value">${acc.platformUserId || '-'}</span></div>
        <div class="info-row"><span class="label">Account Type</span><span class="value">${pd.accountType || '-'}</span></div>
        <div class="info-row"><span class="label">Connected At</span><span class="value">${connectedAt}</span></div>
        <div class="info-row"><span class="label">Token Expires</span><span class="value">${tokenExpires}</span></div>
        <div class="info-row"><span class="label">Last Updated</span><span class="value">${updatedAt}</span></div>
        <div class="info-row"><span class="label">Ads Status</span><span class="value">${acc.adsStatus || '-'}</span></div>
        <div class="info-row"><span class="label">Permissions</span><span class="value" style="font-size:11px;">${(acc.permissions || []).join(', ')}</span></div>
        <div class="info-row"><span class="label">Profile URL</span><span class="value"><a href="${acc.profileUrl}" target="_blank" style="color:var(--accent2);">${acc.profileUrl}</a></span></div>
      `;
    } catch (e) {
      document.getElementById('profileCard').innerHTML = '<div class="error-msg">' + e.message + '</div>';
    }
  }

  async function loadPosts() {
    try {
      const res = await fetch('/api/accounts/' + accountId + '/analytics/posts');
      const data = await res.json();
      const list = document.getElementById('postList');

      const posts = data.data?.posts || data.data || [];
      if (!Array.isArray(posts) || posts.length === 0) {
        list.innerHTML = '<div class="placeholder">No posts found</div>';
        return;
      }

      list.innerHTML = '';
      posts.slice(0, 30).forEach(p => {
        const statusColor = p.status === 'published' ? 'var(--green)' : p.status === 'scheduled' ? 'var(--orange)' : 'var(--dim)';
        const date = p.publishedAt || p.scheduledFor || p.createdAt;
        const dateStr = date ? new Date(date).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '-';

        const div = document.createElement('div');
        div.className = 'post-item';
        div.innerHTML = `
          ${p.mediaItems?.[0]?.url
            ? '<img class="post-thumb" src="' + p.mediaItems[0].url + '" alt="">'
            : '<div class="post-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);">No img</div>'}
          <div class="post-info">
            <div class="post-text">${p.content?.slice(0, 80) || 'No caption'}</div>
            <div class="post-meta">${dateStr}</div>
          </div>
          <span class="post-status" style="color:${statusColor};background:${statusColor}15;">${p.status || '-'}</span>
        `;
        list.appendChild(div);
      });
    } catch (e) {
      document.getElementById('postList').innerHTML = '<div class="error-msg">' + e.message + '</div>';
    }
  }

  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function loadAll() {
    loadDetail();
    loadPosts();
  }

  loadAll();
</script>
</body>
</html>
