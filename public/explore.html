<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Explore</title>
<script src="/js/flags.js" defer></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=5" />
<script src="/saas-auth.js" defer></script>
<script src="/js/rail.js?v=3" defer></script>
<style>
  .wrap{max-width:1280px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:2}
  .head{margin-bottom:24px}
  h1{font-family:'Sora';font-size:30px;font-weight:800;letter-spacing:-1px}
  .head .sub{color:var(--dim);font-size:14px;margin-top:4px}
  /* 마소너리 그리드 */
  /* creations = 행 우선 masonry: 윗줄=최신, 아래로 갈수록 오래된 것 + 자연 비율(JS가 grid-row span 계산) */
  .grid{column-count:2;column-gap:14px}  /* 폴백 */
  #grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1px;column-gap:14px}
  @media(min-width:560px){#grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:700px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}}  /* 한 줄 최대 4개, 이후 줄바뀜 */
  #grid .card{margin:0;align-self:start;break-inside:auto}
  .card{break-inside:avoid;margin:0 0 16px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--surface);position:relative;cursor:pointer}
  .card .media{display:block;width:100%;height:auto;background:#0c0c14}
  .hlink{color:inherit;text-decoration:none}
  .hlink:hover{color:var(--accent2);text-decoration:underline}
  /* 호버 오버레이: 평소 숨김 → 호버 시 상단(생성자+하트)·하단(액션). 컨테이너는 클릭 통과(pointer-events:none), 버튼만 클릭. */
  .card .ovt,.card .ovb{position:absolute;left:0;right:0;opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}
  .card:hover .ovt,.card:hover .ovb{opacity:1}
  .card .ovt{top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;background:linear-gradient(rgba(0,0,0,.72),transparent)}
  .card .ovb{bottom:0;padding:30px 11px 12px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
  .card .by{pointer-events:auto;font-size:12px;color:#fff;font-weight:600;text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .card a.by:hover{text-decoration:underline}
  .card .like{pointer-events:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1;transition:transform .12s,border-color .15s}
  .card .like:active{transform:scale(.88)}
  .card .like .hrt{font-size:13px;line-height:1}
  .card .like.on{color:#ff5a7a;border-color:rgba(255,90,122,.6)}
  .card .act{pointer-events:auto;width:100%;border:none;border-radius:9px;padding:9px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .act.save{background:rgba(255,255,255,.17);color:#fff;border:1px solid rgba(255,255,255,.32)}
  .card .act.use{background:var(--accent);color:#fff}
  .card .act.ghost{background:rgba(255,255,255,.14);color:#fff}
  .card .vbadge{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:3;opacity:0;transition:opacity .15s}
  .card:hover .vbadge{opacity:1}
  .empty{text-align:center;color:var(--dim);padding:80px 20px}
  .empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px;font-family:'Sora'}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a27;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border2)}
  #toast.show{opacity:1}
  /* Discover 탭(Creations | Templates) */
  .tabbar{display:flex;gap:6px;margin:18px 0 20px;border-bottom:1px solid var(--border)}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}
  .filter-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:30px;cursor:pointer;transition:all .2s}
  .chip:hover{color:var(--text)}
  .chip.active{background:rgba(124,108,255,.16);color:var(--accent2);border-color:rgba(124,108,255,.4)}
  #tplSearch{width:100%;max-width:340px;display:block;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13.5px;padding:9px 13px;margin-bottom:18px}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .tcard{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface);transition:border-color .2s,transform .2s}
  .tcard:hover{transform:translateY(-3px);border-color:var(--border2)}
  .tthumb{position:relative;aspect-ratio:4/5;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#7c6cff,#5ee0d6)}
  .tthumb img{width:100%;height:100%;object-fit:cover}
  .temoji{font-size:46px}
  .tprice{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;text-transform:uppercase;letter-spacing:.3px}
  .tbody{padding:11px 12px}
  .tname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tmeta{font-size:11.5px;color:var(--dim);margin-top:3px}
  .trow{display:flex;gap:7px;margin-top:10px}
  .tuse{flex:1;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .tuse:hover{filter:brightness(1.08)}
  .tbk{background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;border-radius:9px;padding:8px 11px;font-size:14px;cursor:pointer;line-height:1}
  .tbk.on{color:#ffd35e;border-color:rgba(255,211,94,.5)}
</style>
</head>
<body class="has-rail">
<div class="wrap">
  <div class="head">
    <h1>Explore</h1>
    <div class="sub" id="sub">Real creations from the Doppia community. Like one? <b style="color:var(--accent2)">Make it with your own face or product.</b></div>
  </div>

  <div class="tabbar">
    <button class="tab active" data-tab="feed" onclick="switchTab('feed')">Creations</button>
    <button class="tab" data-tab="templates" onclick="switchTab('templates')">Templates</button>
  </div>

  <!-- Creations: 커뮤니티 공개 결과 피드 (기존) -->
  <section id="tab-feed">
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty"><b>Nothing here yet</b>Be the first — create something in Studio (Public mode on) and it shows up here.</div>
  </section>

  <!-- Templates: 마켓 카탈로그 (용도별 + 가격 + 검색 + 북마크) -->
  <section id="tab-templates" class="hidden">
    <div class="filter-row" id="catFilter"></div>
    <div class="filter-row" id="priceFilter" data-flag="marketplace"></div>
    <input id="tplSearch" type="search" placeholder="Search templates…" oninput="renderCatalog()" autocomplete="off" />
    <div class="tgrid" id="tplGrid"></div>
    <div class="empty hidden" id="tplEmpty"><b>No templates here</b>Try another category, or be the first to publish one from Studio.</div>
  </section>
</div>
<div id="toast"></div>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

// Explore Creations 카드 = 호버 액션 없는 깔끔한 미리보기(클릭→상세). 템플릿 관련 액션은 상세 페이지에서만(사용자 지시).
// 타인 creation이 낳은 auto 템플릿을 My templates에 추가(acquire) — Templates 카탈로그 카드(tcard)에서 사용.
async function acquireTpl(tid,btn){
  if(btn){btn.disabled=true;btn.textContent='Adding…';}
  try{
    const r=await fetch('/api/marketplace/templates/'+encodeURIComponent(tid)+'/acquire',{method:'POST'});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast((d.data&&d.data.alreadyOwned)?'Already in My templates':'Added to My templates');
    if(btn){btn.textContent='✓ In My templates';btn.disabled=true;btn.style.opacity='.6';btn.style.cursor='default';}
  }catch(e){ toast('Could not add: '+(e.message||e)); if(btn){btn.disabled=false;btn.textContent='＋ Add to My templates';} }
}
function card(it){
  const media=it.type==='video'
    ? `<video class="media" src="${esc(it.url)}" muted loop playsinline autoplay></video>`
    : `<img class="media" src="${esc(it.url)}" loading="lazy" alt="">`;
  const by=it.creatorHandle
    ? `<a class="by" href="/creator?handle=${encodeURIComponent(String(it.creatorHandle).replace(/^@/,''))}" onclick="event.stopPropagation()">${esc(it.creatorHandle)}</a>`
    : `<span class="by">@creator</span>`;
  const like=`<button class="like ${it.liked?'on':''}" title="${it.liked?'Liked':'Like'}" onclick="event.stopPropagation();toggleLike(${it.idx},this)"><span class="hrt">${it.liked?'♥':'♡'}</span><span class="lct">${it.likes||0}</span></button>`;
  return `<div class="card" onclick="location.href='/creation?idx=${it.idx}&from=explore'">
    <div class="ovt">${by}${like}</div>
    ${media}
  </div>`;
}
async function toggleLike(idx,btn){
  const on=btn.classList.contains('on');
  btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+idx+'/like',{method:on?'DELETE':'POST'});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.liked);
    btn.querySelector('.hrt').textContent=d.data.liked?'♥':'♡';
    btn.querySelector('.lct').textContent=d.data.likes;
    btn.title=d.data.liked?'Liked':'Like';
  }catch(e){toast('Like failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}

async function load(){
  const grid=document.getElementById('grid'),empty=document.getElementById('empty');
  try{
    const d=(await(await fetch('/api/generate/community?limit=80')).json()).data||[];
    if(!d.length){grid.innerHTML='';empty.classList.remove('hidden');return;}
    empty.classList.add('hidden');grid.innerHTML=d.map(card).join('');
    playFeedVideos();
    layoutGridMasonry();
  }catch(e){console.error('explore load failed',e);empty.classList.remove('hidden');}
}
// 행 우선 masonry(#grid 전용): 각 카드 자연 높이로 grid-row span 계산 → 윗줄=최신, 자연 비율·세로 gap 유지.
function sizeGridCard(card){ const h=card.getBoundingClientRect().height; if(h>4) card.style.gridRowEnd='span '+Math.round(h+14); }
function layoutGridMasonry(){
  const g=document.getElementById('grid'); if(!g||getComputedStyle(g).display!=='grid')return;
  g.querySelectorAll('.card').forEach(c=>{ const m=c.querySelector('.media');
    if(m&&!m.__gmHooked){ m.__gmHooked=1; try{m.loading='eager';}catch(e){} const ev=m.tagName==='VIDEO'?'loadedmetadata':'load';
      if((m.tagName==='IMG'&&m.complete)||(m.tagName==='VIDEO'&&m.readyState>=1)) sizeGridCard(c); else m.addEventListener(ev,()=>sizeGridCard(c),{once:true}); }
    sizeGridCard(c); });
}
addEventListener('resize',()=>{ clearTimeout(window.__gmT); window.__gmT=setTimeout(layoutGridMasonry,150); });
// 동적 삽입된 영상은 autoplay 속성만으론 재생이 안 걸려 명시적으로 play() 호출(muted=정책 통과). 화면 들어올 때 재생.
function playFeedVideos(){
  const vids=document.querySelectorAll('.card video.media');
  if(!vids.length)return;
  const kick=v=>{v.muted=true;const p=v.play();if(p&&p.catch)p.catch(()=>{});};
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver((es)=>es.forEach(e=>{e.isIntersecting?kick(e.target):e.target.pause();}),{threshold:.25});
    vids.forEach(v=>io.observe(v));
  }else{ vids.forEach(kick); }
}
async function reportResult(idx){
  if(!confirm('Report this creation for review?'))return;
  try{
    const r=await fetch('/api/generate/results/'+idx+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'inappropriate'})});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast(d.data&&d.data.takenDown?'Reported — removed from feed':'Reported. Thank you.');
    if(d.data&&d.data.takenDown)load();
  }catch(e){toast('Report failed: '+(e.message||e));}
}

// ── Discover 탭 (Creations | Templates 카탈로그) ──
const PRICES=['All','Free','Paid'];
let CATALOG=[], THEMES=[], curTheme='All', curPrice='All', catalogLoaded=false;
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.getElementById('tab-feed').classList.toggle('hidden',t!=='feed');
  document.getElementById('tab-templates').classList.toggle('hidden',t!=='templates');
  document.getElementById('sub').innerHTML = t==='templates'
    ? 'Browse community templates. <b style="color:var(--accent2)">Save the ones you like</b> — or use them with your own face or product.'
    : 'Real creations from the Doppia community. Like one? <b style="color:var(--accent2)">Make it with your own face or product.</b>';
  if(t==='templates'&&!catalogLoaded){catalogLoaded=true;renderPrices();loadThemesThenCatalog();}
}
function themeName(slug){return slug==='All'?'All':((THEMES.find(t=>t.slug===slug)||{}).name||slug);}
function renderThemeFilter(){const all=['All'].concat(THEMES.map(t=>t.slug));document.getElementById('catFilter').innerHTML=all.map(s=>`<div class="chip ${curTheme===s?'active':''}" onclick="setTheme('${s}')">${themeName(s)}</div>`).join('');}
function setTheme(s){curTheme=s;renderThemeFilter();renderCatalog();}
function renderPrices(){document.getElementById('priceFilter').innerHTML=PRICES.map(c=>`<div class="chip ${curPrice===c?'active':''}" onclick="setPrice('${c}')">${c}</div>`).join('');}
function setPrice(c){curPrice=c;renderPrices();renderCatalog();}
async function loadThemesThenCatalog(){try{THEMES=(await(await fetch('/api/marketplace/themes')).json()).data||[];}catch(e){THEMES=[];}renderThemeFilter();loadCatalog();}
async function loadCatalog(){
  try{
    CATALOG=(await(await fetch('/api/marketplace/templates')).json()).data||[];
  }catch(e){console.error('catalog load failed',e);CATALOG=[];}
  renderCatalog();
}
function tcard(t){
  const prev=(t.preview_media&&t.preview_media[0])||'';
  const thumb=prev?`<img src="${esc(prev)}" loading="lazy" alt="">`:`<div class="temoji">${esc(t.emoji||'🎨')}</div>`;
  const price=t.price_credits>0?('◈ '+t.price_credits):'Free';
  return `<div class="tcard">
    <div class="tthumb" onclick="goTpl('${esc(t.id)}')">${thumb}<span class="tprice">${price}</span></div>
    <div class="tbody">
      <div class="tname">${esc(t.name)}</div>
      <div class="tmeta">by ${t.creator_handle?`<a class="hlink" href="/creator?handle=${encodeURIComponent(String(t.creator_handle).replace(/^@/,''))}">${esc(t.creator_handle)}</a>`:'@creator'} · ♥ ${t.likes_count||0}${t.type==='reel'?' · ▶ Reel':''}</div>
      <div class="trow">
        <button class="tuse" onclick="acquireTpl('${esc(t.id)}',this)">＋ Add to My templates</button>
        <button class="tbk ${t.bookmarked?'on':''}" onclick="toggleBookmark('${esc(t.id)}',this)" title="${t.bookmarked?'Saved':'Save'}">${t.bookmarked?'★':'☆'}</button>
      </div>
    </div></div>`;
}
function renderCatalog(){
  const term=(document.getElementById('tplSearch').value||'').toLowerCase().trim();
  let list=CATALOG.filter(t=>!t.owned); // 발견용: 이미 보유한 건 숨김(Library에 있음)
  if(curTheme!=='All')list=list.filter(t=>(t.themes||[]).includes(curTheme));
  if(curPrice==='Free')list=list.filter(t=>!(t.price_credits>0));
  else if(curPrice==='Paid')list=list.filter(t=>t.price_credits>0);
  if(term)list=list.filter(t=>(t.name||'').toLowerCase().includes(term));
  const grid=document.getElementById('tplGrid'),empty=document.getElementById('tplEmpty');
  if(!list.length){grid.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');grid.innerHTML=list.map(tcard).join('');
}
function goTpl(id){location.href='/template?id='+encodeURIComponent(id);}
async function toggleBookmark(id,btn){
  const on=btn.classList.contains('on');
  try{
    const r=await fetch('/api/marketplace/templates/'+id+'/bookmark',{method:on?'DELETE':'POST'});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',!on);btn.textContent=!on?'★':'☆';btn.title=!on?'Saved':'Save';
    const t=CATALOG.find(x=>x.id===id);if(t)t.bookmarked=!on;
    toast(!on?'Saved to your Library':'Removed from Saved');
  }catch(e){toast('Could not update: '+(e.message||e));}
}

load();
// 딥링크: /explore?tab=templates → 카탈로그 탭으로 진입
if(/[?&]tab=templates\b/.test(location.search))switchTab('templates');
</script>
<script src="/js/biz-footer.js?v=1"></script>
</body>
</html>
