<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Creation</title>
<script src="/js/flags.js" defer></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=4" />
<script src="/saas-auth.js" defer></script>
<script src="/js/rail.js?v=3" defer></script>
<style>
  .wrap{max-width:1080px;margin:0 auto;padding:30px 24px 90px;position:relative;z-index:2}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;cursor:pointer;margin-bottom:18px;background:none;border:none;font-family:inherit}
  .back:hover{color:var(--text)}
  .grid2{display:grid;grid-template-columns:1.3fr .82fr;gap:30px;align-items:start}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  /* 좌: 미디어 */
  .stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:#0c0c14;min-height:280px}
  .stage .media{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;margin:0 auto;background:#0c0c14}
  .like{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1;transition:transform .12s,background .15s,border-color .15s}
  .like:hover{background:rgba(0,0,0,.72)}
  .like:active{transform:scale(.9)}
  .like .hrt{font-size:15px;line-height:1}
  .like.on{color:#ff5a7a;border-color:rgba(255,90,122,.55)}
  .vbadge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px}
  /* 우: 패널 */
  .panel{position:sticky;top:24px}
  .date{color:var(--faint);font-size:12.5px;margin-bottom:12px}
  .creatorRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  .creator{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
  .follow{flex-shrink:0;border:1px solid var(--accent);background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
  .follow:hover{filter:brightness(1.08)}
  .follow.on{background:transparent;color:var(--dim);border-color:var(--border2)}
  .follow.on:hover{color:#ff7eb6;border-color:#ff7eb6}
  .ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;font-family:'Sora';flex-shrink:0}
  .creator .who{display:flex;flex-direction:column;gap:1px}
  .creator .hnd{color:var(--text);font-weight:700;font-size:15px}
  .creator:hover .hnd{color:var(--accent2)}
  .creator .lbl{color:var(--faint);font-size:11.5px}
  .acts{display:flex;flex-direction:column;gap:10px}
  .act{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--text);transition:all .15s;text-decoration:none}
  .act:hover{border-color:var(--accent);color:#fff}
  .act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .act.primary:hover{filter:brightness(1.08)}
  .act.sm{padding:11px 14px;font-size:13.5px}
  .row2{display:flex;gap:10px}
  .row2 .act{flex:1}
  .sep{height:1px;background:var(--border);margin:18px 0 14px}
  .ownhdr{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .report{margin-top:18px;background:none;border:none;color:var(--faint);font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px}
  .report:hover{color:#ff7eb6}
  .state{text-align:center;color:var(--dim);padding:90px 20px}
  .state b{display:block;color:var(--text);font-size:18px;margin-bottom:6px;font-family:'Sora'}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a27;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border2)}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <button class="back" onclick="goBack()">← Back</button>
  <div id="root"><div class="state">Loading…</div></div>
</div>
<div id="toast"></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function goBack(){ if(history.length>1) history.back(); else location.href='/explore'; }
function qs(k){return new URLSearchParams(location.search).get(k);}

let IT=null;
const IDX=parseInt(qs('idx'),10);

async function load(){
  const root=document.getElementById('root');
  if(!IDX){root.innerHTML='<div class="state"><b>Invalid creation</b>No creation id.</div>';return;}
  try{
    const r=await fetch('/api/generate/creations/'+IDX);
    if(r.status===404){root.innerHTML='<div class="state"><b>Not available</b>This creation is private or no longer available.</div>';return;}
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT=d.data; render();
  }catch(e){root.innerHTML='<div class="state"><b>Couldn’t load</b>'+esc(e.message||e)+'</div>';}
}

function useCta(){
  if(IT.templateSource==='marketplace' && IT.templateId)
    return `<a class="act primary" href="/template?id=${encodeURIComponent(IT.templateId)}">🔓 Get ${esc(IT.templateName||'this template')}</a>`;
  if(IT.templateSource==='recipe' && IT.templateId)
    return `<a class="act primary" href="/studio?recipe=${encodeURIComponent(IT.templateId)}">✨ Use ${esc(IT.templateName||'this template')}</a>`;
  // 무템플릿: 레시피 비노출 — 스튜디오로 보내 내 주체로 새로 만들게(퍼널 유지)
  return `<a class="act primary" href="/studio">✨ Make your own</a>`;
}

function render(){
  const media=IT.type==='video'
    ? `<video class="media" src="${esc(IT.url)}" controls loop playsinline></video>`
    : `<img class="media" src="${esc(IT.url)}" alt="">`;
  const vbadge=IT.type==='video'?'<span class="vbadge">▶ Reel</span>':'';
  const handle=IT.creatorHandle||'@creator';
  const letter=esc(handle.replace(/^@/,'').charAt(0).toUpperCase()||'C');
  const dateStr=IT.createdAt?new Date(IT.createdAt).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'';
  const fLbl=IT.followers>0?`Creator · ${IT.followers} follower${IT.followers===1?'':'s'}`:'Creator';
  const inner=`<div class="ava">${letter}</div><div class="who"><span class="hnd">${esc(handle)}</span><span class="lbl" id="followLbl">${fLbl}</span></div>`;
  const followBtn=(IT.creatorHandle && !IT.isOwn)
    ? `<button class="follow ${IT.following?'on':''}" id="followBtn" onclick="toggleFollow()">${IT.following?'Following':'+ Follow'}</button>` : '';
  const creator=IT.creatorHandle
    ? `<div class="creatorRow"><a class="creator" href="/creator?handle=${encodeURIComponent(handle.replace(/^@/,''))}">${inner}</a>${followBtn}</div>`
    : `<div class="creatorRow"><div class="creator">${inner}</div></div>`;

  let owner='';
  if(IT.isOwn){
    const isPub=IT.visibility==='public';
    const canSave=!IT.templateSource; // Custom(미귀속)만 템플릿화
    owner=`<div class="sep"></div><div class="ownhdr">Your creation</div><div class="acts">
      ${canSave?`<a class="act sm" href="/gallery?save=${IT.idx}">✦ Save as template</a>`:''}
      <button class="act sm" id="visBtn" onclick="toggleVis()">${isPub?'🌐 Public — make private':'🔒 Private — make public'}</button>
      <a class="act sm" href="${esc(IT.url)}" download>⬇ Download</a>
    </div>`;
  }
  const report=IT.isOwn?'':`<button class="report" onclick="reportIt()">⚐ Report this creation</button>`;

  document.getElementById('root').innerHTML=`<div class="grid2">
    <div class="stage">${vbadge}
      <button class="like ${IT.liked?'on':''}" title="${IT.liked?'Liked':'Like'}" onclick="toggleLike(this)"><span class="hrt">${IT.liked?'♥':'♡'}</span><span class="lct">${IT.likes||0}</span></button>
      ${media}
    </div>
    <div class="panel">
      <div class="date">${esc(dateStr)}</div>
      ${creator}
      <div class="acts">
        ${useCta()}
        <div class="row2">
          <button class="act sm" onclick="share()">↗ Share</button>
        </div>
      </div>
      ${owner}
      ${report}
    </div>
  </div>`;
}

async function toggleLike(btn){
  const on=btn.classList.contains('on'); btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/like',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.liked);
    btn.querySelector('.hrt').textContent=d.data.liked?'♥':'♡';
    btn.querySelector('.lct').textContent=d.data.likes;
    btn.title=d.data.liked?'Liked':'Like'; IT.liked=d.data.liked; IT.likes=d.data.likes;
  }catch(e){toast('Like failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}

function share(){
  const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Copy failed'));
  }else{ toast('Copy this URL: '+url); }
}

async function toggleFollow(){
  const btn=document.getElementById('followBtn'); if(!btn)return;
  const on=btn.classList.contains('on'); btn.disabled=true;
  const h=(IT.creatorHandle||'').replace(/^@/,'');
  try{
    const r=await fetch('/api/marketplace/creators/'+encodeURIComponent(h)+'/follow',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.following);
    btn.textContent=d.data.following?'Following':'+ Follow';
    IT.following=d.data.following; IT.followers=d.data.followers;
    const lbl=document.getElementById('followLbl');
    if(lbl)lbl.textContent=d.data.followers>0?`Creator · ${d.data.followers} follower${d.data.followers===1?'':'s'}`:'Creator';
  }catch(e){toast('Follow failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}

async function toggleVis(){
  const btn=document.getElementById('visBtn'); if(!btn)return;
  const next=IT.visibility==='public'?'private':'public'; btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/visibility',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({visibility:next})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT.visibility=d.data.visibility;
    btn.textContent=IT.visibility==='public'?'🌐 Public — make private':'🔒 Private — make public';
    toast(IT.visibility==='public'?'Now public — shows in Explore':'Now private');
  }catch(e){toast('Update failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}

async function reportIt(){
  if(!confirm('Report this creation for review?'))return;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'inappropriate'})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast(d.data&&d.data.takenDown?'Reported — removed from feed':'Reported. Thank you.');
  }catch(e){toast('Report failed: '+(e.message||e));}
}

load();
</script>
</body>
</html>
