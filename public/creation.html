<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Creation</title>
<script src="/js/flags.js" defer></script>
<script src="/js/no-pip.js" defer></script>
<script src="/js/themes.js?v=7"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/js/i18n.js?v=9" defer></script>
<script src="/saas-auth.js?v=3" defer></script>
<style>
  /* ── Studio Tool look: immersive stage, slim filmstrip, calm action stack ── */
  :root{ --r-sm:10px; --r-md:12px; --r-lg:16px; --r-pill:999px; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
  svg{display:block}
  .ic{width:16px;height:16px;flex-shrink:0;color:var(--dim)}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--accent2);outline-offset:3px;border-radius:var(--r-sm)}

  /* DOPPIA.AI 워드마크(Studio 브랜드와 동일 크기·스타일) — 좌측 상단 플로팅, 글래스 바 없음 */
  .brandmark{position:fixed;top:20px;left:24px;z-index:40;display:inline-flex;align-items:center;text-decoration:none;user-select:none}
  .brandmark span{font-family:'Sora',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.5px;background:linear-gradient(120deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent2)}
  .viewer{display:grid;grid-template-columns:70px minmax(0,1fr) 250px;height:100vh;position:relative;z-index:1}

  /* ── close (fixed, true top-right) ── */
  /* 닫기 X = 패널 왼쪽 바깥 여백 상단(Leonardo식). 패널(폭250+margin14=left offset 264) 왼쪽 20px */
  .vclose{position:fixed;top:30px;right:284px;z-index:40;width:34px;height:34px;border-radius:var(--r-pill);border:1px solid var(--border2);background:color-mix(in srgb,var(--bg2) 78%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;transition:color .16s,background .16s,border-color .16s}
  .vclose:hover{color:var(--text);background:var(--surface2)}
  .vclose .ic{width:16px;height:16px;color:inherit}

  /* ── filmstrip ── */
  /* 스크롤 시 상단 로고 영역·하단으로 썸네일이 우아하게 페이드(하드컷·로고 침범 방지) */
  .strip{position:relative;overflow-y:auto;overflow-x:hidden;padding:64px 0 22px;display:flex;flex-direction:column;align-items:center;gap:9px;background:var(--bg2);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 44px,#000 64px,#000 calc(100% - 22px),transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,transparent 44px,#000 64px,#000 calc(100% - 22px),transparent 100%)}
  .strip::before{content:"";position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--border) 12%,var(--border) 88%,transparent)}
  .strip::-webkit-scrollbar{width:0}
  .th{width:50px;height:50px;border-radius:11px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:var(--bg);padding:0;position:relative;transition:transform .14s,border-color .15s,box-shadow .15s}
  .th:hover{transform:scale(1.05)}
  .th.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
  .th img,.th video{width:100%;height:100%;object-fit:cover;display:block}

  /* ── stage (immersive, borderless, softly lit) ── */
  .stageWrap{position:relative;display:flex;align-items:center;justify-content:center;padding:44px 64px;min-width:0;background:radial-gradient(120% 100% at 50% 38%,var(--bg2),var(--bg))}
  .stageWrap::before{content:"";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(620px,66%);height:min(620px,66%);pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 16%,transparent),transparent 72%);filter:blur(20px)}
  .stageWrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(92% 74% at 50% 42%,transparent 58%,rgba(0,0,0,.4))}
  .stage{position:relative;z-index:1;display:inline-flex;max-width:100%;max-height:calc(100vh - 96px);border-radius:var(--r-lg);overflow:hidden;background:var(--bg2);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 0 1px rgba(255,255,255,.05),0 30px 90px -24px rgba(0,0,0,.8),0 10px 34px -8px rgba(0,0,0,.5)}
  .stage .media{display:block;max-width:100%;max-height:calc(100vh - 96px);object-fit:contain}
  .stage::after{content:"";position:absolute;top:0;left:0;right:0;height:96px;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.32),transparent)}
  .like{position:absolute;top:14px;right:14px;z-index:3;display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;border-radius:var(--r-pill);padding:8px 13px;font-size:13px;font-weight:600;line-height:1;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums;transition:background .15s,transform .12s,border-color .15s}
  .like:hover{background:rgba(0,0,0,.72)}
  .like:active{transform:scale(.92)}
  .like .hrt{display:inline-flex;line-height:0}
  .like .ic{color:inherit}
  .like .hrt .ic{width:15px;height:15px}
  .like.on{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 55%,transparent)}
  .vbadge{position:absolute;top:14px;left:14px;z-index:3;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;padding:5px 10px;border-radius:var(--r-sm)}
  .vbadge .ic{width:11px;height:11px;color:#fff}

  /* ── panel ── */
  /* 페이드 없이 또렷한 카드(필름스트립과 구분). 상단 로고 밴드 아래서 시작 + top-right에 닫기 X 헤더 존(padding-top) */
  .panel{position:relative;overflow-y:auto;margin:30px 14px 14px 0;padding:28px 24px 28px;background:radial-gradient(125% 48% at 50% 0%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 56%),linear-gradient(180deg,rgba(24,24,35,.86),rgba(15,15,23,.9));backdrop-filter:blur(22px);border:1px solid var(--border2);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 44px 100px -46px rgba(0,0,0,.85);display:flex;flex-direction:column}
  .panel{padding:30px 22px 26px}
  .panel>*{flex-shrink:0}  /* 내용이 길면 카드가 쭈그러들지 말고(→.tpl-sub 짤림) 패널이 스크롤. .report의 margin-top:auto는 유지 */
  .panel::before{content:"";position:absolute;top:0;left:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--border) 8%,var(--border) 92%,transparent)}
  .panel::-webkit-scrollbar{width:7px}
  .panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
  .panel::-webkit-scrollbar-track{background:transparent}

  .date{color:var(--faint);font-size:11px;font-weight:500;letter-spacing:.3px;margin-bottom:14px}
  .eyebrow{display:block;font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}

  /* creator */
  .creatorRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:0}
  .creator{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
  .ava{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(140deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:17px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 6px 16px -8px color-mix(in srgb,var(--accent) 50%,transparent)}
  .who{display:flex;flex-direction:column;gap:2px;min-width:0}
  .hnd{color:var(--text);font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .creator:hover .hnd{color:var(--accent2)}
  .sub{color:var(--faint);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
  .follow{flex-shrink:0;border:1px solid var(--border2);background:transparent;color:var(--dim);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:var(--r-pill);cursor:pointer;transition:all .15s}
  .follow:hover{background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text)}
  .follow.on{background:transparent;color:var(--dim);border-color:var(--border2)}
  .follow.on:hover{color:var(--pink);border-color:var(--pink)}

  /* Made with — premium template module */
  .tpl{position:relative;margin-bottom:4px;background:none;border:0;border-radius:0;overflow:visible;padding:0}
  .tpl-head{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .tpl-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .tpl-name{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;color:var(--text);margin:0;line-height:1.15;letter-spacing:-.2px}
  .tpl-price{display:inline-flex;align-items:center;gap:5px;font-family:'Sora',sans-serif;font-weight:700;color:var(--text);font-size:15px;white-space:nowrap}
  .tpl-price .ic{width:14px;height:14px;color:var(--accent2)}
  .tpl-thumb{position:relative;width:100%;aspect-ratio:4/5;border-radius:var(--r-md);overflow:hidden;margin-bottom:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);background:var(--surface)}
  .tpl-thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .tpl-thumb::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 62%,rgba(0,0,0,.28))}
  .tpl-actions{display:flex;flex-direction:column;gap:8px}
  .tpl-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:var(--r-md);background:linear-gradient(180deg,color-mix(in srgb,#fff 14%,var(--accent)),var(--accent));border:1px solid color-mix(in srgb,#000 12%,var(--accent));color:#fff;text-decoration:none;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.1px;cursor:pointer;transition:filter .15s,box-shadow .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 22px -8px color-mix(in srgb,var(--accent) 72%,transparent)}
  .tpl-cta:hover{filter:brightness(1.1);box-shadow:0 8px 22px -6px color-mix(in srgb,var(--accent) 85%,transparent)}
  .tpl-cta .ic{color:#fff}
  .tpl-cta .tcl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tpl-cta .price{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;margin-left:2px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.24);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
  .tpl-cta .price .ic{width:12px;height:12px}
  /* View = 박스 버튼 → 중앙 텍스트 링크(CTA 아래 경쟁 박스 제거) */
  .tpl-view{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:8px 0;background:transparent;border:0;color:var(--dim);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:color .15s}
  .tpl-view:hover{color:var(--text);text-decoration:underline}
  .tpl-view:hover .ic{color:var(--text)}
  .tpl-view .ic{width:14px;height:14px}
  .tpl-sub{font-size:12px;font-weight:400;line-height:1.5;color:var(--dim);text-align:center;margin:14px 0 0}
  /* 스펙 = 갤러리 크레딧식 마이크로 캡션 한 줄(중요정보 아님 → 강등). 중점(·)으로 연결 */
  .specs{display:flex;flex-wrap:wrap;align-items:baseline;gap:0;margin:6px 0 0}
  .spec{display:inline;padding:0;border:0;background:none;font-size:10.5px;font-weight:500;letter-spacing:.3px;color:var(--faint);line-height:1.5;font-variant-numeric:tabular-nums}
  .spec .ic{display:none}
  .spec b{color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
  .spec[hidden]{display:none}   /* 미로드/실패 시 숨김 + 그 앞 중점도 함께 사라짐 */
  .spec:not(:first-child)::before{content:"·";margin:0 6px;color:rgba(255,255,255,.16);font-weight:400}
  /* 존 구분 = 박스 대신 양끝 페이드 헤어라인 */
  .hair{height:1px;margin:22px 0;flex-shrink:0;background:linear-gradient(90deg,transparent,var(--border) 15%,var(--border) 85%,transparent)}

  /* Made with — no longer available (weak) */
  .tpl.gone{display:flex;align-items:center;flex-wrap:wrap;gap:7px;background:none;border:0;padding:0}
  .tpl.gone .eyebrow{color:var(--faint)}
  .gone-name{font-weight:600;color:var(--dim);text-decoration:line-through;font-size:14px}
  .gone-note{font-size:12px;color:var(--faint)}

  /* Custom / Ad Video origin chip */
  .badge-chip{display:inline-flex;align-items:center;align-self:flex-start;gap:7px;margin-bottom:4px;padding:0;border:0;background:none;box-shadow:none;color:var(--dim);font-size:12.5px;font-weight:600}
  .badge-chip .ic{color:var(--faint)}

  /* Ad Video 씬 스토리보드 — 컨셉(hook) + 씬 이미지 그리드, 호버 시 클립 재생(자막 미노출). 퍼플은 Create CTA만 */
  .story{position:relative;margin-bottom:4px}
  .story>.eyebrow{margin-bottom:9px}
  .sb-hook{font-size:12.5px;font-style:italic;color:var(--dim);line-height:1.45;margin-bottom:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .sb-cell{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .sb-cell[data-play="1"]{cursor:pointer}
  .sb-poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .sb-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
  .sb-cell.von .sb-vid{opacity:1}
  .sb-n{position:absolute;top:4px;left:4px;z-index:2;min-width:14px;height:14px;padding:0 3px;border-radius:5px;background:rgba(0,0,0,.5);color:rgba(255,255,255,.9);font-size:9px;font-weight:700;line-height:14px;text-align:center;font-variant-numeric:tabular-nums}
  .sb-dur{position:absolute;bottom:4px;right:4px;z-index:2;padding:1px 5px;border-radius:var(--r-pill);background:rgba(0,0,0,.5);color:rgba(255,255,255,.82);font-size:8.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .sb-glyph{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .2s}
  .sb-cell.von .sb-glyph{opacity:0}
  .sb-glyph .ic{width:15px;height:15px;color:rgba(255,255,255,.92);filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
  .sb-cell:not([data-play="1"]){cursor:default}
  .sb-cell:not([data-play="1"]) .sb-glyph{display:none}   /* 정지컷·클립 404 latch(data-play=0): 재생 어포던스 제거 */
  .sb-cell:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .sb-more-note{margin-top:8px;font-size:11px;font-weight:500;color:var(--faint);text-align:center;letter-spacing:.2px}

  /* Prompt module (Custom only) — 박스 → 좌측 룰 에디토리얼 풀쿼트 */
  .prompt{margin:0 0 4px;padding:0 0 0 13px;border:0;border-left:2px solid var(--border2);border-radius:0;background:none;box-shadow:none}
  .prompt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .prompt-copy{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--dim);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 0;transition:color .15s}
  .prompt-copy:hover{color:var(--text)}
  .prompt-copy .ic{width:14px;height:14px}
  .prompt-text{font-size:13px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:150px;overflow-y:auto;padding-right:6px}

  /* action stack — calm, identical rows */
  .acts{display:flex;flex-direction:column;gap:10px}
  .act{display:flex;align-items:center;gap:11px;width:100%;height:46px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s;text-decoration:none}
  .act:hover{border-color:var(--border2);background:var(--surface2)}
  .act .ic{color:var(--dim)}
  .act:hover .ic{color:var(--text)}
  /* Leonardo식 작은 아이콘 액션(저장·공유) + 하단 바 */
  .foot{position:relative;display:flex;flex-direction:column;margin-top:auto;padding-top:22px}
  .foot::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border) 15%,var(--border) 85%,transparent)}
  .foot .own-hint{margin:0 0 12px}
  .foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .mini-acts{display:flex;gap:4px;flex-wrap:wrap;margin-left:-7px}   /* 아이콘 전용 — 박스 없이 첫 아이콘 광학 정렬(좁은 패널서 5개 한 줄) */
  .mini-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--dim);cursor:pointer;transition:color .15s,background .15s;text-decoration:none;flex-shrink:0}
  .mini-btn:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .mini-btn .ic{width:16px;height:16px;color:currentColor}
  .mini-btn.on{color:var(--accent2)}          /* Private ON */
  .mini-btn.danger:hover{color:#ff6b6b;background:color-mix(in srgb,#ff6b6b 12%,transparent)}
  /* 공유 드롭다운(Leonardo식): Copy link + 소셜 */
  .share-wrap{position:relative;display:inline-flex}
  .share-menu{position:absolute;bottom:calc(100% + 8px);left:0;min-width:186px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 22px 54px -18px rgba(0,0,0,.75);z-index:30}
  .share-menu[hidden]{display:none}
  .share-menu>*{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;background:none;border:0;color:var(--dim);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;text-align:left;width:100%;box-sizing:border-box;transition:color .12s,background .12s}
  .share-menu>*:hover{background:var(--surface);color:var(--text)}
  .share-menu .ic{width:15px;height:15px;flex-shrink:0}

  /* owner section */
  .sep{height:1px;background:var(--border);margin:24px 0}
  .ownhdr{margin-bottom:12px}
  .own-hint{font-size:12px;font-weight:400;line-height:1.5;color:var(--faint);margin:10px 2px 0}

  /* tertiary — report */
  .report{display:inline-flex;align-items:center;gap:7px;padding:6px 2px;background:transparent;border:0;cursor:pointer;color:var(--faint);font-family:inherit;font-size:12px;font-weight:500;transition:color .15s}
  .report .ic{width:15px;height:15px;color:inherit}
  .report:hover{color:var(--pink)}

  /* loading / error */
  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);text-align:center}
  .state b{color:var(--text);font-size:18px;font-family:'Sora'}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border2)}
  #toast.show{opacity:1}

  @media(max-width:820px){
    body{overflow:auto}
    .viewer{grid-template-columns:1fr;height:auto;min-height:100vh}
    .strip{flex-direction:row;padding:14px 16px;gap:10px;overflow-x:auto;overflow-y:hidden;-webkit-mask-image:none;mask-image:none}
    .strip::before{display:none}
    .stageWrap{padding:28px 16px 20px}
    .stage,.stage .media{max-height:70vh}

function goBack(){ if(history.length>1) history.back(); else location.href = FROM==='library' ? '/gallery' : '/explore'; }
function qs(k){return new URLSearchParams(location.search).get(k);}

// ── 필름스트립 (컨텍스트 피드의 앞뒤 이미지 순서대로) ──
async function loadStrip(){
  const el=document.getElementById('strip');
  try{
    let list=[];
    if(FROM==='library'){
      const d=(await(await fetch('/api/generate/results?limit=200')).json()).data||[];
      list=d.filter(r=>r.status==='success'&&r.file_path).map(r=>{const fn=r.file_path.split('/').pop();return {idx:r.idx,url:'/images/'+fn,type:/\.(mp4|webm|mov)$/i.test(fn)?'video':'image'};});
    }else{
      const d=(await(await fetch('/api/generate/community?limit=120')).json()).data||[];
      list=d.map(r=>({idx:r.idx,url:r.url,type:r.type}));
    }
    el.innerHTML=list.map(it=>`<button class="th ${it.idx===IDX?'on':''}" data-idx="${it.idx}" onclick="selectIdx(${it.idx})">${it.type==='video'?`<video src="${esc(it.url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(it.url)}" loading="lazy" alt="">`}</button>`).join('');
    scrollStripToCurrent();
  }catch(e){ el.innerHTML=''; }
}
function scrollStripToCurrent(){const cur=document.querySelector('.th.on');if(cur)cur.scrollIntoView({block:'center',behavior:'auto'});}
function markStrip(){document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.idx,10)===IDX));scrollStripToCurrent();}

// ── 상세 로드(리로드 없이 전환) ──
async function selectIdx(idx){ if(idx===IDX)return; IDX=idx; history.replaceState(null,'',`/creation?idx=${idx}&from=${FROM}`); markStrip(); await loadDetail(); }
async function loadDetail(){
  const sw=document.getElementById('stageWrap'),panel=document.getElementById('panel');
  if(!IDX){sw.innerHTML='<div class="state"><b>Invalid creation</b><span>No creation id.</span></div>';panel.innerHTML='';return;}
  try{
    const r=await fetch('/api/generate/creations/'+IDX);
    if(r.status===404){sw.innerHTML='<div class="state"><b>Not available</b><span>This creation is private or no longer available.</span></div>';panel.innerHTML='';return;}
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT=d.data; render();
  }catch(e){sw.innerHTML='<div class="state"><b>Couldn’t load</b><span>'+esc(e.message||e)+'</span></div>';panel.innerHTML='';}
}

// (2026-07-04) 일괄 템플릿 카드 — 템플릿으로 만든 결과물이면 보유·미보유 무관 동일 외형(premium "Made with" 모듈 + primary "Use [name]").

//   가격(◈)은 "미보유 유료 타인 템플릿"에만 노출. 롤백: 이 함수 + sellCard + render의 ${templateCard()} 제거.
function sellCard(name, price, id, thumb, ctaHtml, extraHtml){
  const priceTag = (price!=null) ? `<span class="tpl-price">${IC.credit}${price}</span>` : '';
  const img = thumb ? `<div class="tpl-thumb"><img src="${esc(thumb)}" alt="" loading="lazy"></div>` : '';
  const view = id ? `<button class="tpl-view" onclick="location.href='/template?id='+encodeURIComponent('${esc(id)}')">${IC.eye}View ${name}</button>` : '';
  return `<section class="tpl" aria-label="Template used">
    <div class="tpl-head"><span class="eyebrow">Made with</span><div class="tpl-name-row"><h2 class="tpl-name">${name}</h2></div></div>
    ${img}
    <div class="tpl-actions">${ctaHtml}${view}${extraHtml||''}</div>
    <p class="tpl-sub">Recreate this exact style with your own photo</p>
  </section>`;
}

function isUgc(){ return /^ugc/i.test(String((IT&&IT.model)||'')); } // Ad Video(UGC) 판별
// Ad Video 씬 스토리보드 — 전체 컨셉(hook) + 씬 이미지 그리드, 호버 시 씬 클립 재생. 자막 텍스트 미노출(첫 출시 자막 제외).
//   scenes = 서버 allowlist {n,durationSec,thumb,clipUrl,isStill}. 없으면 '' → Make yours 폴백.
function renderStoryboard(){
  const sc=IT&&IT.scenes; if(!Array.isArray(sc)||!sc.length) return '';
  const CAP=6;                                    // CTA가 밀리지 않게 그리드 캡(초과분은 "+N more")
  const shown=sc.slice(0,CAP), extra=sc.length-shown.length;
  const cells=shown.map(function(s){
    const poster=s.thumb?`<img class="sb-poster-img" src="${esc(s.thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
    const canPlay=!!(s.clipUrl&&!s.isStill);
    // 클립 404/실패 → 셀을 죽은 상태로 latch(data-play=0): sbHover 조기return·글리프/커서 CSS로 숨김(재시도·헛클릭 방지)
    const vid=canPlay?`<video class="sb-vid" src="${esc(s.clipUrl)}" muted loop playsinline preload="none" onplaying="this.closest('.sb-cell').classList.add('von')" onerror="var c=this.closest('.sb-cell');c.classList.remove('von');c.dataset.play='0'"></video>`:'';
    const glyph=canPlay?`<span class="sb-glyph">${IC.play}</span>`:'';
    const dur=s.durationSec?`<span class="sb-dur">${s.durationSec}s</span>`:'';
    const inter=canPlay?` data-play="1" tabindex="0" role="button" aria-label="Play scene ${s.n} preview" onmouseenter="sbHover(this,1)" onmouseleave="sbHover(this,0)" onclick="sbToggle(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();sbToggle(this)}"`:'';
    return `<div class="sb-cell"${inter}><span class="sb-n">${s.n}</span>${poster}${vid}${glyph}${dur}</div>`;
  }).join('');
  const more=extra>0?`<div class="sb-more-note">+${extra} more scene${extra>1?'s':''}</div>`:'';
  const hook=IT.storyHook?`<div class="sb-hook">${esc(IT.storyHook)}</div>`:'';
  return `<div class="story"><span class="eyebrow">Storyboard · ${sc.length} scenes</span>${hook}<div class="sb-grid">${cells}</div>${more}</div>`;
}
// 씬 호버 → 클립 재생(muted loop). 실패(404 등)면 poster 유지(von 안 붙음). 모션 저감 존중.
function sbHover(cell,on){
  if(!cell||cell.dataset.play!=='1') return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const v=cell.querySelector('.sb-vid'); if(!v) return;
  if(on){ try{v.currentTime=0;}catch(e){} const p=v.play(); if(p&&p.catch)p.catch(function(){}); }
  else { try{v.pause();}catch(e){} cell.classList.remove('von'); }
}
// 탭/키보드 재생 토글(터치·키보드 경로). 다른 재생 셀은 정지(단일 활성).
function sbToggle(cell){
  if(!cell||cell.dataset.play!=='1') return;
  const playing=cell.classList.contains('von');
  document.querySelectorAll('.sb-cell.von').forEach(function(c){ if(c!==cell) sbHover(c,0); });
  sbHover(cell, playing?0:1);
}
// intrinsic 크기 → 근접 표준 비율 라벨
function ratioLabel(w,h){ if(!w||!h) return ''; const r=w/h, C=[[9,16],[4,5],[2,3],[3,4],[1,1],[4,3],[3,2],[16,9]]; let best=C[0],bd=Infinity; C.forEach(function(c){ const d=Math.abs(r-c[0]/c[1]); if(d<bd){bd=d;best=c;} }); return best[0]+':'+best[1]; }
// model 코드 → Doppia 친절명(알 수 없으면 '' → pill 숨김, raw 코드 노출 방지)
function modelLabel(m){ m=String(m||'').toLowerCase(); if(!m) return '';
  if(m==='pro') return 'Nano Banana Pro'; if(m==='flash') return 'Nano Banana';
  if(/gemini.*flash|flash.*image/.test(m)) return 'Nano Banana'; if(/gemini|nano-banana/.test(m)) return 'Nano Banana Pro';
  if(m==='gpt-image-2-high') return 'GPT Image HD'; if(/gpt/.test(m)) return 'GPT Image';
  if(/kling/.test(m)||/^ugc/.test(m)) return 'Kling'; return ''; }
// 렌더 후 미디어 로드되면 해상도(912×1140)·비율(4:5)·길이(0:09) 채움(클라이언트 전용, 백엔드 무관)
function fillSpecs(){ const el=document.querySelector('.stage .media'); if(!el) return;
  const show=function(id,html){ const n=document.getElementById(id); if(n){ n.innerHTML=html; n.hidden=false; } };
  const apply=function(){ const w=el.videoWidth||el.naturalWidth, h=el.videoHeight||el.naturalHeight;
    if(w&&h){ show('specDim','<b>'+w+'</b> × <b>'+h+'</b>'); const lbl=ratioLabel(w,h); if(lbl)show('specRatio',IC.ratio+'<b>'+lbl+'</b>'); }
    if(isFinite(el.duration)&&el.duration>0){ const s=Math.round(el.duration); show('specDur',IC.play+'<b>'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</b>'); } };
  if(el.tagName==='IMG'){ if(el.complete&&el.naturalWidth) apply(); else el.addEventListener('load',apply,{once:true}); }
  else { if(el.readyState>=1) apply(); else el.addEventListener('loadedmetadata',apply,{once:true}); } }
function templateCard(){
  if(isUgc()){                                                                                    // Ad Video: 씬 스토리보드(있으면) + Create CTA / 없으면 Make yours 폴백
    const sb=renderStoryboard();
    const head=sb||`<div class="tpl-head"><span class="eyebrow">Ad Video</span><div class="tpl-name-row"><h2 class="tpl-name">Make yours</h2></div></div>`;
    return `<section class="tpl advid" aria-label="Ad Video">
    ${head}
    <div class="tpl-actions"><a class="tpl-cta" href="/studio?mode=ugc">${IC.adv}<span>Create Ad Video</span></a></div>
    <p class="tpl-sub">Turn your product into a video ad like this.</p>
  </section>`;
  }
  if(!IT.templateSource) return `<div class="badge-chip">${IC.pencil}<span>Custom</span></div>`;    // 프롬프트만(템플릿 미사용)
  const rt=IT.relTemplate;
  const name=esc((rt&&rt.name)||IT.templateName||'Template');
  const gone=!(rt&&rt.id);   // 살아있는 템플릿 없음 = 삭제/미접근
  // 삭제·미접근: 정보만(약한 카드). 내 creation이면 즉석 민팅+추가 폴백.
  if(gone){
    const add = ''; // (2026-07-11) ＋ Add to My templates 제거(오피셜 전용)
    return `<div class="tpl gone"><span class="eyebrow">Made with</span><span class="gone-name">${name}</span><span class="gone-note">no longer available</span>${add}</div>`;
  }
  const thumb=(rt&&rt.thumb)||null;
  // 보유(공식/구매/내 것): 일괄 강조 카드 — Studio로 바로 사용(가격 없음). 내 auto면 Creator 관리 보조 버튼.
  if(rt.owned){
    const use=`<button class="tpl-cta" onclick="location.href='/studio?tpl='+encodeURIComponent('${esc(rt.id)}')">${IC.arrow}<span class="tcl">Use ${name}</span></button>`;
    const manage=''; // (2026-07-11) Manage template(→earnings/Creator) 제거(미운영)
    return sellCard(name, null, rt.id, thumb, use, manage);
  }
  // 미보유 + 내 minted(본인 creation): 테마 선택 후 추가. primary=Add to My templates(→acquireRelTemplate가 add-to-my-templates 후 Studio).
  if(IT.isOwn && IT.mintedTemplateId){
    return sellCard(name, null, rt.id, thumb, `<button class="tpl-cta" onclick="acquireRelTemplate()">${IC.arrow}Add to My templates</button>`);
  }
  // 미보유 타인 템플릿: 유료=가격 노출 / 무료=가격 없음. 둘 다 "Use [name]"(획득 후 Studio).
  const paid=(!rt.mine && rt.price>0);
  return sellCard(name, null, rt.id, thumb, `<button class="tpl-cta" onclick="acquireRelTemplate()">${IC.arrow}<span class="tcl">Use ${name}</span>${paid?`<span class="price">${IC.credit}${rt.price}</span>`:''}</button>`);
}
// Custom(자작 프롬프트) creation만 사용 프롬프트 공개 — 템플릿 프롬프트는 블랙박스라 노출 안 함.
function promptPanel(){
  if(IT.templateSource || isUgc() || !IT.prompt) return '';   // 템플릿=블랙박스 / Ad Video=제목—캡션이라 숨김 / Custom만 노출
  return `<div class="prompt"><div class="prompt-head"><span class="eyebrow">Prompt</span>
    <button class="prompt-copy" onclick="copyPrompt(this)">${IC.copy}<span>Copy</span></button></div>
    <div class="prompt-text">${esc(IT.prompt)}</div></div>`;
}
function copyPrompt(btn){
  navigator.clipboard.writeText(IT.prompt||'').then(()=>{ const o=btn.innerHTML; btn.innerHTML=IC.check+'<span>Copied</span>'; setTimeout(()=>btn.innerHTML=o,1400); }).catch(()=>toast('Copy failed'));
}
// 출처/연결 템플릿을 My templates에 획득 후 그 위치(My templates)로 이동. 내 것=add-to-my-templates(owns INSERT)·타인=acquire 폴백.
async function acquireRelTemplate(){
  const rt=IT&&IT.relTemplate; if(!rt||!rt.id)return;
  const tid=encodeURIComponent(rt.id);
  try{
    let r=await fetch('/api/marketplace/templates/'+tid+'/add-to-my-templates',{method:'POST'});
    if(r.status===404) r=await fetch('/api/marketplace/templates/'+tid+'/acquire',{method:'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    location.href='/studio?tpl='+tid;
  }catch(e){ toast('Could not add: '+(e.message||e)); }
}

function render(){
  const media=IT.type==='video'
    ? `<video class="media" src="${esc(IT.url)}" controls loop playsinline></video>`
    : `<img class="media" src="${esc(IT.url)}" alt="">`;
  const vbadge=IT.type==='video'?`<span class="vbadge">${IC.play}Reel</span>`:'';
  document.getElementById('stageWrap').innerHTML=`<div class="stage">${vbadge}
    <button class="like ${IT.liked?'on':''}" title="${IT.liked?'Liked':'Like'}" onclick="toggleLike(this)"><span class="hrt">${IT.liked?IC.heartFull:IC.heart}</span><span class="lct">${IT.likes||0}</span></button>
    ${media}</div>`;

  const handle=IT.creatorHandle||'@creator';
  const letter=esc(handle.replace(/^@/,'').charAt(0).toUpperCase()||'C');
  const dateStr=IT.createdAt?new Date(IT.createdAt).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'';
  const fLbl=IT.followers>0?`Creator · ${IT.followers} follower${IT.followers===1?'':'s'}`:'Creator';
  const inner=`<div class="ava">${letter}</div><div class="who"><span class="hnd">${esc(handle)}</span><span class="sub" id="followLbl">${fLbl}</span></div>`;
  const followBtn=(IT.creatorHandle && !IT.isOwn)
    ? `<button class="follow ${IT.following?'on':''}" id="followBtn" onclick="toggleFollow()">${IT.following?'Following':'+ Follow'}</button>` : '';
  const creator=IT.creatorHandle
    ? `<div class="creatorRow"><a class="creator" href="/creator?handle=${encodeURIComponent(handle.replace(/^@/,''))}">${inner}</a>${followBtn}</div>`
    : `<div class="creatorRow"><div class="creator">${inner}</div></div>`;

  // Leonardo식 하단 작은 아이콘 행. 게이팅: share·download=전체(공개 링크 공유는 커뮤니티에서도 필요) · report=남의 것.
  // 관리 버튼(copy·private·delete) = Studio·Library(내 창작물, FROM=library)에서만. Home·Explore(커뮤니티)는 숨김.
  const isImg=IT.type!=='video';
  const isPub=IT.visibility==='public';
  const manage=(FROM==='library');
  const mShare=`<div class="share-wrap">
    <button class="mini-btn" onclick="toggleShareMenu(event)" aria-label="Share" title="Share">${IC.share}</button>
    <div class="share-menu" id="shareMenu" hidden>
      <button type="button" onclick="closeShareMenu();share()">${IC.link}<span>Copy link</span></button>
      <button type="button" onclick="shareOpen('facebook')">${IC.facebook}<span>Facebook</span></button>
      <button type="button" onclick="shareOpen('x')">${IC.x}<span>X</span></button>
      <button type="button" onclick="shareOpen('reddit')">${IC.reddit}<span>Reddit</span></button>
      <a href="mailto:?subject=${encodeURIComponent('Made with Doppia')}&body=${encodeURIComponent(location.href)}" onclick="closeShareMenu()">${IC.mail}<span>Email</span></a>
    </div>
  </div>`;
  const mDl=`<a class="mini-btn" href="${esc(IT.url)}" download aria-label="Download" title="Download">${IC.dl}</a>`;
  const mCopy=(manage&&isImg)?`<button class="mini-btn" onclick="copyImage(this)" aria-label="Copy image" title="Copy image">${IC.copy}</button>`:'';
  const mPriv=(manage&&IT.isOwn)?`<button class="mini-btn${isPub?'':' on'}" id="visBtn" onclick="toggleVis()" aria-label="Toggle visibility" title="${isPub?'Public — your creation and prompt show in the community. Click to make private.':'Private — only you can see it. Click to make public.'}">${isPub?IC.globe:IC.lock}</button>`:'';
  const mDel=(manage&&IT.isOwn)?`<button class="mini-btn danger" onclick="deleteCreation()" aria-label="Delete" title="Delete this creation">${IC.trash}</button>`:'';
  const report=IT.isOwn?'':`<button class="report" onclick="reportIt()">${IC.flag} Report this creation</button>`;
  const ownHint=(manage&&IT.isOwn)?`<div class="own-hint" id="visHint">${isPub?'Public — your creation and prompt show in the community.':'Private — only you can see it.'}</div>`:'';

  const ML=modelLabel(IT.model);
  const typeSpec=IT.type==='video'?`<span class="spec">${IC.play}<b>Reel</b></span>`:`<span class="spec">${IC.image}<b>Photo</b></span>`;
  const specsBlock=`<div class="specs">${typeSpec}<span class="spec" id="specDim" hidden>—</span><span class="spec" id="specRatio" hidden>—</span>${IT.type==='video'?`<span class="spec" id="specDur" hidden></span>`:''}${ML?`<span class="spec">${esc(ML)}</span>`:''}</div>`;
  document.getElementById('panel').innerHTML=`
    <div class="date">${esc(dateStr)}</div>
    ${creator}
    ${specsBlock}
    <div class="hair"></div>
    ${templateCard()}
    ${promptPanel()}
    <div class="foot">
      ${ownHint}
      <div class="foot-row">
        <div class="mini-acts">${mShare}${mDl}${mCopy}${mPriv}${mDel}</div>
        ${report}
      </div>
    </div>`;
  fillSpecs();
}

async function toggleLike(btn){
  const on=btn.classList.contains('on'); btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/like',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.liked);
    btn.querySelector('.hrt').innerHTML=d.data.liked?IC.heartFull:IC.heart;
    btn.querySelector('.lct').textContent=d.data.likes;
    btn.title=d.data.liked?'Liked':'Like'; IT.liked=d.data.liked; IT.likes=d.data.likes;
  }catch(e){toast('Like failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
function share(){
  const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Copy failed')); }
  else{ toast('Copy this URL: '+url); }
}
// 공유 드롭다운(Copy link + 소셜). 바깥 클릭 시 닫힘.
function toggleShareMenu(e){ if(e)e.stopPropagation(); const m=document.getElementById('shareMenu'); if(!m)return;
  if(m.hasAttribute('hidden')){ m.removeAttribute('hidden'); setTimeout(()=>document.addEventListener('click',closeShareMenu,{once:true}),0); } else closeShareMenu(); }
function closeShareMenu(){ const m=document.getElementById('shareMenu'); if(m)m.setAttribute('hidden',''); }
function shareOpen(net){ closeShareMenu(); const u=encodeURIComponent(location.href);
  const map={facebook:'https://www.facebook.com/sharer/sharer.php?u='+u, x:'https://twitter.com/intent/tweet?url='+u, reddit:'https://www.reddit.com/submit?url='+u};
  const href=map[net]; if(href)window.open(href,'_blank','noopener,noreferrer,width=620,height=560'); }
// 이미지 복사 — 클립보드에 이미지(png) 기록. 이미지 전용(릴 제외). Safari 대응: ClipboardItem에 blob 프라미스 전달(제스처 내 동기 생성).
async function copyImage(){
  if(!IT||IT.type==='video'){ toast('Only images can be copied'); return; }
  if(!(navigator.clipboard&&window.ClipboardItem&&navigator.clipboard.write)){ toast('Copy not supported — use Download'); return; }
  try{
    const png=(async()=>{ const blob=await(await fetch(IT.url)).blob();
      if(blob.type==='image/png')return blob;
      const bmp=await createImageBitmap(blob); const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
      c.getContext('2d').drawImage(bmp,0,0); return await new Promise(r=>c.toBlob(r,'image/png')); })();
    await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);
    toast('Image copied');
  }catch(e){ toast('Copy failed — try Download'); }
}
// creation 삭제 — 내 것만(백엔드도 403 게이트). 확인 후 DELETE, 성공 시 뒤로.
async function deleteCreation(){
  if(!IT||!IT.isOwn){ return; }
  if(!confirm('Delete this creation? This can’t be undone.'))return;
  try{
    const r=await fetch('/api/generate/creations/'+IDX,{method:'DELETE'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast('Deleted'); goBack();
  }catch(e){ toast('Delete failed: '+(e.message||e)); }
}
async function toggleFollow(){
  const btn=document.getElementById('followBtn'); if(!btn)return;
  const on=btn.classList.contains('on'); btn.disabled=true;
  const h=(IT.creatorHandle||'').replace(/^@/,'');
  try{
    const r=await fetch('/api/marketplace/creators/'+encodeURIComponent(h)+'/follow',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.following);
    btn.textContent=d.data.following?'Following':'+ Follow';
    IT.following=d.data.following; IT.followers=d.data.followers;
    const lbl=document.getElementById('followLbl');
    if(lbl)lbl.textContent=d.data.followers>0?`Creator · ${d.data.followers} follower${d.data.followers===1?'':'s'}`:'Creator';
  }catch(e){toast('Follow failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function toggleVis(){
  const btn=document.getElementById('visBtn'); if(!btn)return;
  const next=IT.visibility==='public'?'private':'public'; btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/visibility',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({visibility:next})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT.visibility=d.data.visibility;
    const pub=IT.visibility==='public';
    btn.innerHTML=pub?IC.globe:IC.lock;
    btn.classList.toggle('on',!pub);
    btn.title=pub?'Public — your creation and prompt show in the community. Click to make private.':'Private — only you can see it. Click to make public.';
    const hint=document.getElementById('visHint'); if(hint)hint.textContent=pub?'Public — your creation and prompt show in the community.':'Private — only you can see it.';
    toast(next==='private'&&!pub?'Private needs a paid plan — kept public':(pub?'Now public — shows in Explore':'Now private'));
  }catch(e){toast('Update failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function reportIt(){
  if(!confirm('Report this creation for review?'))return;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'inappropriate'})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast(d.data&&d.data.takenDown?'Reported — removed from feed':'Reported. Thank you.');
  }catch(e){toast('Report failed: '+(e.message||e));}
}

loadDetail();
loadStrip();
