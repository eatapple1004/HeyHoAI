<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Creation</title>
<script src="/js/flags.js" defer></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=5" />
<script src="/saas-auth.js" defer></script>
<style>
  html,body{height:100%}
  body{margin:0;overflow:hidden}
  .viewer{display:grid;grid-template-columns:88px minmax(0,1fr) 360px;height:100vh;position:relative;z-index:1}
  /* 좌: 필름스트립 (앞뒤 이미지 순서대로) */
  .strip{overflow-y:auto;overflow-x:hidden;padding:16px 12px;display:flex;flex-direction:column;gap:11px;border-right:1px solid var(--border);background:rgba(0,0,0,.18)}
  .strip::-webkit-scrollbar{width:6px}
  .strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .th{width:64px;height:64px;border-radius:13px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:#0c0c14;padding:0;transition:border-color .15s,transform .12s}
  .th:hover{transform:scale(1.04)}
  .th.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.25)}
  .th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
  /* 중앙: 스테이지 */
  .stageWrap{display:flex;align-items:center;justify-content:center;padding:34px;min-width:0;position:relative}
  .stage{position:relative;max-width:100%;max-height:calc(100vh - 68px);border-radius:16px;overflow:hidden;display:inline-flex;background:#0c0c14;border:1px solid var(--border)}
  .stage .media{display:block;max-width:100%;max-height:calc(100vh - 70px);object-fit:contain}
  .like{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1;transition:transform .12s,background .15s,border-color .15s;z-index:3}
  .like:hover{background:rgba(0,0,0,.72)}
  .like:active{transform:scale(.9)}
  .like .hrt{font-size:15px;line-height:1}
  .like.on{color:#ff5a7a;border-color:rgba(255,90,122,.55)}
  .vbadge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;z-index:3}
  .vclose{position:absolute;top:18px;right:380px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:rgba(20,20,30,.7);color:var(--dim);font-size:17px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .vclose:hover{color:#fff;border-color:var(--text)}
  /* 우: 패널 */
  .panel{overflow-y:auto;padding:30px 26px;border-left:1px solid var(--border);background:rgba(0,0,0,.12)}
  .date{color:var(--faint);font-size:12.5px;margin-bottom:12px}
  .creatorRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .creator{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
  .ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;font-family:'Sora';flex-shrink:0}
  .who{display:flex;flex-direction:column;gap:1px;min-width:0}
  .hnd{color:var(--text);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .creator:hover .hnd{color:var(--accent2)}
  .lbl{color:var(--faint);font-size:11.5px}
  .follow{flex-shrink:0;border:1px solid var(--accent);background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
  .follow:hover{filter:brightness(1.08)}
  .follow.on{background:transparent;color:var(--dim);border-color:var(--border2)}
  .follow.on:hover{color:#ff7eb6;border-color:#ff7eb6}
  .acts{display:flex;flex-direction:column;gap:10px}
  .act{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--text);transition:all .15s;text-decoration:none;box-sizing:border-box}
  .act:hover{border-color:var(--accent);color:#fff}
  .act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .act.primary:hover{filter:brightness(1.08)}
  .act.sm{padding:11px 14px;font-size:13.5px}
  .sep{height:1px;background:var(--border);margin:20px 0 14px}
  .ownhdr{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
  .report{margin-top:20px;background:none;border:none;color:var(--faint);font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px}
  .report:hover{color:#ff7eb6}
  .state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);text-align:center;flex-direction:column;gap:6px}
  .state b{color:var(--text);font-size:18px;font-family:'Sora'}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a27;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border2)}
  #toast.show{opacity:1}
  @media(max-width:820px){
    .viewer{grid-template-columns:1fr;height:auto;min-height:100vh}
    .strip{flex-direction:row;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
    .panel{border-left:none;border-top:1px solid var(--border)}
    .vclose{right:14px}
    body{overflow:auto}
    .stage .media,.stage{max-height:70vh}
  }
</style>
</head>
<body>
<button class="vclose" onclick="goBack()" title="Close">✕</button>
<div class="viewer">
  <div class="strip" id="strip"></div>
  <div class="stageWrap" id="stageWrap"><div class="state">Loading…</div></div>
  <aside class="panel" id="panel"></aside>
</div>
<div id="toast"></div>
<div id="saveModal" class="sv-ov">
  <div class="sv-box">
    <div class="sv-h">Add to My templates</div>
    <div class="sv-s">Adds this template to My templates so you can use it in Studio. Pick at least one theme to organize it.</div>
    <div class="sv-lbl">Themes <span style="text-transform:none;font-weight:500;color:var(--dim,#9aa)">(pick at least one)</span></div>
    <div class="sv-list" id="svThemes"></div>
    <div class="sv-row">
      <button type="button" class="sv-x" onclick="closeSaveModal()">Cancel</button>
      <button type="button" class="sv-go" id="svGo" onclick="confirmSave()">Add</button>
    </div>
  </div>
  <style>
    .sv-ov{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.62);align-items:center;justify-content:center;padding:20px}
    .sv-ov.open{display:flex}
    .sv-box{background:var(--bg2,#15151c);border:1px solid var(--border2,#2a2a35);border-radius:16px;max-width:440px;width:100%;max-height:84vh;overflow:auto;padding:22px}
    .sv-h{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;margin-bottom:4px}
    .sv-s{font-size:13px;color:var(--dim,#9aa);margin-bottom:16px;line-height:1.45}
    .sv-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim,#9aa);font-weight:700;margin:10px 0 6px}
    .sv-name{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border2,#2a2a35);color:var(--text,#fff);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;box-sizing:border-box;margin-bottom:2px}
    .sv-modes{display:flex;gap:8px;margin-bottom:6px}
    .sv-mode{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border2,#2a2a35);color:var(--text,#fff);border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
    .sv-mode.on{background:var(--accent,#7c6cff);border-color:var(--accent,#7c6cff);color:#fff}
    .sv-list{display:flex;flex-direction:column;gap:7px}
    .sv-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim,#9aa);font-weight:700;margin:6px 0 2px}
    .sv-th{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--border2,#2a2a35);color:var(--text,#fff);border-radius:10px;padding:10px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
    .sv-th.on{background:var(--accent,#7c6cff);border-color:var(--accent,#7c6cff);color:#fff}
    .sv-th:disabled,.sv-th.sv-dis{opacity:.38;cursor:not-allowed}
    .sv-new{border-style:dashed;color:var(--accent2,#a89bff)}
    .sv-row{display:flex;gap:8px;margin-top:16px}
    .sv-x{flex:1;background:none;border:1px solid var(--border2,#2a2a35);color:var(--dim,#9aa);border-radius:10px;padding:11px;font-size:13px;cursor:pointer;font-family:inherit}
    .sv-go{flex:2;background:var(--accent,#7c6cff);border:1px solid var(--accent,#7c6cff);color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
    .sv-go:disabled{opacity:.45;cursor:default}
  </style>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
// P4: creation 상세 [Add to My templates] — 생성 시 auto-mint된 내 템플릿(mintedTemplateId)을 owns에 추가 + 선택 테마 배치(새 민팅 X).
let SV={ picks:[], themes:null, hidden:null, mint:false };  // picks=[{kind,key}] 다중선택(테마는 선택) / mint=연결 템플릿 없는 내 creation을 온디맨드 민팅+추가
// mint=true(opts): 연결/민팅된 템플릿이 없는 내 Custom creation → confirm 시 온디맨드 민팅 후 선택 테마 배치. 아니면 이미 auto-mint된 mintedTemplateId를 owns에 추가.
async function openSaveModal(opts){
  SV.mint=!!(opts&&opts.mint);
  if(SV.mint){ if(!IT||!IT.isOwn||!IDX){ toast('No creation to add'); return; } }
  else if(!IT||!IT.mintedTemplateId){ toast('No template to add for this creation'); return; }
  document.getElementById('saveModal').classList.add('open');
  SV.picks=[];
  const g=document.getElementById('svGo'); if(g) g.disabled=true;  // 테마 필수: 선택 0개면 Add 비활성
  if(!SV.themes){
    let defs=[], customs=[];
    try{ defs=(await(await fetch('/api/marketplace/themes')).json()).data||[]; }catch(e){}
    try{ const d=(await(await fetch('/api/studio/themes')).json()).data||{}; customs=d.customThemes||[]; SV.hidden=new Set(d.hiddenThemes||[]); }catch(e){}
    SV.themes={ defs:defs.filter(t=>!(SV.hidden&&SV.hidden.has(t.slug))), customs };
  }
  renderSvThemes();
}
function svOn(kind,key){ return SV.picks.some(p=>p.kind===kind&&p.key===key); }
// 비겹침 대분류(확정 2026-06-26·스튜디오 CAT_THEMES와 동기화) — 각 테마는 한 섹션에만(중복0). general=Shopping(범용/중립 아님)·Influencer=People만·UGC 숨김. 커스텀 테마는 각자 대분류(group) 소속("Your themes" 중립 버킷 폐지).
const SV_GROUPS=[['Influencer',['people']],['Shopping',['beauty','fashion','jewelry','pet','food','coffee','home','tech','general']]];
// 대분류 상호배타: 한 템플릿은 한 대분류에만 → Influencer 테마와 Shopping 테마를 섞어 선택 불가. general은 Shopping 소속. 커스텀도 자기 group 소속(중립 아님).
const SV_GROUP_OF={}; SV_GROUPS.forEach(([label,slugs])=>slugs.forEach(s=>{ SV_GROUP_OF[s]=label; }));
function svCustomGroup(id){ const c=((SV.themes&&SV.themes.customs)||[]).find(x=>x.id===id); return (c&&c.group==='Influencer')?'Influencer':'Shopping'; }
function svPickGroup(p){ return p.kind==='custom'?svCustomGroup(p.key):SV_GROUP_OF[p.key]; }
function svActiveGroup(){ for(const p of SV.picks){ const g=svPickGroup(p); if(g) return g; } return null; }
function svThBtn(kind,key,label,dis){ return `<button type="button" class="sv-th${svOn(kind,key)?' on':''}${dis?' sv-dis':''}" data-kind="${kind}" data-key="${esc(key)}"${dis?' disabled':''} onclick="pickTheme(this)">${esc(label)}</button>`; }
function renderSvThemes(){
  const el=document.getElementById('svThemes'); const {defs,customs}=SV.themes;
  const bySlug={}; (defs||[]).forEach(t=>{ bySlug[t.slug]=t; });
  const active=svActiveGroup();
  let h='';
  for(const [label,slugs] of SV_GROUPS){
    if(label==='Influencer' && typeof featureOn==='function' && !featureOn('influencer')) continue; // (2026-07-01) Influencer 대분류 숨김
    const dis=!!active && label!==active;  // 반대 대분류 섹션 전체 비활성(이미 선택된 건 해제 가능하도록 제외)
    h+=`<div class="sv-sec">${label}</div>`;
    slugs.map(s=>bySlug[s]).filter(Boolean).forEach(t=>{ h+=svThBtn('default',t.slug,t.name, dis && !svOn('default',t.slug)); });
    (customs||[]).filter(c=>svCustomGroup(c.id)===label).forEach(t=>{ h+=svThBtn('custom',t.id,'✦ '+t.name, dis && !svOn('custom',t.id)); });
    h+=`<button type="button" class="sv-th sv-new${dis?' sv-dis':''}"${dis?' disabled':''} onclick="newThemeThenPick('${label}')">＋ New theme</button>`;
  }
  el.innerHTML=h;
}
// 다중선택: 클릭한 칩만 on/off, 나머지 유지(편집 플로우와 동일). 테마는 선택사항이라 버튼은 항상 활성.
function pickTheme(btn){ const kind=btn.dataset.kind, key=btn.dataset.key;
  if(svOn(kind,key)) SV.picks=SV.picks.filter(p=>!(p.kind===kind&&p.key===key));
  else SV.picks.push({kind,key});
  renderSvThemes(); refreshSvGo(); }   // 재렌더: 공유 테마(양쪽 섹션) on/off 동기화
function refreshSvGo(){ const g=document.getElementById('svGo'); if(g)g.disabled=!SV.picks.length; }  // 테마 ≥1개일 때만 Add 활성
async function newThemeThenPick(group){
  const name=prompt('New theme name'); if(!name||!name.trim())return;
  try{ const d=await(await fetch('/api/studio/themes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim(),group})})).json();
    if(d&&d.success&&d.data){ SV.themes.customs.push(d.data); SV.picks.push({kind:'custom',key:d.data.id}); renderSvThemes(); refreshSvGo(); }
  }catch(e){}
}
function closeSaveModal(){ document.getElementById('saveModal').classList.remove('open'); }
async function confirmSave(){
  if(!SV.picks.length){ toast('Pick at least one theme'); return; }  // 테마 필수
  const go=document.getElementById('svGo'); go.disabled=true; go.textContent='Adding…';
  try{
    // 1) 대상 템플릿 확보(owns 존재 보장).
    let tid;
    if(SV.mint){
      // 연결/민팅된 템플릿 없음 → 온디맨드 민팅+보유. skipDefaultTheme=true로 general 폴백 생략(아래서 선택 테마 직접 배치).
      const r=await fetch('/api/generate/creations/'+IDX+'/add-to-my-templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skipDefaultTheme:true})});
      const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
      tid=d.data.templateId;
    }else{
      if(!IT||!IT.mintedTemplateId){ toast('No template to add'); return; }
      tid=IT.mintedTemplateId;
      // auto-mint된 내 템플릿을 My templates에 추가(owns INSERT, 멱등)
      const ar=await fetch('/api/marketplace/templates/'+encodeURIComponent(tid)+'/add-to-my-templates',{method:'POST'});
      const ad=await ar.json(); if(!ar.ok||!ad.success)throw new Error(ad.error||'failed');
    }
    // 2) 선택한 테마에 배치(owns 생성 후라 ensureOwnedIfMine 통과). 커스텀=멤버십 / 기본=오버라이드 add.
    let placed=0;
    for(const p of SV.picks){
      try{
        if(p.kind==='custom'){ await fetch('/api/studio/themes/'+encodeURIComponent(p.key)+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemType:'template',itemId:tid})}); }
        else { await fetch('/api/studio/global-themes/'+encodeURIComponent(p.key)+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemType:'template',itemId:tid,action:'add'})}); }
        placed++;
      }catch(e){}
    }
    closeSaveModal();
    // mint 경로는 기존 mintAndAdd처럼 My templates(해당 템플릿 하이라이트)로 이동, 그 외는 상세에 머물며 재렌더.
    if(SV.mint){ location.href='/gallery?tpl='+encodeURIComponent(tid); return; }
    toast(placed?('Added to My templates · '+placed+' theme'+(placed>1?'s':'')+' ✦'):'Added to My templates ✦');
    IT.ownsTemplate=true; render();
  }catch(e){ toast('Could not add: '+(e.message||e)); }
  finally{ go.disabled=false; go.textContent='Add'; }
}
function goBack(){ if(history.length>1) history.back(); else location.href = FROM==='library' ? '/gallery' : '/explore'; }
function qs(k){return new URLSearchParams(location.search).get(k);}

const FROM=(qs('from')||'explore')==='library'?'library':'explore';
let IDX=parseInt(qs('idx'),10);
let IT=null;

// ── 필름스트립 (컨텍스트 피드의 앞뒤 이미지 순서대로) ──
async function loadStrip(){
  const el=document.getElementById('strip');
  try{
    let list=[];
    if(FROM==='library'){
      const d=(await(await fetch('/api/generate/results?limit=200')).json()).data||[];
      list=d.filter(r=>r.status==='success'&&r.file_path).map(r=>{const fn=r.file_path.split('/').pop();return {idx:r.idx,url:'/images/'+fn,type:/\.(mp4|webm|mov)$/i.test(fn)?'video':'image'};});
    }else{
      const d=(await(await fetch('/api/generate/community?limit=120')).json()).data||[];
      list=d.map(r=>({idx:r.idx,url:r.url,type:r.type}));
    }
    el.innerHTML=list.map(it=>`<button class="th ${it.idx===IDX?'on':''}" data-idx="${it.idx}" onclick="selectIdx(${it.idx})">${it.type==='video'?`<video src="${esc(it.url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(it.url)}" loading="lazy" alt="">`}</button>`).join('');
    scrollStripToCurrent();
  }catch(e){ el.innerHTML=''; }
}
function scrollStripToCurrent(){const cur=document.querySelector('.th.on');if(cur)cur.scrollIntoView({block:'center',behavior:'auto'});}
function markStrip(){document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.idx,10)===IDX));scrollStripToCurrent();}

// ── 상세 로드(리로드 없이 전환) ──
async function selectIdx(idx){ if(idx===IDX)return; IDX=idx; history.replaceState(null,'',`/creation?idx=${idx}&from=${FROM}`); markStrip(); await loadDetail(); }
async function loadDetail(){
  const sw=document.getElementById('stageWrap'),panel=document.getElementById('panel');
  if(!IDX){sw.innerHTML='<div class="state"><b>Invalid creation</b><span>No creation id.</span></div>';panel.innerHTML='';return;}
  try{
    const r=await fetch('/api/generate/creations/'+IDX);
    if(r.status===404){sw.innerHTML='<div class="state"><b>Not available</b><span>This creation is private or no longer available.</span></div>';panel.innerHTML='';return;}
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT=d.data; render();
  }catch(e){sw.innerHTML='<div class="state"><b>Couldn’t load</b><span>'+esc(e.message||e)+'</span></div>';panel.innerHTML='';}
}

// (제거·사용자 지시) 상세 1차 "Make your own"/"Use" 폐지 — Explore=발견+My templates 추가가 정본.
// 템플릿 버튼(relTemplate 기반): 보유=라이브러리에서 보기(내 auto면 Creator 관리) / 미보유=유료 Buy·무료 Add → 획득 후 My templates로 이동.
//   내 Custom auto 템플릿 미추가=테마 선택 모달(openSaveModal). relTemplate 없으면(연결 템플릿 없음) 버튼 없음.
function templateCta(){
  const rt=IT.relTemplate;
  // 연결 템플릿 없음 + 내 creation = 즉석 민팅+추가 폴백(γ·legacy·민팅실패·삭제 케이스 커버). 타인 것은 추가 대상 없음→버튼 없음.
  if(!rt) return IT.isOwn ? `<button class="act sm" onclick="mintAndAdd(this)">＋ Add to My templates</button>` : '';
  // 라이브러리(My templates)에서 보기 — 타인 생성물 상세의 동일 버튼과 동일 동작(?tpl 딥링크).
  const viewInLib=`<button class="act sm" onclick="location.href='/gallery?tpl='+encodeURIComponent('${esc(rt.id)}')">View template in my library</button>`;
  if(rt.owned){
    // 내 auto 템플릿(보유): 라이브러리에서 보기 + (위) Creator 관리 둘 다. 타인 보유: 라이브러리에서 보기만.
    if(IT.isOwn && IT.mintedTemplateId) return viewInLib+`<a class="act sm" href="/earnings">Manage template</a>`;
    return viewInLib;
  }
  if(IT.isOwn && IT.mintedTemplateId) return `<button class="act sm" onclick="openSaveModal()">＋ Add to My templates</button>`;
  // 유료(타인)=Buy / 그 외=Add. 내 템플릿엔 "Buy" 안 붙임.
  const label = (!rt.mine && rt.price>0) ? ('Buy '+(rt.name||'template')+' (◈'+rt.price+')') : '＋ Add to My templates';
  return `<button class="act sm" onclick="acquireRelTemplate()">${esc(label)}</button>`;
}
// relTemplate 없는 내 creation: 테마 피커 모달(mint 모드)을 열어 사용자가 테마 직접 선택 → confirm 시 즉석 민팅+보유+선택 테마 배치 후 My templates로 이동.
function mintAndAdd(btn){ openSaveModal({ mint:true }); }
// 출처/연결 템플릿을 My templates에 획득 후 그 위치(My templates)로 이동. 내 것=add-to-my-templates(owns INSERT)·타인=acquire 폴백.
async function acquireRelTemplate(){
  const rt=IT&&IT.relTemplate; if(!rt||!rt.id)return;
  const tid=encodeURIComponent(rt.id);
  try{
    let r=await fetch('/api/marketplace/templates/'+tid+'/add-to-my-templates',{method:'POST'});
    if(r.status===404) r=await fetch('/api/marketplace/templates/'+tid+'/acquire',{method:'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    location.href='/gallery?tpl='+tid;
  }catch(e){ toast('Could not add: '+(e.message||e)); }
}

function render(){
  const media=IT.type==='video'
    ? `<video class="media" src="${esc(IT.url)}" controls loop playsinline></video>`
    : `<img class="media" src="${esc(IT.url)}" alt="">`;
  const vbadge=IT.type==='video'?'<span class="vbadge">▶ Reel</span>':'';
  document.getElementById('stageWrap').innerHTML=`<div class="stage">${vbadge}
    <button class="like ${IT.liked?'on':''}" title="${IT.liked?'Liked':'Like'}" onclick="toggleLike(this)"><span class="hrt">${IT.liked?'♥':'♡'}</span><span class="lct">${IT.likes||0}</span></button>
    ${media}</div>`;

  const handle=IT.creatorHandle||'@creator';
  const letter=esc(handle.replace(/^@/,'').charAt(0).toUpperCase()||'C');
  const dateStr=IT.createdAt?new Date(IT.createdAt).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'';
  const fLbl=IT.followers>0?`Creator · ${IT.followers} follower${IT.followers===1?'':'s'}`:'Creator';
  const inner=`<div class="ava">${letter}</div><div class="who"><span class="hnd">${esc(handle)}</span><span class="lbl" id="followLbl">${fLbl}</span></div>`;
  const followBtn=(IT.creatorHandle && !IT.isOwn)
    ? `<button class="follow ${IT.following?'on':''}" id="followBtn" onclick="toggleFollow()">${IT.following?'Following':'+ Follow'}</button>` : '';
  const creator=IT.creatorHandle
    ? `<div class="creatorRow"><a class="creator" href="/creator?handle=${encodeURIComponent(handle.replace(/^@/,''))}">${inner}</a>${followBtn}</div>`
    : `<div class="creatorRow"><div class="creator">${inner}</div></div>`;

  let owner='';
  if(IT.isOwn){
    const isPub=IT.visibility==='public';
    // "Make a Reel" 숨김(2026-06-26·사용자 지시): 릴스 미디어 영속성 미확정 — 노출 보류. 재활성 시 아래 acts에 reel 링크 복원: ${IT.type!=='video'?`<a class="act sm" href="/gallery?reel=${IT.idx}">▶ Make a Reel</a>`:''}
    owner=`<div class="sep"></div><div class="ownhdr">Your creation</div><div class="acts">
      <button class="act sm" id="visBtn" onclick="toggleVis()">${isPub?'🌐 Public — make private':'🔒 Private — make public'}</button>
      <a class="act sm" href="${esc(IT.url)}" download>⬇ Download</a>
    </div>`;
  }
  const report=IT.isOwn?'':`<button class="report" onclick="reportIt()">⚐ Report this creation</button>`;

  document.getElementById('panel').innerHTML=`
    <div class="date">${esc(dateStr)}</div>
    ${creator}
    <div class="acts">${templateCta()}<button class="act sm" onclick="share()">↗ Share</button></div>
    ${owner}${report}`;
}

async function toggleLike(btn){
  const on=btn.classList.contains('on'); btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/like',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.liked);
    btn.querySelector('.hrt').textContent=d.data.liked?'♥':'♡';
    btn.querySelector('.lct').textContent=d.data.likes;
    btn.title=d.data.liked?'Liked':'Like'; IT.liked=d.data.liked; IT.likes=d.data.likes;
  }catch(e){toast('Like failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
function share(){
  const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Copy failed')); }
  else{ toast('Copy this URL: '+url); }
}
async function toggleFollow(){
  const btn=document.getElementById('followBtn'); if(!btn)return;
  const on=btn.classList.contains('on'); btn.disabled=true;
  const h=(IT.creatorHandle||'').replace(/^@/,'');
  try{
    const r=await fetch('/api/marketplace/creators/'+encodeURIComponent(h)+'/follow',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.following);
    btn.textContent=d.data.following?'Following':'+ Follow';
    IT.following=d.data.following; IT.followers=d.data.followers;
    const lbl=document.getElementById('followLbl');
    if(lbl)lbl.textContent=d.data.followers>0?`Creator · ${d.data.followers} follower${d.data.followers===1?'':'s'}`:'Creator';
  }catch(e){toast('Follow failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function toggleVis(){
  const btn=document.getElementById('visBtn'); if(!btn)return;
  const next=IT.visibility==='public'?'private':'public'; btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/visibility',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({visibility:next})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT.visibility=d.data.visibility;
    btn.textContent=IT.visibility==='public'?'🌐 Public — make private':'🔒 Private — make public';
    toast(IT.visibility==='public'?'Now public — shows in Explore':'Now private');
  }catch(e){toast('Update failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function reportIt(){
  if(!confirm('Report this creation for review?'))return;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'inappropriate'})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast(d.data&&d.data.takenDown?'Reported — removed from feed':'Reported. Thank you.');
  }catch(e){toast('Report failed: '+(e.message||e));}
}

loadDetail();
loadStrip();
</script>
