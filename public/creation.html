<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Creation</title>
<script src="/js/flags.js" defer></script>
<script src="/js/themes.js?v=7"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/js/i18n.js?v=9" defer></script>
<script src="/saas-auth.js?v=3" defer></script>
<style>
  /* ── Studio Tool look: immersive stage, slim filmstrip, calm action stack ── */
  :root{ --r-sm:10px; --r-md:12px; --r-lg:16px; --r-pill:999px; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
  svg{display:block}
  .ic{width:16px;height:16px;flex-shrink:0;color:var(--dim)}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--accent2);outline-offset:3px;border-radius:var(--r-sm)}

  .viewer{display:grid;grid-template-columns:88px minmax(0,1fr) 372px;height:100vh;position:relative;z-index:1}

  /* ── close (fixed, true top-right) ── */
  .vclose{position:fixed;top:20px;right:20px;z-index:40;width:38px;height:38px;border-radius:var(--r-pill);border:1px solid var(--border2);background:color-mix(in srgb,var(--bg2) 78%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;transition:color .16s,background .16s,border-color .16s}
  .vclose:hover{color:var(--text);background:var(--surface2)}
  .vclose .ic{width:16px;height:16px;color:inherit}

  /* ── filmstrip ── */
  .strip{position:relative;overflow-y:auto;overflow-x:hidden;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg2)}
  .strip::before{content:"";position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--border) 12%,var(--border) 88%,transparent)}
  .strip::-webkit-scrollbar{width:0}
  .th{width:62px;height:62px;border-radius:var(--r-md);overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:var(--bg);padding:0;position:relative;transition:transform .14s,border-color .15s,box-shadow .15s}
  .th:hover{transform:scale(1.05)}
  .th.on{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 24%,transparent)}
  .th img,.th video{width:100%;height:100%;object-fit:cover;display:block}

  /* ── stage (immersive, borderless, softly lit) ── */
  .stageWrap{position:relative;display:flex;align-items:center;justify-content:center;padding:48px;min-width:0;background:radial-gradient(120% 100% at 50% 38%,var(--bg2),var(--bg))}
  .stageWrap::before{content:"";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(620px,66%);height:min(620px,66%);pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 16%,transparent),transparent 72%);filter:blur(20px)}
  .stageWrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(92% 74% at 50% 42%,transparent 58%,rgba(0,0,0,.4))}
  .stage{position:relative;z-index:1;display:inline-flex;max-width:100%;max-height:calc(100vh - 96px);border-radius:var(--r-lg);overflow:hidden;background:var(--bg2);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 0 0 1px rgba(255,255,255,.05),0 30px 90px -24px rgba(0,0,0,.8),0 10px 34px -8px rgba(0,0,0,.5)}
  .stage .media{display:block;max-width:100%;max-height:calc(100vh - 96px);object-fit:contain}
  .stage::after{content:"";position:absolute;top:0;left:0;right:0;height:96px;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.32),transparent)}
  .like{position:absolute;top:14px;right:14px;z-index:3;display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;border-radius:var(--r-pill);padding:8px 13px;font-size:13px;font-weight:600;line-height:1;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums;transition:background .15s,transform .12s,border-color .15s}
  .like:hover{background:rgba(0,0,0,.72)}
  .like:active{transform:scale(.92)}
  .like .hrt{display:inline-flex;line-height:0}
  .like .ic{color:inherit}
  .like .hrt .ic{width:15px;height:15px}
  .like.on{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 55%,transparent)}
  .vbadge{position:absolute;top:14px;left:14px;z-index:3;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;padding:5px 10px;border-radius:var(--r-sm)}
  .vbadge .ic{width:11px;height:11px;color:#fff}

  /* ── panel ── */
  .panel{position:relative;overflow-y:auto;padding:26px 26px 30px;background:var(--bg2);display:flex;flex-direction:column}
  .panel>*{flex-shrink:0}  /* 내용이 길면 카드가 쭈그러들지 말고(→.tpl-sub 짤림) 패널이 스크롤. .report의 margin-top:auto는 유지 */
  .panel::before{content:"";position:absolute;top:0;left:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--border) 8%,var(--border) 92%,transparent)}
  .panel::-webkit-scrollbar{width:7px}
  .panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
  .panel::-webkit-scrollbar-track{background:transparent}

  .date{color:var(--faint);font-size:12px;font-weight:500;letter-spacing:.2px;margin-bottom:16px}
  .eyebrow{display:block;font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}

  /* creator */
  .creatorRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
  .creator{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
  .ava{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:linear-gradient(140deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:18px}
  .who{display:flex;flex-direction:column;gap:2px;min-width:0}
  .hnd{color:var(--text);font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .creator:hover .hnd{color:var(--accent2)}
  .sub{color:var(--faint);font-size:12px;font-weight:500}
  .follow{flex-shrink:0;border:1px solid var(--accent);background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:var(--r-pill);cursor:pointer;transition:all .15s}
  .follow:hover{filter:brightness(1.1)}
  .follow.on{background:transparent;color:var(--dim);border-color:var(--border2)}
  .follow.on:hover{color:var(--pink);border-color:var(--pink)}

  /* Made with — premium template module */
  .tpl{position:relative;margin-bottom:22px;background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),var(--surface2);border:1px solid var(--border2);border-radius:var(--r-lg);overflow:hidden;padding:18px}
  .tpl-head{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .tpl-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .tpl-name{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:var(--text);margin:0;line-height:1.15;letter-spacing:-.2px}
  .tpl-price{display:inline-flex;align-items:center;gap:5px;font-family:'Sora',sans-serif;font-weight:700;color:var(--text);font-size:15px;white-space:nowrap}
  .tpl-price .ic{width:14px;height:14px;color:var(--accent2)}
  .tpl-thumb{position:relative;width:100%;aspect-ratio:4/5;border-radius:var(--r-md);overflow:hidden;margin-bottom:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);background:var(--surface)}
  .tpl-thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .tpl-actions{display:flex;flex-direction:column;gap:8px}
  .tpl-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:var(--r-md);background:var(--accent);border:1px solid var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.1px;cursor:pointer;transition:filter .15s,box-shadow .15s;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
  .tpl-cta:hover{filter:brightness(1.1);box-shadow:0 8px 22px -6px color-mix(in srgb,var(--accent) 85%,transparent)}
  .tpl-cta .ic{color:#fff}
  .tpl-view{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:38px;border-radius:var(--r-md);background:transparent;border:1px solid var(--border);color:var(--dim);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:color .15s,border-color .15s}
  .tpl-view:hover{color:var(--text);border-color:var(--border2)}
  .tpl-view:hover .ic{color:var(--text)}
  .tpl-view .ic{width:14px;height:14px}
  .tpl-sub{font-size:12px;font-weight:400;line-height:1.5;color:var(--dim);text-align:center;margin:14px 0 0}

  /* Made with — no longer available (weak) */
  .tpl.gone{display:flex;align-items:center;flex-wrap:wrap;gap:7px;background:var(--surface);border:1px solid var(--border);padding:14px 16px}
  .tpl.gone .eyebrow{color:var(--faint)}
  .gone-name{font-weight:600;color:var(--dim);text-decoration:line-through;font-size:14px}
  .gone-note{font-size:12px;color:var(--faint)}

  /* Custom / Ad Video origin chip */
  .badge-chip{display:inline-flex;align-items:center;align-self:flex-start;gap:8px;margin-bottom:22px;padding:10px 15px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);color:var(--dim);font-size:13px;font-weight:600}
  .badge-chip .ic{color:var(--accent2)}

  /* Prompt module (Custom only) */
  .prompt{margin-bottom:22px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
  .prompt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .prompt-copy{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);color:var(--dim);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:5px 11px;border-radius:var(--r-pill);transition:color .15s,border-color .15s}
  .prompt-copy:hover{color:var(--text);border-color:var(--border2)}
  .prompt-copy .ic{width:14px;height:14px}
  .prompt-text{font-size:13.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:150px;overflow-y:auto;padding-right:6px}

  /* action stack — calm, identical rows */
  .acts{display:flex;flex-direction:column;gap:10px}
  .act{display:flex;align-items:center;gap:11px;width:100%;height:46px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s;text-decoration:none}
  .act:hover{border-color:var(--border2);background:var(--surface2)}
  .act .ic{color:var(--dim)}
  .act:hover .ic{color:var(--text)}

  /* owner section */
  .sep{height:1px;background:var(--border);margin:24px 0}
  .ownhdr{margin-bottom:12px}
  .own-hint{font-size:12px;font-weight:400;line-height:1.5;color:var(--faint);margin:10px 2px 0}

  /* tertiary — report */
  .report{display:inline-flex;align-items:center;gap:8px;margin-top:auto;align-self:flex-start;padding:10px 2px;background:transparent;border:0;cursor:pointer;color:var(--faint);font-family:inherit;font-size:12px;font-weight:500;transition:color .15s}
  .report .ic{width:15px;height:15px;color:inherit}
  .report:hover{color:var(--pink)}

  /* loading / error */
  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);text-align:center}
  .state b{color:var(--text);font-size:18px;font-family:'Sora'}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border2)}
  #toast.show{opacity:1}

  @media(max-width:820px){
    body{overflow:auto}
    .viewer{grid-template-columns:1fr;height:auto;min-height:100vh}
    .strip{flex-direction:row;padding:14px 16px;gap:10px;overflow-x:auto;overflow-y:hidden}
    .strip::before{display:none}
    .stageWrap{padding:28px 16px 20px}
    .stage,.stage .media{max-height:70vh}
    .panel{padding:24px 18px 44px}
    .panel::before{display:none}
    .vclose{top:14px;right:14px}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .th:hover,.like:active{transform:none}
  }
</style>
</head>
<body>
<button class="vclose" onclick="goBack()" aria-label="Close" title="Close">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
</button>
<div class="viewer">
  <div class="strip" id="strip"></div>
  <div class="stageWrap" id="stageWrap"><div class="state">Loading…</div></div>
  <aside class="panel" id="panel"></aside>
</div>
<div id="toast"></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function goBack(){ if(history.length>1) history.back(); else location.href = FROM==='library' ? '/gallery' : '/explore'; }
function qs(k){return new URLSearchParams(location.search).get(k);}

const FROM=(qs('from')||'explore')==='library'?'library':'explore';
let IDX=parseInt(qs('idx'),10);
let IT=null;

// ── 필름스트립 (컨텍스트 피드의 앞뒤 이미지 순서대로) ──
async function loadStrip(){
  const el=document.getElementById('strip');
  try{
    let list=[];
    if(FROM==='library'){
      const d=(await(await fetch('/api/generate/results?limit=200')).json()).data||[];
      list=d.filter(r=>r.status==='success'&&r.file_path).map(r=>{const fn=r.file_path.split('/').pop();return {idx:r.idx,url:'/images/'+fn,type:/\.(mp4|webm|mov)$/i.test(fn)?'video':'image'};});
    }else{
      const d=(await(await fetch('/api/generate/community?limit=120')).json()).data||[];
      list=d.map(r=>({idx:r.idx,url:r.url,type:r.type}));
    }
    el.innerHTML=list.map(it=>`<button class="th ${it.idx===IDX?'on':''}" data-idx="${it.idx}" onclick="selectIdx(${it.idx})">${it.type==='video'?`<video src="${esc(it.url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(it.url)}" loading="lazy" alt="">`}</button>`).join('');
    scrollStripToCurrent();
  }catch(e){ el.innerHTML=''; }
}
function scrollStripToCurrent(){const cur=document.querySelector('.th.on');if(cur)cur.scrollIntoView({block:'center',behavior:'auto'});}
function markStrip(){document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.idx,10)===IDX));scrollStripToCurrent();}

// ── 상세 로드(리로드 없이 전환) ──
async function selectIdx(idx){ if(idx===IDX)return; IDX=idx; history.replaceState(null,'',`/creation?idx=${idx}&from=${FROM}`); markStrip(); await loadDetail(); }
async function loadDetail(){
  const sw=document.getElementById('stageWrap'),panel=document.getElementById('panel');
  if(!IDX){sw.innerHTML='<div class="state"><b>Invalid creation</b><span>No creation id.</span></div>';panel.innerHTML='';return;}
  try{
    const r=await fetch('/api/generate/creations/'+IDX);
    if(r.status===404){sw.innerHTML='<div class="state"><b>Not available</b><span>This creation is private or no longer available.</span></div>';panel.innerHTML='';return;}
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT=d.data; render();
  }catch(e){sw.innerHTML='<div class="state"><b>Couldn’t load</b><span>'+esc(e.message||e)+'</span></div>';panel.innerHTML='';}
}

// (2026-07-04) 일괄 템플릿 카드 — 템플릿으로 만든 결과물이면 보유·미보유 무관 동일 외형(premium "Made with" 모듈 + primary "Use [name]").
//   동작만 분기: 보유(공식/구매/내 것)=Studio로 바로 사용 / 미보유 타인=획득 후 Studio / 미보유 내 minted=테마선택 모달 / 삭제·미접근=정보만(내 것이면 재추가) / Custom=✎ 배지.
//   가격(◈)은 "미보유 유료 타인 템플릿"에만 노출. 롤백: 이 함수 + sellCard + render의 ${templateCard()} 제거.
function sellCard(name, price, id, thumb, ctaHtml, extraHtml){
  const priceTag = (price!=null) ? `<span class="tpl-price">${IC.credit}${price}</span>` : '';
  const img = thumb ? `<div class="tpl-thumb"><img src="${esc(thumb)}" alt="" loading="lazy"></div>` : '';
  const view = id ? `<button class="tpl-view" onclick="location.href='/template?id='+encodeURIComponent('${esc(id)}')">${IC.eye}View ${name}</button>` : '';
  return `<section class="tpl" aria-label="Template used">
    <div class="tpl-head"><span class="eyebrow">Made with</span><div class="tpl-name-row"><h2 class="tpl-name">${name}</h2>${priceTag}</div></div>
    ${img}
    <div class="tpl-actions">${ctaHtml}${view}${extraHtml||''}</div>
    <p class="tpl-sub">Recreate this exact style with your own photo</p>
  </section>`;
}
// 패널 아이콘(카드 툴과 동일 톤의 클린 라인 SVG)
const IC={
  dl:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  share:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>',
  globe:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>',
  lock:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  flag:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>',
  copy:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  pencil:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  adv:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9.2l5 2.8-5 2.8z"/></svg>',
  eye:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
  arrow:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  play:'<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  heart:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S3.5 15 3.5 8.9A4.4 4.4 0 0 1 12 6.9a4.4 4.4 0 0 1 8.5 2c0 6.1-8.5 11.6-8.5 11.6Z"/></svg>',
  heartFull:'<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 20.5S3.5 15 3.5 8.9A4.4 4.4 0 0 1 12 6.9a4.4 4.4 0 0 1 8.5 2c0 6.1-8.5 11.6-8.5 11.6Z"/></svg>',
  credit:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l3.2 5.8L21 12l-5.8 3.2L12 21l-3.2-5.8L3 12l5.8-3.2z"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'
};
function isUgc(){ return /^ugc/i.test(String((IT&&IT.model)||'')); } // Ad Video(UGC) 판별
function templateCard(){
  if(isUgc()) return `<div class="badge-chip">${IC.adv}<span>Ad Video</span></div>`;              // Ad Video는 별도 표기(프롬프트=제목—캡션 숨김)
  if(!IT.templateSource) return `<div class="badge-chip">${IC.pencil}<span>Custom</span></div>`;    // 프롬프트만(템플릿 미사용)
  const rt=IT.relTemplate;
  const name=esc((rt&&rt.name)||IT.templateName||'Template');
  const gone=!(rt&&rt.id);   // 살아있는 템플릿 없음 = 삭제/미접근
  // 삭제·미접근: 정보만(약한 카드). 내 creation이면 즉석 민팅+추가 폴백.
  if(gone){
    const add = ''; // (2026-07-11) ＋ Add to My templates 제거(오피셜 전용)
    return `<div class="tpl gone"><span class="eyebrow">Made with</span><span class="gone-name">${name}</span><span class="gone-note">no longer available</span>${add}</div>`;
  }
  const thumb=(rt&&rt.thumb)||null;
  // 보유(공식/구매/내 것): 일괄 강조 카드 — Studio로 바로 사용(가격 없음). 내 auto면 Creator 관리 보조 버튼.
  if(rt.owned){
    const use=`<button class="tpl-cta" onclick="location.href='/studio?tpl='+encodeURIComponent('${esc(rt.id)}')">${IC.arrow}Use ${name}</button>`;
    const manage=''; // (2026-07-11) Manage template(→earnings/Creator) 제거(미운영)
    return sellCard(name, null, rt.id, thumb, use, manage);
  }
  // 미보유 + 내 minted(본인 creation): 테마 선택 후 추가. primary=Add to My templates(→acquireRelTemplate가 add-to-my-templates 후 Studio).
  if(IT.isOwn && IT.mintedTemplateId){
    return sellCard(name, null, rt.id, thumb, `<button class="tpl-cta" onclick="acquireRelTemplate()">${IC.arrow}Add to My templates</button>`);
  }
  // 미보유 타인 템플릿: 유료=가격 노출 / 무료=가격 없음. 둘 다 "Use [name]"(획득 후 Studio).
  const paid=(!rt.mine && rt.price>0);
  return sellCard(name, paid?rt.price:null, rt.id, thumb, `<button class="tpl-cta" onclick="acquireRelTemplate()">${IC.arrow}Use ${name}</button>`);
}
// Custom(자작 프롬프트) creation만 사용 프롬프트 공개 — 템플릿 프롬프트는 블랙박스라 노출 안 함.
function promptPanel(){
  if(IT.templateSource || isUgc() || !IT.prompt) return '';   // 템플릿=블랙박스 / Ad Video=제목—캡션이라 숨김 / Custom만 노출
  return `<div class="prompt"><div class="prompt-head"><span class="eyebrow">Prompt</span>
    <button class="prompt-copy" onclick="copyPrompt(this)">${IC.copy}<span>Copy</span></button></div>
    <div class="prompt-text">${esc(IT.prompt)}</div></div>`;
}
function copyPrompt(btn){
  navigator.clipboard.writeText(IT.prompt||'').then(()=>{ const o=btn.innerHTML; btn.innerHTML=IC.check+'<span>Copied</span>'; setTimeout(()=>btn.innerHTML=o,1400); }).catch(()=>toast('Copy failed'));
}
// 출처/연결 템플릿을 My templates에 획득 후 그 위치(My templates)로 이동. 내 것=add-to-my-templates(owns INSERT)·타인=acquire 폴백.
async function acquireRelTemplate(){
  const rt=IT&&IT.relTemplate; if(!rt||!rt.id)return;
  const tid=encodeURIComponent(rt.id);
  try{
    let r=await fetch('/api/marketplace/templates/'+tid+'/add-to-my-templates',{method:'POST'});
    if(r.status===404) r=await fetch('/api/marketplace/templates/'+tid+'/acquire',{method:'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    location.href='/studio?tpl='+tid;
  }catch(e){ toast('Could not add: '+(e.message||e)); }
}

function render(){
  const media=IT.type==='video'
    ? `<video class="media" src="${esc(IT.url)}" controls loop playsinline></video>`
    : `<img class="media" src="${esc(IT.url)}" alt="">`;
  const vbadge=IT.type==='video'?`<span class="vbadge">${IC.play}Reel</span>`:'';
  document.getElementById('stageWrap').innerHTML=`<div class="stage">${vbadge}
    <button class="like ${IT.liked?'on':''}" title="${IT.liked?'Liked':'Like'}" onclick="toggleLike(this)"><span class="hrt">${IT.liked?IC.heartFull:IC.heart}</span><span class="lct">${IT.likes||0}</span></button>
    ${media}</div>`;

  const handle=IT.creatorHandle||'@creator';
  const letter=esc(handle.replace(/^@/,'').charAt(0).toUpperCase()||'C');
  const dateStr=IT.createdAt?new Date(IT.createdAt).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'';
  const fLbl=IT.followers>0?`Creator · ${IT.followers} follower${IT.followers===1?'':'s'}`:'Creator';
  const inner=`<div class="ava">${letter}</div><div class="who"><span class="hnd">${esc(handle)}</span><span class="sub" id="followLbl">${fLbl}</span></div>`;
  const followBtn=(IT.creatorHandle && !IT.isOwn)
    ? `<button class="follow ${IT.following?'on':''}" id="followBtn" onclick="toggleFollow()">${IT.following?'Following':'+ Follow'}</button>` : '';
  const creator=IT.creatorHandle
    ? `<div class="creatorRow"><a class="creator" href="/creator?handle=${encodeURIComponent(handle.replace(/^@/,''))}">${inner}</a>${followBtn}</div>`
    : `<div class="creatorRow"><div class="creator">${inner}</div></div>`;

  let owner='';
  if(IT.isOwn){
    const isPub=IT.visibility==='public';
    // 소유자 전용 = 공개/비공개 토글 + 안내(공개면 프롬프트도 공개된다는 점 명시). Download는 공용(아래)으로 이동(누구나).
    owner=`<div class="sep"></div><div class="ownhdr eyebrow">Your creation</div><div class="acts">
      <button class="act" id="visBtn" onclick="toggleVis()">${isPub?IC.globe+' Public — make private':IC.lock+' Private — make public'}</button>
    </div>
    <div class="own-hint" id="visHint">${isPub?'Public — your creation and prompt show in the community.':'Private — only you can see it.'}</div>`;
  }
  const report=IT.isOwn?'':`<button class="report" onclick="reportIt()">${IC.flag} Report this creation</button>`;

  document.getElementById('panel').innerHTML=`
    <div class="date">${esc(dateStr)}</div>
    ${creator}
    ${templateCard()}
    ${promptPanel()}
    <div class="acts">
      <button class="act" onclick="share()">${IC.share} Share</button>
      <a class="act" href="${esc(IT.url)}" download>${IC.dl} Download</a>
    </div>
    ${owner}${report}`;
}

async function toggleLike(btn){
  const on=btn.classList.contains('on'); btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/like',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.liked);
    btn.querySelector('.hrt').innerHTML=d.data.liked?IC.heartFull:IC.heart;
    btn.querySelector('.lct').textContent=d.data.likes;
    btn.title=d.data.liked?'Liked':'Like'; IT.liked=d.data.liked; IT.likes=d.data.likes;
  }catch(e){toast('Like failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
function share(){
  const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Copy failed')); }
  else{ toast('Copy this URL: '+url); }
}
async function toggleFollow(){
  const btn=document.getElementById('followBtn'); if(!btn)return;
  const on=btn.classList.contains('on'); btn.disabled=true;
  const h=(IT.creatorHandle||'').replace(/^@/,'');
  try{
    const r=await fetch('/api/marketplace/creators/'+encodeURIComponent(h)+'/follow',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.following);
    btn.textContent=d.data.following?'Following':'+ Follow';
    IT.following=d.data.following; IT.followers=d.data.followers;
    const lbl=document.getElementById('followLbl');
    if(lbl)lbl.textContent=d.data.followers>0?`Creator · ${d.data.followers} follower${d.data.followers===1?'':'s'}`:'Creator';
  }catch(e){toast('Follow failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function toggleVis(){
  const btn=document.getElementById('visBtn'); if(!btn)return;
  const next=IT.visibility==='public'?'private':'public'; btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/visibility',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({visibility:next})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT.visibility=d.data.visibility;
    const pub=IT.visibility==='public';
    btn.innerHTML=pub?IC.globe+' Public — make private':IC.lock+' Private — make public';
    const hint=document.getElementById('visHint'); if(hint)hint.textContent=pub?'Public — your creation and prompt show in the community.':'Private — only you can see it.';
    toast(next==='private'&&!pub?'Private needs a paid plan — kept public':(pub?'Now public — shows in Explore':'Now private'));
  }catch(e){toast('Update failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function reportIt(){
  if(!confirm('Report this creation for review?'))return;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'inappropriate'})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast(d.data&&d.data.takenDown?'Reported — removed from feed':'Reported. Thank you.');
  }catch(e){toast('Report failed: '+(e.message||e));}
}

loadDetail();
loadStrip();
</script>
</body>
</html>
