<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Creation</title>
<script src="/js/flags.js" defer></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=4" />
<script src="/saas-auth.js" defer></script>
<style>
  html,body{height:100%}
  body{margin:0;overflow:hidden}
  .viewer{display:grid;grid-template-columns:88px minmax(0,1fr) 360px;height:100vh;position:relative;z-index:1}
  /* 좌: 필름스트립 (앞뒤 이미지 순서대로) */
  .strip{overflow-y:auto;overflow-x:hidden;padding:16px 12px;display:flex;flex-direction:column;gap:11px;border-right:1px solid var(--border);background:rgba(0,0,0,.18)}
  .strip::-webkit-scrollbar{width:6px}
  .strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  .th{width:64px;height:64px;border-radius:13px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:#0c0c14;padding:0;transition:border-color .15s,transform .12s}
  .th:hover{transform:scale(1.04)}
  .th.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.25)}
  .th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
  /* 중앙: 스테이지 */
  .stageWrap{display:flex;align-items:center;justify-content:center;padding:34px;min-width:0;position:relative}
  .stage{position:relative;max-width:100%;max-height:calc(100vh - 68px);border-radius:16px;overflow:hidden;display:inline-flex;background:#0c0c14;border:1px solid var(--border)}
  .stage .media{display:block;max-width:100%;max-height:calc(100vh - 70px);object-fit:contain}
  .like{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1;transition:transform .12s,background .15s,border-color .15s;z-index:3}
  .like:hover{background:rgba(0,0,0,.72)}
  .like:active{transform:scale(.9)}
  .like .hrt{font-size:15px;line-height:1}
  .like.on{color:#ff5a7a;border-color:rgba(255,90,122,.55)}
  .vbadge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;z-index:3}
  .vclose{position:absolute;top:18px;right:380px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:rgba(20,20,30,.7);color:var(--dim);font-size:17px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .vclose:hover{color:#fff;border-color:var(--text)}
  /* 우: 패널 */
  .panel{overflow-y:auto;padding:30px 26px;border-left:1px solid var(--border);background:rgba(0,0,0,.12)}
  .date{color:var(--faint);font-size:12.5px;margin-bottom:12px}
  .creatorRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .creator{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
  .ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;font-family:'Sora';flex-shrink:0}
  .who{display:flex;flex-direction:column;gap:1px;min-width:0}
  .hnd{color:var(--text);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .creator:hover .hnd{color:var(--accent2)}
  .lbl{color:var(--faint);font-size:11.5px}
  .follow{flex-shrink:0;border:1px solid var(--accent);background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
  .follow:hover{filter:brightness(1.08)}
  .follow.on{background:transparent;color:var(--dim);border-color:var(--border2)}
  .follow.on:hover{color:#ff7eb6;border-color:#ff7eb6}
  .acts{display:flex;flex-direction:column;gap:10px}
  .act{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--text);transition:all .15s;text-decoration:none;box-sizing:border-box}
  .act:hover{border-color:var(--accent);color:#fff}
  .act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .act.primary:hover{filter:brightness(1.08)}
  .act.sm{padding:11px 14px;font-size:13.5px}
  .sep{height:1px;background:var(--border);margin:20px 0 14px}
  .ownhdr{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
  .report{margin-top:20px;background:none;border:none;color:var(--faint);font-size:12.5px;cursor:pointer;font-family:inherit;padding:4px}
  .report:hover{color:#ff7eb6}
  .state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);text-align:center;flex-direction:column;gap:6px}
  .state b{color:var(--text);font-size:18px;font-family:'Sora'}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a27;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border2)}
  #toast.show{opacity:1}
  @media(max-width:820px){
    .viewer{grid-template-columns:1fr;height:auto;min-height:100vh}
    .strip{flex-direction:row;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
    .panel{border-left:none;border-top:1px solid var(--border)}
    .vclose{right:14px}
    body{overflow:auto}
    .stage .media,.stage{max-height:70vh}
  }
</style>
</head>
<body>
<button class="vclose" onclick="goBack()" title="Close">✕</button>
<div class="viewer">
  <div class="strip" id="strip"></div>
  <div class="stageWrap" id="stageWrap"><div class="state">Loading…</div></div>
  <aside class="panel" id="panel"></aside>
</div>
<div id="toast"></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function goBack(){ if(history.length>1) history.back(); else location.href = FROM==='library' ? '/gallery' : '/explore'; }
function qs(k){return new URLSearchParams(location.search).get(k);}

const FROM=(qs('from')||'explore')==='library'?'library':'explore';
let IDX=parseInt(qs('idx'),10);
let IT=null;

// ── 필름스트립 (컨텍스트 피드의 앞뒤 이미지 순서대로) ──
async function loadStrip(){
  const el=document.getElementById('strip');
  try{
    let list=[];
    if(FROM==='library'){
      const d=(await(await fetch('/api/generate/results?limit=200')).json()).data||[];
      list=d.filter(r=>r.status==='success'&&r.file_path).map(r=>{const fn=r.file_path.split('/').pop();return {idx:r.idx,url:'/images/'+fn,type:/\.(mp4|webm|mov)$/i.test(fn)?'video':'image'};});
    }else{
      const d=(await(await fetch('/api/generate/community?limit=120')).json()).data||[];
      list=d.map(r=>({idx:r.idx,url:r.url,type:r.type}));
    }
    el.innerHTML=list.map(it=>`<button class="th ${it.idx===IDX?'on':''}" data-idx="${it.idx}" onclick="selectIdx(${it.idx})">${it.type==='video'?`<video src="${esc(it.url)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(it.url)}" loading="lazy" alt="">`}</button>`).join('');
    scrollStripToCurrent();
  }catch(e){ el.innerHTML=''; }
}
function scrollStripToCurrent(){const cur=document.querySelector('.th.on');if(cur)cur.scrollIntoView({block:'center',behavior:'auto'});}
function markStrip(){document.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.idx,10)===IDX));scrollStripToCurrent();}

// ── 상세 로드(리로드 없이 전환) ──
async function selectIdx(idx){ if(idx===IDX)return; IDX=idx; history.replaceState(null,'',`/creation?idx=${idx}&from=${FROM}`); markStrip(); await loadDetail(); }
async function loadDetail(){
  const sw=document.getElementById('stageWrap'),panel=document.getElementById('panel');
  if(!IDX){sw.innerHTML='<div class="state"><b>Invalid creation</b><span>No creation id.</span></div>';panel.innerHTML='';return;}
  try{
    const r=await fetch('/api/generate/creations/'+IDX);
    if(r.status===404){sw.innerHTML='<div class="state"><b>Not available</b><span>This creation is private or no longer available.</span></div>';panel.innerHTML='';return;}
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT=d.data; render();
  }catch(e){sw.innerHTML='<div class="state"><b>Couldn’t load</b><span>'+esc(e.message||e)+'</span></div>';panel.innerHTML='';}
}

function useCta(){
  if(IT.templateSource==='marketplace' && IT.templateId)
    return `<a class="act primary" href="/template?id=${encodeURIComponent(IT.templateId)}">🔓 Get ${esc(IT.templateName||'this template')}</a>`;
  if(IT.templateSource==='recipe' && IT.templateId)
    return `<a class="act primary" href="/studio?recipe=${encodeURIComponent(IT.templateId)}">✨ Use ${esc(IT.templateName||'this template')}</a>`;
  return `<a class="act primary" href="/studio?fromCreation=${IT.idx}">✨ Make your own</a>`;
}

function render(){
  const media=IT.type==='video'
    ? `<video class="media" src="${esc(IT.url)}" controls loop playsinline></video>`
    : `<img class="media" src="${esc(IT.url)}" alt="">`;
  const vbadge=IT.type==='video'?'<span class="vbadge">▶ Reel</span>':'';
  document.getElementById('stageWrap').innerHTML=`<div class="stage">${vbadge}
    <button class="like ${IT.liked?'on':''}" title="${IT.liked?'Liked':'Like'}" onclick="toggleLike(this)"><span class="hrt">${IT.liked?'♥':'♡'}</span><span class="lct">${IT.likes||0}</span></button>
    ${media}</div>`;

  const handle=IT.creatorHandle||'@creator';
  const letter=esc(handle.replace(/^@/,'').charAt(0).toUpperCase()||'C');
  const dateStr=IT.createdAt?new Date(IT.createdAt).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'';
  const fLbl=IT.followers>0?`Creator · ${IT.followers} follower${IT.followers===1?'':'s'}`:'Creator';
  const inner=`<div class="ava">${letter}</div><div class="who"><span class="hnd">${esc(handle)}</span><span class="lbl" id="followLbl">${fLbl}</span></div>`;
  const followBtn=(IT.creatorHandle && !IT.isOwn)
    ? `<button class="follow ${IT.following?'on':''}" id="followBtn" onclick="toggleFollow()">${IT.following?'Following':'+ Follow'}</button>` : '';
  const creator=IT.creatorHandle
    ? `<div class="creatorRow"><a class="creator" href="/creator?handle=${encodeURIComponent(handle.replace(/^@/,''))}">${inner}</a>${followBtn}</div>`
    : `<div class="creatorRow"><div class="creator">${inner}</div></div>`;

  let owner='';
  if(IT.isOwn){
    const isPub=IT.visibility==='public';
    const canSave=!IT.templateSource;
    owner=`<div class="sep"></div><div class="ownhdr">Your creation</div><div class="acts">
      ${canSave?`<a class="act sm" href="/gallery?save=${IT.idx}">✦ Save as template</a>`:''}
      ${IT.type!=='video'?`<a class="act sm" href="/gallery?reel=${IT.idx}">▶ Make a Reel</a>`:''}
      <button class="act sm" id="visBtn" onclick="toggleVis()">${isPub?'🌐 Public — make private':'🔒 Private — make public'}</button>
      <a class="act sm" href="${esc(IT.url)}" download>⬇ Download</a>
    </div>`;
  }
  const report=IT.isOwn?'':`<button class="report" onclick="reportIt()">⚐ Report this creation</button>`;

  document.getElementById('panel').innerHTML=`
    <div class="date">${esc(dateStr)}</div>
    ${creator}
    <div class="acts">${IT.isOwn?'':useCta()}<button class="act sm" onclick="share()">↗ Share</button></div>
    ${owner}${report}`;
}

async function toggleLike(btn){
  const on=btn.classList.contains('on'); btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/like',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.liked);
    btn.querySelector('.hrt').textContent=d.data.liked?'♥':'♡';
    btn.querySelector('.lct').textContent=d.data.likes;
    btn.title=d.data.liked?'Liked':'Like'; IT.liked=d.data.liked; IT.likes=d.data.likes;
  }catch(e){toast('Like failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
function share(){
  const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Copy failed')); }
  else{ toast('Copy this URL: '+url); }
}
async function toggleFollow(){
  const btn=document.getElementById('followBtn'); if(!btn)return;
  const on=btn.classList.contains('on'); btn.disabled=true;
  const h=(IT.creatorHandle||'').replace(/^@/,'');
  try{
    const r=await fetch('/api/marketplace/creators/'+encodeURIComponent(h)+'/follow',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',d.data.following);
    btn.textContent=d.data.following?'Following':'+ Follow';
    IT.following=d.data.following; IT.followers=d.data.followers;
    const lbl=document.getElementById('followLbl');
    if(lbl)lbl.textContent=d.data.followers>0?`Creator · ${d.data.followers} follower${d.data.followers===1?'':'s'}`:'Creator';
  }catch(e){toast('Follow failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function toggleVis(){
  const btn=document.getElementById('visBtn'); if(!btn)return;
  const next=IT.visibility==='public'?'private':'public'; btn.disabled=true;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/visibility',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({visibility:next})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    IT.visibility=d.data.visibility;
    btn.textContent=IT.visibility==='public'?'🌐 Public — make private':'🔒 Private — make public';
    toast(IT.visibility==='public'?'Now public — shows in Explore':'Now private');
  }catch(e){toast('Update failed: '+(e.message||e));}
  finally{btn.disabled=false;}
}
async function reportIt(){
  if(!confirm('Report this creation for review?'))return;
  try{
    const r=await fetch('/api/generate/results/'+IDX+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'inappropriate'})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast(d.data&&d.data.takenDown?'Reported — removed from feed':'Reported. Thank you.');
  }catch(e){toast('Report failed: '+(e.message||e));}
}

loadDetail();
loadStrip();
</script>
</body>
</html>
