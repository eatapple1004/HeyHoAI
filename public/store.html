<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia · Store</title>
<script src="/js/flags.js" defer></script>
<script src="/js/no-pip.js" defer></script>
<script src="/js/themes.js?v=7"></script><!-- (2026-07-03) isThemeVisible 공용 — 테마 칩을 Studio/Library와 동일하게 좁힘 -->
<script src="/js/taxonomy.js?v=1"></script><!-- (2026-07-11) 카테고리 정본 — Store 카테고리 칩을 Studio 오피셜 카테고리(Apparel·Cosmetics·Nail·Accessories)와 정확히 일치 -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/js/i18n.js?v=26" defer></script>
<script src="/saas-auth.js?v=3" defer></script>
<script src="/js/rail.js?v=12" defer></script>
<style>
  /* ▼▼▼ (2026-07-03) Store = 옛 Explore>Templates 카탈로그를 독립 페이지로 분리. 스타일은 explore.html 카탈로그분과 동일. ▼▼▼ */
  .wrap{max-width:none;margin:0;padding:34px 24px 80px;position:relative;z-index:2}/* (2026-07-03) full-bleed + 제목 위치 Community/Library와 통일(padding 34 24). 롤백: max-width:1280px;margin:0 auto;padding:40px 24px 80px */
  .head{margin-bottom:24px}
  h1{font-family:'Sora';font-size:30px;font-weight:800;letter-spacing:-1px}
  .head .sub{color:var(--dim);font-size:14px;margin-top:4px}
  .empty{text-align:center;color:var(--dim);padding:80px 20px}
  .empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px;font-family:'Sora'}
  .empty .ico{font-size:40px;margin-bottom:12px;opacity:.8}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border2)}
  #toast.show{opacity:1}
  .filter-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:30px;cursor:pointer;transition:all .2s}
  .chip:hover{color:var(--text)}
  .chip.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  #tplSearch{width:100%;max-width:340px;display:block;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13.5px;padding:9px 13px;margin-bottom:18px}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .tcard{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);transition:border-color .2s,transform .2s,box-shadow .2s}
  .tcard:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
  .tthumb{position:relative;aspect-ratio:4/5;cursor:pointer;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 62%),var(--surface2)}
  .tthumb img,.tthumb video{width:100%;height:100%;object-fit:cover}
  .temoji{font-size:46px;opacity:.72}
  .tprice{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;text-transform:uppercase;letter-spacing:.3px}
  .tthemetag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;text-transform:capitalize;letter-spacing:.2px}/* (2026-07-03) 카드 테마 표시 */
  .tbody{padding:11px 12px}
  .tname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tmeta{font-size:11.5px;color:var(--dim);margin-top:3px}
  .trow{display:flex;gap:7px;margin-top:10px}
  .tuse{flex:1;background:linear-gradient(180deg,#7c52e8,#5c33c2);color:#fff;border:none;border-radius:11px;padding:10px 8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px -4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.13)}
  .tuse:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .tbk{background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;border-radius:9px;padding:8px 11px;font-size:14px;cursor:pointer;line-height:1}
  .tbk.on{color:#ffd35e;border-color:rgba(255,211,94,.5)}
  /* (2026-07-03) 보유 카드: 살짝 흐리게 + "✓ In Library" 배지·비활성 버튼·View 링크 */
  .tcard.is-owned{opacity:.72}
  .tcard.is-owned:hover{opacity:1}
  .towned{position:absolute;top:8px;left:8px;background:rgba(94,224,214,.9);color:#06231f;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.2px}
  .tuse.owned{background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--border);cursor:default;box-shadow:none;transform:none}
  .tuse.owned:hover{filter:none}
  .tview{display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;border-radius:9px;padding:0 12px;font-size:12.5px;font-weight:700;text-decoration:none}
  .tview:hover{border-color:var(--border2)}
  @media(max-width:760px){#toast{bottom:76px}.tuse{padding:11px 10px}.filter-row .chip{padding:9px 16px}}
  @media(hover:none){.tcard.is-owned{opacity:.86}}
</style>
</head>
<body class="has-rail">
<div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>
<div class="credits" id="saasUserBox"></div><!-- rail.js가 레일 하단으로 이동 · saas-auth.js가 아바타 채움 -->
<div class="wrap">
  <div class="head">
    <h1>Store</h1>
    <div class="sub">Browse templates and <b style="color:var(--accent2)">add the ones you like</b> — then use them in Shots with your own product.</div>
  </div>

  <div class="filter-row" id="catFilter"></div>
  <div class="filter-row" id="priceFilter" data-flag="marketplace"></div>
  <input id="tplSearch" type="search" placeholder="Search templates…" aria-label="Search templates" oninput="renderCatalog()" autocomplete="off" />
  <div class="tgrid" id="tplGrid"></div>
  <div class="empty hidden" id="tplEmpty"><div class="ico">🔍</div><b>No templates here</b>Try another category or price.</div>
</div>
<div id="toast"></div>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

// (2026-07-06) 유료 오피셜 구매(Unlock) — 크레딧 결제 후 Studio에 추가. 무료 오피셜은 기본제공이라 여기 오지 않음(항상 보유).
async function acquireTpl(tid,btn){
  const orig=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Unlocking…';}
  try{
    const r=await fetch('/api/marketplace/templates/'+encodeURIComponent(tid)+'/acquire',{method:'POST'});
    const d=await r.json();
    if(r.status===402){toast(d.error||'Not enough credits — top up in Billing');if(btn){btn.disabled=false;btn.textContent=orig;}return;}
    if(!r.ok||!d.success)throw new Error(d.error||'failed');
    toast((d.data&&d.data.alreadyOwned)?'Already yours':'Unlocked — ready to use');
    const ct=CATALOG.find(x=>x.id===tid); if(ct)ct.owned=true;
    if(btn){btn.textContent='✓ In use';btn.disabled=true;btn.classList.add('owned');}
  }catch(e){ toast('Could not unlock: '+(e.message||e)); if(btn){btn.disabled=false;btn.textContent=orig;} }
}
function tcard(t){
  const prev=t.thumb||(t.preview_media&&t.preview_media[0])||'';
  const isVid=/\.(mp4|webm|mov)$/i.test(prev);
  const thumb=prev?(isVid
      ?`<video src="${esc(prev)}" muted loop playsinline preload="metadata"></video>`
      :`<img src="${esc(prev)}" loading="lazy" alt="">`):`<div class="temoji">${esc(t.emoji||'🎨')}</div>`;
  const price=t.price_credits>0?('◈ '+t.price_credits):'Free';
  // ▼▼▼ (2026-07-06 Store=오피셜 전용 재정의) Store엔 오피셜만. 보유(무료 오피셜=기본제공 포함)=비활성 상태표시 / 미보유(유료·비기본, 현재 없음)=Unlock(구매)→Studio 추가. "Add to My templates"(오피셜엔 부적절) 제거. 롤백: 옛 In Library/＋Add·View 분기 복원 ▼▼▼
  const owned=!!t.owned;
  const ownedBadge=owned?`<span class="towned">✓ Owned</span>`:'';
  // (2026-07-03) 카드에 테마 표시 — 보이는 기본 테마만(Studio·Library·칩과 통일). 여러 개면 첫 번째.
  const vis=(typeof isThemeVisible==='function')?isThemeVisible:function(){return true;};
  const themeSlug=(t.themes||[]).filter(function(s){return vis(s);})[0];
  const themeTag=themeSlug?`<span class="tthemetag">${esc(themeName(themeSlug))}</span>`:'';
  const actions=owned
    ? `<button class="tuse owned" disabled>✓ In use</button>`
    : (t.price_credits>0
        ? `<button class="tuse" onclick="acquireTpl('${esc(t.id)}',this)">🔓 Unlock · ◈ ${t.price_credits}</button>`
        : `<button class="tuse" onclick="acquireTpl('${esc(t.id)}',this)">＋ Add</button>`);
  return `<div class="tcard${owned?' is-owned':''}">
    <div class="tthumb" role="button" tabindex="0" aria-label="View ${esc(t.name)}" onclick="goTpl('${esc(t.id)}')" onkeydown="tkey(event,'${esc(t.id)}')">${thumb}${ownedBadge}<span class="tprice">${price}</span>${themeTag}</div>
    <div class="tbody">
      <div class="tname">${esc(t.name)}</div>
      <div class="tmeta">by ${t.creator_handle?`<a class="hlink" href="/creator?handle=${encodeURIComponent(String(t.creator_handle).replace(/^@/,''))}">${esc(t.creator_handle)}</a>`:'@creator'} · ♥ ${t.likes_count||0}${t.type==='reel'?' · ▶ Reel':''}</div>
      <div class="trow">
        ${actions}
        <!-- ☆ Save(북마크) 버튼 숨김 — 현재 미작동(2026-06-27). 재활성 시 복원: toggleBookmark·.tbk·Saved탭 잔존 -->
      </div>
    </div></div>`;
  // ▲▲▲
}
const PRICES=['All','Free','Paid'];
let CATALOG=[], THEMES=[], curTheme='All', curPrice='All';
function themeName(slug){return slug==='All'?'All':((THEMES.find(t=>t.slug===slug)||{}).name||slug);}
// (2026-07-11) 카테고리 칩 = Studio 오피셜 카테고리 정본(TAXONOMY.activeCategories: Apparel·Cosmetics·Nail·Accessories)과 정확히 일치.
//   curTheme는 이제 카테고리 slug('All'|'apparel'|'beauty'|'nail'|'accessories')를 담음. 템플릿은 각 카테고리의 themes 슬러그로 버킷(catThemes).
//   taxonomy.js가 SINGLE SOURCE — 카테고리 추가/삭제 시 Store 칩 자동 반영. 롤백: 아래 3함수를 옛 isThemeVisible 버전으로 복원.
function catLabel(slug){if(slug==='All')return 'All';var c=(window.TAXONOMY&&TAXONOMY.categoryBySlug)?TAXONOMY.categoryBySlug(slug):null;return (c&&c.label)||slug;}
function catThemes(slug){return (window.TAXONOMY&&TAXONOMY.themesForCategory)?TAXONOMY.themesForCategory(slug):[];}
function renderThemeFilter(){const cats=(window.TAXONOMY&&TAXONOMY.activeCategories)?TAXONOMY.activeCategories().map(function(c){return c.slug;}):[];const all=['All'].concat(cats);document.getElementById('catFilter').innerHTML=all.map(s=>`<button type="button" class="chip ${curTheme===s?'active':''}" aria-pressed="${curTheme===s}" onclick="setTheme('${s}')">${catLabel(s)}</button>`).join('');}
function setTheme(s){curTheme=s;renderThemeFilter();renderCatalog();}
function renderPrices(){document.getElementById('priceFilter').innerHTML=PRICES.map(c=>`<button type="button" class="chip ${curPrice===c?'active':''}" aria-pressed="${curPrice===c}" onclick="setPrice('${c}')">${c}</button>`).join('');}
function setPrice(c){curPrice=c;renderPrices();renderCatalog();}
async function loadThemesThenCatalog(){try{THEMES=(await(await fetch('/api/marketplace/themes')).json()).data||[];}catch(e){THEMES=[];}renderThemeFilter();loadCatalog();}
async function loadCatalog(){
  try{
    CATALOG=(await(await fetch('/api/marketplace/templates')).json()).data||[];
  }catch(e){console.error('catalog load failed',e);CATALOG=[];}
  renderCatalog();
}
function renderCatalog(){
  const term=(document.getElementById('tplSearch').value||'').toLowerCase().trim();
  // ▼▼▼ (2026-07-03) 보유 템플릿도 표시(옛 !t.owned 숨김 제거) — "담았는데 사라짐" 혼란 방지. 안 가진 게 위, 보유는 뒤로 정렬. 롤백: `let list=CATALOG.filter(t=>!t.owned);` 복원 ▼▼▼
  let list=CATALOG.slice();
  if(typeof featureOn==='function' && !featureOn('influencer')) list=list.filter(t=>!(t.themes||[]).includes('people')); // (2026-07-01) 인물(people) 템플릿 숨김
  if(curTheme!=='All'){const cth=catThemes(curTheme);list=list.filter(t=>(t.themes||[]).some(x=>cth.indexOf(x)>=0));} // 카테고리 = 그 카테고리 themes 슬러그를 가진 템플릿(taxonomy 정본)
  if(curPrice==='Free')list=list.filter(t=>!(t.price_credits>0));
  else if(curPrice==='Paid')list=list.filter(t=>t.price_credits>0);
  if(term)list=list.filter(t=>(t.name||'').toLowerCase().includes(term));
  list.sort((a,b)=>(a.owned?1:0)-(b.owned?1:0)); // 발견 우선: 미보유 위 / 보유 뒤(안정 정렬)
  // ▲▲▲
  const grid=document.getElementById('tplGrid'),empty=document.getElementById('tplEmpty');
  if(!list.length){grid.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');grid.innerHTML=list.map(tcard).join('');
}
function goTpl(id){location.href='/template?id='+encodeURIComponent(id);}
function tkey(e,id){if(e.key==='Enter'||e.key===' '){e.preventDefault();goTpl(id);}}
async function toggleBookmark(id,btn){
  const on=btn.classList.contains('on');
  try{
    const r=await fetch('/api/marketplace/templates/'+id+'/bookmark',{method:on?'DELETE':'POST'});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'failed');
    btn.classList.toggle('on',!on);btn.textContent=!on?'★':'☆';btn.title=!on?'Saved':'Save';
    const t=CATALOG.find(x=>x.id===id);if(t)t.bookmarked=!on;
    toast(!on?'Saved to your Library':'Removed from Saved');
  }catch(e){toast('Could not update: '+(e.message||e));}
}

renderPrices();
loadThemesThenCatalog();
</script>
</body>
</html>
