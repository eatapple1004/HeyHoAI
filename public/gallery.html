<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HeyHoAI · Gallery</title>
<link rel="stylesheet" href="/css/theme.css?v=2" />
<script src="/saas-auth.js" defer></script>
<style>
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:2}
  .head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:26px}
  h1{font-family:'Sora';font-size:30px;font-weight:800;letter-spacing:-1px}
  .head .sub{color:var(--dim);font-size:14px;margin-top:4px}
  .head .count{font-size:13px;color:var(--faint)}
  .head .count b{color:var(--accent2)}

  .filter-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
  .chip{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:30px;cursor:pointer;transition:all .2s}
  .chip:hover{color:var(--text)}
  .chip.active{background:rgba(124,108,255,.16);color:var(--accent2);border-color:rgba(124,108,255,.4)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .item{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/5;border:1px solid var(--border);transition:transform .2s}
  .item:hover{transform:translateY(-4px)}
  .item .thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px}
  .item .media{width:100%;height:100%;object-fit:cover;display:block;background:#0c0c14}
  .item .badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.4px;padding:4px 9px;border-radius:8px;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);color:#fff;text-transform:uppercase}
  .item .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;border:1px solid rgba(255,255,255,.3)}
  .item .info{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
  .item .info .nm{font-size:12.5px;font-weight:600}
  .item .info .dt{font-size:10.5px;color:rgba(255,255,255,.6);margin-top:2px}
  .item .actions{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:9px;backdrop-filter:blur(2px)}
  .item:hover .actions{opacity:1}
  .item .actions button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-family:inherit;font-size:11.5px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
  .item .actions button:hover{background:var(--accent);border-color:var(--accent)}
  .item .actions button.del:hover{background:#ff5f6e;border-color:#ff5f6e}

  .empty{text-align:center;padding:80px 20px;color:var(--faint)}
  .empty .ico{font-size:42px;margin-bottom:14px}
  .empty h3{font-family:'Sora';font-size:18px;color:var(--text);margin-bottom:8px}
  .empty p{font-size:14px;margin-bottom:22px}
</style>
</head>
<body>
<div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<nav>
  <div class="nav-in">
    <div class="brand" onclick="location.href='/landing.html'"><span class="dot"></span><b>HeyHoAI</b></div>
    <div class="nav-links">
      <a onclick="location.href='/studio.html'">Studio</a>
      <a onclick="location.href='/marketplace.html'">Market</a>
      <a class="active">Gallery</a>
      <a onclick="location.href='/billing.html'">Billing</a>
      <a onclick="location.href='/business.html'">Business</a>
    </div>
    <div class="credits" id="saasUserBox"></div>
  </div>
</nav>

<div class="wrap">
  <div class="head fade d1">
    <div><h1>Your Gallery</h1><div class="sub">Everything you've created — download or post anytime.</div></div>
    <div class="count"><b id="cnt">0</b> creations</div>
  </div>

  <div class="filter-row fade d1" id="filterRow"></div>
  <div class="grid fade d2" id="grid"></div>

  <div class="empty hidden" id="empty">
    <div class="ico">🖼️</div><h3>Nothing here yet</h3>
    <p>Generate your first photo or reel to fill your gallery.</p>
    <a href="/studio.html" class="btn btn-primary">Open Studio →</a>
  </div>
</div>

<script>
// ═══ 실제 데이터 연결: GET /api/generate/results ═══
let ITEMS=[];
let filter='All';
const FILTERS=['All','Photos','Reels'];

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  try{
    const res=await fetch('/api/generate/results?limit=200');
    const data=await res.json();
    ITEMS=(data.data||[])
      .filter(r=>r.status==='success'&&r.file_path)
      .map(r=>{
        const fn=r.file_path.split('/').pop();
        return {
          idx:r.idx,
          url:'/images/'+fn,
          type:/\.(mp4|webm|mov)$/i.test(fn)?'reel':'photo',
          name:r.character_name||(r.prompt_text||'').slice(0,42)||'Generated',
          date:(r.created_at||'').slice(0,10),
          model:r.model||''
        };
      });
  }catch(e){console.error('results load failed',e);}
  renderFilters();render();
}
function renderFilters(){
  document.getElementById('filterRow').innerHTML=FILTERS.map(f=>`<div class="chip ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</div>`).join('');
}
function match(it){
  if(filter==='Photos')return it.type==='photo';
  if(filter==='Reels')return it.type==='reel';
  return true;
}
function render(){
  const list=ITEMS.filter(match);
  document.getElementById('cnt').textContent=list.length;
  const grid=document.getElementById('grid'),empty=document.getElementById('empty');
  if(!list.length){grid.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');
  grid.innerHTML=list.map(it=>`
    <div class="item">
      ${it.type==='reel'
        ?`<video class="media" src="${esc(it.url)}" muted loop playsinline preload="metadata" onmouseover="this.play()" onmouseout="this.pause()"></video>`
        :`<img class="media" src="${esc(it.url)}" loading="lazy" alt="">`}
      <span class="badge">${it.type==='reel'?'▶ Reel':'▦ Photo'}</span>
      <div class="info"><div class="nm">${esc(it.name)}</div><div class="dt">${esc(it.date)}${it.model?' · '+esc(it.model):''}</div></div>
      <div class="actions">
        <a href="${esc(it.url)}" download><button>⬇</button></a>
        <button onclick="window.open('${esc(it.url)}','_blank')">⤢</button>
      </div>
    </div>`).join('');
}
function setFilter(f){filter=f;renderFilters();render();}
renderFilters();load();
</script>
</body>
</html>
