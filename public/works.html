<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doppia Works — Every moment of marketing</title>
<meta name="description" content="Promotion, ads and customer loyalty — marketing results, made by Doppia Works. Start with a free six-question check-up.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<!--
  Doppia Works 랜딩 (2026-10-07). 설계 정본 = 노션 "Doppia 웹 진단 퍼널 — 사업 지도·질문 설계".
  - Works = 운영·컨설팅 부문. 이 페이지는 "뭘 하는 곳인지" 말하고 /diagnose(질문 6개)로 보낸다.
  - 톤: 팀이 맡아서 한다. "AI"라는 말은 쓰지 않는다. 인원수·성과 숫자·가격·후기는 적지 않는다(없는 건 안 쓴다).
  - 범위는 콘텐츠 제작에 가두지 않는다 — 마케팅 운영 전반. (내부 사유: Doppia 툴 외에 협업 마케팅 팀에도 업무를 배정할 수 있어야 함. 고객에겐 언급하지 않음.)
  - 제목은 구호체(리듬). "~합니다" 설명문 금지.
  - 배경 문법은 피처링(featuring.co)에서, 색은 Doppia 것: 흰 기본 + 보라끼 틴트 + 포인트 보라 하나. 어두운 띠 없음(사용자: 전부 흰으로). 핑크는 헤드라인 그라데이션 꼬리에만.
  - 정렬: 가운데 집합이 아니라 **왼쪽 정렬**(신뢰·전문성). 히어로는 왼쪽 글 + 오른쪽 리포트 프레임 2단.
    메인 랜딩(어두움)과는 로고·보라·Sora로만 묶고 바탕은 일부러 밝게 — 제품 사이트와 서비스 부문을 구분.
  - theme.css(어두운 body)를 쓰지 않고 자체 스타일. 다국어는 diagnose.html과 같은 방식(페이지 안 STR 표, doppia_lang 키 공유).
  - 비워둔 자리: 리포트 샘플(히어로 아래 프레임, 어두운 띠 안) — 나중에 실제 이미지로 교체.
-->
<style>
  :root{
    --bg:#ffffff; --tint:#f6f4fc; --tint2:#eeeaf9; --ink:#16131f; --dim:#5f5a73; --faint:#8f8aa6;
    --line:rgba(22,19,31,.10); --line2:rgba(22,19,31,.16);
    --accent:#6a40e0; --accent-ink:#5b35cc; --accent-soft:#e9e2fb; --pink:#d9608f;
    --night:#0f0d1c; --night2:#17132b; --night-line:rgba(255,255,255,.10); --night-dim:#b5aed0;
    --maxw:1080px; --r:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit}
  .in{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* ── nav ── */
  nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  nav .in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:66px}
  .brand{font-family:'Sora',Inter,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px;display:flex;align-items:center;gap:9px;white-space:nowrap}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 0 0 4px var(--accent-soft)}
  .brand .sfx{font-weight:600;color:var(--dim);margin-left:2px}
  .nav-r{display:flex;align-items:center;gap:12px}
  .lang{display:flex;gap:2px;border:1px solid var(--line2);border-radius:999px;padding:2px}
  .lang button{background:transparent;border:0;color:var(--dim);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* ── buttons ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;border-radius:12px;padding:12px 20px;border:1px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
  .btn-p{background:var(--accent);color:#fff;box-shadow:0 8px 20px -10px rgba(106,64,224,.7)}
  .btn-p:hover{background:var(--accent-ink);transform:translateY(-1px)}
  .btn-ink{background:var(--ink);color:#fff}
  .btn-ink:hover{background:#2a2538;transform:translateY(-1px)}
  .btn-white{background:#fff;color:var(--accent-ink)}
  .btn-white:hover{transform:translateY(-1px)}
  .btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
  .btn-lg{padding:15px 26px;font-size:15px;border-radius:14px}

  /* ── type ── */
  .pill{display:inline-block;font-size:13px;font-weight:600;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;background:#fff}
  h1{font-family:'Sora',Inter,sans-serif;font-size:clamp(36px,5.6vw,66px);line-height:1.08;letter-spacing:-.03em;font-weight:800;text-wrap:balance}
  h1 .grad,.grad{background:linear-gradient(95deg,var(--accent-ink) 0%,var(--accent) 55%,var(--pink) 115%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h2{font-family:'Sora',Inter,sans-serif;font-size:clamp(26px,3.4vw,40px);line-height:1.18;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
  h2 .ac{color:var(--accent-ink)}
  .lead{color:var(--dim);font-size:clamp(16px,1.5vw,19px);line-height:1.65;max-width:58ch}
  .sec-head{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
  .sec-head h2{max-width:22ch}

  /* ── hero ── */
  .hero{position:relative;padding:96px 0 88px;overflow:hidden;background:linear-gradient(180deg,#fff 0%,var(--tint) 70%,#fff 100%)}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
  .hero::before{width:620px;height:620px;left:-220px;top:-260px;background:radial-gradient(circle,rgba(106,64,224,.16),transparent 70%)}
  .hero::after{width:560px;height:560px;right:-200px;top:40px;background:radial-gradient(circle,rgba(217,96,143,.10),transparent 70%)}
  .hero .in{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
  @media(max-width:900px){.hero .in{grid-template-columns:1fr;gap:40px}}
  .hero h1{margin-top:22px;max-width:none;font-size:clamp(32px,4.1vw,52px);white-space:normal}
  .hero h1 .grad{white-space:nowrap}
  .hero .lead{margin-top:22px}
  .cta{margin-top:34px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .fine{color:var(--faint);font-size:13px;margin-top:14px}
  .scope{display:flex;flex-wrap:wrap;gap:8px;margin-top:36px;max-width:620px}
  .scope span{font-size:13px;font-weight:600;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff}
  .scope span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
  /* 히어로 아래 프레임 — 피처링의 제품 화면 자리. 지금은 리포트 샘플 자리. */
  .frame{border-radius:24px;background:var(--tint2);border:1px solid var(--line);padding:22px}
  .frame .paper{background:#fff;border-radius:16px;border:1px solid var(--line);min-height:380px;box-shadow:0 24px 60px -30px rgba(22,19,31,.28);padding:28px 30px;display:grid;grid-template-columns:1.15fr .85fr;gap:26px;text-align:left}
  @media(max-width:520px){.frame{padding:14px}.frame .paper{grid-template-columns:1fr;padding:22px}}
  .paper .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
  .paper .ttl{font-family:'Sora',Inter,sans-serif;font-weight:700;font-size:20px;margin-top:12px;color:var(--ink)}
  .sk{height:10px;border-radius:6px;background:var(--tint2);margin-top:12px}
  .sk.w60{width:60%}.sk.w85{width:85%}.sk.w40{width:40%}
  .paper .side{border-left:1px solid var(--line);padding-left:28px;display:flex;flex-direction:column;gap:14px}
  @media(max-width:760px){.paper .side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:18px}}
  .kpi{display:flex;flex-direction:column;gap:4px}
  .kpi b{font-family:'Sora',Inter,sans-serif;font-size:22px;color:var(--accent-ink);letter-spacing:-.02em}
  .kpi span{font-size:12px;color:var(--faint)}
  .paper .soon{margin-top:auto;font-size:12px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  /* 가상 예시 리포트(움직이는 목업) */
  .rp{display:flex;flex-direction:column;gap:14px;min-width:0}
  .rp .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--faint)}
  .rp .ex{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
  .rp .biz{font-family:'Sora',Inter,sans-serif;font-weight:700;font-size:19px;color:var(--ink);line-height:1.25}
  .rp .biz small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:var(--faint);margin-top:4px}
  .bars{display:grid;gap:9px;margin-top:4px}
  .bar{display:grid;grid-template-columns:76px 1fr 58px;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  .bar .t{height:8px;border-radius:6px;background:var(--tint2);overflow:hidden}
  .bar .t i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--accent),#a394ee);animation:fill 1.6s cubic-bezier(.2,.7,.2,1) forwards}
  .bar b{font-family:'Sora',Inter,sans-serif;font-weight:700;color:var(--ink);text-align:right;font-size:12px}
  .bar.warn .t i{background:linear-gradient(90deg,var(--pink),#f0a0bf)}
  @keyframes fill{from{width:0}to{width:var(--w)}}
  .plan{border-top:1px solid var(--line);padding-top:12px}
  .plan .h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
  .plan div{font-size:13px;color:var(--ink);line-height:1.5;min-height:20px}
  .plan div.cur::after{content:"";display:inline-block;width:2px;height:13px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{to{opacity:0}}
  .kpi b.cnt{font-variant-numeric:tabular-nums}
  .kpi.bad b{color:#b8336a}
  .scopechip{display:inline-block;margin-top:auto;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:6px 10px;align-self:flex-start}
  /* 패널 카드 더미 → 가상 운영 카드 */
  .stack .c .l b{font-size:13px;color:var(--ink);font-weight:700}
  .stack .c .l em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .stack .c .d{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.45}
  /* 리포트 섹션 샘플(2쪽 미리보기) */
  .nsample{border:1px solid var(--line);border-radius:18px;background:var(--tint);padding:18px;display:grid;gap:12px}
  .pg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 10px 28px -22px rgba(22,19,31,.3);transition:border-color .4s,box-shadow .4s,transform .4s}
  .pg.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 14px 32px -20px rgba(106,64,224,.45);transform:translateY(-2px)}
  .pg .h{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .pg .h b{color:var(--accent-ink)}
  .pg p{font-size:13px;color:var(--ink);line-height:1.55}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .tiles i{display:block;aspect-ratio:4/5;border-radius:8px;background:linear-gradient(160deg,#e9e2fb,#cdbff5)}
  .tiles i:nth-child(2){background:linear-gradient(160deg,#fde7f0,#f3b9d0)}
  .tiles i:nth-child(3){background:linear-gradient(160deg,#eeeaf9,#b9a6ee)}
  .tiles i span{display:block;margin:8px;font-size:10px;font-weight:700;color:rgba(22,19,31,.55)}
  .pg ul{list-style:none;display:grid;gap:6px;margin-top:8px}
  .pg li{font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
  .pg li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;margin-top:7px}


  /* ── sections ── */
  section.sec{padding:120px 0}
  section.sec.tint{background:var(--tint)}
  .rows{margin-top:64px;display:flex;flex-direction:column;gap:72px}
  .row{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:center}
  .row.flip{direction:rtl}.row.flip>*{direction:ltr}
  @media(max-width:860px){.row,.row.flip{grid-template-columns:1fr;direction:ltr;gap:28px}}
  .row .k{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:8px;padding:5px 10px}
  .row h3{font-family:'Sora',Inter,sans-serif;font-size:clamp(22px,2.4vw,28px);line-height:1.25;letter-spacing:-.02em;font-weight:800;margin-top:16px}
  .row p{color:var(--dim);font-size:16px;margin-top:14px;max-width:46ch}
  .row .to{display:inline-flex;align-items:center;gap:6px;margin-top:22px;color:var(--accent-ink);font-weight:700;font-size:14px}
  /* 틴트 프레임 패널 — 안에 추상 카드 더미 (이미지 없이 공들인 느낌) */
  .panel{background:linear-gradient(160deg,var(--tint2),#f8f6fd);border:1px solid var(--line);border-radius:22px;padding:34px;min-height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .panel::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(106,64,224,.14),transparent 70%)}
  .stack{position:relative;width:min(100%,380px);height:150px}
  /* 불투명 카드 덱 — 뒤 카드는 위 테두리만 보인다(글자 비침 없음). 높이 고정으로 회전 시 들쭉날쭉 방지 */
  .stack .c{position:absolute;left:0;right:0;top:30px;height:108px;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 16px 40px -24px rgba(22,19,31,.3);transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .55s;transform-origin:50% 0}
  .stack .c1{transform:translateY(-28px) scale(.92);z-index:1}
  .stack .c2{transform:translateY(-14px) scale(.96);z-index:2}
  .stack .c3{transform:none;z-index:3}
  /* 앞 카드만 내용 표시 — 뒤 카드는 빈 종이라 전환 중에도 글자가 겹치지 않는다 */
  .stack .c .l,.stack .c .d{transition:opacity .25s}
  .stack .c:not(.c3) .l,.stack .c:not(.c3) .d{opacity:0}
  .stack .c .l{display:flex;align-items:center;gap:10px}
  .stack .c i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);flex:0 0 28px}
  .stack .c .l b{font-size:13px;color:var(--ink)}
  .stack .c .sk{margin-top:10px}
  .steps{margin-top:56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  @media(max-width:760px){.steps{grid-template-columns:1fr}}
  .step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 26px 30px;box-shadow:0 1px 2px rgba(22,19,31,.03),0 12px 30px -24px rgba(22,19,31,.25)}
  .step .n{font-family:'Sora',Inter,sans-serif;font-size:14px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .step h3{font-size:18px;font-weight:700;margin-top:18px;line-height:1.3}
  .step p{color:var(--dim);font-size:15px;margin-top:8px}

  /* ── 리포트 섹션 (흰 바탕, 왼쪽 글 + 오른쪽 샘플 프레임) ── */
  section.report{background:#fff;padding:120px 0;border-top:1px solid var(--line)}
  .ngrid{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
  @media(max-width:860px){.ngrid{grid-template-columns:1fr}}
  .nlist{display:grid;gap:12px}
  .nlist div{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(22,19,31,.03),0 10px 24px -22px rgba(22,19,31,.25)}
  .nlist i{flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a394ee);margin-top:7px}
  .nlist span{font-size:16px;line-height:1.5;color:var(--ink)}
  .nslot{border:1px dashed var(--line2);border-radius:18px;min-height:300px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--tint)}

  /* ── 마무리 배너 ── */
  section.close{padding:120px 0}
  .banner{background:linear-gradient(120deg,#4b2bb8 0%,var(--accent) 60%,#8a5cf0 100%);border-radius:28px;padding:64px 56px;color:#fff;position:relative;overflow:hidden;box-shadow:0 30px 80px -40px rgba(106,64,224,.7);display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center}
  @media(max-width:760px){.banner{grid-template-columns:1fr;padding:44px 28px}}
  .banner::after{content:"";position:absolute;width:420px;height:420px;right:-140px;bottom:-220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
  .banner h2{color:#fff;position:relative}
  .banner .lead{color:rgba(255,255,255,.82);margin:16px 0 0;position:relative}
  .banner .cta{position:relative;margin-top:0}

  footer{border-top:1px solid var(--line);padding:30px 0 46px;color:var(--faint);font-size:13px}
  footer .in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>

<nav>
  <div class="in">
    <a class="brand" href="/"><span class="dot"></span><span>DOPPIA</span><span class="sfx">Works</span></a>
    <div class="nav-r">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ko">KO</button>
      </div>
      <a class="btn btn-p btn-sm" href="/diagnose" data-s="navCta"></a>
    </div>
  </div>
</nav>

<main>
  <section class="hero">
    <div class="in">
      <div>
        <span class="pill" data-s="eyebrow"></span>

  // 2) 운영 카드 더미 — 2.5초마다 맨 위 카드가 뒤로 가고 다음 카드가 올라옴
  var ORDER = ['c1', 'c2', 'c3'];
  document.querySelectorAll('.stack').forEach(function (st, k) {
    var cards = [].slice.call(st.querySelectorAll('.c')); var pos = 0;
    setInterval(function () {
      pos = (pos + 1) % cards.length;
      cards.forEach(function (c, i) { c.classList.remove('c1', 'c2', 'c3'); c.classList.add(ORDER[(i - pos + cards.length) % cards.length]); });
    }, 2500 + k * 400);
  });

  // 3) 리포트 3쪽 — 차례로 강조
  var pgs = [].slice.call(document.querySelectorAll('.nsample .pg')); var pi = 0;
  if (pgs.length) { pgs[0].classList.add('on'); setInterval(function () { pgs[pi].classList.remove('on'); pi = (pi + 1) % pgs.length; pgs[pi].classList.add('on'); }, 2400); }
})();
</script>
</body>
</html>
