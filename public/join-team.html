<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doppia — Join team</title>
<script src="/js/flags.js" defer></script>
<link rel="stylesheet" href="/css/theme.css?v=3" />
<script src="/saas-auth.js" defer></script>
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{position:relative;z-index:2;width:100%;max-width:420px;text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid var(--border2);border-radius:24px;padding:40px 34px;
    box-shadow:0 40px 100px -40px rgba(124,108,255,.5)}
  .card .ico{font-size:44px;margin-bottom:16px}
  .card h1{font-family:'Sora';font-size:22px;font-weight:800;margin-bottom:8px}
  .card .desc{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:26px}
  .card .desc b{color:var(--accent2)}
  .card .role-tag{display:inline-block;font-size:12px;font-weight:700;background:rgba(124,108,255,.16);color:var(--accent2);padding:4px 12px;border-radius:8px;margin-top:4px}
  .btn-primary{width:100%}
  .msg{margin-top:18px;font-size:13px}
  .msg.err{color:#ff7eb6}
</style>
</head>
<body>
<div class="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<div class="card fade d1">
  <div class="ico">👥</div>
  <h1 id="title">초대 확인 중…</h1>
  <div class="desc" id="desc">잠시만 기다려 주세요.</div>
  <button class="btn btn-primary btn-lg" id="acceptBtn" style="display:none" onclick="accept()">팀 합류하기</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const code=new URLSearchParams(location.search).get('code');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  if(!code){fail('초대 코드가 없습니다.');return;}
  try{
    const res=await fetch('/api/teams/invites/'+encodeURIComponent(code));
    const d=await res.json();
    if(!res.ok||!d.success){fail(d.error||'유효하지 않은 초대입니다.');return;}
    document.getElementById('title').textContent=esc(d.data.teamName)+' 팀 초대';
    document.getElementById('desc').innerHTML=`<b>${esc(d.data.teamName)}</b> 팀에 합류하도록 초대받았어요.<br><span class="role-tag">${esc(d.data.role)} 권한</span>`;
    document.getElementById('acceptBtn').style.display='';
  }catch(e){fail('초대 정보를 불러올 수 없습니다.');}
}
function fail(m){
  document.getElementById('title').textContent='초대를 사용할 수 없어요';
  document.getElementById('desc').textContent=m;
}
async function accept(){
  const btn=document.getElementById('acceptBtn');btn.disabled=true;btn.textContent='합류 중…';
  try{
    const res=await fetch('/api/teams/invites/'+encodeURIComponent(code)+'/accept',{method:'POST'});
    const d=await res.json();
    if(!res.ok||!d.success){document.getElementById('msg').className='msg err';document.getElementById('msg').textContent=d.error||'합류 실패';btn.disabled=false;btn.textContent='팀 합류하기';return;}
    document.getElementById('msg').textContent=d.data.already?'이미 이 팀의 멤버예요. 이동합니다…':'합류 완료! 이동합니다…';
    setTimeout(()=>location.href='/business',1200);
  }catch(e){btn.disabled=false;btn.textContent='팀 합류하기';}
}
load();
</script>
</body>
</html>
