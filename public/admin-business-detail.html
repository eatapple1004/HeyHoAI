<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사업체 상세 · Doppia Admin</title>
<style>
:root{--accent:#6a40e0;--accent2:#a394ee;--bg:#0c0c14;--panel:#15151f;--panel2:#1c1c28;
  --text:#edecf5;--dim:#9a9ab2;--faint:#6a6a85;--border:#2a2a3a;--green:#4ade80;--red:#f87171;--gold:#ffce7a;--pink:#d9608f;
  --font:'Pretendard','Apple SD Gothic Neo','맑은 고딕',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:32px;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto}
a{color:var(--accent2)}
.back{font-size:.82rem;font-weight:600;color:var(--dim);text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:7px 13px;display:inline-block;margin-bottom:16px}
.back:hover{color:var(--text);border-color:var(--accent2)}
h1{font-size:1.7rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1 .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink))}
.sub{color:var(--dim);margin:6px 0 22px;font-size:.95rem}
h2{font-size:1.05rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .hint{font-weight:400;font-size:.8rem;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 13px;font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
textarea{width:100%;resize:vertical;line-height:1.6}
button{font-family:inherit;font-size:.86rem;font-weight:600;padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent2)}
button.primary{background:linear-gradient(180deg,#7c52e8,#5c33c2);border-color:transparent;color:#fff}
button.danger{color:#fca5a5}
button.sm{padding:5px 10px;font-size:.76rem}
button:disabled{opacity:.5;cursor:default}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:700}
.b-on{background:rgba(74,222,128,.16);color:var(--green)}
.b-off{background:rgba(154,154,178,.16);color:var(--dim)}
.b-wait{background:rgba(255,206,122,.16);color:var(--gold)}
.b-done{background:rgba(106,64,224,.22);color:var(--accent2)}
.acct{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.acct:last-child{border-bottom:none}
.acct img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--panel2)}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.tabs button{background:none;border:none;color:var(--dim);border-radius:0}
.tabs button.on{background:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--panel2);cursor:pointer;aspect-ratio:4/5}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.sel{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(163,148,238,.25)}
.tile .tag{position:absolute;top:6px;left:6px;background:rgba(20,16,34,.82);color:#fff;padding:2px 7px;border-radius:20px;font-size:.66rem;font-weight:700}
.tile .tag.base{background:rgba(255,206,122,.9);color:#2a1d05}
.tile .acts{position:absolute;bottom:0;left:0;right:0;display:flex;gap:4px;padding:6px;background:linear-gradient(transparent,rgba(10,10,18,.9));opacity:0;transition:opacity .15s}
.tile:hover .acts{opacity:1}
.tile .acts button{flex:1;padding:4px 0;font-size:.68rem;border-radius:7px}
.pack{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.pack .h{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--dim);flex-wrap:wrap}
.compose{display:grid;grid-template-columns:190px 1fr;gap:18px}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{border:1px dashed var(--border);border-radius:12px;padding:10px;text-align:center;font-size:.76rem;color:var(--faint)}
.slot img,.slot video{width:100%;border-radius:8px;display:block;margin-bottom:6px}
.slot .lbl{font-weight:700;color:var(--dim);margin-bottom:6px;font-size:.75rem}
.field{margin-bottom:12px}
.field label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:5px;font-weight:600}
.qitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.qitem:last-child{border-bottom:none}
.qitem .thumbs{display:flex;gap:6px;flex:none}
.qitem .thumbs img,.qitem .thumbs video{width:56px;height:70px;object-fit:cover;border-radius:8px;background:var(--panel2)}
.qitem .body{flex:1;min-width:0;font-size:.84rem}
.qitem .cap{color:var(--dim);white-space:pre-wrap;margin-top:4px;max-height:4.6em;overflow:hidden}
.qitem .when{color:var(--faint);font-size:.75rem;margin-top:4px}
.empty{color:var(--faint);text-align:center;padding:34px 20px;font-size:.88rem}
.msg{padding:14px 16px;border-radius:12px;display:none;margin-bottom:16px;font-size:.9rem}
.msg.show{display:block}
.msg.err{background:rgba(248,113,113,.12);border:1px solid #5b2e2e;color:#fca5a5}
.msg.ok{background:rgba(74,222,128,.12);border:1px solid #2e5b3a;color:#86efac}
@media(max-width:860px){body{padding:18px}.compose{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/admin-business">← 사업체 목록</a>

  <h1><span class="dot"></span> <span id="bizName">…</span> <span id="bizStatus"></span></h1>
  <div class="sub" id="bizMeta"></div>

  <div class="msg err" id="err"></div>
  <div class="msg ok" id="ok"></div>

  <!-- 1. 사업체 정보 -->
  <div class="card">
    <h2>사업체 정보 <span class="hint">업종·참고사항은 AI 캡션 작성에 그대로 쓰입니다</span></h2>
    <div class="row">
      <input id="fName" placeholder="사업체 이름" style="flex:1;min-width:160px">
      <input id="fIndustry" placeholder="업종" style="flex:1;min-width:140px">
      <input id="fMemo" placeholder="참고사항 (말투·강조 포인트)" style="flex:2;min-width:200px">
      <select id="fStatus"><option value="active">운영중</option><option value="paused">일시중지</option></select>
      <button onclick="saveBiz()">저장</button>
    </div>
  </div>

  <!-- 2. 인스타 연결 -->
  <div class="card">
    <h2>인스타그램 연결 <span class="hint">발행에 쓸 계정입니다</span></h2>
    <div id="accts"></div>
    <div class="row" style="margin-top:12px">
      <select id="unlinked" style="flex:1;min-width:200px"><option value="">불러온 미연결 계정 없음</option></select>
      <button onclick="linkAccount()">계정 연결</button>
      <button onclick="syncAccounts()" id="syncBtn">🔄 계정 불러오기</button>
    </div>
  </div>

  <!-- 3. 오리지널 이미지 -->
  <div class="card">
    <h2>오리지널 이미지 <span class="hint">사업체에서 받은 원본 사진·영상. ★ 는 대표 원본</span></h2>
    <div class="row" style="margin-bottom:14px">
      <input type="file" id="file" accept="image/*,video/*" multiple>
      <button class="primary" onclick="upload()" id="upBtn">업로드</button>
    </div>
    <div class="tiles" id="baseTiles"></div>
  </div>

  <!-- 4. 콘텐츠 풀 -->
  <div class="card">
    <h2>콘텐츠 선택 <span class="hint">클릭하면 아래 발행 작성에 담깁니다 (이미지 → 게시물 / 영상 → 릴스)</span></h2>
    <div class="tabs">
      <button id="tabMedia" class="on" onclick="setTab('media')">생성 결과물</button>
      <button id="tabPack" onclick="setTab('pack')">콘텐츠팩</button>
    </div>
    <div id="paneMedia"><div class="tiles" id="mediaTiles"></div></div>
    <div id="panePack" style="display:none">
      <div class="row" style="margin-bottom:14px">
        <input id="packKey" placeholder="팩 ID 또는 공유 ID(share_id)" style="flex:1;min-width:220px">
        <button onclick="linkPack()">팩 연결</button>
      </div>
      <div id="packs"></div>
    </div>
  </div>

  <!-- 5. 발행 작성 -->
  <div class="card">
    <h2>발행 작성 <span class="hint">캡션은 AI가 선택한 사진을 보고 씁니다</span></h2>
    <div class="compose">
      <div class="slots">
        <div class="slot" id="slotImage"><div class="lbl">게시물 이미지</div><span>미선택</span></div>
        <div class="slot" id="slotReel"><div class="lbl">릴스 영상</div><span>미선택</span></div>
      </div>
      <div>
        <div class="row" style="margin-bottom:12px">
          <select id="capType"><option value="feed">피드 게시물</option><option value="reel">릴스</option></select>
          <input id="capTone" placeholder="말투 (예: 친근한)" style="width:150px">
          <input id="capHighlight" placeholder="이번에 강조할 것 (예: 신메뉴 출시)" style="flex:1;min-width:180px">
          <button class="primary" onclick="genCaption()" id="capBtn">✨ AI로 캡션 쓰기</button>
        </div>
        <div class="field">
          <label>게시물 캡션</label>
          <textarea id="imageCaption" rows="4" placeholder="이미지 게시물 캡션"></textarea>
        </div>
        <div class="field">
          <label>릴스 캡션</label>
          <textarea id="reelCaption" rows="3" placeholder="릴스 캡션 (릴스를 올릴 때만)"></textarea>
        </div>
        <div class="field">
          <label>해시태그 (공백/쉼표 구분, # 없이)</label>
          <input id="hashtags" style="width:100%" placeholder="네일아트 강남네일 젤네일">
        </div>
        <div class="row">
          <select id="acctSel" style="min-width:170px"></select>
          <select id="whenMode" onchange="onWhenMode()">
            <option value="now">확정 (다음 발행 루프)</option>
            <option value="at">시각 예약</option>
          </select>
          <input type="datetime-local" id="whenAt" style="display:none">
          <button class="primary" onclick="enqueue()" id="enqBtn">발행 큐에 등록</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 6. 발행 큐 -->
  <div class="card">
    <h2>발행 큐 <span class="hint">예약 건은 지정 시각에 자동 발행됩니다 (1분 주기 확인)</span></h2>
    <div id="queue"></div>
  </div>
</div>

<script>
const BIZ_ID = location.pathname.split('/').filter(Boolean).pop();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isVideo = (u) => /\.(mp4|mov|webm|m4v)$/i.test(u || '');

let state = { business: null, accounts: [], media: [], packs: [], queue: [] };
/** 선택 슬롯 — mediaId(우리 미디어) 또는 url(팩 자산)로 지정한다 */
let sel = { image: null, reel: null };

function flash(kind, text) {
  const el = $(kind === 'err' ? 'err' : 'ok');
  el.textContent = text; el.classList.add('show');
  if (kind !== 'err') setTimeout(() => el.classList.remove('show'), 3000);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearMsg() { $('err').classList.remove('show'); $('ok').classList.remove('show'); }

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 403) throw new Error('관리자 권한이 필요합니다.');
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.success === false) throw new Error(body.error || body.message || `요청 실패 (${res.status})`);
  return body;
}

// ── 로드 ──

async function load() {
  try {
    const d = await api('/api/admin/business/' + BIZ_ID);
    state = { business: d.business, accounts: d.accounts, media: d.media, packs: d.packs, queue: d.queue };
    renderBiz(); renderAccounts(); renderMedia(); renderPacks(); renderQueue(); loadUnlinked();
  } catch (e) { flash('err', e.message); }
}

function renderBiz() {
  const b = state.business;
  document.title = b.name + ' · Doppia Admin';
  $('bizName').textContent = b.name;
  $('bizStatus').innerHTML = b.status === 'paused'
    ? '<span class="badge b-wait">일시중지</span>' : '<span class="badge b-on">운영중</span>';
  $('bizMeta').textContent = [b.industry, b.memo].filter(Boolean).join(' · ') || '업종·참고사항 미입력';
  $('fName').value = b.name || '';
  $('fIndustry').value = b.industry || '';
  $('fMemo').value = b.memo || '';
  $('fStatus').value = b.status || 'active';
}

function renderAccounts() {
  const list = state.accounts;
  $('accts').innerHTML = list.length ? list.map((a) =>
    '<div class="acct">'
    + (a.profile_image ? '<img src="' + esc(a.profile_image) + '" alt="">' : '<img alt="">')
    + '<div style="flex:1;min-width:0">'
    + '<div style="font-weight:600">@' + esc(a.username || a.account_id) + '</div>'
    + '<div style="color:var(--faint);font-size:.78rem">' + (a.followers || 0).toLocaleString() + ' 팔로워 · ' + esc(a.platform) + '</div>'
    + '</div>'
    + (a.status === 'active' ? '<span class="badge b-on">활성</span>' : '<span class="badge b-off">' + esc(a.status) + '</span>')
    + '<button class="sm danger" onclick="unlinkAccount(\'' + a.id + '\')">연결 해제</button>'
    + '</div>').join('')
    : '<div class="empty">연결된 인스타 계정이 없습니다. 아래에서 연결하세요.</div>';

  $('acctSel').innerHTML = list.length
    ? list.map((a) => '<option value="' + a.id + '">@' + esc(a.username || a.account_id) + '</option>').join('')
    : '<option value="">계정 없음</option>';
}

async function loadUnlinked() {
  try {
    const { data } = await api('/api/admin/business/accounts/unlinked');
    $('unlinked').innerHTML = data.length
      ? data.map((a) => '<option value="' + a.id + '">@' + esc(a.username || a.account_id) + ' (' + (a.followers || 0).toLocaleString() + ')</option>').join('')
      : '<option value="">미연결 계정 없음 — 계정 불러오기를 눌러보세요</option>';
  } catch (e) { /* 목록 실패가 화면 전체를 막을 이유는 없다 */ }
}

// ── 타일(선택 가능한 콘텐츠) ──

function tileHtml(item, opts = {}) {
  const url = item.url;
  const key = item.id ? 'id:' + item.id : 'url:' + url;
  const on = (sel.image && sel.image.key === key) || (sel.reel && sel.reel.key === key);
  const media = isVideo(url) || item.media_type === 'video'
    ? '<video src="' + esc(url) + '" muted></video>'
    : '<img src="' + esc(url) + '" alt="" loading="lazy">';
  const tag = item.is_base ? '<div class="tag base">★ 원본</div>'
    : opts.label ? '<div class="tag">' + esc(opts.label) + '</div>' : '';
  const acts = opts.acts ? '<div class="acts">' + opts.acts + '</div>' : '';
  return '<div class="tile' + (on ? ' sel' : '') + '" onclick="pick(\'' + key + '\')">' + media + tag + acts + '</div>';
}

/** 클릭 → 미디어 타입에 맞는 슬롯에 담는다(같은 걸 다시 누르면 해제) */
function pick(key) {
  const item = findByKey(key);
  if (!item) return;
  const slot = (isVideo(item.url) || item.media_type === 'video') ? 'reel' : 'image';
  sel[slot] = (sel[slot] && sel[slot].key === key) ? null : { key, url: item.url, mediaId: item.id || null };
  renderMedia(); renderPacks(); renderSlots();
}

function findByKey(key) {
  if (key.startsWith('id:')) return state.media.find((m) => m.id === key.slice(3));
  const url = key.slice(4);
  for (const p of state.packs) {
    const a = p.assets.find((x) => x.url === url);
    if (a) return a;
  }
  return null;
}

function renderMedia() {
  // 원본 = 관리자가 직접 올린 것(source=upload). 나머지(편입·계정 미디어)는 결과물 탭으로.
  const originals = state.media.filter((m) => m.source === 'upload');
  const generated = state.media.filter((m) => m.source !== 'upload');

  $('baseTiles').innerHTML = originals.length
    ? originals.map((m) => tileHtml(m, {
        acts: (m.is_base ? '' : '<button class="sm" onclick="event.stopPropagation();setBase(\'' + m.id + '\')">★ 원본</button>')
          + '<button class="sm danger" onclick="event.stopPropagation();delMedia(\'' + m.id + '\')">삭제</button>',
      })).join('')
    : '<div class="empty">업로드된 원본이 없습니다.</div>';

  $('mediaTiles').innerHTML = generated.length
    ? generated.map((m) => tileHtml(m, {
        acts: '<button class="sm danger" onclick="event.stopPropagation();delMedia(\'' + m.id + '\')">삭제</button>',
      })).join('')
    : '<div class="empty">생성 결과물이 없습니다. 콘텐츠팩 탭에서 팩을 연결하세요.</div>';
}

function renderPacks() {
  $('packs').innerHTML = state.packs.length ? state.packs.map((p) =>
    '<div class="pack"><div class="h">'
    + '<b>' + esc(p.vertical || '팩') + '</b>'
    + '<span>' + esc(p.product || '') + '</span>'
    + '<span class="badge ' + (p.status === 'ready' ? 'b-on' : 'b-wait') + '">' + esc(p.status) + '</span>'
    + '<span style="color:var(--faint)">#' + esc(p.pack_id) + '</span>'
    + '<button class="sm danger" style="margin-left:auto" onclick="unlinkPack(\'' + p.pack_id + '\')">연결 해제</button>'
    + '</div><div class="tiles">'
    + (p.assets.length ? p.assets.map((a) => tileHtml(a, { label: a.label || a.kind })).join('')
       : '<div class="empty">자산이 없습니다.</div>')
    + '</div></div>').join('')
    : '<div class="empty">연결된 콘텐츠팩이 없습니다. 위에 팩 ID를 넣어 연결하세요.</div>';
}

function renderSlots() {
  for (const slot of ['image', 'reel']) {
    const el = $(slot === 'image' ? 'slotImage' : 'slotReel');
    const label = slot === 'image' ? '게시물 이미지' : '릴스 영상';
    const s = sel[slot];
    el.innerHTML = '<div class="lbl">' + label + '</div>' + (s
      ? (isVideo(s.url) ? '<video src="' + esc(s.url) + '" muted></video>' : '<img src="' + esc(s.url) + '" alt="">')
        + '<button class="sm" onclick="clearSlot(\'' + slot + '\')">해제</button>'
      : '<span>미선택</span>');
  }
}
function clearSlot(slot) { sel[slot] = null; renderMedia(); renderPacks(); renderSlots(); }

function setTab(t) {
  $('tabMedia').classList.toggle('on', t === 'media');
  $('tabPack').classList.toggle('on', t === 'pack');
  $('paneMedia').style.display = t === 'media' ? '' : 'none';
  $('panePack').style.display = t === 'pack' ? '' : 'none';
}

// ── 큐 ──

const QSTATUS = {
  pending: ['b-off', '작성중'], confirmed: ['b-wait', '발행 대기'], scheduled: ['b-wait', '예약'],
  publishing: ['b-wait', '발행중'], posted: ['b-done', '게시됨'], cancelled: ['b-off', '취소'],
};

function renderQueue() {
  $('queue').innerHTML = state.queue.length ? state.queue.map((q) => {
    const [cls, label] = QSTATUS[q.status] || ['b-off', q.status];
    const thumb = (u) => u ? (isVideo(u) ? '<video src="' + esc(u) + '" muted></video>' : '<img src="' + esc(u) + '" alt="">') : '';
    const when = q.status === 'posted'
      ? '게시: ' + fmt(q.posted_at)
      : q.scheduled_at ? '예약: ' + fmt(q.scheduled_at) : '다음 발행 루프에서 게시';
    const links = [q.image_post_url && '<a href="' + esc(q.image_post_url) + '" target="_blank" rel="noopener">게시물</a>',
                   q.reel_post_url && '<a href="' + esc(q.reel_post_url) + '" target="_blank" rel="noopener">릴스</a>']
                   .filter(Boolean).join(' · ');
    const done = q.status === 'posted' || q.status === 'publishing';
    return '<div class="qitem">'
      + '<div class="thumbs">' + thumb(q.image_url) + thumb(q.reel_url) + '</div>'
      + '<div class="body">'
      + '<span class="badge ' + cls + '">' + label + '</span> <b>@' + esc(q.account_username || '') + '</b>'
      + '<div class="cap">' + esc(q.image_caption || q.reel_caption || '(캡션 없음)') + '</div>'
      + '<div class="when">' + when + (links ? ' · ' + links : '') + '</div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:6px">'
      + (done ? '' : '<button class="sm" onclick="reschedule(\'' + q.id + '\')">시각 변경</button>'
                   + '<button class="sm primary" onclick="publishNow(\'' + q.id + '\')">지금 발행</button>')
      + '<button class="sm danger" onclick="delQueue(\'' + q.id + '\')">삭제</button>'
      + '</div></div>';
  }).join('') : '<div class="empty">발행 큐가 비어 있습니다.</div>';
}

const fmt = (iso) => iso ? new Date(iso).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '-';

// ── 액션 ──

async function saveBiz() {
  clearMsg();
  try {
    await api('/api/admin/business/' + BIZ_ID, {
      method: 'PATCH',
      body: JSON.stringify({
        name: $('fName').value.trim(), industry: $('fIndustry').value.trim(),
        memo: $('fMemo').value.trim(), status: $('fStatus').value,
      }),
    });
    flash('ok', '저장했습니다.');
    load();
  } catch (e) { flash('err', e.message); }
}

async function syncAccounts() {
  clearMsg(); $('syncBtn').disabled = true;
  try {
    const { data } = await api('/api/admin/business/accounts/sync', { method: 'POST' });
    flash('ok', data.length + '개 계정을 불러왔습니다.');
    loadUnlinked();
  } catch (e) { flash('err', e.message); }
  finally { $('syncBtn').disabled = false; }
}

async function linkAccount() {
  clearMsg();
  const accountId = $('unlinked').value;
  if (!accountId) return flash('err', '연결할 계정을 선택하세요.');
  try {
    await api('/api/admin/business/' + BIZ_ID + '/accounts', { method: 'POST', body: JSON.stringify({ accountId }) });
    flash('ok', '계정을 연결했습니다.');
    load();
  } catch (e) { flash('err', e.message); }
}

async function unlinkAccount(accountId) {
  if (!confirm('이 계정의 연결을 해제할까요? (계정 자체는 삭제되지 않습니다)')) return;
  clearMsg();
  try {
    await api('/api/admin/business/' + BIZ_ID + '/accounts/' + accountId, { method: 'DELETE' });
    load();
  } catch (e) { flash('err', e.message); }
}

async function upload() {
  clearMsg();
  const files = $('file').files;
  if (!files.length) return flash('err', '업로드할 파일을 선택하세요.');
  $('upBtn').disabled = true;
  try {
    for (const f of files) {
      const fd = new FormData();
      fd.append('file', f);
      // FormData는 Content-Type을 브라우저가 boundary와 함께 정해야 하므로 헤더를 넘기지 않는다
      const res = await fetch('/api/admin/business/' + BIZ_ID + '/media', { method: 'POST', body: fd });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.success === false) throw new Error(body.error || '업로드 실패: ' + f.name);
    }
    $('file').value = '';
    flash('ok', files.length + '개 업로드했습니다.');
    load();
  } catch (e) { flash('err', e.message); }
  finally { $('upBtn').disabled = false; }
}

async function setBase(mediaId) {
  clearMsg();
  try {
    await api('/api/admin/business/' + BIZ_ID + '/media/' + mediaId + '/base', { method: 'PATCH' });
    load();
  } catch (e) { flash('err', e.message); }
}

async function delMedia(mediaId) {
  if (!confirm('이 미디어를 삭제할까요?')) return;
  clearMsg();
  try {
    await api('/api/admin/business/' + BIZ_ID + '/media/' + mediaId, { method: 'DELETE' });
    load();
  } catch (e) { flash('err', e.message); }
}

async function linkPack() {
  clearMsg();
  const pack = $('packKey').value.trim();
  if (!pack) return flash('err', '팩 ID 또는 공유 ID를 입력하세요.');
  try {
    await api('/api/admin/business/' + BIZ_ID + '/packs', { method: 'POST', body: JSON.stringify({ pack }) });
    $('packKey').value = '';
    load();
  } catch (e) { flash('err', e.message); }
}

async function unlinkPack(packId) {
  clearMsg();
  try {
    await api('/api/admin/business/' + BIZ_ID + '/packs/' + packId, { method: 'DELETE' });
    load();
  } catch (e) { flash('err', e.message); }
}

/** 선택된 미디어를 근거로 캡션 초안을 받는다 — 없으면 업종·참고사항만으로 쓴다 */
async function genCaption() {
  clearMsg();
  const type = $('capType').value;
  const s = type === 'reel' ? sel.reel : sel.image;
  $('capBtn').disabled = true;
  try {
    const { data } = await api('/api/admin/business/' + BIZ_ID + '/caption', {
      method: 'POST',
      body: JSON.stringify({
        mediaId: s && s.mediaId ? s.mediaId : undefined,
        url: s && !s.mediaId ? s.url : undefined,
        postType: type,
        tone: $('capTone').value.trim() || undefined,
        highlight: $('capHighlight').value.trim() || undefined,
        language: 'ko',
      }),
    });
    const body = data.caption + (data.callToAction ? '\n\n' + data.callToAction : '');
    if (type === 'reel') $('reelCaption').value = body; else $('imageCaption').value = body;
    $('hashtags').value = (data.hashtags || []).join(' ');
    flash('ok', 'AI 캡션을 채웠습니다. 확인하고 수정하세요.');
  } catch (e) { flash('err', e.message); }
  finally { $('capBtn').disabled = false; }
}

function onWhenMode() {
  $('whenAt').style.display = $('whenMode').value === 'at' ? '' : 'none';
}

/** datetime-local(로컬 시각) → ISO. 브라우저 타임존 기준으로 해석된다. */
function scheduledAtValue() {
  if ($('whenMode').value !== 'at') return undefined;
  const v = $('whenAt').value;
  if (!v) throw new Error('예약 시각을 입력하세요.');
  return new Date(v).toISOString();
}

async function enqueue() {
  clearMsg();
  if (!sel.image && !sel.reel) return flash('err', '게시할 이미지 또는 릴스를 선택하세요.');
  $('enqBtn').disabled = true;
  try {
    const tags = $('hashtags').value.split(/[\s,]+/).map((t) => t.replace(/^#/, '')).filter(Boolean);
    await api('/api/admin/business/' + BIZ_ID + '/queue', {
      method: 'POST',
      body: JSON.stringify({
        accountId: $('acctSel').value || undefined,
        imageMediaId: sel.image && sel.image.mediaId ? sel.image.mediaId : undefined,
        imageUrl: sel.image && !sel.image.mediaId ? sel.image.url : undefined,
        reelMediaId: sel.reel && sel.reel.mediaId ? sel.reel.mediaId : undefined,
        reelUrl: sel.reel && !sel.reel.mediaId ? sel.reel.url : undefined,
        imageCaption: $('imageCaption').value.trim() || undefined,
        reelCaption: $('reelCaption').value.trim() || undefined,
        hashtags: tags,
        scheduledAt: scheduledAtValue(),
      }),
    });
    sel = { image: null, reel: null };
    $('imageCaption').value = $('reelCaption').value = $('hashtags').value = '';
    flash('ok', '발행 큐에 등록했습니다.');
    renderSlots();
    load();
  } catch (e) { flash('err', e.message); }
  finally { $('enqBtn').disabled = false; }
}

async function reschedule(queueId) {
  const input = prompt('예약 시각을 입력하세요 (예: 2026-08-15 18:00). 비우면 예약을 걷고 대기 상태로 둡니다.');
  if (input === null) return;
  clearMsg();
  try {
    let scheduledAt = null;
    if (input.trim()) {
      const d = new Date(input.trim().replace(' ', 'T'));
      if (isNaN(d)) throw new Error('시각 형식을 알아볼 수 없습니다.');
      scheduledAt = d.toISOString();
    }
    await api('/api/admin/business/' + BIZ_ID + '/queue/' + queueId, {
      method: 'PATCH', body: JSON.stringify({ scheduledAt }),
    });
    flash('ok', scheduledAt ? '예약 시각을 변경했습니다.' : '예약을 해제했습니다.');
    load();
  } catch (e) { flash('err', e.message); }
}

async function publishNow(queueId) {
  if (!confirm('지금 인스타그램에 발행할까요?')) return;
  clearMsg();
  try {
    await api('/api/admin/business/' + BIZ_ID + '/queue/' + queueId + '/publish', { method: 'POST' });
    flash('ok', '발행 요청을 보냈습니다.');
    load();
  } catch (e) { flash('err', e.message); }
}

async function delQueue(queueId) {
  if (!confirm('이 발행 건을 삭제할까요?')) return;
  clearMsg();
  try {
    await api('/api/admin/business/' + BIZ_ID + '/queue/' + queueId, { method: 'DELETE' });
    load();
  } catch (e) { flash('err', e.message); }
}

renderSlots();
load();
</script>
