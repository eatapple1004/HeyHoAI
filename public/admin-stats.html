<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 · Doppia Admin</title>
<style>
:root{--accent:#6a40e0;--accent2:#a394ee;--bg:#0c0c14;--panel:#15151f;--panel2:#1c1c28;
  --text:#edecf5;--dim:#9a9ab2;--faint:#6a6a85;--border:#2a2a3a;--green:#4ade80;--red:#f87171;--gold:#ffce7a;--pink:#d9608f;
  --font:'Pretendard','Apple SD Gothic Neo','맑은 고딕',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:32px;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:1.7rem;font-weight:800;display:flex;align-items:center;gap:10px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink))}
.sub{color:var(--dim);margin:6px 0 22px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.nav a{font-size:.82rem;font-weight:600;color:var(--dim);text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:7px 13px}
.nav a:hover{color:var(--text);border-color:var(--accent2)}
.nav a.on{color:#fff;background:linear-gradient(180deg,#7c52e8,#5c33c2);border-color:transparent}
.sechead{font-size:.8rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:26px 2px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px}
.stat .k{font-size:.78rem;color:var(--dim);font-weight:600;margin-bottom:8px}
.stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.5px}
.stat .s{font-size:.76rem;color:var(--faint);margin-top:5px}
.stat .v.grn{color:var(--green)} .stat .v.gld{color:var(--gold)} .stat .v.pnk{color:var(--pink)} .stat .v.acc{color:var(--accent2)}
.panelbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:600;font-size:.78rem}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar-inline{display:inline-block;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--pink));vertical-align:middle;margin-right:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.refresh{float:right;background:var(--panel);border:1px solid var(--border);color:var(--dim);font-family:inherit;font-size:.8rem;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer}
.refresh:hover{color:var(--text);border-color:var(--accent2)}
.err{background:rgba(248,113,113,.12);border:1px solid #5b2e2e;color:#fca5a5;padding:14px 16px;border-radius:12px;display:none;margin-bottom:16px}
.err.show{display:block}
.muted{color:var(--faint);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span> 통계 <button class="refresh" onclick="load()">↻ 새로고침</button></h1>
  <div class="sub">유저 · 크리에이션 · 결제 기본 집계. (관리자 전용)</div>
  <div class="nav">
    <a href="/admin-creations">🖼 크리에이션</a>
    <a href="/admin-stats" class="on">📊 통계</a>
    <a href="/admin-trials">🎟 체험 계정</a>
    <a href="/admin-templates">🧩 템플릿</a>
  </div>

  <div class="err" id="err"></div>

  <div class="sechead">유저</div>
  <div class="cards" id="userCards"><div class="muted">불러오는 중…</div></div>

  <div class="sechead">크리에이션</div>
  <div class="cards" id="creationCards"></div>

  <div class="sechead">결제 (누적)</div>
  <div class="cards" id="payCards"></div>

  <div class="two">
    <div>
      <div class="sechead">결제사별</div>
      <div class="panelbox"><table><thead><tr><th>결제사</th><th class="num">주문</th><th class="num">매출($)</th></tr></thead><tbody id="providerRows"></tbody></table></div>
    </div>
    <div>
      <div class="sechead">인기 템플릿 (최근 30일)</div>
      <div class="panelbox"><table><tbody id="tplRows"></tbody></table></div>
    </div>
  </div>

  <div class="sechead">최근 결제</div>
  <div class="panelbox"><table><thead><tr><th>일시</th><th>유저</th><th>팩</th><th class="num">$</th><th class="num">◈</th><th>결제사</th></tr></thead><tbody id="recentRows"></tbody></table></div>
</div>

<script>
const $=id=>document.getElementById(id);
function showErr(m){const e=$('err');e.textContent='⚠ '+m;e.classList.add('show');}
function clearErr(){$('err').classList.remove('show');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function n(v){return (v==null?0:Number(v)).toLocaleString('ko-KR');}
function fmtDate(s){try{return new Date(s).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function card(k,v,cls,s){return `<div class="stat"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}

async function load(){
  clearErr();
  try{
    const res=await fetch('/api/admin/stats');
    if(res.status===403){showErr('관리자 권한이 필요합니다. admin 계정으로 로그인하세요.');return;}
    const d=await res.json();
    if(!res.ok||!d.success){showErr(d.error||'불러오기 실패');return;}
    const s=d.data;

    $('userCards').innerHTML=[
      card('전체 유저', n(s.users.total), 'acc'),
      card('신규 (24h)', n(s.users.new1d)),
      card('신규 (7d)', n(s.users.new7d)),
      card('체험 계정', n(s.users.trials), 'gld'),
      card('미사용 크레딧', '◈'+n(s.users.credit_outstanding), '', '전 유저 잔액 합'),
    ].join('');

    $('creationCards').innerHTML=[
      card('전체 생성물', n(s.creations.total)),
      card('공개', n(s.creations.public), 'grn'),
      card('비공개', n(s.creations.private), 'pnk'),
      card('실패', n(s.creations.failed), s.creations.failed?'':''),
      card('최근 24h', n(s.creations.last1d), '', '7일: '+n(s.creations.last7d)),
    ].join('');

    $('payCards').innerHTML=[
      card('총 주문', n(s.payments.orders)),
      card('총 매출', '$'+n(s.payments.revenue_usd), 'grn'),
      card('판매 크레딧', '◈'+n(s.payments.credits_sold), 'gld'),
    ].join('');

    $('providerRows').innerHTML=(s.byProvider||[]).length
      ? s.byProvider.map(r=>`<tr><td>${esc(r.provider)}</td><td class="num">${n(r.orders)}</td><td class="num">$${n(r.revenue)}</td></tr>`).join('')
      : `<tr><td colspan="3" class="muted">결제 없음</td></tr>`;

    const tpl=s.topTemplates||[]; const max=tpl.reduce((m,r)=>Math.max(m,r.n),0)||1;
    $('tplRows').innerHTML=tpl.length
      ? tpl.map(r=>`<tr><td><span class="bar-inline" style="width:${Math.round(r.n/max*90)+10}px"></span>${esc(r.name)}</td><td class="num">${n(r.n)}</td></tr>`).join('')
      : `<tr><td class="muted">데이터 없음</td></tr>`;

    $('recentRows').innerHTML=(s.recentPayments||[]).length
      ? s.recentPayments.map(r=>`<tr><td>${fmtDate(r.created_at)}</td><td>${esc(r.email||'—')}</td><td>${esc(r.product||'')}</td><td class="num">${n(r.amount_usd)}</td><td class="num">${n(r.credits)}</td><td>${esc(r.provider)}</td></tr>`).join('')
      : `<tr><td colspan="6" class="muted">결제 없음</td></tr>`;
  }catch(e){showErr('네트워크 오류');}
}
load();
</script>
</body>
</html>
