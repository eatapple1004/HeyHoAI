<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사용자 상세 · Doppia Admin</title>
<style>
:root{--accent:#6a40e0;--accent2:#a394ee;--bg:#0c0c14;--panel:#15151f;--panel2:#1c1c28;
  --text:#edecf5;--dim:#9a9ab2;--faint:#6a6a85;--border:#2a2a3a;--green:#4ade80;--red:#f87171;--gold:#ffce7a;--pink:#d9608f;
  --font:'Pretendard','Apple SD Gothic Neo','맑은 고딕',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:32px;min-height:100vh}
body.prod{background:#140c0e}
.wrap{max-width:1300px;margin:0 auto}
a{color:var(--accent2)}
.back{display:inline-block;color:var(--dim);text-decoration:none;font-size:.85rem;margin-bottom:14px}
.back:hover{color:var(--text)}
h1{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--dim);margin:6px 0 20px;font-size:.9rem}
.envwarn{display:none;background:rgba(248,113,113,.12);border:1px solid #5b2e2e;color:#fca5a5;
  padding:10px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px}
body.prod .envwarn{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.card h2 .cnt{color:var(--faint);font-size:.78rem;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 20px}
.kv div span{display:block}
.kv .k{color:var(--faint);font-size:.72rem;margin-bottom:2px}
.kv .v{font-size:.92rem;word-break:break-all}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700}
.t-admin{background:rgba(255,206,122,.16);color:var(--gold)}
.t-ok{background:rgba(74,222,128,.14);color:var(--green)}
.t-bad{background:rgba(248,113,113,.16);color:var(--red)}
.t-wait{background:rgba(154,154,178,.16);color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}
th{color:var(--faint);font-size:.72rem;font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap-t{white-space:normal;word-break:break-word;max-width:520px}
.plus{color:var(--green)}
.minus{color:var(--red)}
.empty{color:var(--faint);padding:18px 0;font-size:.86rem}
.msg{padding:12px 15px;border-radius:11px;margin-bottom:14px;display:none;font-size:.88rem}
.msg.show{display:block}
.msg.err{background:rgba(248,113,113,.12);border:1px solid #5b2e2e;color:#fca5a5}
.scroll{overflow-x:auto}
@media(max-width:820px){body{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="backLink" href="/admin-users">← 사용자 목록</a>
  <h1 id="title">…</h1>
  <div class="sub" id="sub"></div>

  <div class="envwarn">🔴 <b>prod — 실서비스 데이터</b>입니다. 조회 전용이지만 화면 공유·캡처 시 개인정보가 노출됩니다.</div>
  <div class="msg err" id="err"></div>

  <div class="card"><h2>계정</h2><div class="kv" id="acct"></div></div>
  <div class="card"><h2>이미지 <span class="cnt" id="cImg"></span></h2><div class="scroll" id="imgs"></div></div>
  <div class="card"><h2>영상 <span class="cnt" id="cVid"></span></h2><div class="scroll" id="vids"></div></div>
  <div class="card"><h2>UGC <span class="cnt" id="cUgc"></span></h2><div class="scroll" id="ugcs"></div></div>
  <div class="card"><h2>콘텐츠팩 <span class="cnt" id="cPack"></span></h2><div class="scroll" id="packs"></div></div>
  <div class="card"><h2>결제 <span class="cnt" id="cPay"></span></h2><div class="scroll" id="pays"></div></div>
  <div class="card"><h2>크레딧 내역 <span class="cnt" id="cLed"></span></h2><div class="scroll" id="ledger"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 경로에서 id, 쿼리에서 환경 — 목록에서 넘어온 환경을 그대로 이어받아야 같은 DB를 본다.
const USER_ID = location.pathname.split('/').filter(Boolean).pop();
const ENV = new URLSearchParams(location.search).get('env') || '';

const fmt = (iso) => iso ? new Date(iso).toLocaleString('ko-KR',
  { year: '2-digit', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const cut = (s, n) => { const t = String(s ?? ''); return t.length > n ? t.slice(0, n) + '…' : (t || '—'); };
const statusTag = (s) => {
  const cls = /succeed|done|posted|paid|completed/i.test(s || '') ? 't-ok'
            : /fail|error|cancel|reject/i.test(s || '') ? 't-bad' : 't-wait';
  return '<span class="tag ' + cls + '">' + esc(s || '—') + '</span>';
};

/** 표 하나 그리기 — 비면 그 사실을 적는다(빈 표는 로딩 실패와 구분이 안 된다) */
function table(el, rows, cols, emptyText) {
  if (!rows.length) { $(el).innerHTML = '<div class="empty">' + emptyText + '</div>'; return; }
  $(el).innerHTML = '<table><thead><tr>' + cols.map((c) => '<th>' + c.t + '</th>').join('')
    + '</tr></thead><tbody>' + rows.map((r) => '<tr>'
    + cols.map((c) => '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.v(r) + '</td>').join('')
    + '</tr>').join('') + '</tbody></table>';
}

async function load() {
  try {
    const res = await fetch('/api/admin/users/' + encodeURIComponent(USER_ID) + (ENV ? '?env=' + encodeURIComponent(ENV) : ''),
      { headers: { 'Content-Type': 'application/json' } });
    if (res.status === 403) throw new Error('관리자 권한이 필요합니다.');
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.success === false) throw new Error(body.error || body.message || ('요청 실패 (' + res.status + ')'));
    const d = body.data;
    const u = d.user;

    if (d.env === 'production') document.body.classList.add('prod');
    $('backLink').href = '/admin-users' + (ENV ? '?env=' + encodeURIComponent(ENV) : '');
    $('title').innerHTML = esc(u.email)
      + (u.role === 'admin' ? ' <span class="tag t-admin">관리자</span>' : '');
    $('sub').textContent = (u.display_name || '이름 없음') + ' · ' + d.label + ' (DB ' + d.db + ')';

    $('acct').innerHTML = [
      ['가입', fmt(u.created_at)], ['가입 방식', u.via_google ? '구글' : '이메일'],
      ['플랜', u.plan || '—'], ['상태', u.status || '—'],
      ['크레딧 잔액', (u.credit_balance || 0).toLocaleString()], ['포인트', (u.point_balance || 0).toLocaleString()],
      ['회사', u.company_name || '—'], ['체험 계정', u.is_trial ? ('예 · ' + (u.trial_days || 0) + '일') : '아니오'],
      ['추천 코드', u.referral_code || '—'], ['id', u.id],
    ].map(([k, v]) => '<div><span class="k">' + k + '</span><span class="v">' + esc(v) + '</span></div>').join('');

    $('cImg').textContent = d.images.length + '건 (최근 60)';
    table('imgs', d.images, [
      { t: '만든 시각', v: (r) => fmt(r.created_at) },
      { t: '프롬프트', cls: 'wrap-t', v: (r) => esc(cut(r.prompt_text, 220)) },
      { t: '모델', v: (r) => esc(r.model || '—') },
      { t: '스타일', v: (r) => esc(r.style_preset || '—') },
    ], '만든 이미지가 없습니다.');

    $('cVid').textContent = d.videos.length + '건';
    table('vids', d.videos, [
      { t: '만든 시각', v: (r) => fmt(r.created_at) },
      { t: '상태', v: (r) => statusTag(r.status) },
      { t: '프롬프트', cls: 'wrap-t', v: (r) => esc(cut(r.prompt, 180)) },
      { t: '모드', v: (r) => esc(r.mode || '—') },
      { t: '차감', cls: 'num', v: (r) => (r.charge_amount || 0).toLocaleString() },
      { t: '결과', v: (r) => r.result_url ? '<a href="' + esc(r.result_url) + '" target="_blank" rel="noopener">열기</a>' : (r.error ? '<span class="t-bad">' + esc(cut(r.error, 60)) + '</span>' : '—') },
    ], '만든 영상이 없습니다.');

    $('cUgc').textContent = d.ugc.length + '건';
    table('ugcs', d.ugc, [
      { t: '만든 시각', v: (r) => fmt(r.created_at) },
      { t: '상태', v: (r) => statusTag(r.status) },
      { t: '제목·제품', cls: 'wrap-t', v: (r) => esc(cut(r.title || r.product, 120)) },
      { t: '컨셉', cls: 'wrap-t', v: (r) => esc(cut(r.concept, 160)) },
      { t: '컷', cls: 'num', v: (r) => r.n_clips ?? '—' },
      { t: '차감', cls: 'num', v: (r) => (r.charge_amount || 0).toLocaleString() },
      { t: '결과', v: (r) => r.result_url ? '<a href="' + esc(r.result_url) + '" target="_blank" rel="noopener">열기</a>' : '—' },
    ], '만든 UGC가 없습니다.');

    $('cPack').textContent = d.packs.length + '건';
    table('packs', d.packs, [
      { t: '만든 시각', v: (r) => fmt(r.created_at) },
      { t: '상태', v: (r) => statusTag(r.status) },
      { t: '제품', cls: 'wrap-t', v: (r) => esc(cut(r.product, 140)) },
      { t: '분야', v: (r) => esc(r.vertical || '—') },
      { t: '컷', cls: 'num', v: (r) => r.stills ?? 0 },
      { t: '오류', cls: 'wrap-t', v: (r) => r.error ? esc(cut(r.error, 90)) : '—' },
    ], '만든 팩이 없습니다.');

    $('cPay').textContent = d.payments.length + '건';
    table('pays', d.payments, [
      { t: '결제 시각', v: (r) => fmt(r.created_at) },
      { t: '수단', v: (r) => esc(r.provider || '—') },
      { t: '상품', v: (r) => esc(r.product || '—') },
      { t: '금액(USD)', cls: 'num', v: (r) => r.amount_usd ?? '—' },
      { t: '크레딧', cls: 'num', v: (r) => (r.credits || 0).toLocaleString() },
      { t: '주문번호', v: (r) => esc(r.order_id || '—') },
    ], '결제 내역이 없습니다.');

    $('cLed').textContent = d.ledger.length + '건 (최근 60)';
    table('ledger', d.ledger, [
      { t: '시각', v: (r) => fmt(r.created_at) },
      { t: '증감', cls: 'num', v: (r) => '<span class="' + (r.amount >= 0 ? 'plus' : 'minus') + '">'
          + (r.amount >= 0 ? '+' : '') + Number(r.amount).toLocaleString() + '</span>' },
      { t: '잔액', cls: 'num', v: (r) => (r.balance_after ?? 0).toLocaleString() },
      { t: '종류', v: (r) => esc(r.type || '—') },
      { t: '설명', cls: 'wrap-t', v: (r) => esc(cut(r.description, 160)) },
    ], '크레딧 내역이 없습니다.');
  } catch (e) {
    $('err').textContent = e.message; $('err').classList.add('show');
  }
}

load();
</script>
</body>
</html>
