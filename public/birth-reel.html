<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyHoAI - 출산 릴스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a2e;
    --border: #2a2a3e; --text: #e4e4ed; --dim: #8888a0;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00b894;
    --red: #ff7675; --orange: #fdcb6e;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent2); }
  header nav { display: flex; gap: 16px; }
  header nav a { color: var(--dim); text-decoration: none; font-size: 13px; font-weight: 500; }
  header nav a:hover, header nav a.active { color: var(--accent2); }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); text-decoration: none; font-size: 13px; margin-bottom: 20px; }
  .back-link:hover { color: var(--accent2); }

  .flow-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .flow-desc { font-size: 13px; color: var(--dim); margin-bottom: 24px; }

  .progress-bar { display: flex; gap: 4px; margin-bottom: 28px; }
  .progress-step {
    flex: 1; height: 36px; border-radius: 6px; background: var(--surface2);
    transition: all 0.3s; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 600; color: var(--dim);
    border: 1px solid transparent;
    padding: 0 6px; text-align: center; line-height: 1.1;
  }
  .progress-step:hover { border-color: var(--accent); color: var(--accent2); }
  .progress-step.done { background: rgba(0,184,148,0.15); color: var(--green); border-color: var(--green); }
  .progress-step.active { background: rgba(108,92,231,0.15); color: var(--accent2); border-color: var(--accent); }

  .step-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 16px; display: none;
  }
  .step-card.active { display: block; }
  .step-card h3 { font-size: 16px; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
  .step-card .step-num { font-size: 12px; color: var(--dim); margin-bottom: 16px; }
  .step-card .step-desc { font-size: 13px; color: var(--dim); margin-bottom: 16px; line-height: 1.6; }

  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .form-input {
    width: 100%; padding: 10px 12px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13px; font-family: inherit;
  }
  .form-input:focus { outline: none; border-color: var(--accent); }
  textarea.form-input { min-height: 80px; resize: vertical; }
  .form-group { margin-bottom: 14px; }

  .ref-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .ref-item {
    width: 64px; height: 64px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); background: var(--surface2); position: relative;
  }
  .ref-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref-item .ref-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 2px 4px; text-align: center;
  }
  .ref-item.missing { display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 10px; text-align: center; padding: 4px; }

  .result-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .result-item {
    position: relative; cursor: zoom-in;
    border: 3px solid transparent; border-radius: 10px; overflow: hidden;
  }
  .result-item.selected { border-color: var(--green); }
  .result-item img { width: 140px; height: 140px; object-fit: cover; display: block; }
  .result-item .dl-btn {
    position: absolute; top: 4px; right: 4px;
    background: rgba(0,0,0,0.6); color: #fff; width: 22px; height: 22px;
    border-radius: 4px; text-decoration: none; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .btn-group { display: flex; gap: 8px; margin-top: 20px; }
  .btn-prev {
    padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--dim); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-next {
    flex: 1; padding: 10px 20px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    color: white; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .gen-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg,var(--accent),#a29bfe);
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 300; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); color: white; }
  .toast.error { background: var(--red); color: white; }

  .model-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .model-row select {
    padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; font-size: 12px; font-family: inherit;
  }

  .video-result video { width: 100%; max-height: 480px; background: #000; border-radius: 8px; }

  /* Step 7에서만 컨테이너를 넓혀 에디터가 좌우로 펴지도록 */
  .container { transition: max-width 0.25s ease; }
  .container.wide { max-width: 1480px; padding: 24px; }
  #step7 .container { max-width: none; margin: 0; padding: 0; }
</style>
<link rel="stylesheet" href="/editor-core.css">
</head>
<body>

<header>
  <h1>HeyHoAI</h1>
  <nav>
    <a href="/heyhoai/image/generater/page">Image Generator</a>
    <a href="/heyhoai/character/page">Characters</a>
    <a href="/heyhoai/accounts/page">Accounts</a>
    <a href="/heyhoai/templates/page" class="active">Templates</a>
    <a href="/heyhoai/editor/page">Editor</a>
    <a href="/heyhoai/logs/page">Logs</a>
  </nav>
</header>

<div class="container">
  <a class="back-link" href="/heyhoai/templates/page">&larr; Back to Templates</a>

  <div class="flow-title">&#128118; 출산 릴스</div>
  <div class="flow-desc">엄마/아빠 캐릭터를 만들고 결혼식·출산·신생아 장면을 거쳐 영상까지 완성하는 6단계 흐름입니다.</div>

  <!-- Saved data -->
  <div class="form-group" style="display:flex;gap:8px;align-items:center;">
    <select class="form-input" id="savedSelect" style="flex:1;">
      <option value="">-- 저장된 데이터 불러오기 --</option>
    </select>
    <button onclick="saveTemplateData()" style="padding:10px 16px;border:none;border-radius:8px;background:var(--green);color:white;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Save</button>
    <button onclick="deleteTemplateData()" style="padding:10px 16px;border:none;border-radius:8px;background:transparent;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Delete</button>
  </div>

  <div class="progress-bar">
    <div class="progress-step active" id="prog1" onclick="goStep(1)">1. 엄마</div>
    <div class="progress-step" id="prog2" onclick="goStep(2)">2. 아빠</div>
    <div class="progress-step" id="prog3" onclick="goStep(3)">3. 결혼식</div>
    <div class="progress-step" id="prog4" onclick="goStep(4)">4. 출산</div>
    <div class="progress-step" id="prog5" onclick="goStep(5)">5. 대표 캐릭터</div>
    <div class="progress-step" id="prog6" onclick="goStep(6)">6. 영상</div>
    <div class="progress-step" id="prog7" onclick="goStep(7)">7. 편집</div>
  </div>

  <div class="step-card active" id="step1"></div>
  <div class="step-card" id="step2"></div>
  <div class="step-card" id="step3"></div>
  <div class="step-card" id="step4"></div>
  <div class="step-card" id="step5"></div>
  <div class="step-card" id="step6"></div>
  <div class="step-card" id="step7" style="max-width:none;"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 이미지 라이트박스 -->
<div id="imgLightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:1000;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;cursor:zoom-out;">
  <img id="imgLightboxImg" style="max-width:95vw;max-height:85vh;border-radius:8px;display:block;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
  <div style="display:flex;gap:10px;">
    <a id="imgLightboxDownload" href="" download style="padding:8px 16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:12px;text-decoration:none;font-family:inherit;">⬇ 다운로드</a>
    <button onclick="closeImageLightbox()" style="padding:8px 16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;">닫기 (Esc)</button>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
const STEPS = ['mom', 'dad', 'wedding', 'hospital', 'baby', 'video', 'editor'];
const state = {
  mom:       { prompt: '', model: 'pro', results: [], selectedUrl: null },
  dad:       { prompt: '', model: 'pro', results: [], selectedUrl: null },
  wedding:   { prompt: '', model: 'pro', results: [], selectedUrl: null },
  hospital:  { prompt: '', model: 'pro', results: [], selectedUrl: null },
  baby:      { prompt: '', model: 'pro', results: [], selectedUrl: null, characterRefId: null },
  video:     { motionPrompt: 'gentle smile, slow camera push-in, soft ambient light', duration: '5', mode: 'std', resultUrl: null },
};
let currentStep = 1;
let savedTemplateId = null;

// ── Step config ────────────────────────────────────────────────────────
const STEP_CONFIG = {
  mom: {
    num: 1, title: '엄마 사진 생성',
    desc: '엄마 캐릭터의 인물 사진을 만듭니다. 외형(나이대, 헤어, 분위기)을 자세히 적을수록 일관성이 높아집니다.',
    refs: [], // no auto refs
    placeholder: 'ex) 32-year-old korean woman, warm smile, soft natural makeup, long wavy brown hair, gentle expression, soft studio light, portrait',
  },
  dad: {
    num: 2, title: '아빠 사진 생성',
    desc: '아빠 캐릭터의 인물 사진을 만듭니다.',
    refs: [],
    placeholder: 'ex) 34-year-old korean man, friendly smile, short black hair, warm expression, soft studio light, portrait',
  },
  wedding: {
    num: 3, title: '결혼식 사진',
    desc: '엄마/아빠 캐릭터를 레퍼런스로 결혼식 한 장면을 생성합니다.',
    refs: ['mom', 'dad'],
    placeholder: 'ex) wedding ceremony, bride and groom standing together at altar, white wedding dress, black tuxedo, soft flower decorations, warm light, full body shot',
  },
  hospital: {
    num: 4, title: '병원 출산 사진',
    desc: '엄마/아빠 캐릭터를 레퍼런스로 병원에서의 출산 직후 장면을 생성합니다.',
    refs: ['mom', 'dad'],
    placeholder: 'ex) hospital delivery room, mother lying in bed holding newborn baby, father sitting next to bed with happy tears, warm hospital lighting, tender moment',
  },
  baby: {
    num: 5, title: '대표 캐릭터 사진',
    desc: '아래에서 고른 캐릭터를 레퍼런스로 가족을 대표하는 인물 사진을 생성합니다 (엄마/아빠 결과는 여기서 레퍼런스로 쓰이지 않습니다).',
    refs: [],
    placeholder: 'ex) representative portrait of the family character, natural makeup, soft studio light, gentle expression',
  },
};

// ── Characters list (for Step 5 representative-character reference) ────
let charactersCache = [];
async function loadCharacters() {
  try {
    const res = await fetch('/api/characters');
    const j = await res.json();
    charactersCache = (j && j.data) || [];
  } catch (e) { charactersCache = []; }
}
function charById(id) { return charactersCache.find((c) => c.id === id) || null; }
function charRefUrlFor(id) {
  const c = charById(id);
  if (!c || !c.reference_image_url) return null;
  // reference_image_url may be a relative /images/... path or a filename — normalize to relative
  const u = c.reference_image_url;
  if (u.startsWith('http') || u.startsWith('/')) return u;
  return '/images/' + u.split('/').pop();
}

// ── DOM helpers ────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
function showToast(msg, type = 'success') {
  const t = $('toast'); t.textContent = msg; t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Lightbox ───────────────────────────────────────────────────────────
function openImageLightbox(url) {
  const box = $('imgLightbox'); const img = $('imgLightboxImg'); const dl = $('imgLightboxDownload');
  img.src = url;
  if (dl) { dl.href = url; dl.download = (url.split('/').pop() || 'photo').split('?')[0]; }
  box.style.display = 'flex';
}
function closeImageLightbox() {
  const box = $('imgLightbox'); if (!box) return;
  box.style.display = 'none';
  const img = $('imgLightboxImg'); if (img) img.src = '';
}
document.addEventListener('click', (ev) => { const box = $('imgLightbox'); if (box && box.style.display !== 'none' && ev.target === box) closeImageLightbox(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeImageLightbox(); });

// ── Step navigation ────────────────────────────────────────────────────
function goStep(n) {
  $('step' + currentStep).classList.remove('active');
  $('step' + n).classList.add('active');
  currentStep = n;
  for (let i = 1; i <= 7; i++) {
    const el = $('prog' + i);
    if (el) el.className = 'progress-step' + (i < n ? ' done' : i === n ? ' active' : '');
  }
  // Step 7(에디터)는 좌우 폭이 넓어야 타임라인/사이드 패널이 들어가므로 wide 모드로 전환
  const container = document.querySelector('body > .container');
  if (container) container.classList.toggle('wide', n === 7);
  renderStep(n);
  if (n === 7) loadEditorWithSources();
}

// ── Render: image gen steps (1~5) ──────────────────────────────────────
function renderGenStep(key) {
  const cfg = STEP_CONFIG[key];
  const data = state[key];
  const stepEl = $('step' + cfg.num);

  // Reference image preview area (이전 단계 결과)
  const refsHtml = cfg.refs.map((rk) => {
    const sel = state[rk] && state[rk].selectedUrl;
    if (sel) return `<div class="ref-item"><img src="${sel}"><div class="ref-label">${rk}</div></div>`;
    return `<div class="ref-item missing">${rk} 미선택</div>`;
  }).join('');

  // Step 5 전용: Characters 리스트에서 추가 레퍼런스 선택
  let characterPickerHtml = '';
  if (key === 'baby') {
    const opts = ['<option value="">-- 선택 안 함 --</option>']
      .concat(charactersCache.map((c) => {
        const sel = data.characterRefId === c.id ? ' selected' : '';
        return `<option value="${c.id}"${sel}>${c.name}</option>`;
      }))
      .join('');
    const refUrl = data.characterRefId ? charRefUrlFor(data.characterRefId) : null;
    characterPickerHtml = `
      <div class="form-group">
        <label class="form-label">캐릭터 레퍼런스 (선택 사항)</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <select class="form-input" id="characterRefSelect" style="flex:1;" onchange="setBabyCharacterRef(this.value)">${opts}</select>
          <div class="ref-list" style="margin-top:0;">
            ${refUrl
              ? `<div class="ref-item"><img src="${refUrl}"><div class="ref-label">char</div></div>`
              : `<div class="ref-item missing">없음</div>`}
          </div>
        </div>
        <div style="font-size:11px;color:var(--dim);margin-top:4px;">선택한 캐릭터의 reference 이미지가 엄마/아빠와 함께 레퍼런스로 전달됩니다.</div>
      </div>
    `;
  }

  stepEl.innerHTML = `
    <div class="step-num">Step ${cfg.num} / 7</div>
    <h3>${cfg.title}</h3>
    <div class="step-desc">${cfg.desc}</div>

    ${cfg.refs.length > 0 ? `
    <div class="form-group">
      <label class="form-label">레퍼런스 이미지 (이전 단계 결과)</label>
      <div class="ref-list">${refsHtml}</div>
    </div>` : ''}

    ${characterPickerHtml}

    <div class="form-group">
      <label class="form-label">저장된 프롬프트 (클릭해서 불러오기)</label>
      <div id="savedPromptTags_${key}" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;"></div>
    </div>

    <div class="form-group">
      <label class="form-label">프롬프트</label>
      <textarea class="form-input" id="prompt_${key}" placeholder="${cfg.placeholder}">${data.prompt}</textarea>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <input class="form-input" id="promptSaveName_${key}" placeholder="프롬프트 이름" style="flex:1;padding:6px 10px;font-size:12px;">
        <button onclick="savePromptForStep('${key}')" style="padding:6px 14px;background:var(--green);border:none;border-radius:6px;color:white;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;">Save</button>
      </div>
      <div class="model-row">
        <label style="font-size:11px;color:var(--dim);">모델:</label>
        <select id="model_${key}">
          <option value="pro" ${data.model === 'pro' ? 'selected' : ''}>Gemini Pro</option>
          <option value="flash" ${data.model === 'flash' ? 'selected' : ''}>Gemini Flash</option>
          <option value="gpt-image-2" ${data.model === 'gpt-image-2' ? 'selected' : ''}>GPT Image 2</option>
          <option value="gpt-image-1.5" ${data.model === 'gpt-image-1.5' ? 'selected' : ''}>GPT Image 1.5</option>
        </select>
        <button class="gen-btn" id="genBtn_${key}" style="flex:1;" onclick="generateStepImage('${key}')">
          <span style="font-size:15px;">▶</span> 생성
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">결과 (클릭: 선택 + 크게 보기)</label>
      <div class="result-grid" id="results_${key}"></div>
    </div>

    <div class="btn-group">
      ${cfg.num > 1 ? `<button class="btn-prev" onclick="goStep(${cfg.num - 1})">&larr; Back</button>` : ''}
      <button class="btn-next" onclick="goStep(${cfg.num + 1})">Next &rarr;</button>
    </div>
  `;
  renderStepResults(key);
}

function renderStepResults(key) {
  const data = state[key];
  const wrap = $('results_' + key);
  if (!wrap) return;
  wrap.innerHTML = '';
  if (data.results.length === 0) {
    wrap.innerHTML = '<span style="font-size:11px;color:var(--dim);">아직 생성된 사진이 없습니다.</span>';
    return;
  }
  data.results.forEach((r) => {
    const item = document.createElement('div');
    item.className = 'result-item' + (r.url === data.selectedUrl ? ' selected' : '');
    const img = document.createElement('img');
    img.src = r.url;
    img.onclick = () => { data.selectedUrl = r.url; renderStepResults(key); openImageLightbox(r.url); };
    item.appendChild(img);
    const dl = document.createElement('a');
    dl.href = r.url;
    dl.download = (r.url.split('/').pop() || 'photo').split('?')[0];
    dl.textContent = '⬇';
    dl.className = 'dl-btn';
    dl.onclick = (ev) => ev.stopPropagation();
    item.appendChild(dl);
    wrap.appendChild(item);
  });
}

// ── Render: video step (6) ────────────────────────────────────────────
function renderVideoStep() {
  const data = state.video;
  const baby = state.baby.selectedUrl;
  const stepEl = $('step6');
  stepEl.innerHTML = `
    <div class="step-num">Step 6 / 7</div>
    <h3>대표 캐릭터 영상</h3>
    <div class="step-desc">Step 5에서 선택한 대표 사진을 첫 프레임으로 영상을 생성합니다.</div>

    <div class="form-group">
      <label class="form-label">소스 사진</label>

// ── Embedded editor boot + auto-populate ──────────────────────────────
let step7EditorBooted = false;
let step7EditorHandle = null;
const step7LoadedClipUrls = new Set();

// 단계별 기본 노출 시간(초). 영상(Step 6)은 mediaDuration을 그대로 쓰므로 override 없음.
// baby(대표 캐릭터 사진)는 영상 생성에만 쓰이고 타임라인에는 올리지 않음.
const STEP7_TIMELINE_KEYS = ['mom', 'dad', 'wedding', 'hospital'];
const STEP7_DEFAULT_DURATIONS = {
  mom:      4,
  dad:      4,
  wedding:  4,
  hospital: 1,
};

// 사전 정의된 텍스트 오버레이 — 각 사진 클립 구간에 맞춤
//   엄마(0~4s) / 아빠(4~8s) / 결혼식(8~12s) / 병원(12~13s)
//   영상은 13s 이후로 들어가며 텍스트 없음.
const STEP7_DEFAULT_TEXTS = [
  { text: 'started with my mom (20)', startTime: 0,  endTime: 4  },
  { text: 'met my dad (25 🇰🇷)',      startTime: 4,  endTime: 8  },
  { text: 'They fell in Love ❤️',     startTime: 8,  endTime: 12 },
  { text: 'They had me',              startTime: 12, endTime: 13 },
];

async function loadEditorWithSources() {
  // 이전 단계의 결과물을 {url, duration} 형태로 모음 (사진 4종 + 6 영상)
  const items = [];
  for (const k of STEP7_TIMELINE_KEYS) {
    const url = state[k] && state[k].selectedUrl;
    if (!url) continue;
    const dur = STEP7_DEFAULT_DURATIONS[k];
    items.push(dur != null ? { url, duration: dur } : { url });
  }
  if (state.video.resultUrl) items.push({ url: state.video.resultUrl });

  if (!step7EditorBooted) {
    step7EditorBooted = true;
    try {
      const mod = await import('/editor-core.js');
      step7EditorHandle = await mod.initEditor({
        initialClipUrls: items,
        initialTexts: STEP7_DEFAULT_TEXTS,
      });
      items.forEach((it) => step7LoadedClipUrls.add(it.url));
    } catch (e) {
      showToast('에디터 부팅 실패: ' + (e && e.message ? e.message : e), 'error');
      step7EditorBooted = false;
    }
    return;
  }

  // 재진입: 새로 생긴 미디어만 추가 (텍스트는 첫 부팅에만 자동 셋팅)
  if (!step7EditorHandle || typeof step7EditorHandle.loadMedia !== 'function') return;
  const newItems = items.filter((it) => !step7LoadedClipUrls.has(it.url));
  if (newItems.length === 0) return;
  try {
    await step7EditorHandle.loadMedia({ initialClipUrls: newItems });
    newItems.forEach((it) => step7LoadedClipUrls.add(it.url));
  } catch (e) {
    showToast('미디어 추가 실패: ' + (e && e.message ? e.message : e), 'error');
  }
}

// ── Render dispatch ────────────────────────────────────────────────────
function renderStep(n) {
  const key = STEPS[n - 1];
  if (n <= 5) renderGenStep(key);
  else if (n === 6) renderVideoStep();
  else if (n === 7) renderEditorStep();
  // 단계 전환 후 저장된 프롬프트 태그 다시 그리기 (1~5, 6만 해당)
  if (n <= 6) loadSavedPromptsForStep(key);
}

// ── Per-step saved prompts ────────────────────────────────────────────
// 저장 형식: /api/template-data with templateType = 'birth-reel-prompt-' + step
const savedPrompts = {};   // key → array of {id, name, data:{prompt}}

async function loadSavedPromptsForStep(key) {
  try {
    const res = await fetch('/api/template-data?templateType=birth-reel-prompt-' + key);
    const json = await res.json();
    savedPrompts[key] = (json.data || []).map(d => ({ id: d.id, name: d.name, data: d.data || {} }));
    renderSavedPromptTags(key);
  } catch (e) { /* ignore */ }
}

function renderSavedPromptTags(key) {
  const wrap = $('savedPromptTags_' + key);
  if (!wrap) return;
  const list = savedPrompts[key] || [];
  if (list.length === 0) {
    wrap.innerHTML = '<span style="font-size:11px;color:var(--dim);">아직 저장된 프롬프트가 없습니다.</span>';
    return;
  }
  wrap.innerHTML = '';
  list.forEach((p) => {
    const tag = document.createElement('div');
    tag.style.cssText =
      'display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;font-size:11px;color:var(--text);cursor:pointer;';
    tag.onclick = () => {
      const ta = key === 'video' ? $('motionPrompt') : $('prompt_' + key);
      if (ta) ta.value = (p.data && p.data.prompt) || p.name || '';
      if (key === 'video') state.video.motionPrompt = ta ? ta.value : state.video.motionPrompt;
      else state[key].prompt = ta ? ta.value : state[key].prompt;
    };
    const label = document.createElement('span');
    label.textContent = p.name || '(unnamed)';
    const del = document.createElement('span');
    del.textContent = '×';
    del.style.cssText = 'color:var(--dim);font-size:13px;line-height:1;';
    del.onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm('삭제할까요?')) return;
      try {
        await fetch('/api/template-data/' + p.id, { method: 'DELETE' });
        showToast('삭제됨', 'success');
        loadSavedPromptsForStep(key);
      } catch (e) { showToast('Error', 'error'); }
    };
    tag.appendChild(label);
    tag.appendChild(del);
    wrap.appendChild(tag);
  });
}

async function savePromptForStep(key) {
  // 현재 textarea의 값을 그대로 저장
  const ta = key === 'video' ? $('motionPrompt') : $('prompt_' + key);
  const nameEl = $('promptSaveName_' + key);
  const prompt = (ta && ta.value || '').trim();
  const name = (nameEl && nameEl.value || '').trim() || prompt.slice(0, 40);
  if (!prompt) { showToast('프롬프트 내용이 비어있습니다', 'error'); return; }
  try {
    const res = await fetch('/api/template-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ templateType: 'birth-reel-prompt-' + key, name, data: { prompt } }),
    });
    const j = await res.json();
    if (j.success) {
      if (nameEl) nameEl.value = '';
      showToast('저장됨', 'success');
      loadSavedPromptsForStep(key);
    } else {
      showToast(j.error || '저장 실패', 'error');
    }
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

// ── Image generation ───────────────────────────────────────────────────
async function generateStepImage(key) {
  const cfg = STEP_CONFIG[key];
  const data = state[key];

  // 프롬프트 / 모델 저장
  const pEl = $('prompt_' + key);
  const mEl = $('model_' + key);
  data.prompt = pEl ? pEl.value.trim() : data.prompt;
  data.model = mEl ? mEl.value : data.model;

  if (!data.prompt) { showToast('프롬프트를 입력하세요', 'error'); return; }

  // 레퍼런스 URL 수집
  const refUrls = [];
  for (const rk of cfg.refs) {
    const sel = state[rk] && state[rk].selectedUrl;
    if (!sel) { showToast(`먼저 ${rk} 단계에서 사진을 선택하세요`, 'error'); return; }
    refUrls.push(sel);
  }
  // Step 5 한정: 선택한 캐릭터의 reference 이미지를 추가 ref로 같이 전달
  if (key === 'baby' && data.characterRefId) {
    const curl = charRefUrlFor(data.characterRefId);
    if (curl) refUrls.push(curl);
  }

  const btn = $('genBtn_' + key);
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>생성 중…';

  try {
    const formData = new FormData();
    formData.append('prompt', data.prompt);
    formData.append('model', data.model);
    formData.append('count', '1');

    // 각 레퍼런스를 fetch해서 referenceImages로 첨부
    for (const url of refUrls) {
      try {
        const r = await fetch(url);
        const blob = await r.blob();
        const filename = (url.split('/').pop() || 'ref').split('?')[0];
        formData.append('referenceImages', new File([blob], filename, { type: blob.type }));
      } catch (e) { /* skip */ }
    }

    const res = await fetch('/api/generate', { method: 'POST', body: formData });
    const json = await res.json();
    if (!json.success) {
      showToast(json.error || '생성 실패', 'error');
      return;
    }
    const success = (json.results || []).filter(r => r.success);
    success.forEach(r => data.results.push(r));
    if (success.length > 0 && !data.selectedUrl) data.selectedUrl = success[0].url;
    showToast('생성 완료', 'success');
    renderStepResults(key);
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span style="font-size:15px;">▶</span> 생성';
  }
}

// ── Video generation ──────────────────────────────────────────────────
async function generateVideo() {
  const motionEl = $('motionPrompt');
  if (motionEl) state.video.motionPrompt = motionEl.value.trim();
  if (!state.video.motionPrompt) { showToast('모션 프롬프트를 입력하세요', 'error'); return; }
  if (!state.baby.selectedUrl) { showToast('Step 5에서 사진을 먼저 선택하세요', 'error'); return; }

  // Video generation needs a characterId. We don't have a real character bound to this flow;
  // /api/characters list로 첫 번째를 가져와 character 의존성을 만족시킨다 (sourceImageUrl로 실제 소스 지정).
  let characterId = null;
  try {
    const cres = await fetch('/api/characters');
    const cj = await cres.json();
    if (cj.success && cj.data && cj.data.length > 0) characterId = cj.data[0].id;
  } catch {}
  if (!characterId) { showToast('영상 생성에는 캐릭터가 1개 이상 필요합니다. Characters에서 먼저 만들어주세요.', 'error'); return; }

  const btn = $('videoGenBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>영상 생성 중… (수십 초~수 분)';

  try {
    const durationSec = parseInt(state.video.duration, 10) || 5;
    const videoStyle = state.video.mode === 'pro' ? 'cinematic' : 'natural';
    const sourceImageUrl = state.baby.selectedUrl.startsWith('http')
      ? state.baby.selectedUrl
      : window.location.origin + state.baby.selectedUrl;

    const body = {
      prompt: state.video.motionPrompt,
      durationSec,
      videoStyle,
      sourceImageUrl,
    };

    const res = await fetch(`/api/characters/${encodeURIComponent(characterId)}/videos/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { showToast(`Server ${res.status}: ${raw.slice(0, 160)}`, 'error'); return; }

    if (!data.success) { showToast(`HTTP ${res.status}: ${data.error || '생성 실패'}`, 'error'); return; }
    const url = data.data && data.data.video && data.data.video.videoUrl;
    if (!url) { showToast('영상 URL을 받지 못했습니다', 'error'); return; }

    state.video.resultUrl = url;
    showToast('영상 생성 완료', 'success');
    renderVideoStep();
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span style="font-size:15px;">▶</span> 영상 생성';
  }
}

// ── Save / Load ────────────────────────────────────────────────────────
function collectData() {
  // 입력값을 한 번 더 모음 (현재 active step의 dom 값을 우선)
  const k = STEPS[currentStep - 1];
  if (k && k !== 'video') {
    const pEl = $('prompt_' + k); if (pEl) state[k].prompt = pEl.value.trim();
    const mEl = $('model_' + k); if (mEl) state[k].model = mEl.value;
  } else if (k === 'video') {
    const motionEl = $('motionPrompt'); if (motionEl) state.video.motionPrompt = motionEl.value.trim();
  }
  return JSON.parse(JSON.stringify(state));
}

async function loadSavedList() {
  try {
    const res = await fetch('/api/template-data?templateType=birth-reel');
    const json = await res.json();
    const sel = $('savedSelect');
    sel.innerHTML = '<option value="">-- 저장된 데이터 불러오기 --</option>';
    (json.data || []).forEach((d) => {
      const opt = document.createElement('option');
      opt.value = d.id; opt.textContent = d.name;
      sel.appendChild(opt);
    });
    sel.onchange = () => loadTemplateData(sel.value);
  } catch (e) { /* ignore */ }
}

async function loadTemplateData(id) {
  if (!id) return;
  try {
    const res = await fetch('/api/template-data/' + id);
    const json = await res.json();
    if (!json.success) return;
    const d = json.data.data || {};
    for (const k of STEPS) {
      if (d[k]) Object.assign(state[k], d[k]);
    }
    savedTemplateId = id;
    renderStep(currentStep);
    showToast('불러오기 완료', 'success');
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

async function saveTemplateData() {
  const name = prompt('저장 이름을 입력하세요', '출산 릴스 ' + new Date().toLocaleDateString());
  if (!name) return;
  try {
    const data = collectData();
    const res = await fetch('/api/template-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ templateType: 'birth-reel', name, data }),
    });
    const j = await res.json();
    if (j.success) {
      savedTemplateId = j.data.id;
      showToast('저장 완료', 'success');
      loadSavedList();
    } else {
      showToast(j.error || '저장 실패', 'error');
    }
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

async function deleteTemplateData() {
  const sel = $('savedSelect');
  const id = sel.value || savedTemplateId;
  if (!id) { showToast('삭제할 항목을 선택하세요', 'error'); return; }
  if (!confirm('정말 삭제할까요?')) return;
  try {
    await fetch('/api/template-data/' + id, { method: 'DELETE' });
    showToast('삭제 완료', 'success');
    savedTemplateId = null;
    loadSavedList();
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

// ── Init ──────────────────────────────────────────────────────────────
loadCharacters().then(() => renderStep(1));
loadSavedList();
</script>

</body>
</html>
