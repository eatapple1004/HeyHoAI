<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyHoAI - Video Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a2e;
    --border: #2a2a3e; --text: #e4e4ed; --dim: #8888a0;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00b894;
    --red: #ff7675; --orange: #fdcb6e;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent2); }
  header nav { display: flex; gap: 16px; }
  header nav a { color: var(--dim); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
  header nav a:hover, header nav a.active { color: var(--accent2); }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .page-desc { font-size: 13px; color: var(--dim); margin-bottom: 20px; }

  .toolbar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 18px;
  }
  .toolbar label { font-size: 12px; color: var(--dim); }
  .toolbar select, .toolbar button, .toolbar .file-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  .toolbar button.primary:hover { background: var(--accent2); }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar .file-btn input { display: none; }
  .toolbar .spacer { flex: 1; }
  .toolbar .status { font-size: 12px; color: var(--dim); }

  .workspace { display: grid; grid-template-columns: 1fr 360px; gap: 18px; }
  @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }

  .preview-pane {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; display: flex; flex-direction: column; align-items: center;
    min-height: 480px;
  }
  .preview-pane .preview-box {
    background: #000; border-radius: 8px; max-width: 100%; max-height: 60vh;
    display: flex; align-items: center; justify-content: center; color: var(--dim);
    font-size: 12px;
  }
  .preview-pane video, .preview-pane img { max-width: 100%; max-height: 60vh; border-radius: 8px; display: block; }
  .preview-pane .empty { padding: 100px 40px; text-align: center; color: var(--dim); font-size: 13px; }
  .preview-pane .preview-caption { margin-top: 12px; font-size: 12px; color: var(--dim); }

  .side-pane { display: flex; flex-direction: column; gap: 14px; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
  }
  .panel h3 { font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .panel .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .panel .row label { color: var(--dim); width: 80px; }
  .panel input[type="number"], .panel input[type="text"] {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; width: 80px;
    font-family: inherit;
  }
  .panel input[type="range"] { flex: 1; }
  .panel .bgm-name { font-size: 12px; color: var(--text); word-break: break-all; }
  .panel .empty-text { font-size: 12px; color: var(--dim); }
  .panel .remove-btn {
    background: transparent; border: none; color: var(--red); font-size: 12px; cursor: pointer; padding: 0;
  }

  .timeline-section { margin-top: 18px; }
  .timeline-section h3 { font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .timeline {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; min-height: 140px; display: flex; gap: 10px; overflow-x: auto;
  }
  .timeline .empty {
    width: 100%; text-align: center; color: var(--dim); font-size: 13px;
    padding: 40px 20px; border: 2px dashed var(--border); border-radius: 8px;
  }
  .clip {
    flex-shrink: 0; width: 140px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; cursor: pointer; transition: border-color 0.15s;
    position: relative;
  }
  .clip:hover { border-color: var(--accent); }
  .clip.selected { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(108,92,231,0.3); }
  .clip .clip-thumb {
    width: 100%; height: 80px; background: #000; border-radius: 4px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .clip .clip-thumb img, .clip .clip-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .clip .clip-type {
    font-size: 9px; font-weight: 700; color: var(--accent2); text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .clip .clip-name {
    font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; margin: 2px 0;
  }
  .clip .clip-duration { font-size: 10px; color: var(--dim); }
  .clip .clip-actions {
    position: absolute; top: 4px; right: 4px; display: flex; gap: 4px;
  }
  .clip .clip-actions button {
    background: rgba(0,0,0,0.6); border: none; color: white; width: 20px; height: 20px;
    border-radius: 4px; cursor: pointer; font-size: 11px; line-height: 1;
  }
  .clip .clip-actions button:hover { background: var(--accent); }

  .log-pane {
    margin-top: 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; color: var(--dim); max-height: 160px; overflow-y: auto;
  }
  .log-pane .log-line { padding: 2px 0; }
  .log-pane .log-line.err { color: var(--red); }
  .log-pane .log-line.ok { color: var(--green); }

  .progress {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    margin-top: 8px; display: none;
  }
  .progress.active { display: block; }
  .progress .bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
</style>
</head>
<body>

<header>
  <h1>HeyHoAI</h1>
  <nav>
    <a href="/heyhoai/image/generater/page">Image Generator</a>
    <a href="/heyhoai/character/page">Characters</a>
    <a href="/heyhoai/accounts/page">Accounts</a>
    <a href="/heyhoai/templates/page">Templates</a>
    <a href="/heyhoai/editor/page" class="active">Editor</a>
    <a href="/heyhoai/logs/page">Logs</a>
  </nav>
</header>

<div class="container">
  <div class="page-title">Video Editor</div>
  <div class="page-desc">사진과 영상을 타임라인에 올려 이어붙이고, BGM을 추가해 영상을 만드세요. 모든 인코딩은 브라우저(로컬)에서 처리됩니다.</div>

  <div class="toolbar">
    <label class="file-btn">
      <input type="file" id="mediaInput" accept="image/*,video/*" multiple>
      <span>＋ 사진/영상 추가</span>
    </label>
    <label class="file-btn">
      <input type="file" id="bgmInput" accept="audio/*">
      <span>♪ BGM 추가</span>
    </label>
    <label>출력 비율</label>
    <select id="aspectSelect">
      <option value="9:16">세로 9:16 (1080×1920)</option>
      <option value="1:1">정사각 1:1 (1080×1080)</option>
      <option value="16:9">가로 16:9 (1920×1080)</option>
    </select>
    <div class="spacer"></div>
    <span class="status" id="statusText">FFmpeg 로딩 중…</span>
    <button id="renderBtn" class="primary" disabled>영상 렌더링</button>
    <button id="downloadBtn" disabled>다운로드</button>
  </div>

  <div class="progress" id="progressBar"><div class="bar" id="progressFill"></div></div>

  <div class="workspace">
    <div class="preview-pane">
      <div class="preview-box" id="previewBox">
        <div class="empty">렌더링 후 미리보기가 여기에 표시됩니다.</div>
      </div>
      <div class="preview-caption" id="previewCaption"></div>
    </div>

    <div class="side-pane">
      <div class="panel">
        <h3>선택된 클립</h3>
        <div id="clipInspector">
          <div class="empty-text">타임라인에서 클립을 선택하세요.</div>
        </div>
      </div>
      <div class="panel">
        <h3>BGM</h3>
        <div id="bgmInspector">
          <div class="empty-text">BGM이 추가되지 않았습니다.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="timeline-section">
    <h3>타임라인</h3>
    <div class="timeline" id="timeline">
      <div class="empty">상단의 「사진/영상 추가」 버튼으로 클립을 추가하세요.</div>
    </div>
  </div>

  <div class="log-pane" id="logPane">
    <div class="log-line">로그가 여기에 표시됩니다.</div>
  </div>
</div>

<script type="module">
  import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
  import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

  const state = {
    clips: [],          // { id, type: 'image'|'video', file, name, url, duration, trimStart, trimEnd, mediaDuration }
    bgm: null,          // { file, name, url, volume }
    selectedId: null,
    rendering: false,
    outputUrl: null,
  };

  const $ = (id) => document.getElementById(id);
  const log = (msg, cls = '') => {
    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = msg;
    $('logPane').appendChild(el);
    $('logPane').scrollTop = $('logPane').scrollHeight;
  };

  // ---------- FFmpeg setup ----------
  const ffmpeg = new FFmpeg();
  let ffmpegReady = false;

  ffmpeg.on('log', ({ message }) => {
    if (message && message.length < 300) log(message);
  });
  ffmpeg.on('progress', ({ progress }) => {
    const pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
    $('progressFill').style.width = pct + '%';
  });

  async function loadFFmpeg() {
    const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
    try {
      await ffmpeg.load({
        coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
      });
      ffmpegReady = true;
      $('statusText').textContent = 'Ready';
      $('renderBtn').disabled = false;
      log('FFmpeg loaded.', 'ok');
    } catch (e) {
      $('statusText').textContent = 'FFmpeg 로딩 실패';
      log('FFmpeg load error: ' + e.message, 'err');
    }
  }
  loadFFmpeg();

  // ---------- Media handling ----------
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function getVideoDuration(file) {
    return new Promise((resolve) => {
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = () => resolve(v.duration || 0);
      v.onerror = () => resolve(0);
      v.src = URL.createObjectURL(file);
    });
  }

  $('mediaInput').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for (const file of files) {
      const isVideo = file.type.startsWith('video/');
      const isImage = file.type.startsWith('image/');
      if (!isVideo && !isImage) continue;

      const url = URL.createObjectURL(file);
      const clip = {
        id: uid(),
        type: isVideo ? 'video' : 'image',
        file,
        name: file.name,
        url,
        duration: isVideo ? 0 : 3,    // for images: how long to show
        trimStart: 0,
        trimEnd: 0,
        mediaDuration: 0,
      };
      if (isVideo) {
        clip.mediaDuration = await getVideoDuration(file);
        clip.duration = clip.mediaDuration;
        clip.trimEnd = clip.mediaDuration;
      }
      state.clips.push(clip);
    }
    e.target.value = '';
    renderTimeline();
  });

  $('bgmInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (state.bgm) URL.revokeObjectURL(state.bgm.url);
    state.bgm = { file, name: file.name, url: URL.createObjectURL(file), volume: 0.8 };
    e.target.value = '';
    renderBgmInspector();
  });

  // ---------- Timeline UI ----------
  function renderTimeline() {
    const tl = $('timeline');
    tl.innerHTML = '';
    if (state.clips.length === 0) {
      tl.innerHTML = '<div class="empty">상단의 「사진/영상 추가」 버튼으로 클립을 추가하세요.</div>';
      renderInspector();
      return;
    }
    for (const clip of state.clips) {
      const el = document.createElement('div');
      el.className = 'clip' + (clip.id === state.selectedId ? ' selected' : '');
      el.dataset.id = clip.id;

      const thumb = document.createElement('div');
      thumb.className = 'clip-thumb';
      if (clip.type === 'image') {
        const img = document.createElement('img');
        img.src = clip.url;
        thumb.appendChild(img);
      } else {
        const v = document.createElement('video');
        v.src = clip.url;
        v.muted = true;
        thumb.appendChild(v);
      }
      el.appendChild(thumb);

      const type = document.createElement('div');
      type.className = 'clip-type';
      type.textContent = clip.type;
      el.appendChild(type);

      const name = document.createElement('div');
      name.className = 'clip-name';
      name.textContent = clip.name;
      el.appendChild(name);

      const dur = document.createElement('div');
      dur.className = 'clip-duration';
      const usedDuration = clip.type === 'image' ? clip.duration : Math.max(0, clip.trimEnd - clip.trimStart);
      dur.textContent = usedDuration.toFixed(1) + 's';
      el.appendChild(dur);

      const actions = document.createElement('div');
      actions.className = 'clip-actions';
      const leftBtn = document.createElement('button');
      leftBtn.textContent = '←';
      leftBtn.title = '왼쪽으로';
      leftBtn.onclick = (ev) => { ev.stopPropagation(); moveClip(clip.id, -1); };
      const rightBtn = document.createElement('button');
      rightBtn.textContent = '→';
      rightBtn.title = '오른쪽으로';
      rightBtn.onclick = (ev) => { ev.stopPropagation(); moveClip(clip.id, +1); };
      const delBtn = document.createElement('button');
      delBtn.textContent = '×';
      delBtn.title = '삭제';
      delBtn.onclick = (ev) => { ev.stopPropagation(); removeClip(clip.id); };
      actions.appendChild(leftBtn);
      actions.appendChild(rightBtn);
      actions.appendChild(delBtn);
      el.appendChild(actions);

      el.onclick = () => { state.selectedId = clip.id; renderTimeline(); };
      tl.appendChild(el);
    }
    renderInspector();
  }

  function moveClip(id, delta) {
    const idx = state.clips.findIndex(c => c.id === id);
    const target = idx + delta;
    if (target < 0 || target >= state.clips.length) return;
    const [c] = state.clips.splice(idx, 1);
    state.clips.splice(target, 0, c);
    renderTimeline();
  }

  function removeClip(id) {
    const idx = state.clips.findIndex(c => c.id === id);
    if (idx < 0) return;
    URL.revokeObjectURL(state.clips[idx].url);
    state.clips.splice(idx, 1);
    if (state.selectedId === id) state.selectedId = null;
    renderTimeline();
  }

  // ---------- Inspector ----------
  function renderInspector() {
    const box = $('clipInspector');
    const clip = state.clips.find(c => c.id === state.selectedId);
    if (!clip) {
      box.innerHTML = '<div class="empty-text">타임라인에서 클립을 선택하세요.</div>';
      return;
    }
    box.innerHTML = '';
    if (clip.type === 'image') {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label>노출 시간</label>`;
      const input = document.createElement('input');
      input.type = 'number'; input.min = '0.5'; input.max = '60'; input.step = '0.5';
      input.value = clip.duration;
      input.oninput = () => { clip.duration = Math.max(0.5, parseFloat(input.value) || 0.5); renderTimeline(); };
      row.appendChild(input);
      const unit = document.createElement('span');
      unit.style.cssText = 'color:var(--dim);font-size:12px;';
      unit.textContent = '초';
      row.appendChild(unit);
      box.appendChild(row);
    } else {
      const total = clip.mediaDuration || 0;
      const dRow = document.createElement('div');
      dRow.className = 'row';
      dRow.innerHTML = `<label>전체 길이</label><span style="font-size:12px;color:var(--dim)">${total.toFixed(2)}s</span>`;
      box.appendChild(dRow);

      const sRow = document.createElement('div');
      sRow.className = 'row';
      sRow.innerHTML = `<label>시작</label>`;
      const sInput = document.createElement('input');
      sInput.type = 'number'; sInput.min = '0'; sInput.max = String(total); sInput.step = '0.1';
      sInput.value = clip.trimStart;
      sInput.oninput = () => {
        clip.trimStart = Math.max(0, Math.min(parseFloat(sInput.value) || 0, clip.trimEnd - 0.1));
        renderTimeline();
      };
      sRow.appendChild(sInput);
      box.appendChild(sRow);

      const eRow = document.createElement('div');
      eRow.className = 'row';
      eRow.innerHTML = `<label>끝</label>`;
      const eInput = document.createElement('input');
      eInput.type = 'number'; eInput.min = '0'; eInput.max = String(total); eInput.step = '0.1';
      eInput.value = clip.trimEnd;
      eInput.oninput = () => {
        clip.trimEnd = Math.min(total, Math.max(parseFloat(eInput.value) || total, clip.trimStart + 0.1));
        renderTimeline();
      };
      eRow.appendChild(eInput);
      box.appendChild(eRow);

      const uRow = document.createElement('div');
      uRow.className = 'row';
      uRow.innerHTML = `<label>사용 길이</label><span style="font-size:12px;color:var(--text)">${Math.max(0, clip.trimEnd - clip.trimStart).toFixed(2)}s</span>`;
      box.appendChild(uRow);
    }
  }

  function renderBgmInspector() {
    const box = $('bgmInspector');
    if (!state.bgm) {
      box.innerHTML = '<div class="empty-text">BGM이 추가되지 않았습니다.</div>';
      return;
    }
    box.innerHTML = '';
    const name = document.createElement('div');
    name.className = 'bgm-name';
    name.textContent = state.bgm.name;
    box.appendChild(name);

    const vRow = document.createElement('div');
    vRow.className = 'row';
    vRow.style.marginTop = '10px';
    vRow.innerHTML = `<label>볼륨</label>`;
    const slider = document.createElement('input');
    slider.type = 'range'; slider.min = '0'; slider.max = '1'; slider.step = '0.05';
    slider.value = state.bgm.volume;
    const pct = document.createElement('span');
    pct.style.cssText = 'color:var(--dim);font-size:12px;width:36px;text-align:right;';
    pct.textContent = Math.round(state.bgm.volume * 100) + '%';
    slider.oninput = () => {
      state.bgm.volume = parseFloat(slider.value);
      pct.textContent = Math.round(state.bgm.volume * 100) + '%';
    };
    vRow.appendChild(slider);
    vRow.appendChild(pct);
    box.appendChild(vRow);

    const remove = document.createElement('button');
    remove.className = 'remove-btn';
    remove.textContent = '× BGM 제거';
    remove.style.marginTop = '10px';
    remove.onclick = () => {
      URL.revokeObjectURL(state.bgm.url);
      state.bgm = null;
      renderBgmInspector();
    };
    box.appendChild(remove);
  }

  // ---------- Render pipeline ----------
  function getAspectSize() {
    const v = $('aspectSelect').value;
    if (v === '9:16') return { w: 1080, h: 1920 };
    if (v === '1:1') return { w: 1080, h: 1080 };
    return { w: 1920, h: 1080 };
  }

  // Build a scale+pad filter so we keep aspect, with letterbox/pillarbox to fit target
  function fitFilter(w, h) {
    return `scale=${w}:${h}:force_original_aspect_ratio=decrease,pad=${w}:${h}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1`;
  }

  async function renderVideo() {
    if (state.rendering) return;
    if (!ffmpegReady) { log('FFmpeg 아직 준비 안됨', 'err'); return; }
    if (state.clips.length === 0) { log('클립을 먼저 추가하세요.', 'err'); return; }

    state.rendering = true;
    $('renderBtn').disabled = true;
    $('downloadBtn').disabled = true;
    $('progressBar').classList.add('active');
    $('progressFill').style.width = '0%';
    $('statusText').textContent = '렌더링 중…';

    const { w, h } = getAspectSize();
    const fps = 30;
    const segmentFiles = [];

    try {
      // Step 1 — normalize every clip to MP4 (same codec/res/fps/sar)
      for (let i = 0; i < state.clips.length; i++) {
        const clip = state.clips[i];
        const outName = `seg_${String(i).padStart(3, '0')}.mp4`;
        const inputName = `in_${i}.${clip.type === 'image' ? 'img' : 'mp4'}`;

        log(`[${i + 1}/${state.clips.length}] ${clip.type} → 정규화`);
        await ffmpeg.writeFile(inputName, await fetchFile(clip.file));

        if (clip.type === 'image') {
          const dur = clip.duration;
          await ffmpeg.exec([
            '-y',
            '-loop', '1',
            '-t', String(dur),
            '-i', inputName,
            '-f', 'lavfi',
            '-t', String(dur),
            '-i', 'anullsrc=channel_layout=stereo:sample_rate=44100',
            '-vf', fitFilter(w, h),
            '-r', String(fps),
            '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p',
            '-c:a', 'aac', '-b:a', '128k',
            '-shortest',
            outName,
          ]);
        } else {
          const start = clip.trimStart || 0;
          const dur = Math.max(0.1, (clip.trimEnd || clip.mediaDuration) - start);
          await ffmpeg.exec([
            '-y',
            '-ss', String(start),
            '-t', String(dur),
            '-i', inputName,
            '-vf', fitFilter(w, h),
            '-r', String(fps),
            '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p',
            '-c:a', 'aac', '-b:a', '128k', '-ar', '44100', '-ac', '2',
            // ensure audio exists even if source has none
            '-af', 'aresample=async=1',
            outName,
          ]).catch(async () => {
            // Source had no audio at all — re-encode with synthesized silence
            await ffmpeg.exec([
              '-y',
              '-ss', String(start),
              '-t', String(dur),
              '-i', inputName,
              '-f', 'lavfi',
              '-t', String(dur),
              '-i', 'anullsrc=channel_layout=stereo:sample_rate=44100',
              '-vf', fitFilter(w, h),
              '-r', String(fps),
              '-map', '0:v:0', '-map', '1:a:0',
              '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p',
              '-c:a', 'aac', '-b:a', '128k',
              '-shortest',
              outName,
            ]);
          });
        }
        segmentFiles.push(outName);
        await ffmpeg.deleteFile(inputName).catch(() => {});
      }

      // Step 2 — concat list
      const listTxt = segmentFiles.map(n => `file '${n}'`).join('\n');
      await ffmpeg.writeFile('concat.txt', new TextEncoder().encode(listTxt));

      log('병합 중…');
      const concatOut = state.bgm ? 'concat.mp4' : 'output.mp4';
      await ffmpeg.exec([
        '-y',
        '-f', 'concat', '-safe', '0', '-i', 'concat.txt',
        '-c', 'copy',
        concatOut,
      ]);

      // Step 3 — add BGM if present
      if (state.bgm) {
        log('BGM 추가 중…');
        await ffmpeg.writeFile('bgm.audio', await fetchFile(state.bgm.file));
        const vol = state.bgm.volume.toFixed(2);
        await ffmpeg.exec([
          '-y',
          '-i', 'concat.mp4',
          '-stream_loop', '-1', '-i', 'bgm.audio',
          '-filter_complex',
            `[0:a]volume=0.4[a0];[1:a]volume=${vol}[a1];[a0][a1]amix=inputs=2:duration=first:dropout_transition=0[aout]`,
          '-map', '0:v:0', '-map', '[aout]',
          '-c:v', 'copy',
          '-c:a', 'aac', '-b:a', '160k',
          '-shortest',
          'output.mp4',
        ]);
        await ffmpeg.deleteFile('bgm.audio').catch(() => {});
        await ffmpeg.deleteFile('concat.mp4').catch(() => {});
      }

      const data = await ffmpeg.readFile('output.mp4');
      const blob = new Blob([data.buffer], { type: 'video/mp4' });
      if (state.outputUrl) URL.revokeObjectURL(state.outputUrl);
      state.outputUrl = URL.createObjectURL(blob);

      // Preview
      const box = $('previewBox');
      box.innerHTML = '';
      const v = document.createElement('video');
      v.src = state.outputUrl;
      v.controls = true;
      v.autoplay = false;
      box.appendChild(v);
      $('previewCaption').textContent = `${w}×${h} · ${(blob.size / 1024 / 1024).toFixed(2)} MB`;

      // Cleanup intermediate
      for (const n of segmentFiles) await ffmpeg.deleteFile(n).catch(() => {});
      await ffmpeg.deleteFile('concat.txt').catch(() => {});

      $('downloadBtn').disabled = false;
      log('완료', 'ok');
      $('statusText').textContent = 'Ready';
    } catch (e) {
      log('에러: ' + e.message, 'err');
      $('statusText').textContent = '실패';
    } finally {
      state.rendering = false;
      $('renderBtn').disabled = false;
      $('progressBar').classList.remove('active');
    }
  }

  $('renderBtn').onclick = renderVideo;
  $('downloadBtn').onclick = () => {
    if (!state.outputUrl) return;
    const a = document.createElement('a');
    a.href = state.outputUrl;
    a.download = `heyhoai-${Date.now()}.mp4`;
    a.click();
  };
</script>

</body>
</html>
