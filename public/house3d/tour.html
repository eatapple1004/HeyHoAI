<style>
:root {
  --ink: #1d1c1a; --ink2: #5e5a54; --ink3: #8f8a82; --line: #e2ddd4; --paper: #f8f6f2; --card: rgba(250, 248, 244, .94);
  --accent: #8a6a45; --accent-ink: #fff; --sel: #c99a5b; --shadow: 0 10px 40px rgba(20, 16, 10, .18);
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink);
  font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#gl.grab { cursor: grab; } #gl.grabbing { cursor: grabbing; } #gl.pick { cursor: pointer; }

/* 상단 바 */
.top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; z-index: 5; }
.top > * { pointer-events: auto; }
.brand { background: var(--card); backdrop-filter: blur(12px); border-radius: var(--r); padding: 9px 14px; box-shadow: var(--shadow); line-height: 1.25; }
.brand b { display: block; font-size: 14px; letter-spacing: -.01em; }
.brand span { font-size: 11.5px; color: var(--ink2); }
.home { text-decoration: none; color: var(--ink); }
#homeSel { max-width: 220px; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.seg { display: flex; background: var(--card); backdrop-filter: blur(12px); border-radius: var(--r); padding: 4px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.seg button.on { background: var(--ink); color: #fff; }
.spacer { flex: 1; }
.btn { border: 0; background: var(--card); backdrop-filter: blur(12px); border-radius: var(--r); padding: 10px 14px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
select.btn { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; font-family: inherit; color: var(--ink); }

/* 걷기 HUD */
#roomName { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); background: rgba(20, 18, 15, .55); color: #fff; font-size: 13px; font-weight: 600;
  padding: 6px 14px; border-radius: 99px; backdrop-filter: blur(8px); z-index: 4; pointer-events: none; transition: opacity .3s; }
#hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(20, 18, 15, .62); color: #f3efe8; font-size: 12.5px; padding: 9px 16px;
  border-radius: 99px; backdrop-filter: blur(8px); z-index: 4; white-space: nowrap; display: flex; gap: 14px; align-items: center; }
#hintText { display: flex; gap: 14px; }
#hint kbd { font: inherit; font-weight: 700; color: #fff; background: rgba(255, 255, 255, .14); border-radius: 5px; padding: 0 5px; }
#hint button { border: 0; background: none; color: #bdb5a8; padding: 0 0 0 4px; font-size: 15px; line-height: 1; }
#tip { position: absolute; z-index: 6; pointer-events: none; background: rgba(20, 18, 15, .82); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px;
  white-space: nowrap; transform: translate(14px, 14px); display: none; }
#tip small { color: #cbbfae; margin-left: 6px; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.rl { position: absolute; transform: translate(-50%, -50%); text-align: center; font-size: 12px; font-weight: 700; color: var(--ink); background: rgba(255, 255, 255, .82);
  padding: 4px 9px; border-radius: 8px; white-space: nowrap; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
.rl small { display: block; font-weight: 500; font-size: 10.5px; color: var(--ink2); }

/* 미니맵 */
#mini { position: absolute; right: 12px; bottom: 12px; width: 260px; background: var(--card); backdrop-filter: blur(12px); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 10px 10px 8px; z-index: 4; }
#mini header { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink2); margin: 0 2px 6px; }
#mini svg { width: 100%; display: block; cursor: crosshair; }
#mini .room { fill: #efebe4; stroke: none; } #mini .room.here { fill: #e8d9c3; }
#mini .wall { stroke: #2e2c29; stroke-linecap: square; } #mini .wall.rail { stroke: #7fa3b0; }
#mini .room.void { fill: #fff; stroke: #c9c2b6; stroke-width: .05; stroke-dasharray: .3 .2; }
#mini text { font-size: .62px; fill: var(--ink2); text-anchor: middle; dominant-baseline: middle; font-weight: 600; pointer-events: none; }
#mini .me { fill: var(--accent); } #mini .cone { fill: var(--accent); opacity: .28; }

/* 마감 선택 패널 */
#panel { position: absolute; top: 76px; right: 12px; width: 340px; max-height: calc(100% - 76px - 200px); display: flex; flex-direction: column;
  background: var(--card); backdrop-filter: blur(14px); border-radius: 18px; box-shadow: var(--shadow); z-index: 6; overflow: hidden;
  transform: translateX(calc(100% + 24px)); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
#panel.open { transform: none; }
.ph { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
.ph .where { font-size: 12px; color: var(--ink2); font-weight: 600; }
.ph h2 { margin: 3px 0 2px; font-size: 18px; letter-spacing: -.02em; }
.ph .spec { font-size: 12px; color: var(--ink3); }
.ph .x { position: absolute; top: 12px; right: 12px; border: 0; background: #ece8e1; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; line-height: 1; }
.scope { display: flex; gap: 6px; padding: 12px 18px 0; flex-wrap: wrap; }
.scope button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--ink2); }
.scope button.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.tabs { display: flex; gap: 2px; padding: 12px 14px 0; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 6px 8px 8px; font-size: 13px; font-weight: 700; color: var(--ink3); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 18px; overflow-y: auto; }
.chip { border: 0; background: none; padding: 0; text-align: left; }
.chip i { display: block; aspect-ratio: 1; border-radius: 10px; background-size: cover; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); transition: transform .15s; }
.chip:hover i { transform: scale(1.04); }
.chip.on i { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--sel); }
.chip span { display: block; font-size: 11.5px; font-weight: 600; margin-top: 6px; line-height: 1.25; }
.chip small { display: block; font-size: 10.5px; color: var(--ink3); }
.chip.custom i { display: grid; place-items: center; background: conic-gradient(#e66, #ec6, #6c6, #6ce, #66e, #e6e, #e66); position: relative; }
.chip.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.pf { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.pf button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px; font-size: 12.5px; font-weight: 600; }
.pf button:disabled { opacity: .4; cursor: default; }

/* 조이스틱 (터치) */
#joy { position: absolute; left: 22px; bottom: 26px; width: 120px; height: 120px; border-radius: 50%; background: rgba(20, 18, 15, .25); backdrop-filter: blur(6px);
  z-index: 4; display: none; touch-action: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(255, 255, 255, .85); }
.touch #joy.show { display: block; }

/* 사양서 */
dialog { border: 0; border-radius: 20px; padding: 0; width: min(860px, calc(100% - 24px)); max-height: calc(100% - 40px); box-shadow: var(--shadow); color: var(--ink); }
dialog::backdrop { background: rgba(20, 16, 10, .45); backdrop-filter: blur(3px); }
.dh { display: flex; align-items: center; gap: 10px; padding: 20px 24px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
.dh h2 { margin: 0; font-size: 19px; flex: 1; }
.db { padding: 18px 24px 24px; }
.db h3 { font-size: 14px; margin: 22px 0 8px; } .db h3:first-child { margin-top: 0; }
.note { font-size: 12px; color: var(--ink3); margin: 4px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; color: var(--ink3); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .sw { display: inline-block; width: 22px; height: 22px; border-radius: 5px; background-size: cover; vertical-align: middle; margin-right: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { font-size: 12px; font-weight: 600; color: var(--ink2); display: grid; gap: 4px; }
.form input, .form textarea, .form select { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; }
.form .wide { grid-column: 1 / -1; }
.ok { background: #f2efe8; border-radius: 12px; padding: 14px 16px; font-size: 13px; margin-top: 12px; display: none; }

#fade { position: absolute; inset: 0; background: #f4f1ec; opacity: 0; pointer-events: none; z-index: 8; transition: opacity .22s; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: #ece8e1; z-index: 9; font-size: 14px; color: var(--ink2); transition: opacity .4s; }
#toast { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 99px; font-size: 13px;
  z-index: 9; opacity: 0; transition: opacity .25s; pointer-events: none; }


/* 페이지 틀: 머리글 + 크게 자리 잡은 3D 뷰어 + 아래 소개 */
body.noscroll { overflow: hidden; }
.pwrap { max-width: 1680px; margin: 0 auto; padding: 0 20px; }
header.page { position: sticky; top: 0; z-index: 20; background: rgba(248, 246, 242, .9); backdrop-filter: blur(12px); }
header.page .pwrap { display: flex; align-items: center; gap: 14px; height: 64px; }
header.page .back { text-decoration: none; font-weight: 700; font-size: 14px; color: var(--ink2); white-space: nowrap; }
header.page .title { flex: 1; min-width: 0; line-height: 1.25; }
header.page h1 { margin: 0; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.page .title span { font-size: 12px; color: var(--ink2); }
header.page .btn { box-shadow: none; border: 1px solid var(--line); text-decoration: none; }
header.page .btn.primary { color: #fff; border-color: var(--accent); }
#viewer { position: relative; height: min(calc(100svh - 92px), 920px); min-height: 480px; border-radius: 20px; overflow: hidden; background: #cfd9df;
  box-shadow: 0 24px 70px rgba(40, 30, 15, .18); isolation: isolate; }
#viewer:fullscreen { height: 100%; border-radius: 0; }
#viewer.pseudo-fs { position: fixed; inset: 0; height: 100dvh; min-height: 0; border-radius: 0; z-index: 50; }
.vtools { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; gap: 8px; }
.vtools .btn { display: inline-flex; align-items: center; gap: 7px; }
.vtools .btn svg { width: 17px; height: 17px; }
.vtools .btn.on { background: var(--ink); color: #fff; }
#cross { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .45);
  z-index: 4; pointer-events: none; display: none; }
#viewer.locked #cross { display: block; }
#viewer.locked #gl { cursor: none; }
#viewer.locked #tip { transform: translate(-50%, 18px); }
section.info { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; padding: 32px 0 56px; }
.info h2 { font-size: 24px; letter-spacing: -.02em; margin: 6px 0 8px; }
.info .eyebrow { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .1em; }
.info p { color: var(--ink2); margin: 0 0 14px; font-size: 15px; line-height: 1.6; }
.info .facts { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 16px 0; }
.info .facts div { padding: 12px 0; text-align: center; } .info .facts div + div { border-left: 1px solid var(--line); }
.info .facts b { display: block; font-size: 17px; } .info .facts span { font-size: 12px; color: var(--ink3); }
.info .note { font-size: 12px; }
.info .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.info .acts .btn { box-shadow: none; border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.info .acts .btn.primary { color: #fff; border-color: var(--accent); }
.others h3 { font-size: 14px; margin: 6px 0 12px; color: var(--ink2); }
.others .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.others a { display: block; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.others img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.others a span { display: block; padding: 8px 10px 10px; font-size: 13px; font-weight: 700; line-height: 1.3; }
.others a small { display: block; font-weight: 500; font-size: 11.5px; color: var(--ink3); }

@media (max-width: 760px) {
  .top { flex-wrap: wrap; gap: 6px; top: 8px; left: 8px; right: 8px; }
  .pwrap { padding: 0 10px; }
  header.page .pwrap { height: 56px; gap: 8px; } header.page h1 { font-size: 15px; } header.page .title span { display: none; }
  #homeSel { max-width: 120px; } #reqLink { display: none; }
  #viewer { height: 76svh; min-height: 420px; border-radius: 14px; }
  .vtools { left: 8px; bottom: auto; top: 104px; flex-direction: column; } .vtools .btn span { display: none; }
  section.info { grid-template-columns: 1fr; padding: 20px 0 40px; }
  .seg button { padding: 6px 9px; font-size: 12px; }
  .btn { padding: 8px 10px; font-size: 12px; }
  .top .spacer { display: none; }
  #roomName { top: auto; bottom: 168px; }
  #hint { display: none; }
  #mini { width: 150px; top: 104px; bottom: auto; padding: 6px; } #mini header { display: none; }
  #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 52%; border-radius: 18px 18px 0 0; transform: translateY(105%); }
  .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 14px; }
  .form { grid-template-columns: 1fr; }
  .rl { font-size: 10px; padding: 2px 5px; } .rl small { display: none; }
}
@media print {
  body { overflow: visible; height: auto; background: #fff; }
  body > *:not(dialog) { display: none !important; }
  dialog { position: static; width: 100%; max-height: none; box-shadow: none; }
  dialog::backdrop { display: none; }
  .dh .btn, #reqForm, #reqForm + .ok, .db h3:nth-last-of-type(1) { display: none; }
}
</style>
</head>
<body>
<header class="page"><div class="pwrap">
  <a class="back" href="./">← 홈</a>
  <div class="title"><h1 id="planName"></h1><span id="planMeta"></span></div>
  <select class="btn" id="homeSel" aria-label="다른 주택 보기"></select>
  <a class="btn primary" id="reqLink" href="./#request">상담 요청</a>
</div></header>
<main class="pwrap">
<div id="viewer">
<canvas id="gl" tabindex="0"></canvas>
<div id="labels"></div>
<div class="top">
  <div class="seg" id="modes">
    <button data-mode="walk" class="on">걷기</button>
    <button data-mode="doll">3D 전체</button>
    <button data-mode="plan">2D 평면</button>
  </div>
  <div class="seg" id="levels"></div>
  <div class="seg" id="time">
    <button data-t="day" class="on">낮</button>
    <button data-t="night">밤</button>
  </div>
  <div class="spacer"></div>
  <select class="btn" id="preset" aria-label="스타일 프리셋">
    <option value="">스타일 프리셋</option>
  </select>
  <button class="btn" id="shareBtn">링크 복사</button>
  <button class="btn primary" id="specBtn">마감 사양서</button>
</div>

<div class="vtools">
  <button class="btn" id="lookBtn" title="마우스만 움직여 둘러보기 (Esc 로 해제)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></svg><span>마우스 시점</span></button>
  <button class="btn" id="fsBtn" aria-label="전체 화면" title="전체 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>전체 화면</span></button>
</div>
<div id="cross"></div>
<div id="roomName"></div>
<div id="hint">
  <span id="hintText"></span>
  <button aria-label="닫기" id="hintX">×</button>
</div>
<div id="tip"></div>

<div id="mini"><header><span><b id="miniLevel"></b>평면도 · 누르면 이동</span><span id="miniRoom"></span></header><svg id="miniSvg"></svg></div>
<div id="joy"><i></i></div>

<aside id="panel" aria-live="polite">
  <div class="ph">
    <div class="where" id="pWhere"></div>
    <h2 id="pName"></h2>
    <div class="spec" id="pSpec"></div>
    <button class="x" id="pClose" aria-label="닫기">×</button>
  </div>
  <div class="scope" id="pScope"></div>
  <div class="tabs" id="pTabs"></div>
  <div class="grid" id="pGrid"></div>
  <div class="pf"><button id="undoBtn" disabled>되돌리기</button><button id="resetBtn">처음 마감으로</button></div>
</aside>

<div id="fade"></div>
<div id="toast"></div>
<div id="loading">집을 짓는 중…</div>
</div>
<section class="info">
  <div id="homeInfo"></div>
  <div class="others"><h3>다른 주택도 걸어 보기</h3><div class="row" id="otherHomes"></div></div>
</section>
</main>

<dialog id="spec">
  <div class="dh"><h2>마감 사양서</h2><button class="btn" id="jsonBtn">JSON 저장</button><button class="btn" id="printBtn">인쇄 · PDF</button><button class="btn" id="specX">닫기</button></div>
  <div class="db">
    <h3>공간별 마감</h3>
    <table id="specRooms"></table>
    <h3>자재별 물량</h3>
    <table id="specTotals"></table>
    <p class="note">면적은 벽 중심선 기준으로 계산한 참고값이며 창·문 개구부를 뺀 값입니다. 발주 물량은 실측 후 확정합니다. 규격은 참고 표기입니다.</p>
    <h3>이 마감으로 시공 상담 요청</h3>
    <form class="form" id="reqForm">
      <label>이름<input name="name" required autocomplete="name"></label>
      <label>연락처<input name="phone" required autocomplete="tel" inputmode="tel"></label>
      <label>요청 구분<select name="type"><option>신축 시공</option><option>리모델링</option><option>분양 상담</option></select></label>
      <label>시공 지역<input name="area" placeholder="예: 경기 성남시"></label>
      <label class="wide">요청 사항<textarea name="memo" rows="3"></textarea></label>
