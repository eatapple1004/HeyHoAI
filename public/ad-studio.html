<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ad Studio · Doppia</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/theme.css?v=6" />
<script src="/saas-auth.js?v=3" defer></script>
<script src="/js/rail.js?v=12" defer></script>
<style>
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted, #9a9ab0); font-size: 14px; margin-bottom: 24px; }

  /* 단계 — 앞 단계가 끝나야 다음이 열린다. 순서를 눈으로 알 수 있어야 헤매지 않는다. */
  .step { border: 1px solid var(--line, #2a2a3a); border-radius: 12px; padding: 18px; margin-bottom: 14px; background: var(--card, #16161f); }
  .step[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .step h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent, #7c6cff); color: #fff;
         font-size: 12px; display: grid; place-items: center; flex: none; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; resize: vertical;
             border: 1px solid var(--line, #2a2a3a); background: var(--bg, #0c0c14); color: inherit;
             font-size: 14px; font-family: inherit; line-height: 1.5; }
  .chosen { font-size: 12.5px; color: var(--muted, #9a9ab0); margin: 8px 0; }
  .chosen b { color: inherit; }
  input[type=text], input[type=url] { flex: 1; min-width: 220px; padding: 10px 12px; border-radius: 8px;
         border: 1px solid var(--line, #2a2a3a); background: var(--bg, #0c0c14); color: inherit; font-size: 14px; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; background: var(--accent, #7c6cff);
           color: #fff; font-size: 14px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--line, #2a2a3a); color: inherit; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line, #2a2a3a);
          background: transparent; color: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent, #7c6cff); border-color: transparent; color: #fff; }
  .label { font-size: 12px; color: var(--muted, #9a9ab0); margin: 12px 0 6px; }

  .product { display: flex; gap: 12px; align-items: center; }
  .product img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: #222; }
  /* 이전 업로드 선택 — 매번 새로 올리지 않게. Shots와 같은 방식. */
  .picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .picker button { padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden;
                   background: none; line-height: 0; cursor: pointer; position: relative; }
  .picker button:hover { border-color: var(--line, #2a2a3a); }
  .picker button[aria-pressed="true"] { border-color: var(--accent, #7c6cff); }
  .picker img { width: 64px; height: 64px; object-fit: cover; display: block; background: #222; }
  .picker .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9px; line-height: 1.4;
                 padding: 2px 3px; background: rgba(0,0,0,.62); color: #fff; text-align: center;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .thumbs img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }

  .shot { border-left: 2px solid var(--accent, #7c6cff); padding: 6px 0 6px 10px; margin: 8px 0; font-size: 13px; }
  .shot .tc { color: var(--muted, #9a9ab0); font-size: 12px; }
  .shot .say { margin-top: 4px; }
  pre.prompt { white-space: pre-wrap; font-size: 12px; line-height: 1.5; background: var(--bg, #0c0c14);
               padding: 12px; border-radius: 8px; max-height: 260px; overflow: auto; }
  .warn { background: #3a2a00; border: 1px solid #6a4a00; color: #ffd479; padding: 8px 10px;
          border-radius: 8px; font-size: 12.5px; margin: 6px 0; }
  .err { background: #3a1a1a; border: 1px solid #6a2a2a; color: #ff9b9b; padding: 10px 12px;
         border-radius: 8px; font-size: 13px; margin: 8px 0; }
  .cost { font-size: 13px; color: var(--muted, #9a9ab0); }
  .cost b { color: inherit; font-size: 15px; }
  video { width: 100%; max-width: 320px; border-radius: 12px; display: block; margin-top: 10px; }

  /* 생성 진행 — 9:16 자리를 미리 잡아두고 그 안에서 빛이 훑고 지나간다.
     결과가 어디에 얼마만 한 크기로 나올지 미리 보이면 기다림이 덜 답답하다. */
  .prog { display: flex; gap: 16px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .frame { width: 180px; aspect-ratio: 9/16; border-radius: 12px; position: relative; overflow: hidden;
           background: linear-gradient(180deg, #1b1b28, #12121c); border: 1px solid var(--line, #2a2a3a); }
  .frame::after { content: ''; position: absolute; inset: 0;
                  background: linear-gradient(100deg, transparent 20%, rgba(124,108,255,.35) 50%, transparent 80%);
                  transform: translateX(-100%); animation: sweep 1.8s ease-in-out infinite; }
  @keyframes sweep { to { transform: translateX(100%); } }
  .frame .tick { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent, #7c6cff);
                 width: 0; transition: width .6s linear; }

  .steps { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 5px 0; color: var(--muted, #9a9ab0); }
  .steps li .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; display: grid; place-items: center;
                   border: 1.5px solid var(--line, #2a2a3a); font-size: 10px; }
  .steps li[data-s="done"] { color: inherit; }
  .steps li[data-s="done"] .dot { background: var(--accent, #7c6cff); border-color: transparent; color: #fff; }
  .steps li[data-s="now"] { color: inherit; }
  .steps li[data-s="now"] .dot { border-color: var(--accent, #7c6cff); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(124,108,255,.18); } }
  .elapsed { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--muted, #9a9ab0); margin-top: 8px; }
  .muted { color: var(--muted, #9a9ab0); font-size: 12.5px; }

  /* ── 컴포저: 프롬프트·설정·상품·생성을 한 덩어리로 ── */
  .composer { border: 1px solid var(--line, #2a2a3a); border-radius: 18px; padding: 14px 16px;
              background: #0f0f18; }
  .composer textarea { width: 100%; background: transparent; border: 0; resize: none; outline: none;
              color: inherit; font: inherit; font-size: 15px; line-height: 1.5; padding: 4px 2px; }
  .cbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .cbar .chips { margin: 0; flex: 1 1 auto; }
  /* 상품 칩 — 고르기 전엔 '＋ 상품', 고르면 썸네일+이름 */
  .prodchip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px;
              border: 1px solid var(--line, #2a2a3a); background: #16161f; color: inherit;
              font-size: 13px; cursor: pointer; max-width: 200px; }
  .prodchip img { width: 26px; height: 26px; object-fit: cover; border-radius: 6px; }
  .prodchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gen { padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; }

  /* 상품 모달 */
  dialog#prodDlg { width: min(680px, 92vw); border: 1px solid var(--line, #2a2a3a); border-radius: 16px;
                   background: #0f0f18; color: inherit; padding: 18px 20px 22px; }
  dialog#prodDlg::backdrop { background: rgba(0,0,0,.62); backdrop-filter: blur(3px); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

  /* ── 생성 진행 표시 ──
     "processing" 한 단어로는 살아 있는지 멈춘 건지 알 수 없다. 몇 단계 중 어디인지,
     얼마나 됐는지, 지금 뭐가 만들어지는 중인지를 눈으로 보이게 한다. */
  .ms-stages { display: flex; gap: 6px; margin: 10px 0 8px; flex-wrap: wrap; }
  .ms-stage { display: flex; align-items: center; gap: 6px; font-size: 12px;
              color: var(--muted, #9a9ab0); padding: 4px 10px; border-radius: 999px;
              border: 1px solid var(--line, #2a2a3a); }
  .ms-stage[data-s="doing"] { color: #fff; border-color: transparent;
              background: color-mix(in srgb, var(--accent, #7c6cff) 22%, transparent); }
  .ms-stage[data-s="done"]  { color: #b9f5cf; border-color: color-mix(in srgb, #4ad07f 40%, transparent); }
  .ms-stage .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ms-stage[data-s="doing"] .dot { animation: ms-blink 1s ease-in-out infinite; }
  @keyframes ms-blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .ms-bar { height: 6px; border-radius: 999px; background: #1c1c28; overflow: hidden; }
  .ms-bar > i { display: block; height: 100%; border-radius: 999px;
                background: linear-gradient(90deg, var(--accent, #7c6cff), #a98bff);
                transition: width .45s ease; }
  /* 씬 개수를 아직 모를 때(대본 쓰는 중)는 진행률 대신 흐르는 줄무늬로 '살아 있음'만 알린다 */
  .ms-bar.indet > i { width: 40% !important; animation: ms-slide 1.2s ease-in-out infinite; }
  @keyframes ms-slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }

  .ms-ph { position: relative; overflow: hidden; background: #1c1c28; }
  .ms-ph::after { content: ''; position: absolute; inset: 0;
                  background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
                  animation: ms-shim 1.4s linear infinite; }
  @keyframes ms-shim { 0% { transform: translateX(-100%) } 100% { transform: translateX(100%) } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ad Studio</h1>
  <div class="sub">상품 URL 하나로 광고 영상을 만듭니다.</div>

  <!--
    ── 컴포저 한 줄 ──
    경쟁사는 프롬프트·설정·상품·생성을 **한 덩어리**에 넣는다. 단계 번호도 라벨도 없다.
    기능을 줄인 게 아니라 상품 고르기를 모달 뒤로 접었을 뿐이다(그쪽 PRODUCT 칩 = ADD YOUR PRODUCT).
    우리도 같은 방식 — ①의 내용은 그대로 살아 있고 위치만 모달로 옮겼다.
  -->
  <section class="composer">
    <textarea id="msPrompt" rows="2" placeholder="어떤 영상을 원하세요 — 예) 아기자기하고 귀여운 영상을 만들어줘"></textarea>

    <div class="cbar">
      <button type="button" class="prodchip" id="btnProd">
        <img id="msThumb" alt="" hidden />
        <span id="msProdName">＋ 상품</span>
      </button>

      <div class="chips" id="msOpts">
        <button class="chip" data-k="aspect" data-v="9:16" aria-pressed="true">9:16</button>
        <button class="chip" data-k="aspect" data-v="1:1">1:1</button>
        <button class="chip" data-k="aspect" data-v="16:9">16:9</button>
        <button class="chip" data-k="quality" data-v="low" aria-pressed="true">기본</button>
        <button class="chip" data-k="quality" data-v="high">고화질</button>
        <button class="chip" data-k="voice" data-v="on" aria-pressed="true">🔊 내레이션</button>
        <button class="chip" data-k="music" data-v="on" aria-pressed="true">♪ 배경음악</button>
      </div>

      <button id="btnMs" class="gen">만들기</button>
    </div>
    <div class="muted" id="msMsg" style="margin-top:8px"></div>
    <div id="msBox"></div>
  </section>

  <!-- 상품 고르기 — ①의 내용을 그대로 옮겼다(id 동일 → 기존 JS 무변경) -->
  <dialog id="prodDlg">
    <div class="dlg-head">
      <b>상품 고르기</b>
      <button type="button" class="ghost" id="btnProdClose">닫기</button>
    </div>

    <!-- 가장 빠른 길을 맨 위에. 파일을 고르면 업로드·등록·이름/설명 생성까지 한 번에 끝난다
         (아래 '직접 등록'은 올리기 → 등록 두 번을 눌러야 하는 옛 경로라 뒤에 둔다). -->
    <div class="label">사진 한 장으로 바로 시작</div>
    <div class="row" style="align-items:center;gap:10px">
      <input type="file" id="msFile" accept="image/*" style="flex:1" />
    </div>

    
    <div class="row">
      <input type="url" id="url" placeholder="https://... 상품 페이지 주소" />
      <button id="btnCollect">가져오기</button>
    </div>
    <div class="muted" style="margin-top:8px">쿠팡·스마트스토어 등 일부 사이트는 자동 수집이 막혀 있습니다. 그럴 땐 아래에서 이미지를 직접 고르거나 올리세요.</div>
    <div id="collectMsg"></div>

    <!-- 등록된 상품이 먼저다. 아래 '예전에 올린 이미지'는 이름 없는 원본이라 구분이 안 된다. -->
    <div id="myWrap" hidden>
      <div class="label">내 상품 — 눌러서 바로 시작</div>
      <div class="picker" id="myProducts"></div>
    </div>

    <div id="recentWrap" hidden>
      <div class="label">예전에 올린 이미지 — 눌러서 바로 시작</div>
      <div class="picker" id="recent"></div>
    </div>

    <details id="manualBox" style="margin-top:10px">
      <summary class="muted" style="cursor:pointer">URL이 없거나 수집이 안 되면 — 직접 등록</summary>
      <div class="row" style="margin-top:10px">
        <input type="text" id="mName" placeholder="제품명 (비우면 사진 보고 자동으로 지어줍니다)" />
      </div>
      <div class="row" style="margin-top:8px">
        <input type="file" id="mFile" accept="image/*" style="flex:1" />
        <button class="ghost" id="btnUpload">이미지 올리기</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input type="url" id="mImage" placeholder="또는 이미지 주소(https://...)" />
        <button class="ghost" id="btnManual">등록</button>
      </div>
      <div class="muted" id="upMsg" style="margin-top:6px"></div>
    </details>

    <div id="productBox" hidden style="margin-top:12px">
      <div class="product">
        <img id="pImg" alt="" />
        <div style="flex:1">
          <div id="pName" style="font-weight:600"></div>
          <div class="muted" id="pMeta"></div>
          <button class="linkish" id="btnEditProduct" type="button"
                  style="background:none;border:0;padding:0;margin-top:6px;cursor:pointer;font-size:12.5px;opacity:.75;text-decoration:underline">이름·설명 수정</button>
        </div>
      </div>

      <!-- 자동 추출은 출발점일 뿐이다. 판매명이 따로 있거나 비전이 어색하게 지었을 때 사람이 고친다. -->
      <div id="pEdit" hidden style="margin-top:10px">
        <div class="label">상품명</div>
        <input id="pNameInput" maxlength="120" />
        <div class="label" style="margin-top:8px">설명</div>
        <textarea id="pDescInput" rows="3" maxlength="2000"></textarea>
        <div class="row" style="margin-top:8px; align-items:center">
          <button id="btnSaveProduct" type="button">저장</button>
          <button id="btnAutofill" type="button" class="ghost">사진 보고 자동으로 짓기</button>
          <button id="btnCancelProduct" type="button" class="ghost">취소</button>
          <span class="muted" id="pEditMsg"></span>
        </div>
      </div>
      <div class="thumbs" id="pThumbs"></div>
    </div>
    </dialog>

</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  /** 칩 목록 렌더 — 훅·장소·스타일이 같은 동작(단일 선택, 다시 누르면 해제)을 공유한다. */

  let autofilling = false;   // 자동 채우기 재진입 방지(showProduct가 다시 불리므로)
  const state = { product: null, compiled: null };   // ④(Marketing Studio)만 남아 상품만 쓴다

  /** 응답 봉투가 {success,data} 또는 {success:false,error}. 에러는 서버 문구를 그대로 보여준다. */
  async function api(path, opts = {}) {
    const r = await fetch('/api/ad-studio' + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.success === false) {
      const e = new Error(j.error || ('요청 실패 (' + r.status + ')'));
      e.status = r.status; e.data = j.data;
      throw e;
    }
    return j.data;
  }

  const enable = (id, on) => $(id).setAttribute('aria-disabled', on ? 'false' : 'true');
  const html = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ── 0. 예전에 올린 이미지 ──
  /** 이미 올린 걸 다시 올리게 하지 않는다. 누르면 vision이 이름까지 붙여 바로 제품이 된다. */
  async function loadRecent() {
    let items = [];
    try { items = await api('/recent-images'); } catch { return; }
    if (!items.length) return;
    $('recentWrap').hidden = false;
    $('recent').innerHTML = items.map((it, i) =>
      '<button data-i="' + i + '" title="' + html(it.label) + '">' +
      '<img src="' + html(it.url) + '" alt="" loading="lazy">' +
      '<span class="cap">' + html(it.label) + '</span></button>').join('');
    $('recent').querySelectorAll('button').forEach((b) => {
      b.onclick = async () => {
        const it = items[+b.dataset.i];
        $('recent').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        // 이미 등록된 제품이면 그대로 쓰고, 아니면 이미지로 새로 등록한다(이름은 vision이 붙인다).
        $('collectMsg').innerHTML = '<div class="muted">불러오는 중…</div>';
        try {
          const p = it.productId
            ? await api('/web-products/' + it.productId)
            : await api('/web-products/manual', { method: 'POST', body: JSON.stringify({ images: [it.url] }) });
          showProduct(p);
          $('collectMsg').innerHTML = '';
        } catch (e) {
          $('collectMsg').innerHTML = '<div class="err">' + html(e.message) + '</div>';
        }
      };
    });
  }

  /** 등록된 상품 목록. 자동 생성된 이름이 붙어 있어 무엇인지 알아볼 수 있다. */
  async function loadMyProducts() {
    let items = [];
    try { items = await api('/web-products'); } catch { return; }
    if (!items.length) return;
    $('myWrap').hidden = false;
    $('myProducts').innerHTML = items.map((p, i) =>
      '<button data-i="' + i + '" title="' + html(p.description || '') + '">'
      + '<img src="' + html((p.images || [])[0] || '') + '" alt="">'
      + '<span>' + html(p.name || '(이름 없음)') + '</span></button>').join('');
    $('myProducts').querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        $('myProducts').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        showProduct(items[+b.dataset.i]);
      };
    });
  }

  // ── 1. 수집 ──
  function showProduct(p) {
    state.product = p;
    $('pName').textContent = p.name || '(이름 없음)';
    $('pMeta').textContent = [p.price ? p.price + '원' : '', p.attributes?.category || ''].filter(Boolean).join(' · ');
    $('pImg').src = (p.images || [])[0] || '';
    $('pThumbs').innerHTML = (p.images || []).slice(1, 6).map((u) => '<img src="' + html(u) + '" alt="">').join('');
    $('pNameInput').value = p.name || '';
    $('pDescInput').value = p.description || '';
    $('pEdit').hidden = true;
    $('pEditMsg').textContent = '';
    $('productBox').hidden = false;
    $('manualBox').open = false;
    if (p.id) loadMyProducts();
    // 컴포저의 상품 칩을 갱신하고 모달을 닫는다 — 고른 즉시 본 화면으로 돌아가야 한다.
    if ($('msProdName')) {
      $('msProdName').textContent = p.name || '상품';
      const u0 = (p.images || [])[0];
      if (u0) { $('msThumb').src = u0; $('msThumb').hidden = false; }
    }
    const dlg = $('prodDlg');
    if (dlg && dlg.open && !autofilling) dlg.close();
    // 비어 있으면 자동으로 채운다 — 자동 생성이 붙기 전에 만든 상품은 이름이 '제품'이고 설명이 없다.
    //   서버가 같은 조건을 다시 검사하므로, 이미 채워진 상품에는 API 호출이 낭비되지 않는다.
    if (p.id && !autofilling && (!p.description || ['제품', '상품'].includes(String(p.name || '').trim()))) {
      autofilling = true;
      $('pMeta').textContent = '사진 보고 이름·설명 짓는 중…';
      api('/web-products/' + encodeURIComponent(p.id) + '/autofill', { method: 'POST', body: '{}' })
        .then((up) => { if (up) showProduct(up); })
        .catch(() => { $('pMeta').textContent = ''; })
        .finally(() => { autofilling = false; });
    }
  }

  // ── Marketing Studio (Ad Video 엔진 배선) ──
  // voice·music은 **기본 켜짐**이다. 서버는 'true'를 명시해야 오디오를 만드는데, 안 보내면
  //   무음 영상이 나온다 — ElevenLabs를 붙여도 소리가 없다(실측으로 발견).
  const ms = { aspect: '9:16', quality: 'low', voice: true, music: true, busy: false };
  const TOGGLES = ['voice', 'music'];
  let msScript = null;
  let msStartedAt = 0;
  let msLastJob = null;
  /** 경과 시간 — 몇 분 걸리는 작업이라 "얼마나 됐는지"가 멈춤과 진행을 구분해 준다. */
  function msElapsed() {
    if (!msStartedAt) return '';
    const s2 = Math.round((Date.now() - msStartedAt) / 1000);
    return s2 < 60 ? s2 + '초' : Math.floor(s2 / 60) + '분 ' + (s2 % 60) + '초';
  }
  $('msOpts').querySelectorAll('.chip').forEach((c) => {
    c.onclick = () => {
      const k = c.dataset.k;
      if (TOGGLES.includes(k)) {                       // on/off
        ms[k] = c.getAttribute('aria-pressed') !== 'true';
        c.setAttribute('aria-pressed', ms[k] ? 'true' : 'false');
        return;
      }
      $('msOpts').querySelectorAll('.chip[data-k="' + k + '"]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      c.setAttribute('aria-pressed', 'true');
      ms[k] = c.dataset.v;
    };
  });

  /** 상품 이미지를 URL로 넘긴다 — 서버가 /images/<file> 서빙 경로만 받아 로컬에서 읽는다. */
  function msForm(extra) {
    const fd = new FormData();
    const p = state.product || {};
    (p.images || []).slice(0, 5).forEach((u) => fd.append('productImageUrl', u));
    fd.append('product', p.name || '제품');
    fd.append('concept', $('msPrompt').value.trim() || '제품의 매력이 드러나는 광고 영상');
    fd.append('language', 'ko');
    fd.append('outputType', 'product-ad');
    Object.entries(extra || {}).forEach(([k, v]) => fd.append(k, v));
    return fd;
  }

  async function msPost(path, fd) {
    const r = await fetch('/api/generate/ugc/' + path, { method: 'POST', body: fd });
    const t = await r.text();
    let j; try { j = JSON.parse(t); } catch { throw new Error('서버 응답을 읽지 못했습니다 (' + r.status + ')'); }
    if (!r.ok || j.success === false) throw new Error(j.error || ('요청 실패 (' + r.status + ')'));
    return j;
  }

  /**
   * 씬 진행 상황. 힉스필드는 "여러 씬이 만들어지는 과정"을 보여주는 게 핵심 경험이라,
   * 썸네일만 늘어놓지 않고 **몇 번째 씬이 무슨 내용인지** 같이 보여준다.
   * 대본(msScript)은 렌더 전에 이미 받아둔 것 — 클립이 아직 없어도 내용은 먼저 뜬다.
   */
  function msRender(job) {
    const clips = (job && (job.sceneClips || job.scene_clips || job.scenes || job.clips)) || [];
    const plan = (msScript && msScript.scenes) || [];
    const n = Math.max(clips.length, plan.length);
    const done = clips.filter((x) => x && (x.url || x.clipUrl)).length;
    const vid = job && (job.resultUrl || job.result_url || job.videoUrl || job.url);

    let cards = '';
    for (let i = 0; i < n; i++) {
      const c = clips[i] || {};
      const u = c.url || c.clipUrl;
      const sc = plan[i] || {};
      const txt = sc.summary || sc.brollPrompt || sc.direction || '';
      cards += '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)">'
        + (u ? '<video src="' + html(u) + '" muted playsinline loop autoplay style="width:92px;border-radius:8px;flex:0 0 auto"></video>'
             : '<div class="ms-ph" style="width:92px;height:124px;border-radius:8px;flex:0 0 auto"></div>')
        + '<div style="min-width:0">'
        +   '<div style="font-size:12.5px;font-weight:600">씬 ' + (i + 1)
        +     (sc.durationSec ? ' <span class="muted" style="font-weight:400">· ' + sc.durationSec + '초</span>' : '')
        +     (u ? '' : ' <span class="muted" style="font-weight:400">· 만드는 중…</span>') + '</div>'
        +   '<div class="muted" style="font-size:12px;line-height:1.45">' + html(String(txt).slice(0, 120)) + '</div>'
        + '</div></div>';
    }

    // 단계 표시 — 어디까지 왔는지가 한눈에 보여야 한다.
    const ok = job.status === 'succeeded';
    const st = (cond, doing) => (cond ? 'done' : doing ? 'doing' : 'todo');
    const stages = [
      ['대본', st(!!msScript, !msScript)],
      ['씬 생성', st(n > 0 && done >= n, n > 0 && done < n)],
      ['조립', st(ok, n > 0 && done >= n && !ok)],
    ];
    const pct = ok ? 100 : (n ? Math.round((done / n) * 100) : 0);
    const indet = !n && !ok;   // 씬 개수를 아직 모름(대본 쓰는 중)

    $('msBox').innerHTML =
      '<div class="ms-stages">' + stages.map(([lbl, s2]) =>
        '<span class="ms-stage" data-s="' + s2 + '"><i class="dot"></i>' + lbl + '</span>').join('') + '</div>'
      + '<div class="ms-bar' + (indet ? ' indet' : '') + '"><i style="width:' + pct + '%"></i></div>'
      + '<div class="muted" style="margin-top:6px">'
      +   (ok ? '완성' : '만드는 중') + (n ? ' · 씬 ' + done + '/' + n + ' (' + pct + '%)' : '')
      +   (msElapsed() ? ' · ' + msElapsed() : '') + '</div>'
      + (msScript && msScript.title ? '<div style="font-weight:600;margin-top:8px">' + html(msScript.title) + '</div>' : '')
      + cards
      + (vid ? '<video src="' + html(vid) + '" controls playsinline style="margin-top:12px;max-width:320px;border-radius:12px"></video>' : '');
  }

  /** ④에서 고른 사진을 바로 상품으로 만든다 — 이름·설명은 서버가 사진 보고 붙인다. */
  $('msFile').onchange = async () => {
    const f = $('msFile').files[0];
    if (!f) return;
    $('msMsg').textContent = '사진 올리는 중…';
    try {
      const fd = new FormData(); fd.append('file', f);
      const up = await (await fetch('/api/ad-studio/upload', { method: 'POST', body: fd })).json();
      if (!up.success) throw new Error(up.error || '업로드 실패');

      $('msMsg').textContent = '사진 보고 상품 정보 정리하는 중…';
      const prod = await api('/web-products/manual', {
        method: 'POST', body: JSON.stringify({ images: [up.data.url] }),
      });
      showProduct(prod);                       // ①의 상품 카드도 같이 채워진다
      $('msThumb').src = up.data.url; $('msThumb').hidden = false;
      $('msProdName').textContent = prod.name || '';
      $('msMsg').textContent = '';
    } catch (e) {
      $('msMsg').textContent = e.message || '사진을 처리하지 못했습니다.';
    }
  };

  $('btnMs').onclick = async () => {
    if (ms.busy) return;
    if (!state.product) { $('msMsg').textContent = '먼저 상품을 가져와 주세요.'; return; }
    if (!(state.product.images || []).length) { $('msMsg').textContent = '상품 이미지가 필요합니다.'; return; }
    ms.busy = true; $('btnMs').disabled = true; $('msBox').innerHTML = '';
    msScript = null; msStartedAt = Date.now();
    msRender({ status: 'processing' });        // 누르는 즉시 단계 표시가 뜬다
    // 폴 간격이 4초라 그 사이 경과 시간이 멈춰 보인다 — 1초마다 다시 그린다.
    const tickTimer = setInterval(() => { if (ms.busy) msRender(msLastJob || { status: 'processing' }); }, 1000);
    try {
      $('msMsg').textContent = '대본 쓰는 중…';
      const sc = await msPost('script', msForm({ durationSec: '20' }));
      msScript = sc.script;                 // 씬 내용을 클립보다 먼저 띄우기 위해 보관
      msRender({ status: 'processing' });   // 대본이 나온 순간 씬 목록이 보인다 — 빈 화면으로 기다리지 않게

      $('msMsg').textContent = '씬 생성 중…';
      const rd = await msPost('render', msForm({
        script: JSON.stringify(sc.script), aspect: ms.aspect, quality: ms.quality,
        voice: ms.voice ? 'true' : 'false',   // 서버는 문자열 'true'만 참으로 본다
        music: ms.music ? 'true' : 'false',
      }));

      // 폴링 — Ad Video(pollUgcJob)와 같은 규약·간격을 쓴다. 초반은 촘촘하게, 이후 4초.
      let tick = 0;
      for (;;) {
        const j = await (await fetch('/api/generate/ugc/jobs/' + encodeURIComponent(rd.jobId))).json();
        const job = j.data || j.job || j;
        msLastJob = job;
        msRender(job);
        // ⚠️ ugc_jobs의 종료 상태는 succeeded/failed 둘뿐이다(processing → 둘 중 하나).
        //   done·completed 같은 값은 없다 — 그걸로 판정해서 완료된 잡을 계속 폴링했다(실측).
        if (job.status === 'succeeded') { $('msMsg').textContent = '완성되었습니다.'; break; }
        if (job.status === 'failed') { $('msMsg').textContent = '실패: ' + (job.error || '알 수 없는 오류'); break; }
        if (++tick > 240) { $('msMsg').textContent = '아직 만드는 중입니다 — 끝나면 여기에 나타납니다.'; break; }
        await new Promise((r) => setTimeout(r, tick < 4 ? 2500 : 4000));
      }
    } catch (e) {
      $('msMsg').textContent = e.message || '생성에 실패했습니다.';
    } finally {
      clearInterval(tickTimer);
      ms.busy = false; $('btnMs').disabled = false;
    }
  };

  // 상품 모달 — ①을 없앤 게 아니라 여기로 접었다.
  $('btnProd').onclick = () => { $('prodDlg').showModal(); loadMyProducts(); loadRecent(); };
  $('btnProdClose').onclick = () => $('prodDlg').close();
  $('prodDlg').addEventListener('click', (e) => {           // 바깥 클릭으로 닫기
    if (e.target === $('prodDlg')) $('prodDlg').close();
  });

  $('btnEditProduct').onclick = () => { $('pEdit').hidden = !$('pEdit').hidden; };
  $('btnAutofill').onclick = async () => {
    const p = state.product;
    if (!p || !p.id) { $('pEditMsg').textContent = '먼저 상품을 등록해 주세요.'; return; }
    $('btnAutofill').disabled = true; $('pEditMsg').textContent = '사진 보고 짓는 중…';
    try {
      showProduct(await api('/web-products/' + encodeURIComponent(p.id) + '/autofill',
        { method: 'POST', body: JSON.stringify({ force: true }) }));
      $('pEdit').hidden = false;   // 결과를 바로 보고 고칠 수 있게 편집칸을 연 채로 둔다
      $('pEditMsg').textContent = '새로 지었습니다.';
    } catch (e) {
      $('pEditMsg').textContent = e.message || '자동 생성에 실패했습니다.';
    } finally { $('btnAutofill').disabled = false; }
  };

  $('btnCancelProduct').onclick = () => {
    $('pNameInput').value = state.product?.name || '';
    $('pDescInput').value = state.product?.description || '';
    $('pEdit').hidden = true;
  };
  $('btnSaveProduct').onclick = async () => {
    const p = state.product;
    // 인라인 제품(업로드만 하고 아직 저장 전)은 서버에 행이 없다 — 그땐 화면 값만 바꾼다.
    if (!p || !p.id) {
      if (p) { p.name = $('pNameInput').value.trim() || p.name; p.description = $('pDescInput').value.trim(); showProduct(p); }
      return;
    }
    $('pEditMsg').textContent = '저장 중…';
    try {
      const saved = await api('/web-products/' + encodeURIComponent(p.id), {
        method: 'PATCH',
        body: JSON.stringify({ name: $('pNameInput').value, description: $('pDescInput').value }),
      });
      showProduct(saved);
      $('pEditMsg').textContent = '저장했습니다.';
    } catch (e) {
      $('pEditMsg').textContent = e.message || '저장에 실패했습니다.';
    }
  };

  $('btnCollect').onclick = async () => {
    const url = $('url').value.trim();
    if (!url) return;
    $('collectMsg').innerHTML = '<div class="muted">가져오는 중… (최대 30초)</div>';
    $('btnCollect').disabled = true;
    try {
      showProduct(await api('/web-products', { method: 'POST', body: JSON.stringify({ url }) }));
      $('collectMsg').innerHTML = '';
    } catch (e) {
      // 422 = 대상 사이트 문제 → 수동 입력을 연다(막다른 길로 두지 않는다)
      $('collectMsg').innerHTML = '<div class="err">' + html(e.message) + '</div>';
      if (e.status === 422) $('manualBox').open = true;   // 막다른 길로 두지 않는다
    } finally {
      $('btnCollect').disabled = false;
    }
  };

  $('btnManual').onclick = async () => {
    const name = $('mName').value.trim(), image = $('mImage').value.trim();
    // 이름은 선택이다 — 비우면 비전이 사진을 보고 짓는다(web-product.service의 폴백).
    //   전엔 name을 필수로 막아서, 자동 생성이 붙어 있는데도 쓸 기회가 없었다.
    if (!image) { $('collectMsg').innerHTML = '<div class="err">이미지를 올리거나 주소를 입력해 주세요.</div>'; return; }
    $('btnManual').disabled = true;
    try {
      showProduct(await api('/web-products/manual', {
        method: 'POST',
        // name을 비워 보내면 서버가 비전 값으로 채운다. 빈 문자열을 보내면 안 된다(그대로 저장된다).
        body: JSON.stringify({ url: $('url').value.trim(), ...(name ? { name } : {}), images: [image] }),
      }));
      $('collectMsg').innerHTML = '';
    } catch (e) {
      $('collectMsg').innerHTML = '<div class="err">' + html(e.message) + '</div>';
    } finally {
      $('btnManual').disabled = false;
    }
  };

  // ── 2. 라이브러리 ──
  let libLoaded = false;




  /** 파일 업로드 → /images/<file> 경로를 받아 아래 URL 칸을 채운다. */
  $('btnUpload').onclick = async () => {
    const f = $('mFile').files[0];
    if (!f) { $('upMsg').textContent = '이미지 파일을 먼저 고르세요.'; return; }
    $('btnUpload').disabled = true;
    $('upMsg').textContent = '올리는 중…';
    try {
      const fd = new FormData();
      fd.append('file', f);
      const r = await fetch('/api/ad-studio/upload', { method: 'POST', body: fd });
      const j = await r.json();
      if (!r.ok || j.success === false) throw new Error(j.error || '업로드 실패');
      $('mImage').value = j.data.url;
      $('upMsg').textContent = '업로드 완료 — 제품명을 넣고 [등록]을 누르세요.';
    } catch (e) {
      $('upMsg').textContent = e.message;
    } finally {
      $('btnUpload').disabled = false;
    }
  };

})();
</script>
</body>
</html>
