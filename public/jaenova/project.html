<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<title>Project | Jaenova Honors</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261007g">
</head>
<body data-page="projects" data-meta="pd" class="solid-header">

<!-- ============ PROJECT HERO — 내용은 project-detail.js 가 채움 ============ -->
<section class="page-hero with-img">
  <div class="page-hero-media">
    <img id="pdHeroImg" src="" alt="">
  </div>
  <div class="wrap page-hero-inner">
    <nav class="crumb">
      <a href="projects.html" data-i18n="pd.crumb"></a><span>/</span><span id="pdCrumbType"></span>
    </nav>
    <h1 id="pdName"></h1>
    <p class="sub" id="pdLoc"></p>
  </div>
</section>

<!-- ============ OVERVIEW ============ -->
<section class="section">
  <div class="wrap">
    <div class="split-2">
      <div class="reveal">
        <p class="kicker" data-i18n="pd.kicker"></p>
        <h2 class="display" data-i18n="pd.title"></h2>
        <div class="rule"></div>
      </div>
      <div class="reveal">
        <p class="lead" data-i18n="pd.desc"></p>
        <dl class="fact-table" id="pdFacts" style="margin-top:2.2rem"></dl>
      </div>
    </div>
  </div>
</section>

<!-- ============ GALLERY ============ -->
<section class="section navy">
  <div class="wrap">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="pd.g.kicker"></p>
      <h2 class="display" data-i18n="pd.g.title"></h2>
    </header>
    <div class="filters reveal" id="pdFilters" data-target="#pdGallery"></div>
    <div class="gallery pd-gallery reveal" id="pdGallery"></div>
    <p class="sub reveal" style="font-size:.8rem;margin-top:1.6rem" data-i18n="pd.note"></p>
    <nav class="pd-nav reveal" id="pdNav"></nav>
  </div>
</section>

<section class="cta">
  <div class="wrap reveal">
    <h2 data-i18n="cta.title"></h2>
    <p data-i18n="cta.p"></p>
    <a href="contact.html" class="btn btn-gold" data-i18n="cta.btn"></a>
  </div>
</section>

<script src="assets/js/i18n.js?v=20261007g"></script>
<script src="assets/js/layout.js?v=20261007g"></script>
<script src="assets/js/project-detail.js?v=20261007g"></script>
<script src="assets/js/main.js?v=20261007g"></script>
</body>
</html>
