<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta 직결 인스타 연동 · Doppia Admin</title>
<style>
:root{--accent:#6a40e0;--accent2:#a394ee;--bg:#0c0c14;--panel:#15151f;--panel2:#1c1c28;
  --text:#edecf5;--dim:#9a9ab2;--faint:#6a6a85;--border:#2a2a3a;--green:#4ade80;--red:#f87171;--gold:#ffce7a;--pink:#d9608f;
  --font:'Pretendard','Apple SD Gothic Neo','맑은 고딕',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:32px;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:1.7rem;font-weight:800;display:flex;align-items:center;gap:10px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#f09433,#dc2743)}
.sub{color:var(--dim);margin:6px 0 22px;font-size:.95rem}
.nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.nav a{font-size:.82rem;font-weight:600;color:var(--dim);text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:7px 13px}
.nav a:hover{color:var(--text);border-color:var(--accent2)}
.nav a.on{color:#fff;background:linear-gradient(180deg,#7c52e8,#5c33c2);border-color:transparent}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.count{margin-left:auto;color:var(--faint);font-size:.85rem}
input{background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 13px;font-size:.9rem;font-family:inherit}
input:focus{outline:none;border-color:var(--accent2)}
button{font-family:inherit;font-size:.88rem;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent2)}
button.primary{background:linear-gradient(180deg,#7c52e8,#5c33c2);border-color:transparent;color:#fff}
button.tiny{font-size:.78rem;padding:6px 11px}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.acc{display:flex;flex-direction:column;gap:12px}
.acc .top{display:flex;gap:12px;align-items:center}
.acc .avatar{width:46px;height:46px;border-radius:50%;background:var(--panel2);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:1.1rem;font-weight:700}
.acc .name{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .meta{color:var(--dim);font-size:.8rem;margin-top:2px}
.acc .acts{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:700}
.b-on{background:rgba(74,222,128,.16);color:var(--green)}
.b-off{background:rgba(154,154,178,.16);color:var(--dim)}
.b-warn{background:rgba(255,206,122,.16);color:var(--gold)}
.b-err{background:rgba(248,113,113,.16);color:var(--red)}
.empty{color:var(--faint);text-align:center;padding:60px 20px;grid-column:1/-1;line-height:1.7}
.msg{padding:14px 16px;border-radius:12px;display:none;margin-bottom:16px;font-size:.9rem;line-height:1.6}
.msg.show{display:block}
.msg.err{background:rgba(248,113,113,.12);border:1px solid #5b2e2e;color:#fca5a5}
.msg.ok{background:rgba(74,222,128,.12);border:1px solid #2e5b3a;color:#86efac}
.setup{margin-bottom:20px;font-size:.86rem;line-height:1.8;color:var(--dim)}
.setup b{color:var(--text)}
.setup code{background:var(--panel2);padding:2px 7px;border-radius:6px;font-size:.82rem;word-break:break-all}
.setup ol{margin:8px 0 0 20px}
@media(max-width:720px){body{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span> Meta 직결 인스타 연동</h1>
  <div class="sub">중개(Zernio) 없이 Meta에 바로 붙는 경로입니다. 기존 <a href="/admin-business" style="color:var(--accent2)">사업체 관리</a>와 나란히 두고 비교하기 위한 화면이라, 여기서 연결한 계정도 사업체 상세에서 그대로 붙일 수 있습니다.</div>
  <div class="nav">
    <a href="/admin-business">🏪 사업체 (Zernio)</a>
    <a href="/admin-business-meta" class="on">🔗 Meta 직결</a>
    <a href="/admin-creations">🖼 크리에이션</a>
    <a href="/admin-stats">📊 통계</a>
    <a href="/admin-trials">🎟 체험 계정</a>
    <a href="/admin-templates">🧩 템플릿</a>
  </div>

  <div class="msg err" id="err"></div>
  <div class="msg ok" id="ok"></div>

  <div class="card setup" id="setup" hidden></div>

  <div class="bar">
    <input id="expect" placeholder="붙일 계정 핸들 (예: doppia.ai) — 선택" style="min-width:260px">
    <button class="primary" id="connBtn" onclick="connect()">＋ 인스타 연결</button>
    <button id="refreshAllBtn" onclick="refreshAll()">🔄 만료 임박 토큰 갱신</button>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function flash(kind, text) {
  const el = $(kind === 'err' ? 'err' : 'ok');
  el.innerHTML = text;
  el.classList.add('show');
  if (kind !== 'err') setTimeout(() => el.classList.remove('show'), 5000);
}
function clearMsg() { $('err').classList.remove('show'); $('ok').classList.remove('show'); }

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 403) throw new Error('관리자 권한이 필요합니다.');
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.success === false) throw new Error(body.error || body.message || `요청 실패 (${res.status})`);
  return body;
}

/** 만료까지 남은 일수 — 60일 토큰이라 이 숫자가 화면의 핵심 정보다. */
function expiryBadge(iso) {
  if (!iso) return '<span class="badge b-err">토큰 없음</span>';
  const days = Math.floor((new Date(iso) - Date.now()) / 86400000);
  if (days < 0) return '<span class="badge b-err">만료됨 · 재연결 필요</span>';
  if (days <= 7) return '<span class="badge b-warn">' + days + '일 남음</span>';
  return '<span class="badge b-on">' + days + '일 남음</span>';
}

function cardHtml(a) {
  const avatar = a.profile_image
    ? '<img class="avatar" src="' + esc(a.profile_image) + '" alt="">'
    : '<div class="avatar">' + esc((a.username || '?').charAt(0).toUpperCase()) + '</div>';
  const biz = a.business_name
    ? '연결됨 · ' + esc(a.business_name)
    : '<span style="color:var(--faint)">사업체 미연결</span>';
  return '<div class="card acc">'
    + '<div class="top">' + avatar
    + '<div style="min-width:0;flex:1">'
    + '<div class="name">@' + esc(a.username) + '</div>'
    + '<div class="meta">' + (a.followers || 0).toLocaleString() + ' 팔로워 · ' + biz + '</div>'
    + '</div>' + expiryBadge(a.token_expires_at) + '</div>'
    + '<div class="acts">'
    + '<button class="tiny" onclick="refreshOne(\'' + a.id + '\')">토큰 갱신</button>'
    + '<button class="tiny" onclick="disconnect(\'' + a.id + '\', \'' + esc(a.username) + '\')">연결 해제</button>'
    + '</div></div>';
}

/** 자격증명이 없으면 무엇을 어디에 넣어야 하는지 화면에서 알려준다 — 콘솔 설정과 짝이 맞아야 동작한다. */
async function loadConfig() {
  try {
    const { data } = await api('/api/admin/business-meta/config');
    if (data.configured) { $('setup').hidden = true; return true; }
    $('setup').hidden = false;
    $('setup').innerHTML = '<b>⚠️ 아직 자격증명이 없습니다.</b> 서버 <code>.env</code>에 다음을 넣고 재시작하세요.'
      + '<ol>'
      + '<li><code>INSTAGRAM_APP_ID</code> — ⚠️ <b>Meta 앱 ID와 다른 숫자</b>입니다 (Meta 앱 → Instagram → API 설정)</li>'
      + '<li><code>INSTAGRAM_APP_SECRET</code></li>'
      + '<li>Meta 콘솔에 리디렉션 URI 등록: <code>' + esc(data.redirectUri) + '</code></li>'
      + '<li>붙일 계정을 앱 <b>Instagram 테스터</b>로 초대 → 해당 계정에서 수락 (개발 모드에선 역할이 있는 계정만 인증됩니다)</li>'
      + '</ol>';
    $('connBtn').disabled = true;
    return false;
  } catch (e) { flash('err', e.message); return false; }
}

async function load() {
  try {
    const { data } = await api('/api/admin/business-meta/accounts');
    $('count').textContent = data.length + '개 연결됨';
    $('grid').innerHTML = data.length
      ? data.map(cardHtml).join('')
      : '<div class="empty">연결된 계정이 없습니다.<br>위 [＋ 인스타 연결]을 누르면 인스타 동의 화면으로 이동합니다.</div>';
  } catch (e) {
    flash('err', e.message);
    $('grid').innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
  }
}

/** 동의 화면으로 이동 — 팝업이 아니라 전체 이동이다(팝업 차단·쿠키 문제를 피한다). */
function connect() {
  const expect = $('expect').value.trim().replace(/^@/, '');
  location.href = '/api/admin/business-meta/oauth/start' + (expect ? '?expect=' + encodeURIComponent(expect) : '');
}

async function refreshOne(id) {
  clearMsg();
  try { await api('/api/admin/business-meta/accounts/' + id + '/refresh', { method: 'POST' }); flash('ok', '토큰을 갱신했습니다 (+60일).'); load(); }
  catch (e) { flash('err', e.message); }
}

async function refreshAll() {
  clearMsg();
  $('refreshAllBtn').disabled = true;
  try {
    const { data } = await api('/api/admin/business-meta/accounts/refresh', { method: 'POST' });
    flash('ok', data.tried ? data.ok + '/' + data.tried + '개 갱신했습니다.' : '만료가 임박한 토큰이 없습니다.');
    load();
  } catch (e) { flash('err', e.message); }
  finally { $('refreshAllBtn').disabled = false; }
}

async function disconnect(id, username) {
  if (!confirm('@' + username + ' 연결을 해제할까요?\n토큰만 삭제되고 계정·미디어 기록은 남습니다.')) return;
  clearMsg();
  try { await api('/api/admin/business-meta/accounts/' + id, { method: 'DELETE' }); flash('ok', '연결을 해제했습니다.'); load(); }
  catch (e) { flash('err', e.message); }
}

/** OAuth 콜백이 결과를 쿼리로 실어 돌아온다 — 읽고 나면 주소창을 깨끗이 되돌린다. */
function readCallbackResult() {
  const q = new URLSearchParams(location.search);
  if (q.get('error')) flash('err', '연결 실패: ' + esc(q.get('error')));
  else if (q.get('connected')) {
    const mismatch = q.get('mismatch');
    flash('ok', mismatch
      ? '⚠️ <b>@' + esc(q.get('connected')) + '</b> 이(가) 연결됐습니다 — 입력하신 <b>@' + esc(mismatch)
        + '</b> 와 다릅니다.<br>브라우저에 로그인돼 있던 계정이 붙은 것일 수 있습니다. 확인 후 필요하면 해제하고, 시크릿 창에서 다시 연결하세요.'
      : '@' + esc(q.get('connected')) + ' 연결 완료.');
  }
  if (location.search) history.replaceState(null, '', location.pathname);
}

(async () => { readCallbackResult(); await loadConfig(); load(); })();
</script>
</body>
</html>
